 their computer is still not fixed. What should the technician do?","o":["Listen actively, avoid arguing, and clarify the issue and next steps","Tell them it is not your fault","Explain the problem using technical jargon","Leave without explanation"],"a":0,"e":"Professionalism means active listening, not being defensive, setting clear expectations, and following up."},{"d":4,"q":"An employee wants to paste a customer's account details into a public AI chatbot to draft a response faster. What is the PRIMARY concern?","o":["Exposing sensitive data to a third party in violation of data privacy policy","The chatbot may type too slowly","The response might be too short","AI tools cannot write emails"],"a":0,"e":"Putting PII or confidential data into public AI tools can violate privacy policies and regulations. Use approved tools and remove sensitive details first."},{"d":4,"q":"A technician uses an AI tool to generate a PowerShell command and plans to run it on production servers. What should the technician do FIRST?","o":["Review and test the output in a non-production environment","Run it immediately since AI is accurate","Share it with all users","Disable logging before running it"],"a":0,"e":"AI output can be wrong or made up (hallucinations). Verify and test it before using it in production."},{"d":4,"q":"Which environmental condition increases the risk of electrostatic discharge in a computer room?","o":["Low humidity","High humidity","Moderate temperature","Good airflow"],"a":0,"e":"Dry air (low humidity) increases static buildup. Too much humidity causes condensation. A moderate range of about 40 to 60 percent is ideal."},{"d":4,"q":"A company's policy describes what employees may and may not do with company computers and internet access. What is this document?","o":["Acceptable use policy (AUP)","Rollback plan","SDS","Chain of custody"],"a":0,"e":"An AUP defines permitted use of company IT resources, and employees typically sign it."},{"d":4,"q":"Which device protects equipment from sudden voltage spikes but provides no battery backup?","o":["Surge suppressor","UPS","Generator","Redundant PSU"],"a":0,"e":"Surge suppressors block voltage spikes. Only a UPS or generator keeps equipment running during an outage."},{"d":4,"q":"Which type of license allows users to view, modify, and redistribute the source code?","o":["Open-source license","Personal license","Enterprise license","DRM license"],"a":0,"e":"Open-source licenses such as the GPL and MIT allow access to and modification of the source code, under the license's terms."},{"d":1,"q":"Which Windows command shows the version and build number of the installed OS in a dialog box?","o":["winver","hostname","ver /all","msinfo64"],"a":0,"e":"winver opens the About Windows dialog with the version and build. msinfo32 shows more detail."},{"d":1,"q":"Which command displays the computer's name?","o":["hostname","whoami","ipconfig /flushdns","net use"],"a":0,"e":"hostname prints the computer's name. whoami shows the logged-in user."},{"d":1,"q":"Which command clears the local DNS resolver cache in Windows?","o":["ipconfig /flushdns","ipconfig /renew","nslookup -clear","netstat -r"],"a":0,"e":"Clearing the DNS cache fixes stale or poisoned name resolution entries."},{"d":1,"q":"Which command combines ping and tracert to show packet loss at each hop?","o":["pathping","netstat","arp","nbtstat"],"a":0,"e":"pathping traces the route and then measures loss and latency at each hop over time."},{"d":1,"q":"Which command repairs the Windows component store that SFC uses as a source for repairs?","o":["DISM /Online /Cleanup-Image /RestoreHealth","chkdsk /f","bootrec /fixmbr","gpupdate /force"],"a":0,"e":"DISM repairs the system image, after which sfc /scannow can repair the system files."},{"d":1,"q":"Which command immediately restarts a Windows computer from the command line?","o":["shutdown /r /t 0","shutdown /s","restart now","logoff /r"],"a":0,"e":"shutdown /r restarts, /s shuts down, and /t sets the delay in seconds."},{"d":1,"q":"Which command creates a new directory in the Windows command prompt?","o":["md","cd","rd","dir"],"a":0,"e":"md (mkdir) creates a directory, cd changes directories, rd removes one, and dir lists contents."},{"d":1,"q":"Which command lists the contents of the current directory in Windows?","o":["dir","ls -l","cd","md"],"a":0,"e":"dir is the Windows command. ls is the Linux and macOS equivalent."},{"d":1,"q":"Which command copies files and directories including subfolders in older Windows scripts, but is now largely replaced by robocopy?","o":["xcopy","copy","move","rd"],"a":0,"e":"xcopy can copy directory trees, but robocopy is more robust and resumable."},{"d":1,"q":"Which command formats a drive from the Windows command line?","o":["format","chkdsk","diskpart list","defrag"],"a":0,"e":"format prepares a volume with a file system. diskpart can also format inside its own shell."},{"d":1,"q":"Which command manages local user accounts, such as adding a user or resetting a password, from the command line?","o":["net user","net use","netstat","nslookup"],"a":0,"e":"net user manages local accounts, while net use maps network drives."},{"d":1,"q":"An administrator wants to quickly open the classic Control Panel applet to manage installed programs. Which command opens it?","o":["appwiz.cpl","ncpa.cpl","mmsys.cpl","inetcpl.cpl"],"a":0,"e":"appwiz.cpl opens Programs and Features. ncpa.cpl opens Network Connections, mmsys.cpl opens Sound, and inetcpl.cpl opens Internet Options."},{"d":1,"q":"Which Control Panel utility shortcut opens Network Connections to view adapters?","o":["ncpa.cpl","appwiz.cpl","sysdm.cpl","powercfg.cpl"],"a":0,"e":"ncpa.cpl shows the network adapters so you can enable, disable, or set TCP/IP properties."},{"d":1,"q":"Where in Windows can a user configure the computer name, domain membership, and Remote Desktop settings in the classic interface?","o":["System Properties (sysdm.cpl)","Device Manager","Disk Cleanup","Task Scheduler"],"a":0,"e":"System Properties has tabs for the computer name and domain, advanced performance and virtual memory settings, System Protection, and Remote."},{"d":1,"q":"A user wants their laptop to never sleep while plugged in. Where should this be configured?","o":["Power Options/power plan settings","Device Manager","Credential Manager","Indexing Options"],"a":0,"e":"Power Options (or Settings > System > Power) controls sleep, hibernate, and lid-close actions."},{"d":1,"q":"Which Windows feature stores saved website and network credentials for the user?","o":["Credential Manager","Certificate Manager","Device Manager","User Accounts"],"a":0,"e":"Credential Manager stores web and Windows credentials, such as saved network share logins."},{"d":1,"q":"Which Windows tool shows installed certificates and lets an administrator import or remove them?","o":["Certificate Manager (certmgr.msc)","Credential Manager","Device Manager","Event Viewer"],"a":0,"e":"certmgr.msc manages the user's certificate stores. certlm.msc manages the local computer's."},{"d":1,"q":"Which Windows tool provides detailed real-time views of CPU, memory, disk, and network activity per process, including which files are being accessed?","o":["Resource Monitor (resmon)","Task Scheduler","Disk Management","msconfig"],"a":0,"e":"Resource Monitor goes deeper than Task Manager and shows disk I/O by file and network activity by process."},{"d":1,"q":"Which Windows feature indexes files to speed up searches and can be configured to include specific folders?","o":["Indexing Options","Disk Cleanup","Defragment and Optimize Drives","File History"],"a":0,"e":"Indexing Options controls which locations Windows Search indexes."},{"d":1,"q":"Which Windows utility frees space by removing temporary files, the Recycle Bin, and old update files?","o":["Disk Cleanup (cleanmgr)","Disk Management","chkdsk","DISM"],"a":0,"e":"Disk Cleanup and Storage Sense remove temporary and unneeded files."},{"d":1,"q":"A Windows user wants to show file extensions and hidden files. Where is this configured?","o":["File Explorer Options/View settings","Device Manager","Network and Sharing Center","Power Options"],"a":0,"e":"File Explorer Options has 'Hide extensions for known file types' and 'Show hidden files.'"},{"d":1,"q":"Which Windows Settings area is used to configure Windows Update, including pausing updates and viewing update history?","o":["Windows Update","Accounts","Privacy","Apps"],"a":0,"e":"Settings > Windows Update manages updates, active hours, pausing, and update history."},{"d":1,"q":"In Windows, which user account type has full control of the system and can install software for all users?","o":["Administrator","Standard user","Guest","Power user"],"a":0,"e":"Administrators can change system settings and install software. Use standard accounts for day-to-day work."},{"d":1,"q":"Which type of Windows account signs in with an email address and syncs settings across devices?","o":["Microsoft account","Local account","Domain account","Guest account"],"a":0,"e":"A Microsoft account syncs settings, OneDrive, and the Store. Local accounts live only on that PC, and domain accounts come from Active Directory."},{"d":1,"q":"A technician needs to join a Windows 11 Pro workstation to the company's Active Directory domain. Where can this be done?","o":["System Properties > Computer Name > Change, or Settings > Accounts > Access work or school","Device Manager","Disk Management","Task Manager"],"a":0,"e":"You can join a domain through System Properties (sysdm.cpl) or through Settings > Access work or school. It requires Pro or a higher edition."},{"d":1,"q":"On a Mac, which feature quickly searches for files, apps, and settings?","o":["Spotlight","Finder","Dock","Keychain"],"a":0,"e":"Spotlight (Cmd+Space) searches the whole system."},{"d":1,"q":"Which macOS feature shows all open windows and virtual desktops at once?","o":["Mission Control","Spotlight","Launchpad","Time Machine"],"a":0,"e":"Mission Control shows open windows and Spaces (virtual desktops)."},{"d":1,"q":"A Mac user needs to repair disk permissions or check a drive for errors. Which built-in tool should be used?","o":["Disk Utility (First Aid)","Activity Monitor","Terminal only","Boot Camp"],"a":0,"e":"Disk Utility's First Aid checks and repairs disks and volumes."},{"d":1,"q":"Which macOS tool is the equivalent of Windows Task Manager for viewing and ending processes?","o":["Activity Monitor","Console","Spotlight","System Information"],"a":0,"e":"Activity Monitor shows CPU, memory, energy, disk, and network use, and you can force quit apps from it."},{"d":1,"q":"Which macOS app is used to install and update most software from Apple and approved developers?","o":["App Store","Boot Camp","Keychain","Terminal"],"a":0,"e":"The Mac App Store handles installs and updates. Apps from outside it are typically .dmg or .pkg files."},{"d":1,"q":"Which Linux command lists the files in a directory, including hidden files, in long format?","o":["ls -la","dir /a","pwd","cat"],"a":0,"e":"ls -l shows long format, and -a includes hidden dotfiles."},{"d":1,"q":"Which Linux command moves or renames a file?","o":["mv","cp","rm","mkdir"],"a":0,"e":"mv moves or renames, cp copies, rm deletes, and mkdir creates directories."},{"d":1,"q":"Which Linux command displays the manual page for another command?","o":["man","help","info -all","whatis --full"],"a":0,"e":"For example, man ls shows the documentation for ls."},{"d":1,"q":"Which Linux command shows the IP addresses assigned to network interfaces on modern distributions?","o":["ip addr","ipconfig","netsh","nbtstat"],"a":0,"e":"ip addr (or ip a) replaces the older ifconfig. ipconfig is the Windows command."},{"d":1,"q":"Which Linux command switches to another user account, such as root, in the current shell?","o":["su","sudo","chown","passwd"],"a":0,"e":"su switches users, while sudo runs a single command with elevated rights."},{"d":1,"q":"Which package manager command installs software on Red Hat-based Linux distributions like Fedora?","o":["dnf install","apt install","brew install","winget install"],"a":0,"e":"Fedora and RHEL use dnf (formerly yum). Debian and Ubuntu use apt."},{"d":1,"q":"A Linux administrator needs to edit a configuration file from the terminal. Which tool is a command-line text editor?","o":["nano","grep","top","df"],"a":0,"e":"nano and vi/vim are terminal text editors."},{"d":1,"q":"Before installing a new application on 50 workstations, what should be verified FIRST?","o":["System requirements and OS compatibility","The color of the application icon","The vendor's social media","Monitor brand"],"a":0,"e":"Check the CPU, RAM, storage, OS version, and dependencies, along with licensing and security impact, before deploying."},{"d":1,"q":"An application installer requires .NET Framework that is not installed. What is this an example of?","o":["A dependency requirement","A licensing violation","A driver conflict","A file system limitation"],"a":0,"e":"Many apps depend on runtimes (.NET, Visual C++, Java) that must be installed first."},{"d":1,"q":"A technician needs to recover a Windows PC whose OS will not load at all, using a fresh copy of Windows while preserving nothing. Which installation is this?","o":["Clean install","In-place upgrade","Repair install keeping apps","Image capture"],"a":0,"e":"A clean install wipes the target partition and installs a fresh OS."},{"d":2,"q":"Which security control requires users to present a badge to unlock a door, logging each entry?","o":["Badge reader/access control system","Bollard","Fence","Lighting"],"a":0,"e":"Electronic badge systems control who gets in and log each entry."},{"d":2,"q":"Which physical security control uses biometrics like fingerprints or retina scans to grant access?","o":["Biometric lock","Key fob only","Bollard","Video surveillance"],"a":0,"e":"Biometric locks use something you are, which is hard to share or steal."},{"d":2,"q":"Which security measure provides recorded evidence of who entered a secured area?","o":["Video surveillance","Bollards","Fencing","Magnetometer"],"a":0,"e":"Cameras deter intruders and record evidence for investigations."},{"d":2,"q":"Which device detects metal objects at a facility entrance?","o":["Magnetometer","Badge reader","Motion sensor","Bollard"],"a":0,"e":"Magnetometers (metal detectors) screen people for weapons or prohibited devices."},{"d":2,"q":"A visitor badge must be returned at the end of the day, and visitors must sign a logbook. What is the purpose of the log?","o":["Accountability and an audit trail of who was on site","Encrypting visitor data","Speeding up Wi-Fi","Reducing printing"],"a":0,"e":"Visitor logs record who came and when, which supports security and emergency headcounts."},{"d":2,"q":"Which logical security concept means users are denied access unless it is explicitly allowed?","o":["Implicit deny","Least privilege","MFA","SSO"],"a":0,"e":"Implicit deny blocks anything not explicitly permitted. It's common in firewalls and ACLs."},{"d":2,"q":"Which security concept assumes no user or device is trusted by default, even inside the network, and verifies every request?","o":["Zero Trust","Perimeter-only security","Implicit allow","Open access"],"a":0,"e":"Zero Trust continuously verifies identity and device posture for every access request."},{"d":2,"q":"Users log in once and gain access to multiple applications without logging in again. What is this?","o":["Single sign-on (SSO)","MFA","Least privilege","Kerberos ticket expiration"],"a":0,"e":"SSO uses one authentication to grant access to many services, often through SAML or OAuth/OIDC."},{"d":2,"q":"Which authentication factor category does a fingerprint belong to?","o":["Something you are","Something you know","Something you have","Somewhere you are"],"a":0,"e":"Biometrics are inherence factors."},{"d":2,"q":"Which MFA method generates a new six-digit code every 30 seconds in an app?","o":["TOTP authenticator app","SMS only","Security question","Smart card PIN only"],"a":0,"e":"Time-based one-time password (TOTP) apps generate rolling codes. They're more secure than SMS."},{"d":2,"q":"Which MFA method is MOST resistant to phishing?","o":["Hardware security key using FIDO2/WebAuthn","SMS code","Email code","Security questions"],"a":0,"e":"FIDO2 keys and passkeys check the website's domain, so they can't be phished the way codes can."},{"d":2,"q":"What does a mobile device's screen lock with a strong passcode primarily protect against?","o":["Unauthorized access if the device is lost or stolen","Cellular eavesdropping","App crashes","Battery drain"],"a":0,"e":"The screen lock also enables device encryption on modern phones."},{"d":2,"q":"Which wireless security setting should be DISABLED because its PIN method can be brute-forced?","o":["WPS","WPA3","AES","802.1X"],"a":0,"e":"WPS PIN mode has a known brute-force weakness, so turn it off."},{"d":2,"q":"Which SOHO router setting should be disabled because it lets devices automatically open ports without approval?","o":["UPnP","DHCP","NAT","Firewall"],"a":0,"e":"Malware can abuse UPnP to open inbound ports. Disable it unless you specifically need it."},{"d":2,"q":"A technician wants to keep a SOHO router's admin interface from being reachable over the internet. What should be done?","o":["Disable remote/WAN management","Enable UPnP","Enable WPS","Use the default password"],"a":0,"e":"Allow admin access only from the LAN, and change the default credentials."},{"d":2,"q":"Which SOHO feature restricts network access to devices with specific hardware addresses, though it can be bypassed by spoofing?","o":["MAC address filtering","Port forwarding","DHCP reservation","DNS filtering"],"a":0,"e":"MAC filtering adds a small barrier, but MAC addresses are easy to spoof, so don't rely on it alone."},{"d":2,"q":"Which practice reduces attacks on a SOHO network by blocking known malicious domains for all clients?","o":["DNS/content filtering","Disabling DHCP","Hiding the router","Using WEP"],"a":0,"e":"DNS or content filtering blocks malicious and inappropriate sites for the whole network."},{"d":2,"q":"An attacker sends emails pretending to be a bank with a link to a fake login page. What is this?","o":["Phishing","Whaling","Vishing","Tailgating"],"a":0,"e":"Phishing uses fraudulent messages to steal credentials or deliver malware."},{"d":2,"q":"A user receives a text message claiming a package is delayed, with a link to 'reschedule delivery.' What attack is this?","o":["Smishing","Vishing","Whaling","Evil twin"],"a":0,"e":"Smishing is phishing by SMS."},{"d":2,"q":"An attacker calls the help desk pretending to be an executive to get a password reset. What technique is this?","o":["Impersonation","Dumpster diving","Shoulder surfing","Evil twin"],"a":0,"e":"In impersonation, the attacker poses as someone with authority. Verify identity before resetting passwords."},{"d":2,"q":"An attacker sends spoofed packets with a fake source IP address. Which attack type is this?","o":["Spoofing","Brute force","XSS","Dumpster diving"],"a":0,"e":"Spoofing fakes an identity, such as an IP address, MAC address, email sender, or caller ID."},{"d":2,"q":"Which type of malware replicates itself across a network without user interaction?","o":["Worm","Trojan","Adware","Keylogger"],"a":0,"e":"Worms spread on their own by exploiting vulnerabilities. Viruses need a host file and usually some user action."},{"d":2,"q":"Which type of malware infects the master boot record so it loads before the OS?","o":["Boot sector virus","Adware","Spyware","Worm"],"a":0,"e":"Boot sector viruses run before the OS loads. Secure Boot helps defend against them."},{"d":2,"q":"Which malware secretly monitors a user's activity and sends information to a third party?","o":["Spyware","Ransomware","Worm","Rootkit"],"a":0,"e":"Spyware collects data such as browsing habits and keystrokes without consent."},{"d":2,"q":"Which security solution is a managed service where an outside team monitors and responds to endpoint threats 24/7?","o":["MDR (managed detection and response)","Basic antivirus","Host firewall","Proxy server"],"a":0,"e":"MDR adds human analysts who monitor and respond on top of EDR tools."},{"d":2,"q":"Which tool helps prevent sensitive data such as credit card numbers from being emailed outside the company?","o":["Data loss prevention (DLP)","Antivirus","UPS","Load balancer"],"a":0,"e":"DLP inspects content and blocks or flags sensitive data leaving the organization."},{"d":2,"q":"In Windows, which firewall setting determines which rules apply when the PC is on a coffee shop network?","o":["Network profile set to Public","Network profile set to Domain","UAC level","BitLocker status"],"a":0,"e":"Windows Firewall has Domain, Private, and Public profiles. Public is the most restrictive."},{"d":2,"q":"A user needs to run a single program with elevated rights without logging in as an administrator. What should they use?","o":["Run as administrator (with admin credentials via UAC)","Disable UAC","Join the Guest group","Turn off Windows Defender"],"a":0,"e":"Run as administrator elevates just that app and prompts for admin credentials through UAC."},{"d":2,"q":"Which NTFS permission allows a user to read, write, and delete files but NOT change permissions?","o":["Modify","Full Control","Read & Execute","List folder contents"],"a":0,"e":"Modify covers read, write, and delete. Full Control adds changing permissions and taking ownership."},{"d":2,"q":"Which practice describes regularly applying vendor security fixes to OSes and applications?","o":["Patch management","Asset tagging","Change freeze","Data destruction"],"a":0,"e":"Patch management closes known vulnerabilities. Test patches and deploy them on a schedule."},{"d":2,"q":"Which of the following is the BEST password policy recommendation according to modern guidance?","o":["Long passphrases, MFA, and checking against breached password lists","Forced changes every 30 days with complexity only","Short passwords that are easy to remember","Sharing passwords with team leads"],"a":0,"e":"NIST guidance favors length, screening against breached passwords, and MFA over frequent forced changes."},{"d":2,"q":"What does account lockout policy protect against?","o":["Brute force password guessing","Phishing emails","Shoulder surfing","Power outages"],"a":0,"e":"Locking an account after a set number of failed attempts slows online guessing."},{"d":2,"q":"An employee left the company yesterday. What should IT do with their account?","o":["Disable it promptly per the offboarding procedure","Leave it active for a month","Give the password to their manager","Delete all audit logs"],"a":0,"e":"Disable departed users' accounts quickly. Keep the data as policy requires, then delete the account later."},{"d":2,"q":"Which feature on a smartphone erases all data after a number of failed passcode attempts?","o":["Failed login attempt wipe/lockout policy","Screen rotation","Airplane mode","Do Not Disturb"],"a":0,"e":"A wipe after too many failed attempts protects the data on a stolen device. MDM often enforces it."},{"d":2,"q":"A browser shows a padlock and 'https://' in the address bar. What does this indicate?","o":["The connection is encrypted with TLS to that domain","The website is guaranteed to be safe","The site has no malware","The site is government-approved"],"a":0,"e":"HTTPS encrypts the connection, but phishing sites can have valid certificates too. Check the domain itself."},{"d":2,"q":"Which browser feature helps prevent sites from opening unwanted windows?","o":["Pop-up blocker","Private browsing","Cache clearing","Bookmark sync"],"a":0,"e":"A pop-up blocker stops unrequested windows, which are often ads or scams."},{"d":2,"q":"What does private/incognito browsing do?","o":["Does not save local history, cookies, or form data after the session","Hides traffic from the ISP and employer","Encrypts all traffic like a VPN","Blocks all malware"],"a":0,"e":"Private browsing only affects what's stored locally. Networks and websites can still see your activity."},{"d":2,"q":"An administrator wants only company-approved browser extensions installed. What is the BEST approach?","o":["Enforce an extension allow list through Group Policy/MDM","Ask users nicely","Disable the browser","Use private browsing"],"a":0,"e":"Centrally managed policies can block unapproved extensions."},{"d":2,"q":"Which process ensures a downloaded installer has not been tampered with?","o":["Verify its hash/checksum or digital signature from the vendor","Rename the file","Open it in Notepad","Run it in compatibility mode"],"a":0,"e":"Compare the file's hash with the published value, or confirm the code-signing certificate."},{"d":2,"q":"Which wireless authentication method uses a RADIUS server and individual user credentials, rather than a shared password?","o":["WPA2/WPA3-Enterprise (802.1X)","WPA2-Personal (PSK)","WEP","Open network"],"a":0,"e":"Enterprise mode authenticates each user individually through RADIUS and 802.1X."},{"d":3,"q":"Windows takes a very long time to start, and the user sees a spinning wheel for several minutes. What should the technician check FIRST?","o":["Startup apps and services impact, and recent updates","The monitor cable","The printer queue","The Wi-Fi channel"],"a":0,"e":"Slow boots are often caused by heavy startup items, pending updates, or failing storage. Check Task Manager's startup impact and Event Viewer's boot performance logs."},{"d":3,"q":"A Windows PC shows a 'Bootmgr is missing' or boot configuration error. Which tool can repair the boot records?","o":["bootrec commands in WinRE","Disk Cleanup","gpupdate","net use"],"a":0,"e":"In the WinRE command prompt, run bootrec /fixmbr, /fixboot, and /rebuildbcd (or use bcdboot) to repair boot data."},{"d":3,"q":"After a Windows update, a user's PC goes into a repeating restart loop. What should the technician try?","o":["Boot into WinRE and uninstall the latest update or use System Restore","Replace the RAM","Replace the monitor","Change the user's password"],"a":0,"e":"WinRE's Uninstall Updates option and System Restore roll back problem updates."},{"d":3,"q":"Windows shows 'Your PC ran into a problem' with stop code CRITICAL_PROCESS_DIED after installing new hardware. What is a logical first step?","o":["Remove the new hardware or roll back its driver and test","Reinstall Office","Change the wallpaper","Disable the firewall"],"a":0,"e":"Undo the most recent change first, then check drivers and run memory and disk diagnostics."},{"d":3,"q":"A user's application runs slowly, and Task Manager shows disk usage at 100% constantly on an HDD. What is a reasonable fix?","o":["Check for failing disk/background tasks and consider upgrading to an SSD","Add a second monitor","Lower the screen brightness","Change the keyboard layout"],"a":0,"e":"A disk stuck at 100% on an HDD comes from background indexing, updates, malware, or a failing drive. An SSD helps a lot."},{"d":3,"q":"A Windows PC displays 'There are currently no logon servers available' when a domain user signs in. What should be checked?","o":["Network connectivity to the domain controller and DNS settings","The printer driver","The monitor","The audio service"],"a":0,"e":"Domain logons need to reach a domain controller, which depends on network access and DNS pointing to AD DNS."},{"d":3,"q":"A user receives a message that their temporary profile is loaded and their desktop files are missing. What does this indicate?","o":["The user profile failed to load, often due to corruption","The hard drive is full of malware","The user was deleted from AD","The monitor resolution changed"],"a":0,"e":"Windows loads a temporary profile when the real one fails. Fix it through the ProfileList registry key or by rebuilding the profile."},{"d":3,"q":"An application crashes, and Event Viewer shows the faulting module as a ,"The printer spooler","The audio service"],"a":0,"e":"Set the correct time zone and make sure automatic time sync works. Also consider the CMOS battery."},{"d":3,"q":"Users report that an internal web app gives a certificate error on all PCs starting today. What is the MOST likely cause?","o":["The server's certificate has expired","Every PC's clock is wrong","The users' passwords expired","The printer is offline"],"a":0,"e":"An error on every client at once points to the server's certificate expiring. Renew it."},{"d":3,"q":"A user sees ads appearing on websites that normally do not display ads, and new toolbars appear in the browser. What is likely installed?","o":["Adware/potentially unwanted program","A rootkit only","A hardware keylogger","A bad DNS server"],"a":0,"e":"Injected ads and unwanted toolbars mean adware or a PUP. Remove it and reset the browser."},{"d":3,"q":"A user's antivirus shows a definition file several months old and will not update. What should the technician suspect FIRST?","o":["Malware blocking updates or a licensing/connectivity issue","A bad monitor","Faulty RAM","The keyboard driver"],"a":0,"e":"Malware often blocks security updates. Check licensing and connectivity too, and scan with offline tools."},{"d":3,"q":"After clicking a link in an email, a user notices their files have a new .locked extension and a ransom note appears. What should the technician do FIRST?","o":["Disconnect the PC from the network to prevent spread","Pay the ransom","Restart the PC repeatedly","Email the attacker"],"a":0,"e":"Isolate the PC immediately, then follow incident response procedures and restore from clean backups."},{"d":3,"q":"A user reports that their mouse cursor moves on its own and programs open by themselves. What should be suspected?","o":["Remote access malware or an unauthorized remote session","A failing monitor","Low battery in a wired mouse","A wrong time zone"],"a":0,"e":"Uncontrolled cursor movement can mean someone has remote control able updates"],"a":0,"e":"Permissions that don't match what the app does are a red flag for spyware."},{"d":3,"q":"Antivirus detects a threat but cannot remove it because the file is in use. What is the BEST approach?","o":["Scan in Safe Mode or with an offline/boot-time scan","Delete System32","Disable antivirus","Ignore the alert"],"a":0,"e":"Safe Mode or an offline scan (such as Microsoft Defender Offline) runs before the malware loads."},{"d":3,"q":"After malware removal, the user's browser still redirects searches. What should the technician check?","o":["Browser extensions, search engine settings, and proxy/hosts settings","The monitor","The keyboard","The CMOS battery"],"a":0,"e":"Leftover settings can keep the redirect going. Reset the browser and check the proxy and hosts file."},{"d":3,"q":"A user receives an email from their own address that they did not send. What is MOST likely?","o":["The sender address was spoofed, or the account is compromised","The mail server is out of disk","The DNS cache is full","The printer is jammed"],"a":0,"e":"Check the message headers. Spoofing is common, and SPF, DKIM, and DMARC help prevent it. If it's real, reset the password and enable MFA."},{"d":3,"q":"A Windows 11 PC shows that it is not activated after a motherboard replacement. Why?","o":["The digital license is tied to hardware and needs reactivation","The RAM is bad","The SSD is too fast","The firewall is on"],"a":0,"e":"Windows activation is tied to the motherboard. Use the Activation troubleshooter with the linked Microsoft account, or contact support."},{"d":3,"q":"A technician notices a user's PC has random files renamed and the user reports missing documents. Which should be checked FIRST for a non-malware cause?","o":["Recent sync conflicts or user actions, and check backups/Recycle Bin","Replace the CPU","Change the time zone","Disable the firewall"],"a":0,"e":"Rule out sync conflicts, the Recycle Bin, and File History before assuming malware, but stay alert to ransomware."},{"d":4,"q":"What is the purpose of an incident report?","o":["Document details of a security or safety incident for follow-up and improvement","Track printer toner levels","Assign IP addresses","Store passwords"],"a":0,"e":"Incident reports record what happened, when, who was involved, and what was done about it."},{"d":4,"q":"In a ticketing system, what does assigning severity/priority accomplish?","o":["Ensures the most business-critical issues are worked first","Changes the user's password","Encrypts the ticket","Deletes old tickets"],"a":0,"e":"Priority depends on impact and urgency. An outage affecting many users ranks above a single cosmetic issue."},{"d":4,"q":"Which document defines the expected response and resolution times between IT and a customer?","o":["Service level agreement (SLA)","EULA","SDS","AUP"],"a":0,"e":"SLAs set measurable service commitments."},{"d":4,"q":"What should a technician include in a ticket's problem description?","o":["Clear symptoms, error messages, affected users, and when it started","Only 'it's broken'","The technician's lunch plans","Unrelated user complaints"],"a":0,"e":"Detailed descriptions speed up troubleshooting and escalation."},{"d":4,"q":"Which type of documentation shows how network devices are connected and their IP addresses?","o":["Network topology diagram","AUP","Incident report","Purchase order"],"a":0,"e":"Diagrams help troubleshooting and planning. Keep them up to date."},{"d":4,"q":"A help desk keeps a searchable collection of solutions to common problems. What is this?","o":["Knowledge base","Change log","Asset inventory","SDS library"],"a":0,"e":"Knowledge base articles reduce resolution time and keep fixes consistent."},{"d":4,"q":"During change management, who reviews and approves proposed changes?","o":["Change advisory board (CAB)","The end user only","The vendor's sales team","No one"],"a":0,"e":"The CAB evaluates risk and timing before approving a change."},{"d":4,"q":"Which part ,"o":["Data retention policy","AUP","SLA","SDS"],"a":0,"e":"Retention policies balance legal requirements against risk. Delete data you no longer need."},{"d":4,"q":"What does DRM (digital rights management) do?","o":["Restricts how copyrighted digital content can be used or copied","Encrypts network traffic","Manages DHCP leases","Controls backups"],"a":0,"e":"DRM enforces usage restrictions on media and software."},{"d":4,"q":"Which license type allows one purchase to be used by a large organization under a single agreement with a key server or portal?","o":["Enterprise/volume license","Personal license","Open-source GPL","Shareware"],"a":0,"e":"Volume licensing simplifies deploying software across many machines."},{"d":4,"q":"When speaking with a non-technical user, what should a technician avoid?","o":["Jargon and acronyms the user may not understand","Active listening","Clarifying questions","Setting expectations"],"a":0,"e":"Use plain language and confirm the user understood."},{"d":4,"q":"A technician finds personal documents on a user's desk while fixing their PC. What should the technician do?","o":["Not read or disturb them; respect user privacy","Read them to understand the user's needs","Photograph them","Throw them away"],"a":0,"e":"Respect the confidentiality of customer property and information."},{"d":4,"q":"Which is the BEST way to handle a situation where the technician cannot meet a promised repair time?","o":["Proactively contact the customer, explain, and set a new expectation","Say nothing","Blame another department","Close the ticket"],"a":0,"e":"Setting and updating expectations keeps trust."},{"d":4,"q":"Which scripting language is native to Windows and commonly used to automate administrative tasks with cmdlets?","o":["PowerShell","Bash","Python only","JavaScript"],"a":0,"e":"PowerShell uses verb-noun cmdlets such as Get-Process and integrates with Windows management."},{"d":4,"q":"Which file type is a Windows batch script?","o":[".bat",".sh",".py",".ps1"],"a":0,"e":".bat and .cmd files run in the Windows command interpreter."},{"d":4,"q":"Which file extension indicates a Python script?","o":[".py",".js",".vbs",".sh"],"a":0,"e":"Python scripts use .py and are popular for cross-platform automation."},{"d":4,"q":"Which is a common use case for scripting in IT?","o":["Automating repetitive tasks like backups, restarts, and drive mapping","Replacing all hardware","Designing logos","Writing user manuals"],"a":0,"e":"Scripts handle tasks such as installing updates, mapping drives, collecting info, and restarting services."},{"d":4,"q":"Which remote access tool lets a technician view and control a user's desktop across platforms using port 5900 by default?","o":["VNC","SSH","SFTP","Telnet"],"a":0,"e":"VNC shares the screen and uses port 5900 by default. Tunnel or encrypt it."},{"d":4,"q":"What is a security best practice for remote support sessions?","o":["Get user consent, use encrypted tools, and log sessions","Leave sessions open after work","Share passwords in chat","Disable MFA for speed"],"a":0,"e":"Use approved, encrypted tools with consent, authentication, and auditing."},{"d":4,"q":"Which security concern exists when using third-party remote access tools?","o":["Attackers abuse them to gain unauthorized access if not secured","They slow down printers","They change DNS","They void hardware warranties"],"a":0,"e":"Remote access tools are frequent attack targets. Restrict, patch, and monitor them."},{"d":4,"q":"An IT team wants to use AI to summarize support tickets. What should be confirmed FIRST?","o":["The AI tool is approved and handles data per company privacy policy","The AI has a fun name","The AI is free","The AI can play music"],"a":0,"e":"Check how the tool stores and uses data before you send it company or customer information."},{"d":4,"q":"An AI chatbot gives a confident but incorrect answer about a Windows command. What is this AI limitation called?","o":["Hallucination","Encryption","Overfitting hardware","Latency"],"a":0,"e":"AI can generate plausible but wrong output, so always verify it."}]}</script>
<script>
(function(){
"use strict";
const BANK = JSON.parse(document.getElementById("bank").textContent);
const EXAMS = {
  c1:{code:"220-1201",name:"Core 1",domains:[
    {id:1,name:"Mobile Devices",w:13},{id:2,name:"Networking",w:23},{id:3,name:"Hardware",w:25},
    {id:4,name:"Virtualization and Cloud Computing",w:11},{id:5,name:"Hardware and Network Troubleshooting",w:28}]},
  c2:{code:"220-1202",name:"Core 2",domains:[
    {id:1,name:"Operating Systems",w:28},{id:2,name:"Security",w:28},
    {id:3,name:"Software Troubleshooting",w:23},{id:4,name:"Operational Procedures",w:21}]}
};
const N_Q = 45, MINUTES = 50, TARGET = 80;
const app = document.getElementById("app");

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function quotas(exam){
  const ds = EXAMS[exam].domains, tot = ds.reduce((s,d)=>s+d.w,0);
  const raw = ds.map(d=>({id:d.id, x:N_Q*d.w/tot}));
  raw.forEach(r=>{ r.n=Math.floor(r.x); r.f=r.x-r.n; });
  let left = N_Q - raw.reduce((s,r)=>s+r.n,0);
  [...raw].sort((a,b)=>b.f-a.f).slice(0,left).forEach(r=>r.n++);
  return raw;
}
function prep(picked){
  return shuffle(picked).map(p=>{
    const order = shuffle(p.o.map((_,i)=>i));
    const ans = Array.isArray(p.a) ? p.a : [p.a];
    return { id:qid(p), d:p.d, q:p.q, e:p.e, o:order.map(i=>p.o[i]), a:ans.map(i=>order.indexOf(i)).sort(), multi:ans.length>1 };
  });
}
function buildExam(exam){
  const pool = BANK[exam], picked = [];
  for (const q of quotas(exam)){
    const inDom = shuffle(pool.filter(p=>p.d===q.id));
    picked.push(...inDom.slice(0,q.n));
  }
  return prep(picked);
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ---------- personal history + weak-spot drill (kept in this browser only) ---------- */
const N_DRILL = 20, DRILL_MIN_ANSWERED = 10;
function qid(p){ let h=0; for (const ch of p.q) h=(h*31 + ch.charCodeAt(0))|0; return "q"+(h>>>0).toString(36); }
function loadHist(){
  let h = null; try { h = JSON.parse(store.get("aplus-hist")||"null"); } catch(e){}
  if (!h || typeof h!=="object") h = {};
  for (const k of Object.keys(EXAMS)) if (!h[k]) h[k] = {doms:{}, missed:{}, seen:{}};
  return h;
}
let HIST = loadHist();
function record(exam, q, ok){
  const h = HIST[exam], d = h.doms[q.d] || (h.doms[q.d] = {c:0,n:0});
  d.n++; if (ok) d.c++;
  h.seen[q.id] = 1;
  if (ok) delete h.missed[q.id]; else h.missed[q.id] = 1;
  store.set("aplus-hist", JSON.stringify(HIST));
}
function answered(exam){ return Object.values(HIST[exam].doms).reduce((s,d)=>s+d.n,0); }
function domAcc(exam, id){ const d = HIST[exam].doms[id]; return d && d.n ? d.c/d.n : null; }
function weakList(exam){
  return EXAMS[exam].domains.map(d=>({d, acc:domAcc(exam,d.id), n:(HIST[exam].doms[d.id]||{n:0}).n}))
    .sort((a,b)=>(a.acc??.5)-(b.acc??.5));
}
function buildDrill(exam){
  const h = HIST[exam], ds = EXAMS[exam].domains;
  // weight = how often you miss (smoothed so untested domains count as 50%) x the domain's exam weight
  const raw = ds.map(d=>{ const s=h.doms[d.id]||{c:0,n:0}; const miss = 1-(s.c+1)/(s.n+2); return {id:d.id, x:miss*d.w}; });
  const tot = raw.reduce((s,r)=>s+r.x,0) || 1;
  raw.forEach(r=>{ r.x = N_DRILL*r.x/tot; r.n=Math.floor(r.x); r.f=r.x-r.n; });
  let left = N_DRILL - raw.reduce((s,r)=>s+r.n,0);
  [...raw].sort((a,b)=>b.f-a.f).slice(0,left).forEach(r=>r.n++);
  const picked = [];
  for (const r of raw){
    const inDom = BANK[exam].filter(p=>p.d===r.id);
    const missed = shuffle(inDom.filter(p=>h.missed[qid(p)]));
    const unseen = shuffle(inDom.filter(p=>!h.missed[qid(p)] && !h.seen[qid(p)]));
    const rest = shuffle(inDom.filter(p=>!h.missed[qid(p)] && h.seen[qid(p)]));
    picked.push(...[...missed, ...unseen, ...rest].slice(0, r.n));
  }
  return prep(picked);
}

async function refreshBoard(){
  const { data, error } = await board.db.from("scores").select("name,exam,pct,correct,secs")
    .order("pct",{ascending:false}).order("secs",{ascending:true}).limit(1000);
  if (error){ board.failed = true; notifyBoard(); return; }
  const by = {};
  for (const r of data){

    if (!o[r.exam]) o[r.exam] = {best:r.pct, correct:r.correct, secs:r.secs, attempts:1};

  board.rows = Object.values(by); board.ready = true; board.failed = false; notifyBoard();

async function postScore(exam, res){
  board.uid = res.name.toLowerCase();
  if (!board.db) return {ok:false, why:"nodb"};
  const mine = board.rows.find(r=>r.id===board.uid);
  const prev = mine && mine[exam];
  const better = !prev || res.pct > prev.best || (res.pct===prev.best && res.secs < prev.secs);
  const { error } = await board.db.from("scores").insert({ name:res.name, exam, pct:res.pct, correct:res.correct, secs:res.secs });
  if (error) return {ok:false, why:"error"};
  refreshBoard();
  return {ok:true, better};
}

function begin(exam, name, mode){
  mode = mode || "exam";
  clearInterval(tick);
  const qs = mode==="drill" ? buildDrill(exam) : buildExam(exam);
  S = { exam, name, mode, qs, i:0, sel:[], checked:false, results:[], start:Date.now(), end:Date.now()+MINUTES*60000, confirmEnd:false };
  board.tab = exam;
  tick = setInterval(()=>{
    const t = document.getElementById("timer");
    if (S.mode==="drill"){ if (t) t.textContent = fmt((Date.now()-S.start)/1000); return; }
    const left = (S.end-Date.now())/1000;
    if (t){ t.textContent = fmt(left); t.classList.toggle("warn", left<=300); }
    if (left <= 0) finish(true);
  }, 250);
  drawQ();
}
function drawQ(){
  const q = S.qs[S.i], ex = EXAMS[S.exam];
  const right = S.results.filter(r=>r.ok).length, wrong = S.results.length - right;
  const dom = ex.domains.find(d=>d.id===q.d);
  const drill = S.mode==="drill";
  const left = drill ? (Date.now()-S.start)/1000 : (S.end-Date.now())/1000;
  const need = q.multi ? q.a.length : 1;

  const opts = q.o.map((t,idx)=>{
    const isSel = S.sel.includes(idx);
    let cls = "opt" + (isSel ? " sel" : "");
    if (S.checked){
      cls = "opt locked";
      if (q.a.includes(idx)) cls += " right";
      else if (isSel) cls += " wrong";
    }
    const input = el("input",{type:q.multi?"checkbox":"radio",name:"opt",id:"opt-"+idx,checked:isSel,disabled:S.checked});
    input.addEventListener("change",()=>{
      if (S.checked) return;
      if (q.multi){
        if (S.sel.includes(idx)) S.sel = S.sel.filter(x=>x!==idx);
        else if (S.sel.length < need) S.sel = [...S.sel, idx];
      } else S.sel = [idx];
      drawQ();
    });
    return el("label",{class:cls,for:"opt-"+idx}, input, el("span",{class:"letter",text:"ABCDEFGH"[idx]+"."}), el("span",{class:"t",text:t}));
  });

  let feedback = null, actions;
  if (S.checked){
    const r = S.results[S.results.length-1];
    feedback = el("div",{class:"verdict "+(r.ok?"ok":"no"),role:"status"},
      el("h3",{text:r.ok?"Correct":"Incorrect"}),
      r.ok ? null : el("p",null, el("strong",{text:"Answer: "}), q.a.map(i=>"ABCDEFGH"[i]+". "+q.o[i]).join("  ·  ")),
      el("p",{text:q.e}));
    const last = S.i === S.qs.length-1;
    actions = el("div",{class:"row"}, el("button",{class:"primary",id:"next-btn",onclick:()=>{ if(last) finish(false); else { S.i++; S.sel=[]; S.checked=false; drawQ(); window.scrollTo(0,0);} }}, last?"See results":"Next question"));
  } else {

      q.multi ? el("span",{class:"muted",style:"font-size:.88rem",text:"Select "+need+" ("+S.sel.length+"/"+need+")"}) : null);
  }

  const endBox = S.confirmEnd ? el("div",{class:"confirm"},
      el("p",null,(drill?"End this drill now? The ":"End this exam now? The ")+(S.qs.length-S.results.length)+" unanswered questions will count as wrong."),
      el("div",{class:"row"}, el("button",{class:"primary",id:"end-yes",onclick:()=>finish(false)},"End and score it"), el("button",{id:"end-no",onclick:()=>{S.confirmEnd=false;drawQ();}},"Keep going")))
    : el("button",{class:"link",id:"end-btn",onclick:()=>{S.confirmEnd=true;drawQ();}},drill?"End drill early":"End exam early");

      el("div",{class:"inner"},
        el("div",null, el("div",{class:"eyebrow",text:(drill?"Weak-spot drill · ":"")+ex.name+" · "+ex.code}), el("div",{class:"tally"}, "Q "+(S.i+1)+" / "+S.qs.length+"   ", el("b",{text:"✓ "+right}), "  ", el("s",{text:"✗ "+wrong}))),
        el("div",{class:"timer"+(!drill&&left<=300?" warn":""),id:"timer","aria-label":drill?"Time elapsed":"Time remaining",text:fmt(left)})),
      el("div",{class:"progress"}, el("i",{style:"width:"+((S.results.length)/S.qs.length*100)+"%"}))),
    el("div",{class:"stack"},

function check(){

        drill ? el("button",{id:"to-exam",onclick:()=>begin(S.exam,S.name,"exam")},"Full "+ex.name+" exam") : el("button",{id:"to-drill",disabled:answered(S.exam)<DRILL_MIN_ANSWERED,onclick:()=>begin(S.exam,S.name,"drill")},"Drill my weak spots"),

      el("div",{class:"review"}, ...missed.map(({q,r})=>el("div",{class:"rv"},

  if (drill){ const pb0=document.getElementById("post-status"); if (pb0) pb0.textContent = "Drill results count toward your accuracy on the home screen. They aren't posted to the scoreboard."; return; }
