t imitates a legitimate SSID to intercept traffic."},{"d":2,"q":"A user's files are encrypted, and a message demands payment in cryptocurrency to unlock them. Which type of malware is this?","o":["Ransomware","Spyware","Keylogger","Adware"],"a":0,"e":"Ransomware encrypts data and demands payment. Offline, tested backups are the best defense."},{"d":2,"q":"A user downloaded a free game that also secretly installed a backdoor. Which type of malware is this?","o":["Trojan","Worm","Virus","Rootkit"],"a":0,"e":"A Trojan looks like legitimate software but carries a malicious payload."},{"d":2,"q":"Which type of malware hides deep in the operating system or firmware and conceals its presence from antivirus software?","o":["Rootkit","Adware","Keylogger","Spyware"],"a":0,"e":"Rootkits hide processes, files, and registry keys, often at kernel or boot level. Removing one often means reimaging the system."},{"d":2,"q":"A user's PC runs extremely slowly, and the CPU stays near 100% because of an unknown process that uses its resources to generate digital currency. What is this?","o":["Cryptominer","Ransomware","Keylogger","Boot sector virus"],"a":0,"e":"Cryptominers (cryptojacking) secretly use system resources to mine cryptocurrency."},{"d":2,"q":"Which malware records everything a user types to steal credentials?","o":["Keylogger","Adware","Worm","Ransomware"],"a":0,"e":"Keyloggers capture keystrokes, and they can be software or hardware."},{"d":2,"q":"Which wireless security protocol is the MOST secure for a new SOHO network?","o":["WPA3","WPA2 with TKIP","WEP","WPA"],"a":0,"e":"WPA3 uses SAE (Simultaneous Authentication of Equals), which resists offline password guessing. WEP and TKIP are obsolete."},{"d":2,"q":"Which encryption method should be used with WPA2 for strong wireless security?","o":["AES (CCMP)","TKIP","RC4","DES"],"a":0,"e":"WPA2 should use AES-CCMP. TKIP is deprecated and vulnerable."},{"d":2,"q":"An organization wants to centrally manage administrator authentication on network devices and log each command they run. Which protocol is BEST suited?","o":["TACACS+","RADIUS","Kerberos","WPA3"],"a":0,"e":"TACACS+ (a Cisco-developed protocol) separates authentication, authorization, and accounting and can authorize individual commands, which suits device administration."},{"d":2,"q":"Which authentication protocol is used by Windows Active Directory and issues tickets to users?","o":["Kerberos","TACACS+","RADIUS","LDAP"],"a":0,"e":"Kerberos uses a ticket-granting system and is the default authentication protocol in AD domains."},{"d":2,"q":"A user logs in with a password and then approves a push notification on their phone. Which security concept is this?","o":["Multifactor authentication","Single sign-on","Least privilege","Zero trust only"],"a":0,"e":"MFA combines factors from different categories: something you know (a password) and something you have (a phone)."},{"d":2,"q":"An employee in accounting is given access only to the folders and applications needed for their job. Which principle is applied?","o":["Principle of least privilege","Implicit deny","Separation of duties","Single sign-on"],"a":0,"e":"Least privilege grants only the minimum access needed, which limits damage if the account is compromised."},{"d":2,"q":"A folder has Share permission 'Read' and NTFS permission 'Modify' for a user. What is the user's effective permission when accessing it over the network?","o":["Read","Modify","Full Control","No access"],"a":0,"e":"When share and NTFS permissions combine, the most restrictive one applies. Here that's Read."},{"d":2,"q":"A file is moved to a different folder on the SAME NTFS volume. What happens to its NTFS permissions?","o":["It keeps its original permissions","It inherits the destination folder's permissions","All permissions are removed","It gets Full Control for Everyone"],"a":0,"e":"Moving a file within the same volume keeps its permissions. Copying a file, or moving it to a different volume, makes it inherit the destination's permissions."},{"d":2,"q":"Which Windows feature prompts the user for permission before a program can make administrative changes?","o":["User Account Control (UAC)","BitLocker","Windows Defender Firewall","EFS"],"a":0,"e":"UAC requires elevation for administrative actions, even for admin accounts."},{"d":2,"q":"A user wants to encrypt specific files on an NTFS drive so other user accounts on the same PC cannot read them. Which feature should be used?","o":["Encrypting File System (EFS)","BitLocker","FileVault","Windows Hello"],"a":0,"e":"EFS encrypts individual files and folders per user. BitLocker encrypts whole volumes."},{"d":2,"q":"A company wants to encrypt USB flash drives so data is protected if a drive is lost. Which Windows feature should be used?","o":["BitLocker To Go","EFS","UAC","Windows Defender SmartScreen"],"a":0,"e":"BitLocker To Go encrypts removable drives and requires a password or smart card to unlock them."},{"d":2,"q":"Which steps should be taken to harden a new SOHO wireless router? (Choose two.)","o":["Change the default admin password","Update the firmware","Enable WPS","Leave UPnP enabled"],"a":[0,1],"e":"Change the default credentials and update the firmware. WPS and UPnP should normally be disabled because both have known weaknesses."},{"d":2,"q":"A coffee shop wants customers to have internet access without being able to reach the shop's point-of-sale system. What should be configured on the router?","o":["A separate guest network","MAC address cloning","Port forwarding to the POS","DMZ for all clients"],"a":0,"e":"A guest network isolates visitors from internal devices."},{"d":2,"q":"A company is disposing of old hard drives and needs to ensure the data can never be recovered. Which method is MOST secure?","o":["Physical destruction such as shredding","Quick format","Deleting the partitions","Moving files to the Recycle Bin"],"a":0,"e":"Shredding, drilling, or incinerating the drive physically destroys the platters or chips. Formatting or deleting partitions leaves recoverable data."},{"d":2,"q":"Which data destruction method uses a strong magnetic field and is NOT effective on SSDs?","o":["Degaussing","Shredding","Incineration","Drilling"],"a":0,"e":"Degaussing scrambles magnetic media such as HDDs and tapes. SSDs store data in flash cells, so they need cryptographic erase, secure erase, or physical destruction."},{"d":2,"q":"A company uses a third-party vendor to destroy drives. What document should the vendor provide for compliance records?","o":["Certificate of destruction","Chain of custody form only","EULA","Acceptable use policy"],"a":0,"e":"A certificate of destruction proves the media was destroyed and when."},{"d":2,"q":"A user receives a browser warning that a website's certificate is not trusted when visiting their bank. What should the user do?","o":["Not proceed and report it, because the connection may be intercepted","Click through the warning","Disable the browser's certificate checks","Clear the browser cache and proceed"],"a":0,"e":"An untrusted or invalid certificate on a known site can mean an on-path attack or a spoofed site. Don't continue."},{"d":2,"q":"An attacker intercepts and possibly alters communications between two parties without their knowledge. Which attack is this?","o":["On-path (man-in-the-middle)","Denial of service","Brute force","SQL injection"],"a":0,"e":"In an on-path attack, the attacker sits between two parties and can capture or modify the traffic."},{"d":2,"q":"A website is overwhelmed by traffic from thousands of compromised devices and becomes unavailable. Which attack is this?","o":["Distributed denial of service (DDoS)","Phishing","Zero-day","Insider threat"],"a":0,"e":"A DDoS uses many sources, often a botnet, to exhaust a target's resources."},{"d":2,"q":"An attacker exploits a software vulnerability that the vendor does not yet know about and has not patched. What is this?","o":["Zero-day attack","Brute force attack","Dictionary attack","Spoofing"],"a":0,"e":"A zero-day is a vulnerability exploited before a patch exists."},{"d":2,"q":"An attacker tries common words from a list as passwords against a login page. Which attack is this?","o":["Dictionary attack","Rainbow table only","Shoulder surfing","Evil twin"],"a":0,"e":"A dictionary attack tries words from a wordlist. A brute force attack tries every possible combination. Account lockout and MFA defend against both."},{"d":2,"q":"A web form is manipulated to send commands directly to a back-end database. Which attack is this?","o":["SQL injection","Cross-site scripting","Vishing","Evil twin"],"a":0,"e":"SQL injection inserts malicious SQL through unvalidated input. Parameterized queries prevent it."},{"d":2,"q":"An attacker injects malicious script into a website so it runs in other visitors' browsers. Which attack is this?","o":["Cross-site scripting (XSS)","SQL injection","On-path","DDoS"],"a":0,"e":"XSS runs attacker-supplied scripts in victims' browsers, often to steal session cookies."},{"d":2,"q":"Which security solution monitors endpoints for suspicious behavior, records activity, and allows a security team to isolate a compromised device?","o":["Endpoint detection and response (EDR)","Basic signature antivirus","A hardware firewall","A proxy server"],"a":0,"e":"EDR goes beyond signature antivirus: it uses behavior monitoring, collects forensic data, and can isolate devices remotely."},{"d":2,"q":"A disgruntled employee with legitimate access copies confidential data before quitting. Which threat type is this?","o":["Insider threat","Zero-day","Evil twin","Spoofing"],"a":0,"e":"Insider threats come from people with authorized access. Data loss prevention (DLP), least privilege, and monitoring help reduce the risk."},{"d":2,"q":"An attacker searches through a company's trash to find printed passwords and internal documents. What is this called?","o":["Dumpster diving","Shoulder surfing","Tailgating","Impersonation"],"a":0,"e":"Dumpster diving is searching discarded materials for information. Shredding policies help prevent it."},{"d":2,"q":"A company wants lost corporate phones to be locatable and erasable remotely. Which features should be enabled? (Choose two.)","o":["Locator application","Remote wipe","Bluetooth discoverable mode","Developer mode"],"a":[0,1],"e":"Locator apps (such as Find My) and remote wipe protect lost devices, and both are often enforced through MDM."},{"d":2,"q":"Which Windows tool provides built-in antivirus and anti-malware protection?","o":["Microsoft Defender Antivirus","Windows Update","BitLocker","Task Scheduler"],"a":0,"e":"Microsoft Defender Antivirus is built into Windows 10 and 11. Keep its definitions up to date."},{"d":2,"q":"An administrator wants to prevent users from logging in with only a password when accessing email from outside the office. Which approach is BEST?","o":["Require MFA for external access","Increase password length to 10 characters","Disable account lockout","Allow users to reuse passwords"],"a":0,"e":"MFA greatly reduces the risk of credential theft. Password changes alone don't stop phishing."},{"d":2,"q":"A browser extension that a user installed is injecting ads and redirecting searches. What is the BEST first action?","o":["Remove the untrusted extension","Clear the DNS cache","Reinstall the operating system","Disable the firewall"],"a":0,"e":"Malicious or untrusted extensions are a common cause of ad injection and redirects. Remove them and only install extensions from trusted sources."},{"d":3,"q":"What is the FIRST step in CompTIA's best practice procedure for malware removal?","o":["Investigate and verify malware symptoms","Quarantine the infected system","Disable System Restore","Remediate the infected system"],"a":0,"e":"The steps are: 1) investigate and verify malware symptoms, 2) quarantine the infected system, 3) disable System Restore in Windows, 4) remediate (update anti-malware, then scan and remove), 5) schedule scans and run updates, 6) enable System Restore and create a restore point, 7) educate the end user."},{"d":3,"q":"After confirming a PC is infected with malware, what should the technician do NEXT?","o":["Quarantine the system by disconnecting it from the network","Educate the end user","Create a restore point","Reinstall all applications"],"a":0,"e":"Quarantining the system stops the malware from spreading to other machines."},{"d":3,"q":"Why should System Restore be disabled during malware removal?","o":["Restore points may contain the malware and could reinfect the system","It speeds up the antivirus scan","It frees up RAM","It is required to enter Safe Mode"],"a":0,"e":"Old restore points can contain infected files. Disabling System Restore deletes them so the malware can't come back that way."},{"d":3,"q":"What is the FINAL step of the malware removal process?","o":["Educate the end user","Enable System Restore","Schedule scans","Quarantine the system"],"a":0,"e":"Finish by teaching the user how to avoid getting infected again."},{"d":3,"q":"During remediation, what should the technician do BEFORE running a full anti-malware scan?","o":["Update the anti-malware definitions","Enable System Restore","Educate the user","Reconnect to the network permanently"],"a":0,"e":"Current definitions are needed to detect the latest threats. Scanning in Safe Mode or from a pre-installation environment can also help."},{"d":3,"q":"A user's browser homepage keeps changing, and searches redirect to unfamiliar sites. What is the MOST likely cause?","o":["Browser hijacker malware or a malicious extension","A failing hard drive","An incorrect DNS suffix","A bad network cable"],"a":0,"e":"Changed homepages and search redirects are classic signs of a browser hijacker. Check extensions, browser settings, and the hosts file."},{"d":3,"q":"A user reports a pop-up claiming their PC is infected and instructing them to call a support number. Their installed antivirus shows no alerts. What is this MOST likely?","o":["A fake security alert (scareware)","A legitimate Windows Defender alert","A hardware failure","A driver update notice"],"a":0,"e":"Rogue or fake antivirus alerts try to scare users into calling scammers or paying. Close the browser and scan with legitimate tools."},{"d":3,"q":"Several of a user's files now have unfamiliar extensions and cannot be opened. What should the technician suspect?","o":["Ransomware infection","File system corruption from a power outage","Missing codecs","Incorrect file associations only"],"a":0,"e":"Renamed or encrypted files are a key sign of ransomware. Isolate the PC immediately."},{"d":3,"q":"A user's contacts report receiving spam emails from the user's account, but the user did not send them. What is the MOST likely cause?","o":["The email account has been compromised","The mail server is out of disk space","DNS records are incorrect","The user's monitor is faulty"],"a":0,"e":"A hijacked email account sends spam to the user's contacts. Reset the password, enable MFA, and check the mailbox rules."},{"d":3,"q":"A Windows PC displays a blue screen with a stop code and restarts after a new driver was installed. What should the technician do FIRST?","o":["Boot into Safe Mode and roll back the driver","Replace the motherboard","Reinstall Windows","Replace the RAM"],"a":0,"e":"A BSOD right after a driver install points to that driver. Safe Mode loads only minimal drivers so you can roll it back."},{"d":3,"q":"A Windows 11 PC fails to boot after a recent update. Which feature lets the technician access Startup Repair, System Restore, and uninstalling updates?","o":["Windows Recovery Environment (WinRE)","Task Manager","Event Viewer","Disk Cleanup"],"a":0,"e":"WinRE (Advanced Startup) offers Startup Repair, System Restore, Uninstall Updates, a command prompt, and Reset this PC."},{"d":3,"q":"A user's PC has become slow after they installed several programs. The technician sees many apps launching at startup. Where can these be disabled in Windows 11?","o":["Task Manager Startup apps tab","Device Manager","Disk Management","Certificate Manager"],"a":0,"e":"Task Manager's Startup apps page (also found in Settings > Apps > Startup) shows the impact of each app and lets you disable it."},{"d":3,"q":"A Windows service needed by an application fails to start after reboot. Where should the technician check the service's startup type and status?","o":["services.msc","diskmgmt.msc","devmgmt.msc","certmgr.msc"],"a":0,"e":"The Services console shows each service's status and startup type (Automatic, Manual, Disabled) and its dependencies."},{"d":3,"q":"A user's application crashes every time a specific report is opened. Which tool should be checked FIRST for error details?","o":["Event Viewer Application log","Disk Management","Device Manager","Network and Sharing Center"],"a":0,"e":"The Application log records crash events, the faulting module, and error codes."},{"d":3,"q":"Windows displays a 'low memory' warning, and the system is sluggish with many browser tabs open. What should the technician recommend FIRST?","o":["Close unneeded apps and tabs, and consider adding RAM","Replace the hard drive","Disable the firewall","Format the drive"],"a":0,"e":"Using up all the RAM forces heavy paging. Reduce the load first, then upgrade the RAM if needed."},{"d":3,"q":"A user's Windows profile takes several minutes to load at sign-in, while other users sign in quickly on the same PC. What is a likely cause?","o":["A corrupt or very large user profile","A failing power supply","A bad monitor cable","An incorrect time zone"],"a":0,"e":"If only one user signs in slowly, the cause is that user's profile, such as corruption or a large roaming profile. Rebuilding the profile may be needed."},{"d":3,"q":"A PC's clock keeps drifting several minutes from the correct time, causing authentication failures on the domain. What should be checked?","o":["Time synchronization with the domain/NTP server","The screen resolution","The printer spooler","The USB controller"],"a":0,"e":"Kerberos needs clocks within about 5 minutes of each other. Check the Windows Time service and the NTP source, and consider the CMOS battery."},{"d":3,"q":"A Windows Update repeatedly fails to install with the same error code. What should the technician try?","o":["Run the Windows Update troubleshooter and check the error code","Replace the RAM","Disable the firewall permanently","Change the screen resolution"],"a":0,"e":"Look up the specific error code, run the troubleshooter, and consider clearing the SoftwareDistribution folder and running DISM and SFC."},{"d":3,"q":"A Windows PC shows 'Operating system not found' after a USB drive was left plugged in. What is the MOST likely cause?","o":["The firmware is trying to boot from the USB drive first","The SSD failed","Windows was deleted by malware","The RAM is bad"],"a":0,"e":"If USB comes before the internal drive in the boot order, a non-bootable USB stick can stop startup. Remove it or fix the boot order."},{"d":3,"q":"A user installed a new application, and now the PC is unstable. The application cannot be uninstalled normally. What is the BEST way to return the system to its prior state?","o":["Use System Restore to a point before the install","Reformat the drive","Replace the motherboard","Disable all services"],"a":0,"e":"System Restore rolls back system files, drivers, and registry settings without affecting personal files."},{"d":3,"q":"A user wants to reinstall Windows but keep their personal files, and is fine with reinstalling apps. Which option should be used?","o":["Reset this PC with 'Keep my files'","Clean install from USB with drive format","System Restore","Disk Cleanup"],"a":0,"e":"Reset this PC with 'Keep my files' reinstalls Windows and removes apps and settings, but keeps your personal files."},{"d":3,"q":"A USB device works on other PCs but is not recognized on one Windows PC. Which tool should the technician check FIRST?","o":["Device Manager","Disk Cleanup","Task Scheduler","msinfo32"],"a":0,"e":"Device Manager shows unknown devices and driver problems, and you can trigger a scan for hardware changes from it."},{"d":3,"q":"A smartphone app keeps crashing right after it opens. What should the technician try FIRST?","o":["Force stop the app and clear its cache, then update it","Factory reset the phone","Replace the battery","Disable cellular data"],"a":0,"e":"Start with the least disruptive fixes: force stop, clear the cache, update or reinstall the app, then restart the device."},{"d":3,"q":"A phone will not install the latest OS update. Which is the MOST likely cause?","o":["Insufficient storage space or the device is no longer supported","The Bluetooth is off","Screen brightness is too low","The SIM card is missing"],"a":0,"e":"Updates fail when there's not enough free space, the battery is low, or the device has reached end-of-support."},{"d":3,"q":"A mobile device is very slow, and its storage is 98% full. What should the technician recommend?","o":["Free up storage by removing unused apps and offloading media","Enable airplane mode","Replace the screen","Disable location services"],"a":0,"e":"Nearly full storage slows the device down. Clearing space restores performance."},{"d":3,"q":"A phone screen does not rotate when the device is turned sideways. What should the technician check FIRST?","o":["Whether rotation lock is enabled","The digitizer","The battery health","The Wi-Fi settings"],"a":0,"e":"Rotation lock is the most common reason. If that's not it, the app may not support rotation, or the accelerometer may have failed."},{"d":3,"q":"A user's phone shows unexpected high data usage, unknown apps, and the battery drains quickly. Which issue should be suspected?","o":["Malware on the mobile device","A faulty charging cable","Low screen brightness","A cracked case"],"a":0,"e":"Unknown apps, data spikes, and battery drain together suggest a compromised device. Remove suspicious apps, and factory reset if needed."},{"d":3,"q":"A user installed an app from outside the official app store and now sees frequent ads on the home screen. What is this practice called, and what risk does it introduce?","o":["Sideloading; it can introduce malware","Rooting; it improves security","Jailbreaking; it is required for updates","Tethering; it increases data use"],"a":0,"e":"Sideloading installs apps from unvetted sources and is a common way malware gets onto phones. MDM can block it."},{"d":3,"q":"A user can no longer log in to a company app after the phone was jailbroken. What is the MOST likely reason?","o":["MDM or the app detected the jailbreak and blocked access","The Wi-Fi password expired","The screen protector is too thick","The phone needs a new SIM"],"a":0,"e":"Jailbroken or rooted devices bypass OS security protections, so MDM and many corporate apps refuse to run on them."},{"d":3,"q":"After malware removal, the technician confirms the system is clean. Which of the following should be done BEFORE educating the user?","o":["Enable System Restore and create a new restore point","Disable antivirus","Delete all user files","Disconnect the PC permanently"],"a":0,"e":"Re-enable System Restore and create a clean restore point, then educate the user."},{"d":3,"q":"A user receives a message that their certificate has expired when connecting to an internal website. Other users have no issue. What should be checked FIRST?","o":["The date and time on the user's PC","The website's DNS record","The user's monitor","The printer queue"],"a":0,"e":"Certificate validation depends on the correct time. A wrong system clock can make a valid certificate appear expired or not yet valid."},{"d":3,"q":"Windows Defender reports that it cannot update and its real-time protection keeps turning off by itself. What should the technician suspect?","o":["Malware tampering with security software","A normal Windows behavior","A failing monitor","An expired Office license"],"a":0,"e":"Malware often disables security tools to protect itself. Investigate and use offline scanning tools."},{"d":3,"q":"Users report that a shared application runs very slowly only between 9:00 and 9:30 a.m. The technician finds an antivirus full scan is scheduled at 9:00 a.m. What should be done?","o":["Reschedule the scan to after hours","Uninstall the antivirus","Add more monitors","Disable Windows Update"],"a":0,"e":"Schedule resource-heavy tasks outside business hours so they don't slow down users."},{"d":3,"q":"A desktop app shows 'The application was unable to start correctly' and mentions a missing DLL. What is the BEST fix?","o":["Repair or reinstall the application or its required runtime","Replace the CPU","Run diskpart","Change the screen resolution"],"a":0,"e":"Missing or corrupt DLLs and runtimes (such as the Visual C++ Redistributable) are usually fixed by repairing or reinstalling the app or runtime."},{"d":3,"q":"Which Windows startup mode loads only the minimal set of drivers and services, which helps isolate software problems?","o":["Safe Mode","Fast Startup","Hibernate","Secure Boot"],"a":0,"e":"Safe Mode loads only essential drivers and services. If the problem disappears there, a third-party driver or app is likely the cause."},{"d":4,"q":"Before working inside a desktop PC, a technician puts on a strap connected to the chassis. What is the purpose?","o":["Prevent electrostatic discharge damage to components","Prevent electric shock from the PSU","Ground the monitor","Measure voltage"],"a":0,"e":"An ESD wrist strap equalizes static charge between you and the equipment, which protects sensitive components."},{"d":4,"q":"Which type of fire extinguisher should be used on an electrical fire in a server room?","o":["Class C (CO2 or clean agent)","Class A (water)","Class K","Class D"],"a":0,"e":"Class C extinguishers are for energized electrical fires. Water conducts electricity and is dangerous to use on them."},{"d":4,"q":"A technician needs the evidence, and report it per company policy","Delete the content","Continue the repair and ignore it","Copy the files to a USB drive for review"],"a":0,"e":"Follow incident response procedures: don't alter the evidence, report it to the proper authority, and preserve the chain of custody."},{"d":4,"q":"Which document tracks every person who handled evidence and when, so it stays admissible?","o":["Chain of custody","SDS","Rollback plan","Acceptable use policy"],"a":0,"e":"The chain of custody records who handled evidence and when, so it can be shown it wasn't tampered with."},{"d":4,"q":"A user wants to install software on 20 office computers but bought a single-user license. What is the issue?","o":["It violates the license agreement (EULA)","It is allowed for small businesses","It is fine if the software is uninstalled later","It is allowed if installed offline"],"a":0,"e":"Licenses define how many installs or users are allowed. Exceeding them is a licensing violation."},{"d":4,"q":"Which ticketing system practice is MOST important when documenting a resolved issue?","o":["Clear description of the problem, steps taken, and the resolution","Only the user's name","Only the time spent","The technician's personal opinions"],"a":0,"e":"Good tickets record the issue, the troubleshooting steps, and the resolution, so they can serve as a knowledge base for future tickets."},{"d":4,"q":"An organization tracks every laptop with a unique tag, assigned user, purchase date, and warranty status. What is this process?","o":["Asset management","Change management","Incident response","Patch management"],"a":0,"e":"Asset management keeps an inventory of hardware and software throughout its lifecycle."},{"d":4,"q":"Which file extension indicates a Windows PowerShell script?","o":[".ps1",".sh",".bat",".vbs"],"a":0,"e":".ps1 is PowerShell, .sh is a Linux shell script, .bat is a Windows batch file, and .vbs is VBScript."},{"d":4,"q":"Which file extension is used for a Linux shell script?","o":[".sh",".ps1",".bat",".js"],"a":0,"e":".sh files are run by shells such as bash."},{"d":4,"q":"A technician writes a script to map network drives at login. Which is a key risk of running scripts?","o":["A script can make unintended system changes or introduce malware if untested","Scripts always require more RAM","Scripts cannot run on domain computers","Scripts disable the firewall automatically"],"a":0,"e":"Untested scripts can cause unintended changes, crash systems, or open security holes. Test them and use code signing."},{"d":4,"q":"A help desk needs to securely access and manage remote employees' PCs, including pushing patches and monitoring health. Which tool is BEST?","o":["Remote monitoring and management (RMM)","Telnet","An FTP server","A KVM switch"],"a":0,"e":"RMM platforms provide remote control, patching, monitoring, and alerting at scale."},{"d":4,"q":"Which remote access method is MOST secure for administering a Linux server's command line?","o":["SSH","Telnet","FTP","HTTP"],"a":0,"e":"SSH encrypts the session. Telnet sends everything, including credentials, in plaintext."},{"d":4,"q":"While on a service call, a technician's personal phone rings repeatedly. What is the MOST professional action?","o":["Silence the phone and return calls after the job","Answer and talk while working","Put the call on speaker","Ask the customer to wait outside"],"a":0,"e":"Avoid distractions. Keep the focus on the customer and use personal devices only when appropriate."},{"d":4,"q":"A customer is upset that their computer is still not fixed. What should the technician do?","o":["Listen actively, avoid arguing, and clarify the issue and next steps","Tell them it is not your fault","Explain the problem using technical jargon","Leave without explanation"],"a":0,"e":"Professionalism means active listening, not being defensive, setting clear expectations, and following up."},{"d":4,"q":"An employee wants to paste a customer's account details into a public AI cha <script>
(function(){

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function quotas(exam){
  const ds = EXAMS[exam].domains, tot = ds.reduce((s,d)=>s+d.w,0);
  const raw = ds.map(d=>({id:d.id, x:N_Q*d.w/tot}));
  raw.forEach(r=>{ r.n=Math.floor(r.x); r.f=r.x-r.n; });
  let left = N_Q - raw.reduce((s,r)=>s+r.n,0);
  [...raw].sort((a,b)=>b.f-a.f).slice(0,left).forEach(r=>r.n++);
  return raw;
}
function buildExam(exam){
  const pool = BANK[exam], picked = [];
  for (const q of quotas(exam)){
    const inDom = shuffle(pool.filter(p=>p.d===q.id));
    picked.push(...inDom.slice(0,q.n));
  }
  return shuffle(picked).map(p=>{
    const order = shuffle(p.o.map((_,i)=>i));
    const ans = Array.isArray(p.a) ? p.a : [p.a];
    return { d:p.d, q:p.q, e:p.e, o:order.map(i=>p.o[i]), a:ans.map(i=>order.indexOf(i)).sort(), multi:ans.length>1 };
  });
}
const store = {

const SUPABASE_URL = "https://llqdwwgznifykwuiueoq.supabase.co";
const SUPABASE_KEY = "sb_publishable_HCy2xUD8lQppMh8vDLZ2VQ_Zh9dewNA";

const board = { ready:false, db:null, uid:null, canWrite:true, rows:[], tab:"c1", listeners:new Set(), failed:false };
function myKey(){ return (cleanName(store.get("aplus-name"))||"").toLowerCase(); }
async function initBoard(){
  board.uid = myKey();

  try { board.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch(e){ board.failed = true; notifyBoard(); return; }

}
async function refreshBoard(){
  const { data, error } = await board.db.from("scores").select("name,exam,pct,correct,secs")
    .order("pct",{ascending:false}).order("secs",{ascending:true}).limit(1000);
  if (error){ board.failed = true; notifyBoard(); return; }
  const by = {};
  for (const r of data){
    const key = cleanName(r.name).toLowerCase(); if (!key) continue;
    const o = by[key] || (by[key] = {id:key, name:r.name});
    if (!o[r.exam]) o[r.exam] = {best:r.pct, correct:r.correct, secs:r.secs, attempts:1};
    else o[r.exam].attempts++;
  }
  board.rows = Object.values(by); board.ready = true; board.failed = false; notifyBoard();
}
function notifyBoard(){ board.listeners.forEach(fn=>fn()); }
async function postScore(exam, res){
  board.uid = res.name.toLowerCase();
  if (!board.db) return {ok:false, why:"nodb"};
  const mine = board.rows.find(r=>r.id===board.uid);
  const prev = mine && mine[exam];
  const better = !prev || res.pct > prev.best || (res.pct===prev.best && res.secs < prev.secs);
  const { error } = await board.db.from("scores").insert({ name:res.name, exam, pct:res.pct, correct:res.correct, secs:res.secs });
  if (error) return {ok:false, why:"error"};
  refreshBoard();
  return {ok:true, better};
}
function renderBoard(container){

  );

/* ---------- exam ---------- */
function begin(exam, name){

  }, 250);

}
function drawQ(){

      el("h3",{text:r.ok?"Correct":"Incorrect"}),
      r.ok ? null : el("p",null, el("strong",{text:"Answer: "}), q.a.map(i=>"ABCDEFGH"[i]+". "+q.o[i]).join("  ·  ")),
      el("p",{text:q.e}));
    const last = S.i === S.qs.length-1;
    actions = el("div",{class:"row"}, el("button",{class:"primary",id:"next-btn",onclick:()=>{ if(last) finish(false); else { S.i++; S.sel=[]; S.checked=false; drawQ(); window.scrollTo(0,0);} }}, last?"See results":"Next question"));
  } else {
    actions = el("div",{class:"row"},
      el("button",{class:"primary",id:"check-btn",disabled:S.sel.length!==need,onclick:check}, "Check answer"),

  }

  const endBox = S.confirmEnd ? el("div",{class:"confirm"},

    : el("button",{class:"link",id:"end-btn",onclick:()=>{S.confirmEnd=true;drawQ();}},"End exam early");

  app.replaceChildren(
    el("div",{class:"bar-top"},
      el("div",{class:"inner"},
        el("div",null, el("div",{class:"eyebrow",text:ex.name+" · "+ex.code}), el("div",{class:"tally"}, "Q "+(S.i+1)+" / "+S.qs.length+"   ", el("b",{text:"✓ "+right}), "  ", el("s",{text:"✗ "+wrong}))),
        el("div",{class:"timer"+(left<=300?" warn":""),id:"timer","aria-label":"Time remaining",text:fmt(left)})),
      el("div",{class:"progress"}, el("i",{style:"width:"+((S.results.length)/S.qs.length*100)+"%"}))),
    el("div",{class:"stack"},
      el("div",{class:"eyebrow",text:dom.name}),
      el("p",{class:"qtext",text:q.q}),
      el("div",{class:"opts",role:q.multi?"group":"radiogroup"}, ...opts),
      feedback, actions, endBox)
  );
}
function check(){
  const q = S.qs[S.i];
  const ok = S.sel.length===q.a.length && [...S.sel].sort().every((v,i)=>v===q.a[i]);
  S.results.push({ok, sel:[...S.sel]});
  S.checked = true; drawQ();
}

/* ---------- results ---------- */
async function finish(timedOut){
  if (!S || S.done) return;
  S.done = true; clearInterval(tick);
  const ex = EXAMS[S.exam];
  const secs = Math.min(MINUTES*60, Math.round((Date.now()-S.start)/1000));
  const correct = S.results.filter(r=>r.ok).length;
  const pct = Math.round(correct/S.qs.length*100);
  const pass = pct >= TARGET;

  const perDom = ex.domains.map(d=>{
    const idxs = S.qs.map((q,i)=>q.d===d.id?i:-1).filter(i=>i>=0);
    const got = idxs.filter(i=>S.results[i]&&S.results[i].ok).length;
    return {d, got, n:idxs.length};
  });
  const missed = S.qs.map((q,i)=>({q, r:S.results[i]})).filter(x=>!x.r || !x.r.ok);

  const postBox = el("p",{class:"post",id:"post-status",text:"Posting your score…"});
  window.scrollTo(0,0);
  app.replaceChildren(
    el("header",{class:"hero"},
      el("span",{class:"codes",text:ex.name+" · "+ex.code}),
      el("h1",{text: timedOut ? "Time's up" : "Exam complete"}),
      el("p",{class:"muted",text:S.name})),
    el("div",{class:"stack"},
      el("div",{class:"scorebig"}, el("span",{class:"n",text:pct+"%"}), el("span",{class:"pill "+(pass?"pass":"fail"),text: pass ? "On track" : "Keep drilling"})),
      el("p",{class:"muted",text:"Aim for "+TARGET+"% or higher on practice tests before booking the real exam. CompTIA uses scaled scores, so this percentage won't map exactly to 675 or 700."}),
      el("div",{class:"stats"},
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Correct"}), el("b",{text:correct+" / "+S.qs.length})),
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Answered"}), el("b",{text:S.results.length+" / "+S.qs.length})),
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Time used"}), el("b",{text:fmt(secs)}))),
      postBox,
      el("div",{class:"dom-res"}, el("h3",{text:"By domain"}),
        ...perDom.map(p=>{
          const r = p.n ? p.got/p.n : 0;
          const col = r>=.8 ? "var(--good)" : r>=.6 ? "var(--accent)" : "var(--bad)";
          return el("div",{class:"r"}, el("span",{text:p.d.name}), el("span",{class:"v",text:p.got+"/"+p.n}), el("span",{class:"bar"}, el("i",{style:"width:"+(r*100)+"%;background:"+col})));
        })),
      el("div",{class:"row"},
        el("button",{class:"primary",id:"retake",onclick:()=>begin(S.exam,S.name)},"New "+ex.name+" exam"),
        el("button",{id:"home",onclick:home},"Back to scoreboard")),
      missed.length ? el("h2",{text:"Review missed ("+missed.length+")",style:"margin-top:16px"}) : el("h2",{text:"Perfect score. Nothing to review.",style:"margin-top:16px"}),
      el("div",{class:"review"}, ...missed.map(({q,r})=>el("div",{class:"rv"},
        el("span",{class:"eyebrow",text:ex.domains.find(d=>d.id===q.d).name}),
        el("strong",{text:q.q}),
        el("span",{class:"yours",text: r ? "Your answer: "+r.sel.map(i=>q.o[i]).join(" · ") : "Not answered"}),
        el("span",{class:"ans",text:"Correct: "+q.a.map(i=>q.o[i]).join(" · ")}),
        el("span",{class:"muted",text:q.e}))))
    )
  );

  const res = await postScore(S.exam, {name:S.name, pct, correct, secs});
  const msg = res.ok ? (res.better ? "New personal best posted to the scoreboard." : "Score saved. Your best score on the scoreboard is still higher.")
    : res.why==="nowrite" ? "Not posted: your access to this page is view-only. Ask the person who shared it to invite you as an Editor."
    : res.why==="noid" || res.why==="nodb" ? "Not posted: the scoreboard isn't connected right now."
    : "Couldn't reach the scoreboard right now. Your score is shown above.";
  const pb = document.getElementById("post-status"); if (pb) pb.textContent = msg;
}

home();
initBoard();
})();
</script>
