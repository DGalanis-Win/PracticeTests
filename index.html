<title>CompTIA Practice Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: single centered column (max 760px); a sticky exam bar during tests; scoreboard below the exam picker. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --line:#cfd6de;
  --ink:#16202b; --muted:#566373; --accent:#d9822b; --accent-ink:#ffffff; --accent-soft:#f8e6d3;
  --good:#1f7a4d; --good-soft:#dcf1e5; --bad:#b4322e; --bad-soft:#f8dedc; --steel:#2f4a66;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --sunk:#0c1117; --line:#2c3947;
  --ink:#e5ebf1; --muted:#97a5b4; --accent:#f0a04b; --accent-ink:#1a1006; --accent-soft:#3a2a18;
  --good:#5cc98f; --good-soft:#163526; --bad:#f07b72; --bad-soft:#3d1c1a; --steel:#8fb3d9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --sunk:#0c1117; --line:#2c3947;
  --ink:#e5ebf1; --muted:#97a5b4; --accent:#f0a04b; --accent-ink:#1a1006; --accent-soft:#3a2a18;
  --good:#5cc98f; --good-soft:#163526; --bad:#f07b72; --bad-soft:#3d1c1a; --steel:#8fb3d9; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,6vw,3.1rem);text-transform:uppercase}
h2{font-size:1.6rem;text-transform:uppercase}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600}
button:hover{border-color:var(--steel)}
button:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.06)}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:none;padding:6px 0;color:var(--muted);text-decoration:underline;font-weight:500}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
/* header */
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.hero .codes{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
/* exam cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .code{font-family:var(--f-mono);font-size:.85rem;color:var(--steel);font-weight:600}
.spec{display:flex;gap:16px;font-family:var(--f-mono);font-size:.85rem}
.spec b{font-size:1.15rem;display:block;color:var(--ink)}
.domains{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.domains li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.domains .bar{grid-column:1/-1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.domains .bar i{display:block;height:100%;background:var(--steel)}
.domains .pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.card button{margin-top:auto}
/* scoreboard */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:var(--r)}
.tabs button{border:none;background:none;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink)}
.board-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 20px;text-align:left;white-space:nowrap}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--sunk);font-variant-numeric:tabular-nums}
td.name{white-space:normal;word-break:break-word;font-weight:500}
td.rank{font-family:var(--f-mono);color:var(--muted);width:3em}
tr.me td{background:var(--accent-soft)}
tr:first-child td.rank{color:var(--accent);font-weight:600}
.board-note{padding:14px 20px;font-size:.88rem;color:var(--muted)}
/* exam bar */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.bar-top .inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.timer.warn{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tally{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--good)} .tally s{color:var(--bad);text-decoration:none;font-weight:600}
/* question */
.qtext{font-size:1.12rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--steel)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.opt .letter{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt span.t{min-width:0}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.locked{cursor:default}
.verdict{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-left:5px solid}
.terms{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.terms dl{margin:0;display:flex;flex-direction:column;gap:10px}
.terms dt{font-weight:600;color:var(--steel)}
.terms dd{margin:0}
.verdict.ok{background:var(--good-soft);border-color:var(--good)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.verdict h3{font-size:1.3rem;text-transform:uppercase}
.verdict.ok h3{color:var(--good)} .verdict.no h3{color:var(--bad)}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
/* results */
.scorebig{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.scorebig .n{font-family:var(--f-display);font-size:5rem;font-weight:700;line-height:1}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.pill.pass{background:var(--good-soft);color:var(--good)} .pill.fail{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.dom-res{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.dom-res .r{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.dom-res .r .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dom-res .bar{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.dom-res .bar i{display:block;height:100%}
.post{font-size:.92rem;padding:12px 16px;border-radius:var(--r);background:var(--sunk)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.rv .ans{color:var(--good);font-weight:600}
.rv .yours{color:var(--bad)}
.foot{margin-top:40px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}</style>

<script id="bank" type="application/json">{"c1":[{"d":1,"q":"A user reports that their laptop screen is very dark. When you shine a flashlight at the screen, you can faintly see the desktop. Which component is MOST likely failing?","o":["Backlight","Digitizer","Video driver","GPU"],"a":0,"e":"A faint image visible under a flashlight means the LCD panel is drawing the picture but nothing is lighting it from behind. That points to the backlight (or, on older CCFL screens, the inverter)."},{"d":1,"q":"A store wants employees to accept tap-to-pay from customers' smartphones. Which wireless technology does this rely on?","o":["NFC","Bluetooth","Infrared","Wi-Fi Direct"],"a":0,"e":"Near-field communication (NFC) works at a range of a few centimeters and is what mobile wallets use for contactless payment."},{"d":1,"q":"A technician is about to replace a laptop keyboard. What should the technician do FIRST?","o":["Disconnect AC power and disconnect or remove the battery","Remove the bottom panel screws","Update the BIOS","Order a replacement keyboard with the same part number"],"a":0,"e":"Before opening any laptop, remove all power sources. That means AC power and the battery, internal or external, to protect both you and the components."},{"d":1,"q":"A user wants to connect their laptop to two monitors, a wired network, a keyboard, and a mouse at their desk using a single cable. Which device BEST meets this need?","o":["USB-C/Thunderbolt docking station","KVM switch","USB hub","Port replicator with no video output"],"a":0,"e":"A docking station connected over USB-C or Thunderbolt can supply video, Ethernet, USB peripherals, and power over one cable."},{"d":1,"q":"A Bluetooth headset does not appear in the list of available devices on a user's phone. What should the technician do FIRST?","o":["Put the headset into pairing (discoverable) mode","Reset the phone's network settings","Replace the headset battery","Enable NFC on the phone"],"a":0,"e":"A Bluetooth device only appears in the scan list while it's discoverable. Putting it into pairing mode is the first step in the pairing process."},{"d":1,"q":"A traveling employee needs to share their phone's cellular data connection with a laptop over Wi-Fi. Which feature should they enable?","o":["Mobile hotspot","Airplane mode","Wi-Fi calling","Data roaming"],"a":0,"e":"A mobile hotspot turns the phone into a Wi-Fi access point that shares its cellular data connection. Sharing over a USB cable is called tethering."},{"d":1,"q":"Which memory module form factor is used in MOST laptops that have upgradeable RAM?","o":["SODIMM","DIMM","RIMM","SIMM"],"a":0,"e":"Laptops use the smaller SODIMM (small outline DIMM). Desktops use full-size DIMMs."},{"d":1,"q":"After replacing a laptop's display assembly, the user notices that Wi-Fi signal strength is much weaker than before. What is the MOST likely cause?","o":["The wireless antenna leads were not reconnected properly","The wireless driver was corrupted","The router channel changed","The display's inverter is faulty"],"a":0,"e":"Laptop Wi-Fi antennas usually run through the display lid. If the antenna cables are pinched or left disconnected during a screen swap, signal strength drops."},{"d":1,"q":"A tablet's display shows a clear image, but the screen no longer responds to touch. Which component is MOST likely faulty?","o":["Digitizer","Backlight","LCD panel","Accelerometer"],"a":0,"e":"The digitizer is the layer that converts touch into input. If the picture is fine but touch fails, the digitizer (or its connector) is the likely cause."},{"d":1,"q":"A company wants to require passcodes, push apps, and remotely wipe lost company smartphones. Which solution should it implement?","o":["Mobile device management (MDM)","A VPN","Remote desktop","A mobile hotspot"],"a":0,"e":"MDM lets an organization centrally enforce policies such as passcodes and encryption, deploy apps, and lock or wipe devices remotely."},{"d":1,"q":"A user notices the laptop touchpad is bulging upward and the case no longer closes flat. What should the technician do?","o":["Power down, stop using the device, and safely remove and dispose of the battery","Recalibrate the touchpad","Update the touchpad driver","Continue charging until the battery reaches 100%"],"a":0,"e":"A bulging case is a sign of a swollen lithium-ion battery, which is a fire hazard. Stop using the device and remove the battery, then recycle it according to local regulations."},{"d":1,"q":"A delivery driver's phone app needs to determine the vehicle's exact location even when there is no Wi-Fi nearby. Which feature provides this?","o":["GPS","NFC","Bluetooth","Infrared"],"a":0,"e":"GPS calculates position from satellite signals and works without Wi-Fi. Cellular and Wi-Fi location can improve accuracy, but GPS is what provides it on its own."},{"d":1,"q":"A new smartphone has no physical SIM tray, but it can still connect to the carrier's network. Which technology makes this possible?","o":["eSIM","MicroSD","IMEI","Baseband update"],"a":0,"e":"An eSIM is an embedded SIM chip. The carrier profile is downloaded to it, so no physical card is needed."},{"d":1,"q":"A user wants to upgrade the storage in a thin laptop. The existing drive is a small stick-shaped card that uses PCIe lanes. Which type of drive should be ordered?","o":["M.2 NVMe SSD","2.5-inch SATA SSD","mSATA SSD","3.5-inch HDD"],"a":0,"e":"A small stick-shaped drive that uses PCIe lanes is an M.2 NVMe SSD. Check the key type and length (for example, 2280) before ordering."},{"d":1,"q":"A graphic designer needs to draw precisely on a tablet with pressure sensitivity. Which accessory is BEST?","o":["Active stylus","Capacitive glove","Trackpoint","Bluetooth keyboard"],"a":0,"e":"An active stylus communicates with the digitizer and supports pressure sensitivity and palm rejection for precise drawing."},{"d":1,"q":"A presenter connects a laptop to a projector, but the projector shows no image. The cable is good. What should the presenter try FIRST?","o":["Use the Fn display key or Windows+P to switch the display output","Replace the projector lamp","Reinstall the graphics driver","Change the projector's input to USB"],"a":0,"e":"Many laptops don't send video to an external display automatically. Toggling the output with the Fn key or Windows+P is the quickest first step."},{"d":1,"q":"Which connector is used for charging and data on MOST current Android phones and newer iPhones?","o":["USB-C","Lightning","Micro-USB","Mini-USB"],"a":0,"e":"USB-C is the current standard. Apple moved iPhones from Lightning to USB-C starting with the iPhone 15."},{"d":1,"q":"A company wants laptop users to sign in to Windows with their fingerprint. Which component and feature are needed?","o":["A fingerprint reader configured with Windows Hello","A TPM configured with BitLocker","An NFC reader configured with smart cards","A webcam configured with a screen saver lock"],"a":0,"e":"Windows Hello supports biometric sign-in using a compatible fingerprint reader or IR camera."},{"d":1,"q":"A user traveling internationally wants to avoid large cellular charges but still receive calls. Which setting should be turned off?","o":["Data roaming","Bluetooth","Location services","Wi-Fi calling"],"a":0,"e":"Turning off data roaming stops the phone from using cellular data on foreign networks while voice service stays available."},{"d":1,"q":"An employee's laptop has a built-in wireless card that needs to be replaced. In modern laptops, which form factor is the wireless card MOST likely to use?","o":["M.2","PCIe x16","ExpressCard","AGP"],"a":0,"e":"Modern laptop Wi-Fi and Bluetooth modules use the M.2 form factor (typically Key E). Older laptops used Mini PCIe."},{"d":2,"q":"Which port does SSH use by default?","o":["22","23","25","3389"],"a":0,"e":"SSH uses TCP port 22. Telnet uses 23, SMTP uses 25, and RDP uses 3389."},{"d":2,"q":"A technician needs to remotely control a Windows workstation's desktop. Which port must be open by default?","o":["3389","22","445","143"],"a":0,"e":"Remote Desktop Protocol (RDP) uses TCP port 3389."},{"d":2,"q":"Which protocol and port does a client use to SEND email to a mail server?","o":["SMTP on port 25 (or 587 for submission)","IMAP on port 143","POP3 on port 110","HTTP on port 80"],"a":0,"e":"SMTP sends mail. POP3 and IMAP retrieve it. Port 25 is server-to-server SMTP, and clients often submit mail on 587."},{"d":2,"q":"A user wants their email to stay synchronized on the server so it appears the same on their phone and laptop. Which protocol should be used?","o":["IMAP","POP3","SMTP","SNMP"],"a":0,"e":"IMAP (port 143, or 993 with TLS) keeps mail on the server and synchronizes folders across devices. POP3 typically downloads mail and removes it from the server."},{"d":2,"q":"Which port is used by Windows file and printer sharing (SMB) over TCP/IP?","o":["445","389","161","53"],"a":0,"e":"SMB runs directly over TCP port 445. LDAP uses 389, SNMP uses 161, and DNS uses 53."},{"d":2,"q":"Which service translates hostnames such as www.example.com into IP addresses, and which port does it use?","o":["DNS, port 53","DHCP, ports 67/68","LDAP, port 389","NetBIOS, port 137"],"a":0,"e":"DNS resolves names to IP addresses using port 53 (UDP for most queries, TCP for zone transfers and large responses)."},{"d":2,"q":"Which ports does DHCP use?","o":["UDP 67 and 68","TCP 20 and 21","TCP 80 and 443","UDP 161 and 162"],"a":0,"e":"DHCP servers listen on UDP 67, and clients use UDP 68. FTP uses 20/21, HTTP/HTTPS use 80/443, and SNMP uses 161/162."},{"d":2,"q":"A network monitoring tool needs to poll switches and routers for performance statistics. Which protocol does it MOST likely use?","o":["SNMP","SMTP","LDAP","RDP"],"a":0,"e":"Simple Network Management Protocol (SNMP) collects device statistics on UDP 161. Traps are sent on UDP 162."},{"d":2,"q":"Which ports does FTP use? (Choose two.)","o":["20","21","22","69"],"a":[0,1],"e":"FTP uses port 21 for control and port 20 for data in active mode. Port 22 is SSH/SFTP, and 69 is TFTP."},{"d":2,"q":"Which statement BEST describes the difference between TCP and UDP?","o":["TCP is connection-oriented with guaranteed delivery; UDP is connectionless with no delivery guarantee","UDP is connection-oriented; TCP is connectionless","TCP is used only for streaming; UDP is used only for web browsing","They are identical except for port numbers"],"a":0,"e":"TCP uses a three-way handshake, acknowledgments, and retransmission. UDP is faster and lighter but doesn't guarantee delivery, which suits streaming, VoIP, DNS queries, and DHCP."},{"d":2,"q":"A workstation shows an IP address of 169.254.33.10. What does this indicate?","o":["The workstation could not reach a DHCP server and assigned itself an APIPA address","The workstation has a valid public IP address","The workstation is using IPv6","The DNS server is down"],"a":0,"e":"169.254.x.x is an APIPA (link-local) address. Windows assigns one to itself when it can't get an address from DHCP."},{"d":2,"q":"Which of the following is a private IPv4 address?","o":["172.20.5.9","172.32.5.9","11.0.0.5","192.169.1.1"],"a":0,"e":"The private ranges are 10.0.0.0/8, 172.16.0.0–172.31.255.255, and 192.168.0.0/16. 172.20.5.9 falls in the 172.16/12 block."},{"d":2,"q":"What is the IPv6 loopback address?","o":["::1","127.0.0.1","fe80::1","ff02::1"],"a":0,"e":"::1 is the IPv6 loopback, equivalent to 127.0.0.1 in IPv4. fe80:: addresses are link-local, and ff02::1 is the all-nodes multicast address."},{"d":2,"q":"An IPv6 address beginning with fe80:: is which type of address?","o":["Link-local","Global unicast","Multicast","Loopback"],"a":0,"e":"fe80::/10 addresses are link-local. Every IPv6 interface generates one automatically, and it's only valid on the local segment."},{"d":2,"q":"Which DNS record type maps a hostname to an IPv6 address?","o":["AAAA","A","MX","CNAME"],"a":0,"e":"An AAAA (quad-A) record maps a name to an IPv6 address. An A record maps to IPv4, MX identifies mail servers, and CNAME is an alias."},{"d":2,"q":"A company is setting up its domain to help receiving mail servers verify which servers are allowed to send email on its behalf. Which DNS record type holds SPF, DKIM, and DMARC information?","o":["TXT","MX","AAAA","PTR"],"a":0,"e":"SPF, DKIM, and DMARC policies are published in TXT records. They help prevent spoofing and keep legitimate mail out of spam folders."},{"d":2,"q":"Which DNS record identifies the mail server that should receive email for a domain?","o":["MX","A","TXT","CNAME"],"a":0,"e":"MX (mail exchanger) records point to the servers that accept email for the domain."},{"d":2,"q":"A network printer must always receive the same IP address from DHCP. What should the administrator configure?","o":["A DHCP reservation","A shorter lease time","A new DHCP scope","An APIPA address"],"a":0,"e":"A DHCP reservation ties an IP address to the device's MAC address, so it always receives the same address while staying centrally managed."},{"d":2,"q":"An administrator needs to separate guest traffic from corporate traffic on the same physical switch. What should be configured?","o":["VLANs on a managed switch","A second hub","A DHCP reservation","Port forwarding"],"a":0,"e":"VLANs logically separate traffic on a managed switch, creating separate broadcast domains without extra hardware."},{"d":2,"q":"A company wants to install wireless access points on the ceiling where no electrical outlets are available. Which technology should it use?","o":["Power over Ethernet (PoE)","Powerline networking","Wake-on-LAN","Link aggregation"],"a":0,"e":"PoE supplies power over the same Ethernet cable that carries data. It's common for APs, IP phones, and cameras."},{"d":2,"q":"Which network device forwards traffic between different IP networks?","o":["Router","Unmanaged switch","Hub","Patch panel"],"a":0,"e":"Routers operate at Layer 3 and forward packets between networks. Switches forward frames within a network using MAC addresses."},{"d":2,"q":"Which cable category supports 10 Gbps Ethernet at the full 100-meter distance?","o":["Cat 6a","Cat 5e","Cat 6","Cat 5"],"a":0,"e":"Cat 6a supports 10GBASE-T to 100 m. Cat 6 supports 10 Gbps only to about 55 m, and Cat 5e is rated for 1 Gbps."},{"d":2,"q":"Two buildings are 10 kilometers apart and need a high-speed wired connection. Which cable type is MOST appropriate?","o":["Single-mode fiber","Multimode fiber","Cat 6a","RG-6 coaxial"],"a":0,"e":"Single-mode fiber carries signals for many kilometers. Multimode is meant for shorter runs, usually within a building or campus, and copper Ethernet is limited to 100 m."},{"d":2,"q":"A technician is terminating network cable into the back of a patch panel. Which tool is required?","o":["Punchdown tool","Crimper","Loopback plug","Toner probe"],"a":0,"e":"A punchdown tool seats wires into 110 or Krone blocks on patch panels and keystone jacks. A crimper attaches RJ45 plugs."},{"d":2,"q":"A technician needs to find which unlabeled wall jack connects to a specific port in the wiring closet. Which tool is BEST?","o":["Toner probe","Cable tester","Multimeter","Wi-Fi analyzer"],"a":0,"e":"A tone generator puts a signal on the cable, and the probe detects it at the other end, so you can trace and identify cable runs."},{"d":2,"q":"Which wiring standard order begins with white/orange, orange, white/green?","o":["T568B","T568A","Crossover","Rollover"],"a":0,"e":"T568B starts with white/orange, orange, white/green, blue. T568A swaps the green and orange pairs."},{"d":2,"q":"Users in an office complain of slow Wi-Fi on the 2.4 GHz band. A survey shows many neighboring networks. Which channels should be used to avoid overlap?","o":["1, 6, and 11","1, 2, and 3","3, 7, and 12","36, 40, and 44"],"a":0,"e":"In the 2.4 GHz band, only channels 1, 6, and 11 don't overlap in North America. Channels 36/40/44 are 5 GHz channels."},{"d":2,"q":"Which wireless standard is known as Wi-Fi 6E and adds support for the 6 GHz band?","o":["802.11ax","802.11ac","802.11n","802.11g"],"a":0,"e":"Wi-Fi 6 and Wi-Fi 6E are both 802.11ax. The 6E variant extends operation into the 6 GHz band."},{"d":2,"q":"Which wireless standard (Wi-Fi 5) operates only in the 5 GHz band?","o":["802.11ac","802.11n","802.11g","802.11ax"],"a":0,"e":"802.11ac (Wi-Fi 5) operates in 5 GHz only. 802.11n operates in both 2.4 and 5 GHz, and 802.11ax supports 2.4, 5, and 6 GHz."},{"d":2,"q":"A remote cabin's internet connection has very high latency, which makes video calls lag. Which connection type is MOST likely in use?","o":["Geostationary satellite","Fiber","Cable","DSL"],"a":0,"e":"Geostationary satellite links have high latency (often 600 ms or more) because of the distance to orbit. Low-earth-orbit services reduce this significantly."},{"d":2,"q":"Which type of network connects a user's smartwatch, phone, and wireless earbuds within a few meters?","o":["PAN","LAN","MAN","WAN"],"a":0,"e":"A personal area network (PAN), usually Bluetooth, covers a very short range around one person."},{"d":2,"q":"A storage network that gives servers block-level access to shared storage arrays is called a:","o":["SAN","WAN","PAN","WLAN"],"a":0,"e":"A storage area network (SAN) provides block-level storage access, often over Fibre Channel or iSCSI."},{"d":2,"q":"A small office wants to host a game server internally and allow outside players to connect to it. What should be configured on the SOHO router?","o":["Port forwarding","DHCP reservation only","MAC filtering","Disable NAT on all clients"],"a":0,"e":"Port forwarding maps an external port on the router's public IP to the internal server's private IP and port."},{"d":2,"q":"What is the subnet mask for a /24 network?","o":["255.255.255.0","255.255.0.0","255.255.255.128","255.0.0.0"],"a":0,"e":"/24 means 24 network bits, which is 255.255.255.0 and gives 254 usable host addresses."},{"d":2,"q":"An organization wants to centralize authentication for network devices and Wi-Fi using 802.1X. Which type of server is typically used?","o":["RADIUS","Syslog","DHCP","Proxy"],"a":0,"e":"RADIUS is an AAA (authentication, authorization, accounting) server and is commonly used with 802.1X for enterprise Wi-Fi and switch-port authentication."},{"d":2,"q":"A company wants to collect log messages from all its network devices in one place. Which type of server should it deploy?","o":["Syslog server","Proxy server","DNS server","Mail server"],"a":0,"e":"A syslog server collects log messages from routers, switches, firewalls, and servers for centralized review."},{"d":2,"q":"Which device filters traffic between networks based on rules such as allowed ports and IP addresses?","o":["Firewall","Hub","Access point","Repeater"],"a":0,"e":"A firewall permits or blocks traffic based on rules for IP addresses, ports, protocols, and, on next-generation firewalls, applications."},{"d":2,"q":"Which device type is typically used in industrial environments to monitor and control equipment such as pumps and power systems?","o":["SCADA system","Hub","Smart TV","Print server"],"a":0,"e":"SCADA (supervisory control and data acquisition) systems control industrial processes. They are often legacy, high-value targets, so they are usually isolated on their own network segment."},{"d":2,"q":"A technician uses a tool to view nearby wireless networks, their channels, and their signal strength in order to choose the best AP placement. Which tool is this?","o":["Wi-Fi analyzer","Toner probe","Loopback plug","Crimper"],"a":0,"e":"A Wi-Fi analyzer shows SSIDs, channels, signal strength, and interference, which helps with channel selection and AP placement."},{"d":3,"q":"A user wants to connect a monitor that supports daisy-chaining additional monitors from a single computer output. Which interface supports this natively?","o":["DisplayPort","HDMI","VGA","DVI-D"],"a":0,"e":"DisplayPort supports Multi-Stream Transport (MST), which lets you daisy-chain several monitors from one output. HDMI doesn't."},{"d":3,"q":"Which interface carries both uncompressed digital video and audio and is the standard connection for TVs?","o":["HDMI","VGA","DVI-I","S-Video"],"a":0,"e":"HDMI carries digital video and multichannel audio over one cable. VGA is analog video only."},{"d":3,"q":"What is the maximum data rate of USB 3.2 Gen 2?","o":["10 Gbps","5 Gbps","20 Gbps","480 Mbps"],"a":0,"e":"USB 3.2 Gen 1 is 5 Gbps, Gen 2 is 10 Gbps, and Gen 2x2 is 20 Gbps. USB 2.0 is 480 Mbps."},{"d":3,"q":"A video editor needs a single port that supports 40 Gbps transfers, external GPUs, and daisy-chaining displays. Which interface should the new laptop have?","o":["Thunderbolt 4","USB 2.0","eSATA","FireWire 800"],"a":0,"e":"Thunderbolt 3 and 4 provide 40 Gbps over a USB-C connector and support PCIe tunneling (for eGPUs) and display daisy-chaining."},{"d":3,"q":"Which connector supplies power to a SATA hard drive from a modern power supply?","o":["15-pin SATA power","4-pin Molex","24-pin ATX","8-pin EPS"],"a":0,"e":"SATA drives use a 15-pin SATA power connector. Molex is the older peripheral connector, 24-pin powers the motherboard, and 8-pin EPS powers the CPU."},{"d":3,"q":"A technician tries to install a DDR5 module into a motherboard designed for DDR4. What will happen?","o":["It will not fit because the notch position is different","It will run at DDR4 speeds","It will work only in single-channel mode","It will work after a BIOS update"],"a":0,"e":"DDR generations are keyed with a notch in a different position, so they physically can't be installed in the wrong slot. The voltages and signaling are also incompatible."},{"d":3,"q":"A server needs memory that can detect and correct single-bit errors. Which type of RAM should be purchased?","o":["ECC RAM","Non-parity RAM","SODIMM","VRAM"],"a":0,"e":"Error-correcting code (ECC) memory detects and corrects single-bit errors and is standard in servers and workstations where stability matters."},{"d":3,"q":"A user installed two identical RAM modules in adjacent slots, but memory bandwidth did not improve. The motherboard manual says modules must go in matching-color slots (A2 and B2). Which feature is not being used?","o":["Dual-channel memory","ECC","Virtual memory","Hyper-threading"],"a":0,"e":"Dual-channel mode needs matched modules installed in the correct paired slots, which the motherboard manual or slot colors identify. It roughly doubles memory bandwidth."},{"d":3,"q":"Which storage type offers the FASTEST performance for a new workstation boot drive?","o":["NVMe M.2 SSD","SATA SSD","7,200 RPM HDD","5,400 RPM HDD"],"a":0,"e":"NVMe drives use PCIe lanes directly, reaching several GB/s. SATA SSDs top out around 550 MB/s, and hard drives are much slower."},{"d":3,"q":"A small business wants disk redundancy using only two drives. Which RAID level should be configured?","o":["RAID 1","RAID 0","RAID 5","RAID 10"],"a":0,"e":"RAID 1 mirrors data across two drives, so either one can fail. RAID 0 has no redundancy, RAID 5 needs at least three drives, and RAID 10 needs at least four."},{"d":3,"q":"Which RAID level stripes data with distributed parity and requires a minimum of three drives?","o":["RAID 5","RAID 1","RAID 0","RAID 10"],"a":0,"e":"RAID 5 stripes data and parity across three or more drives and survives the failure of any single drive."},{"d":3,"q":"Which RAID level provides the BEST performance but NO fault tolerance?","o":["RAID 0","RAID 1","RAID 5","RAID 10"],"a":0,"e":"RAID 0 stripes data across drives for speed, but if any drive fails, all data on the array is lost."},{"d":3,"q":"A database server needs both high performance and redundancy and has four drives available. Which RAID level is MOST appropriate?","o":["RAID 10","RAID 0","RAID 1","RAID 5"],"a":0,"e":"RAID 10 (1+0) stripes across mirrored pairs. It combines RAID 0 speed with RAID 1 redundancy, needs at least four drives, and avoids RAID 5's parity write penalty."},{"d":3,"q":"A technician is building a compact home theater PC. Which motherboard form factor is the SMALLEST of the following?","o":["Mini-ITX","Micro-ATX","ATX","E-ATX"],"a":0,"e":"Mini-ITX boards measure 170 × 170 mm. Micro-ATX is 244 × 244 mm, and ATX is 305 × 244 mm."},{"d":3,"q":"A user wants to install a high-end graphics card. Which expansion slot should be used?","o":["PCIe x16","PCIe x1","PCI","M.2 Key E"],"a":0,"e":"Discrete GPUs use a PCIe x16 slot for maximum bandwidth."},{"d":3,"q":"A PC loses its date and time every time it is unplugged. What should the technician replace?","o":["CMOS battery","Power supply","RAM","BIOS chip"],"a":0,"e":"The CMOS battery (usually a CR2032) keeps the real-time clock and firmware settings when the PC has no power. When it dies, the clock resets."},{"d":3,"q":"Windows 11 requires a hardware component that securely stores encryption keys and supports features like BitLocker. Which component is this?","o":["TPM 2.0","HSM","NIC","ECC module"],"a":0,"e":"A Trusted Platform Module (TPM) 2.0 chip, or its firmware equivalent (fTPM or Intel PTT), is required for Windows 11 and stores keys for BitLocker and Windows Hello."},{"d":3,"q":"Which UEFI feature helps prevent unsigned bootloaders and rootkits from loading during startup?","o":["Secure Boot","Fast Boot","Legacy/CSM mode","PXE boot"],"a":0,"e":"Secure Boot only allows bootloaders signed with trusted keys to run, which blocks bootkits."},{"d":3,"q":"A technician installs a hypervisor, but virtual machines will not start, and an error says hardware virtualization is unavailable. What should the technician do?","o":["Enable Intel VT-x/AMD-V in the BIOS/UEFI","Install more RAM","Enable Secure Boot","Disable the TPM"],"a":0,"e":"Hardware virtualization extensions (Intel VT-x or AMD-V) have to be turned on in firmware before most hypervisors can run VMs."},{"d":3,"q":"Which device stores and manages cryptographic keys for an organization in a dedicated, tamper-resistant appliance?","o":["Hardware security module (HSM)","TPM","Smart card reader","KVM switch"],"a":0,"e":"An HSM is a dedicated appliance or card for high-volume key management and cryptographic operations. A TPM is a chip built into one computer."},{"d":3,"q":"A technician wants to network-boot a workstation to install an OS image from a deployment server. Which boot option should be enabled?","o":["PXE","Secure Boot","USB boot","Fast Boot"],"a":0,"e":"PXE (Preboot Execution Environment) lets the NIC download a boot image from a network server."},{"d":3,"q":"A new GPU requires 450 W, and the rest of the system requires 250 W. Which power supply is the BEST choice?","o":["850 W","500 W","650 W","700 W"],"a":0,"e":"The total load is about 700 W. Choosing a PSU with headroom (roughly 20 percent or more) improves efficiency and reliability, so 850 W is the best fit. 700 W leaves no margin."},{"d":3,"q":"Which power connector provides dedicated power to the CPU on a modern motherboard?","o":["8-pin EPS/ATX12V","24-pin ATX","6+2-pin PCIe","15-pin SATA"],"a":0,"e":"The 4- or 8-pin EPS/ATX12V connector powers the CPU's voltage regulators. The 24-pin connector powers the board, and PCIe connectors power graphics cards."},{"d":3,"q":"A server needs to stay running even if one power supply fails. What should be installed?","o":["Redundant power supplies","A modular power supply","A higher-wattage power supply","A surge protector"],"a":0,"e":"Redundant, hot-swappable PSUs let the server keep running when one supply fails."},{"d":3,"q":"Which advantage does a modular power supply offer?","o":["Only needed cables are attached, improving airflow and cable management","It provides redundancy","It supplies higher voltage","It can be hot-swapped"],"a":0,"e":"With a modular PSU you attach only the cables you need, which reduces clutter and improves airflow. It doesn't add redundancy."},{"d":3,"q":"After replacing a CPU cooler, the system overheats and shuts down within minutes. What did the technician MOST likely forget?","o":["Applying thermal paste between the CPU and the heat sink","Updating the chipset driver","Enabling XMP","Connecting the SATA cable"],"a":0,"e":"Thermal paste fills microscopic gaps between the CPU and heat sink. Without it, heat transfer is poor and the CPU overheats quickly."},{"d":3,"q":"In the laser printing process, which step uses heat and pressure to bond toner to the paper?","o":["Fusing","Developing","Transferring","Charging"],"a":0,"e":"The fuser assembly melts and presses toner into the paper. The order of steps is processing, charging, exposing, developing, transferring, fusing, and cleaning."},{"d":3,"q":"Which is the correct order of the laser printing process?","o":["Processing, charging, exposing, developing, transferring, fusing, cleaning","Charging, processing, fusing, exposing, developing, cleaning, transferring","Processing, exposing, charging, transferring, developing, cleaning, fusing","Cleaning, charging, developing, exposing, fusing, transferring, processing"],"a":0,"e":"CompTIA lists seven steps: processing, charging, exposing, developing, transferring, fusing, cleaning."},{"d":3,"q":"A warehouse needs a printer that produces receipts and shipping labels without ink or toner. Which type should be purchased?","o":["Thermal","Inkjet","Laser","Impact"],"a":0,"e":"Thermal printers use heat-sensitive paper (direct thermal) or a heated ribbon (thermal transfer), so they need no ink or toner."},{"d":3,"q":"An accounting office must print multipart carbon-copy forms. Which printer type is required?","o":["Impact","Thermal","Inkjet","Laser"],"a":0,"e":"Impact (dot-matrix) printers physically strike a ribbon, so the pressure transfers through to the carbon copies."},{"d":3,"q":"A user wants to print a replacement plastic part for a device. Which type of printer and consumable is needed?","o":["3D printer with filament or resin","Laser printer with toner","Thermal printer with ribbon","Impact printer with tractor-feed paper"],"a":0,"e":"3D printers build objects layer by layer from plastic filament (FDM) or liquid resin (SLA)."},{"d":3,"q":"A user wants all documents on a shared office printer to print on both sides of the page by default. Which setting should be configured?","o":["Duplex","Collate","Orientation","Tray assignment"],"a":0,"e":"Duplex printing prints on both sides of the page. You can set it as the default in the printer's preferences."},{"d":3,"q":"Users want to scan documents on a multifunction printer and have them delivered straight to a network folder. Which feature should be configured?","o":["Scan to SMB/folder","Scan to cloud only","Fax forwarding","Print to PDF"],"a":0,"e":"Scan-to-folder uses SMB to save scans to a network share. You need to configure the share path and credentials on the device."},{"d":3,"q":"An administrator wants to control two computers using a single keyboard, mouse, and monitor. Which device is needed?","o":["KVM switch","Docking station","USB hub","Port replicator"],"a":0,"e":"A KVM (keyboard, video, mouse) switch lets one set of peripherals control several computers."},{"d":3,"q":"Which hard drive spindle speed would provide the BEST performance for a traditional HDD?","o":["15,000 RPM","5,400 RPM","7,200 RPM","10,000 RPM"],"a":0,"e":"A faster spindle lowers latency. 15k RPM enterprise drives are the fastest hard drives, though any SSD outperforms them."},{"d":3,"q":"An inkjet printer is producing streaky output with missing colors. Which maintenance step should be performed FIRST?","o":["Run the print head cleaning utility","Replace the fuser","Replace the drum","Recalibrate the touchscreen"],"a":0,"e":"Streaks and missing colors on an inkjet usually mean clogged nozzles. Run the head cleaning routine first, then replace cartridges if needed. Fusers and drums are laser printer parts."},{"d":3,"q":"Which feature on a motherboard allows the system to boot from a USB flash drive before the internal SSD?","o":["Boot order/priority in BIOS/UEFI","Secure Boot","TPM","Fan curve"],"a":0,"e":"The firmware's boot order setting decides which device it tries first. Many systems also have a one-time boot menu key (such as F12)."},{"d":3,"q":"Which type of optical disc offers the GREATEST storage capacity?","o":["Blu-ray","DVD dual layer","CD-R","DVD single layer"],"a":0,"e":"Single-layer Blu-ray holds 25 GB and dual-layer holds 50 GB. DVD is 4.7 or 8.5 GB, and a CD is about 700 MB."},{"d":4,"q":"Which type of hypervisor runs directly on the hardware without a host operating system?","o":["Type 1","Type 2","Container engine","Emulator"],"a":0,"e":"Type 1 (bare-metal) hypervisors such as ESXi, Hyper-V Server, and KVM run directly on the hardware. Type 2 hypervisors such as VirtualBox and VMware Workstation run on top of a host OS."},{"d":4,"q":"A help desk technician wants to run a Linux VM on their Windows laptop for testing. Which hypervisor type is MOST appropriate?","o":["Type 2","Type 1","SAN","VDI"],"a":0,"e":"A Type 2 hypervisor like VirtualBox or VMware Workstation installs as an application on the existing OS, which is ideal for desktop testing."},{"d":4,"q":"A security analyst wants to open a suspicious attachment in an isolated environment that can be discarded afterward. Which use of virtualization does this describe?","o":["Sandbox","VDI","Legacy software support","Load balancing"],"a":0,"e":"A sandbox VM isolates untrusted code from the host. You can revert or delete it afterward."},{"d":4,"q":"A company provides employees with desktops hosted in a data center that they access remotely from any device. What is this called?","o":["Virtual desktop infrastructure (VDI)","SaaS email","Type 2 hypervisor","Containerization"],"a":0,"e":"VDI hosts desktop operating systems centrally and delivers them to users remotely."},{"d":4,"q":"A company subscribes to a web-based email and office suite that the provider fully manages. Which cloud service model is this?","o":["SaaS","IaaS","PaaS","DaaS"],"a":0,"e":"Software as a Service delivers finished applications such as Microsoft 365 or Google Workspace. The provider manages everything from the hardware up to the app."},{"d":4,"q":"Developers want a cloud platform where they can deploy code without managing the underlying servers or operating systems. Which model fits?","o":["PaaS","IaaS","SaaS","On-premises"],"a":0,"e":"Platform as a Service provides a managed runtime. Developers manage only their code and data."},{"d":4,"q":"A company rents virtual servers, storage, and networking from a provider and manages the operating systems itself. Which cloud model is this?","o":["IaaS","SaaS","PaaS","Private cloud"],"a":0,"e":"With Infrastructure as a Service, the provider supplies the compute, storage, and network, and the customer manages the OS and everything above it."},{"d":4,"q":"An organization runs some workloads in its own data center and bursts to a public cloud provider during peak demand. Which deployment model is this?","o":["Hybrid cloud","Private cloud","Community cloud","Public cloud"],"a":0,"e":"A hybrid cloud combines private or on-premises infrastructure with public cloud resources."},{"d":4,"q":"Several government agencies share cloud infrastructure built specifically for their common compliance requirements. Which deployment model is this?","o":["Community cloud","Hybrid cloud","Public cloud","Private cloud"],"a":0,"e":"A community cloud is shared by organizations with common concerns, such as compliance or mission requirements."},{"d":4,"q":"An online retailer's cloud resources automatically scale up during a holiday sale and scale back down afterward. Which cloud characteristic does this describe?","o":["Rapid elasticity","Metered utilization","Multitenancy","High availability"],"a":0,"e":"Rapid elasticity means resources scale up and down automatically with demand."},{"d":4,"q":"A company is billed only for the compute hours and storage it actually uses each month. Which cloud characteristic is this?","o":["Metered utilization","Rapid elasticity","File synchronization","Shared resources"],"a":0,"e":"Metered (measured) utilization means you pay only for what you consume."},{"d":4,"q":"Which cloud characteristic means multiple customers share the same underlying physical infrastructure while their data stays logically separated?","o":["Shared resources (multitenancy)","Rapid elasticity","Metered utilization","Private cloud"],"a":0,"e":"Public cloud providers pool hardware among many tenants and keep each tenant isolated logically."},{"d":4,"q":"A user edits a document on their laptop, and the changes automatically appear on their phone through cloud storage. Which feature is this?","o":["File synchronization","VDI","Load balancing","Snapshotting"],"a":0,"e":"Cloud file synchronization (such as OneDrive or Google Drive) keeps copies up to date across devices."},{"d":4,"q":"A company needs to keep running an old application that only works on Windows XP, without keeping old hardware. What is the BEST solution?","o":["Run Windows XP in an isolated virtual machine","Install the app on Windows 11 directly","Move the app to SaaS","Use a container on Linux"],"a":0,"e":"Running legacy software in a VM preserves the old OS environment. Isolate that VM from the network because XP no longer receives security updates."},{"d":4,"q":"Which technology packages an application with its dependencies and shares the host OS kernel, making it lighter than a full VM?","o":["Containers","Type 1 hypervisor","VDI","Emulation"],"a":0,"e":"Containers (such as Docker) share the host kernel, so they start faster and use fewer resources than VMs."},{"d":4,"q":"A VM needs to appear on the physical LAN with its own IP address from the network's DHCP server. Which virtual network mode should be used?","o":["Bridged","NAT","Internal/host-only","Isolated"],"a":0,"e":"Bridged mode connects the VM directly to the physical network as if it were a separate device. NAT hides the VM behind the host's IP address."},{"d":4,"q":"A technician is planning a host that will run four VMs, each needing 8 GB of RAM. The host OS needs 8 GB. What is the MINIMUM RAM the host should have?","o":["40 GB","32 GB","24 GB","16 GB"],"a":0,"e":"Four VMs at 8 GB each is 32 GB, plus 8 GB for the host, for a total of 40 GB. In practice, plan some headroom on top."},{"d":4,"q":"Before applying a risky update to a VM, the administrator wants to be able to roll back quickly if something breaks. What should be taken first?","o":["A snapshot","A container image","A VDI session","A DHCP reservation"],"a":0,"e":"A snapshot captures the VM's state at a point in time so you can revert to it. Keep in mind that a snapshot isn't a full backup."},{"d":5,"q":"According to the CompTIA troubleshooting methodology, what is the FIRST step?","o":["Identify the problem","Establish a theory of probable cause","Test the theory","Document findings"],"a":0,"e":"The steps are: 1) identify the problem, 2) establish a theory of probable cause, 3) test the theory, 4) establish a plan of action and implement it, 5) verify full system functionality and implement preventive measures, 6) document findings, actions, and outcomes."},{"d":5,"q":"A technician has tested a theory and confirmed the cause of a problem. What is the NEXT step in the troubleshooting methodology?","o":["Establish a plan of action to resolve the problem and implement the solution","Document findings","Identify the problem","Question the obvious"],"a":0,"e":"Once a theory is confirmed, the next step is to plan the fix, considering impact and change management, and then implement it."},{"d":5,"q":"A technician's first theory about a problem turns out to be wrong after testing. What should the technician do?","o":["Establish a new theory or escalate","Implement the solution anyway","Document findings and close the ticket","Verify full system functionality"],"a":0,"e":"If the theory isn't confirmed, come up with a new theory or escalate. Don't move on to a fix that isn't based on a confirmed cause."},{"d":5,"q":"During which troubleshooting step should a technician back up data before making changes?","o":["Identify the problem","Document findings","Verify full system functionality","Test the theory"],"a":0,"e":"CompTIA puts backups in the first step, identifying the problem, before any changes are made. That step also covers gathering information, questioning the user, and checking for recent changes."},{"d":5,"q":"What is the LAST step of the CompTIA troubleshooting methodology?","o":["Document findings, actions, and outcomes","Verify full system functionality","Implement preventive measures","Close the ticket without notes"],"a":0,"e":"Documentation comes last so the knowledge is captured for future tickets."},{"d":5,"q":"A PC powers on, and the fans spin, but there is no display and no POST beeps. Which component should be checked FIRST?","o":["RAM seating","Hard drive","Network card","Optical drive"],"a":0,"e":"No POST and no video usually points to RAM, CPU, or motherboard problems. Reseating RAM is the quickest and most common fix. Storage and the NIC don't affect POST."},{"d":5,"q":"A computer repeatedly shuts down without warning after running for about 20 minutes. The case feels very hot. What is the MOST likely cause?","o":["Overheating due to failed fans or clogged airflow","Corrupt operating system","Failed CMOS battery","Bad network cable"],"a":0,"e":"Shutdowns that happen only after the system warms up suggest overheating. Check the fans, dust buildup, and thermal paste."},{"d":5,"q":"A user reports a burning smell coming from their desktop PC. What should the technician do FIRST?","o":["Power off and unplug the system immediately","Run a hardware diagnostic","Update the BIOS","Open the case while it is running to find the source"],"a":0,"e":"A burning smell can mean a failing PSU or component. Remove power right away for safety, then inspect it."},{"d":5,"q":"While inspecting a motherboard, a technician sees capacitors with bulging tops. What does this indicate?","o":["Failing capacitors that will cause instability; replace the board","Normal appearance for solid capacitors","Overclocking is enabled","The CMOS battery is low"],"a":0,"e":"Swollen or leaking capacitors cause random reboots and instability. The usual fix is replacing the board."},{"d":5,"q":"A hard drive makes a loud clicking noise, and the system cannot find the boot device. What is the MOST likely issue?","o":["Mechanical drive failure","Corrupt boot sector","Incorrect boot order","Failing CMOS battery"],"a":0,"e":"A repeated clicking noise (the 'click of death') means the drive's heads or mechanics are failing. Back up whatever you can immediately and replace the drive."},{"d":5,"q":"A system shows a warning at boot that S.M.A.R.T. has detected an imminent drive failure. What should the technician do FIRST?","o":["Back up the data immediately","Defragment the drive","Run disk cleanup","Ignore it because the system still boots"],"a":0,"e":"A S.M.A.R.T. warning predicts the drive will fail. Back up the data first, then replace the drive."},{"d":5,"q":"A newly built PC shows 'No bootable device found' even though a new SSD is installed and detected in the BIOS. What is the MOST likely reason?","o":["No operating system is installed on the drive yet","The RAM is faulty","The monitor cable is loose","The NIC is disabled"],"a":0,"e":"The drive is detected but has no bootloader because no OS is installed. Other causes include the wrong boot order or a UEFI/Legacy mode mismatch."},{"d":5,"q":"A RAID 5 array with four drives reports one failed drive, but data is still accessible. What should the technician do?","o":["Replace the failed drive so the array can rebuild","Delete and recreate the array","Convert the array to RAID 0","Nothing, because RAID 5 is self-healing without replacement"],"a":0,"e":"RAID 5 tolerates one failure, but the array is running degraded. Replace the failed drive promptly so it can rebuild, because a second failure would lose all data."},{"d":5,"q":"A user reports that a desktop's clock is wrong every morning, and BIOS settings have reset to defaults. What should be replaced?","o":["CMOS battery","Power supply","Hard drive","RAM"],"a":0,"e":"A dying CMOS battery can't keep the clock and firmware settings while the PC is off."},{"d":5,"q":"A monitor shows a few pixels that are always black regardless of what is displayed. What is this called?","o":["Dead pixels","Burn-in","Ghosting","Flickering"],"a":0,"e":"Pixels that stay black are dead. Pixels that stay lit in one color are stuck. Neither can be fixed with software, though stuck pixels sometimes recover."},{"d":5,"q":"An OLED display in a lobby permanently shows a faint company logo even when other content is displayed. What is this issue?","o":["Burn-in","Dead pixels","Incorrect color depth","Dim backlight"],"a":0,"e":"Burn-in happens when static images are shown for a long time on OLED or plasma screens and leave a permanent ghost image."},{"d":5,"q":"A user's external monitor flickers, and the problem goes away when the cable is wiggled. What should the technician do FIRST?","o":["Reseat or replace the video cable","Replace the monitor","Reinstall Windows","Replace the GPU"],"a":0,"e":"Flickering that changes when you move the cable points to a loose or damaged cable. Check the simplest, cheapest cause first."},{"d":5,"q":"After a driver update, text and images on a user's monitor look stretched and blurry. What should the technician check FIRST?","o":["The display resolution is set to the monitor's native resolution","The monitor's power cable","The keyboard driver","The network adapter"],"a":0,"e":"LCDs look sharpest at their native resolution. A non-native setting looks blurry or stretched."},{"d":5,"q":"A projector displays an image, but it is very dim, and the lamp-hours counter is very high. What should the technician do?","o":["Replace the projector bulb","Replace the HDMI cable","Change the input source","Lower the resolution"],"a":0,"e":"Projector lamps lose brightness with use and need replacing at the end of their rated life."},{"d":5,"q":"A laser printer produces pages where the toner smears and wipes off when touched. Which component is MOST likely faulty?","o":["Fuser","Transfer roller","Pickup roller","Toner cartridge chip"],"a":0,"e":"If toner isn't bonding to the paper, the fuser isn't applying enough heat or pressure."},{"d":5,"q":"A laser printer prints a faint duplicate of the previous image further down each page. What is this problem called, and what is a likely cause?","o":["Ghosting; a failing drum or cleaning blade","Speckling; a dirty fuser","Garbled print; a bad driver","Paper jam; a worn pickup roller"],"a":0,"e":"Ghost images are usually caused by a drum that isn't being fully cleaned or discharged. The imaging drum is often part of the toner cartridge."},{"d":5,"q":"Every page from a laser printer has a vertical black line in the same position. What is the MOST likely cause?","o":["A scratch or debris on the imaging drum","Wrong paper size","An incorrect printer driver","A bad network connection"],"a":0,"e":"A repeating vertical line usually comes from damage or debris on the drum. Replacing the toner/drum unit usually fixes it."},{"d":5,"q":"A printer outputs pages full of random symbols and strange characters. What should the technician check FIRST?","o":["The printer driver","The fuser","The toner level","The paper type"],"a":0,"e":"Garbled characters mean the computer is sending data the printer doesn't understand, which is usually a wrong or corrupt driver."},{"d":5,"q":"A printer frequently pulls multiple sheets at once and jams. What is the MOST likely cause?","o":["Worn pickup roller or separation pad, or humid/stuck-together paper","A bad print driver","Low toner","A faulty network cable"],"a":0,"e":"Multi-feeds come from worn rollers or separation pads, or from humid paper that sticks together. Fanning the paper and replacing the rollers usually helps."},{"d":5,"q":"Print jobs are stuck in the queue, and no one can print to a shared printer. What should the technician do FIRST on the print server?","o":["Clear the queue and restart the Print Spooler service","Replace the printer","Reinstall the operating system","Replace the fuser"],"a":0,"e":"A stuck job often hangs the spooler. Clearing the queue and restarting the Print Spooler service usually clears it."},{"d":5,"q":"A laser printer produces completely blank pages, although the toner cartridge is new. What should the technician check FIRST?","o":["Whether the protective seal or tape was removed from the toner cartridge","The paper weight","The network IP address","The duplex setting"],"a":0,"e":"New toner cartridges come with a protective seal or tape that blocks toner. Forgetting to remove it is a classic cause of blank pages."},{"d":5,"q":"A smartphone battery drains very quickly, and the phone gets warm even when idle. What should the technician check FIRST?","o":["Battery usage by app in settings to find a runaway app","Replace the screen","Reset network settings","Disable the camera"],"a":0,"e":"Check which apps are using the battery. A misbehaving background app can drain power and generate heat. If that's not it, check battery health."},{"d":5,"q":"A phone fell into water and now will not power on. What should the technician advise?","o":["Power it off if it is on, do not charge it, dry it, and have it inspected for corrosion","Charge it immediately to test it","Put it in a microwave to dry it","Use a hair dryer on high heat"],"a":0,"e":"Charging a wet device can short it. Keep it powered off, let it dry, and have it inspected. Corrosion can show up later."},{"d":5,"q":"A laptop cannot connect to any Wi-Fi networks, and the wireless indicator light is off. What should the technician check FIRST?","o":["The physical wireless switch or airplane mode/Fn key","The router firmware","The DNS server settings","The laptop's RAM"],"a":0,"e":"An unlit wireless indicator usually means the radio is turned off by a switch, the Fn key, or airplane mode. Always check the simplest cause first."},{"d":5,"q":"Several users report intermittent wireless drops near the break room, especially around lunchtime. What is the MOST likely cause?","o":["Interference from a microwave oven on the 2.4 GHz band","A bad Ethernet cable","DNS server failure","An expired DHCP lease on the router"],"a":0,"e":"Microwave ovens emit energy around 2.4 GHz and can disrupt Wi-Fi on that band. Moving clients to 5 GHz or relocating the AP helps."},{"d":5,"q":"A user can browse to websites by IP address but not by name. What is the MOST likely problem?","o":["DNS resolution","DHCP","Physical cabling","Default gateway"],"a":0,"e":"If IP addresses work but names fail, the network path is fine and DNS is failing. Check the DNS server settings and test with nslookup."},{"d":5,"q":"A user can reach other computers on the local network but cannot reach the internet. Other users are fine. What should be checked FIRST?","o":["The default gateway configured on the user's PC","The monitor cable","The user's printer","The DNS records for the company website"],"a":0,"e":"Local access but no internet suggests a wrong or missing default gateway on that one PC."},{"d":5,"q":"Windows displays an alert that another device on the network has the same IP address. What is this issue called?","o":["IP address conflict","APIPA","Port flapping","Jitter"],"a":0,"e":"An IP conflict happens when two devices use the same address, often because of a static IP inside the DHCP scope. Fix it with reservations or exclusions."},{"d":5,"q":"VoIP calls sound choppy with words cutting out, even though bandwidth tests show plenty of speed. Which network issue is MOST likely?","o":["Jitter","Low disk space","An incorrect subnet mask","A failed DNS server"],"a":0,"e":"Jitter is variation in packet arrival times, and it makes real-time audio choppy. QoS settings that prioritize voice traffic help."},{"d":5,"q":"A switch log shows that a port repeatedly goes up and down every few seconds. What is this called, and what is a likely cause?","o":["Port flapping; a bad cable or failing NIC","Jitter; too much bandwidth","APIPA; DHCP failure","Latency; satellite internet"],"a":0,"e":"Port flapping means a link is constantly bouncing between up and down. Common causes are a damaged cable, a bad port, or a failing NIC."},{"d":5,"q":"File transfers on the network are very slow. The switch shows the PC's port negotiated at 10 Mbps half-duplex. What is the MOST likely cause?","o":["A damaged cable or speed/duplex mismatch","DNS misconfiguration","An expired IP lease","Too much RAM"],"a":0,"e":"A Gigabit-capable NIC that drops to 10 Mbps half-duplex usually means a bad cable (for example, broken pairs) or a speed/duplex mismatch."},{"d":5,"q":"A workstation has an IP address of 169.254.10.5 and cannot reach any network resources. What should the technician check FIRST?","o":["Physical connectivity and whether the DHCP server is reachable","The web browser settings","The printer driver","The DNS records"],"a":0,"e":"An APIPA address means DHCP failed. Check the cable and link light, then the DHCP server and scope. Running ipconfig /renew helps test the fix."},{"d":5,"q":"A user's laptop shows full Wi-Fi bars but very slow speeds in a conference room far from the office's single access point. Several neighbors' networks use the same channel. What is the BEST fix?","o":["Change the AP channel and/or add an access point closer to the room","Replace the laptop","Disable DHCP","Use a static IP address on the laptop"],"a":0,"e":"Co-channel interference and distance reduce throughput. Choosing a less crowded channel or adding an AP improves performance."},{"d":5,"q":"A desktop PC randomly reboots, and the technician suspects the power supply. Which tool should be used to verify PSU voltages?","o":["Multimeter or PSU tester","Toner probe","Loopback plug","Crimper"],"a":0,"e":"A PSU tester or multimeter checks whether the 3.3 V, 5 V, and 12 V rails are within tolerance."},{"d":5,"q":"A technician needs to test whether a NIC port is working without connecting it to a network. Which tool should be used?","o":["Loopback plug","Toner probe","Punchdown tool","Wi-Fi analyzer"],"a":0,"e":"A loopback plug routes the NIC's transmit pins back to its receive pins so you can test the port by itself."},{"d":5,"q":"A PC emits a series of beeps at startup and does not display anything. Where should the technician look to interpret the beep pattern?","o":["The motherboard or BIOS manufacturer's documentation","The Windows Event Viewer","The router logs","The printer manual"],"a":0,"e":"Beep codes differ by firmware vendor (AMI, Award, Phoenix, or OEM). Check the manufacturer's documentation for what each pattern means."},{"d":5,"q":"A user hears a grinding noise from their desktop that changes when the system is under load. The hard drive is an SSD. What is the MOST likely source?","o":["A failing fan bearing","The SSD","The RAM","The CMOS battery"],"a":0,"e":"SSDs have no moving parts. Grinding that changes with load usually comes from a fan (CPU, GPU, or PSU) speeding up with a worn bearing."},{"d":1,"q":"A laptop's display works on an external monitor but the built-in screen is completely black, with no image visible even under a flashlight. What is the MOST likely cause?","o":["Failed LCD panel or disconnected display cable","Outdated BIOS","Wrong Wi-Fi driver","Disabled touchpad"],"a":0,"e":"The GPU is fine because the external monitor works. No image at all, even under a flashlight, points to the panel itself or its display cable rather than the backlight."},{"d":1,"q":"A user wants to view their smartphone's screen on a conference room TV without cables. Which feature should they use?","o":["Screen mirroring (Miracast/AirPlay/Chromecast)","NFC","Bluetooth tethering","IR blaster"],"a":0,"e":"Screen mirroring protocols cast the device's display to a compatible TV or adapter over Wi-Fi."},{"d":1,"q":"A company issues laptops that must be physically secured to desks in an open office. Which accessory should be used?","o":["Cable lock using the laptop's security slot","Privacy screen","Docking station","Port replicator"],"a":0,"e":"A cable lock attaches to the laptop's security slot (often Kensington-style) and deters theft."},{"d":1,"q":"An employee working in a busy airport wants to prevent others from reading their laptop screen. Which accessory helps?","o":["Privacy screen filter","Cable lock","Screen protector only","Docking station"],"a":0,"e":"A privacy filter narrows the viewing angle so people beside the user can't read the screen. It defends against shoulder surfing."},{"d":1,"q":"Which type of laptop memory upgrade is NOT possible on many ultrathin laptops?","o":["Adding RAM, because the memory is soldered to the motherboard","Replacing the SSD","Replacing the battery with an approved part","Replacing the keyboard"],"a":0,"e":"Many ultrathin laptops use RAM soldered to the board, so it can't be upgraded. Check the specs before you buy."},{"d":1,"q":"A tablet's screen orientation does not change when the device is rotated, and rotation lock is off. Which component is MOST likely faulty?","o":["Accelerometer/gyroscope","Digitizer","Backlight","Battery"],"a":0,"e":"The accelerometer and gyroscope sense orientation. If rotation lock is off and the screen still won't turn, suspect the sensor."},{"d":1,"q":"A user wants their phone to automatically sync photos to cloud storage only when on Wi-Fi to save cellular data. Which setting should be configured?","o":["Cloud backup set to Wi-Fi only","Data roaming on","Airplane mode","Bluetooth discoverable"],"a":0,"e":"Most cloud photo backup apps have a 'Wi-Fi only' option so large uploads don't use cellular data."},{"d":1,"q":"A company wants employees' personal phones to keep work email and apps separate from personal data. Which approach should MDM use?","o":["Containerization/work profile","Full device wipe policy only","Disabling the camera","Jailbreaking"],"a":0,"e":"In a BYOD setup, a work profile or container keeps corporate data separate. IT can wipe just the work container without touching personal data."},{"d":1,"q":"A laptop's battery no longer holds a charge longer than 20 minutes, even after a full charge. The battery is three years old. What is the BEST solution?","o":["Replace the battery","Replace the AC adapter","Reinstall the OS","Update the touchpad driver"],"a":0,"e":"Lithium-ion batteries lose capacity over charge cycles. An old battery with very short runtime should be replaced."},{"d":1,"q":"A laptop will charge only when the AC adapter cable is held at a certain angle. What is the MOST likely cause?","o":["A damaged DC jack or adapter cable","A failed battery","Corrupted power plan","A bad CMOS battery"],"a":0,"e":"Charging that depends on the cable's angle means a loose or damaged DC power jack or a frayed adapter cable."},{"d":1,"q":"Which wireless technology is used by most wireless keyboards, mice, and headsets to connect to a laptop without a dongle?","o":["Bluetooth","NFC","Infrared","Zigbee"],"a":0,"e":"Bluetooth is built into most laptops and phones and supports keyboards, mice, and audio devices."},{"d":1,"q":"A smart card reader must be added to a laptop that has no built-in reader so the user can log in with a CAC. What is the SIMPLEST solution?","o":["A USB smart card reader","An NFC tag","A Bluetooth speaker","A docking station without USB"],"a":0,"e":"External USB smart card readers are the usual way to add CAC or PIV support to a laptop."},{"d":1,"q":"Which mobile device feature allows a phone to make calls over a Wi-Fi network when cellular signal is weak?","o":["Wi-Fi calling","Hotspot","Tethering","Airplane mode"],"a":0,"e":"Wi-Fi calling routes voice calls over Wi-Fi, which helps indoors or anywhere cellular coverage is poor."},{"d":1,"q":"A technician is replacing a laptop screen. Which of these should be done to avoid losing screws and mixing them up?","o":["Document and organize screws by location as they are removed","Put all screws in one cup","Use a magnetized screwdriver directly on the motherboard","Skip removing screws and pry the bezel"],"a":0,"e":"Laptop screws are different lengths, and putting a long screw in the wrong hole can damage the board. Use a labeled tray or a diagram."},{"d":1,"q":"A wearable fitness tracker syncs heart-rate data to a phone app. Which wireless technology does it MOST likely use?","o":["Bluetooth Low Energy","Wi-Fi 6E","NFC","Cellular 5G"],"a":0,"e":"Wearables use Bluetooth Low Energy (BLE) to save battery while syncing with phones."},{"d":1,"q":"A laptop user frequently uses the touchpad accidentally while typing, moving the cursor. What should the technician configure?","o":["Touchpad sensitivity or palm-rejection settings, or disable the touchpad while typing","Replace the keyboard","Reinstall the display driver","Increase screen resolution"],"a":0,"e":"Touchpad settings usually include palm rejection, a typing delay, or a quick way to disable the pad."},{"d":1,"q":"A company needs field technicians' tablets to have internet access anywhere without relying on Wi-Fi. What should be included in the tablets?","o":["Cellular (LTE/5G) modem with a data plan","Bluetooth 5","NFC","An Ethernet port"],"a":0,"e":"Tablets with a cellular modem and a data plan or eSIM can get online anywhere there's carrier coverage."},{"d":1,"q":"A user's laptop speaker crackles and sounds distorted at all volume levels, but headphones sound fine. What is MOST likely faulty?","o":["The internal speaker","The audio driver","The sound card","The microphone"],"a":0,"e":"If headphones sound fine, the audio hardware and driver are working. The internal speaker is the likely cause."},{"d":1,"q":"An employee needs to enter data on a tablet using a full-size keyboard in the field. Which is the BEST accessory?","o":["Bluetooth keyboard","KVM switch","Docking station with VGA","PS/2 keyboard"],"a":0,"e":"A Bluetooth keyboard pairs wirelessly with the tablet and is portable."},{"d":1,"q":"A laptop's webcam shows a black image in all apps, but Device Manager shows no errors. What should the technician check FIRST?","o":["Physical privacy shutter or webcam kill switch/Fn key and app permissions","Replace the motherboard","Reinstall Windows","Replace the display assembly"],"a":0,"e":"Many laptops have a privacy shutter, a hotkey that disables the camera, or OS privacy settings that block camera access. Check those simple causes first."},{"d":2,"q":"Which port does HTTPS use by default?","o":["443","80","8080","22"],"a":0,"e":"HTTPS runs HTTP over TLS on TCP port 443. Plain HTTP uses port 80."},{"d":2,"q":"Which port does Telnet use, and why should it be avoided?","o":["23; it sends data including credentials in plaintext","22; it is too slow","25; it is only for email","3389; it requires a GUI"],"a":0,"e":"Telnet (TCP 23) isn't encrypted. Use SSH (TCP 22) instead."},{"d":2,"q":"Which port does LDAP use for unencrypted directory queries?","o":["389","636","443","88"],"a":0,"e":"LDAP uses TCP/UDP 389. LDAPS uses 636. Kerberos uses 88."},{"d":2,"q":"Which port does POP3 use by default?","o":["110","143","25","993"],"a":0,"e":"POP3 uses port 110 (995 with TLS). IMAP uses 143 (993 with TLS)."},{"d":2,"q":"Which NetBIOS ports may need to be open for legacy Windows name resolution and file sharing? (Choose two.)","o":["137","139","443","3389"],"a":[0,1],"e":"NetBIOS uses 137 (name service), 138 (datagram), and 139 (session). Modern SMB runs directly on 445."},{"d":2,"q":"Which type of device extends a wireless network's coverage by rebroadcasting the signal from an existing access point?","o":["Wireless range extender/repeater","Hub","Modem","Patch panel"],"a":0,"e":"Range extenders repeat an AP's signal to cover dead spots. They can cut throughput, so mesh systems are often a better fix."},{"d":2,"q":"A home office connects to the internet through the cable provider. Which device converts the provider's signal to Ethernet?","o":["Cable modem","Switch","Access point","Firewall"],"a":0,"e":"A cable modem translates the DOCSIS signal on the coaxial line into Ethernet for the router."},{"d":2,"q":"Which device is used in a wiring closet to terminate horizontal cable runs and organize connections to switches with short patch cables?","o":["Patch panel","Hub","Repeater","Modem"],"a":0,"e":"Patch panels terminate permanent cable runs. Short patch cables then connect each port to the switch."},{"d":2,"q":"An office has many devices that need power and data in ceiling locations, but the existing switch does not support PoE. Which device can add power to individual runs?","o":["PoE injector","Hub","Media converter","Loopback plug"],"a":0,"e":"A PoE injector adds power to an Ethernet run when the switch can't supply it."},{"d":2,"q":"A network needs to connect a fiber link to a copper Ethernet switch port. Which device is required?","o":["Media converter","Patch panel","Toner probe","Repeater"],"a":0,"e":"A media converter switches the signal between fiber and copper. Many switches also accept SFP fiber modules."},{"d":2,"q":"Which network topology/technology uses multiple access points that communicate with each other to provide seamless whole-home Wi-Fi coverage?","o":["Mesh network","Star with hub","Point-to-point","Bus"],"a":0,"e":"A mesh system uses multiple nodes that coordinate, so clients roam between them seamlessly."},{"d":2,"q":"Which wireless frequency band generally has longer range but lower throughput and more interference?","o":["2.4 GHz","5 GHz","6 GHz","60 GHz"],"a":0,"e":"2.4 GHz travels farther and passes through walls better, but it's crowded and slower. 5 and 6 GHz are faster but have shorter range."},{"d":2,"q":"A building wants to connect two floors' networks using existing coaxial TV cabling. Which cable type is MOST likely already installed?","o":["RG-6","Cat 6","Single-mode fiber","USB-C"],"a":0,"e":"RG-6 coax is the standard for cable TV and broadband."},{"d":2,"q":"Which cable type has an outer jacket rated to resist fire and limit toxic smoke so it can be run through air-handling spaces above drop ceilings?","o":["Plenum-rated cable","PVC cable","Direct burial cable","Patch cable"],"a":0,"e":"Building codes require plenum-rated cable in air-handling spaces. PVC jackets give off toxic smoke when they burn."},{"d":2,"q":"A cable must be run near heavy machinery with strong electromagnetic interference. Which cable is BEST?","o":["Shielded twisted pair (STP)","Unshielded twisted pair (UTP)","Telephone cable","Coaxial RG-59"],"a":0,"e":"STP has shielding that reduces EMI. Fiber is immune to EMI and is another option."},{"d":2,"q":"Which IPv4 address class range does 10.0.0.0/8 fall into, and is it public or private?","o":["Class A, private","Class B, public","Class C, private","Class D, multicast"],"a":0,"e":"10.0.0.0/8 is a Class A private range, defined in RFC 1918."},{"d":2,"q":"A /26 subnet provides how many usable host addresses?","o":["62","64","30","126"],"a":0,"e":"/26 leaves 6 host bits: 2^6 = 64 addresses, minus the network and broadcast addresses, gives 62 usable."},{"d":2,"q":"What does NAT allow a SOHO router to do?","o":["Let many private IP devices share one public IP address","Assign IP addresses automatically","Resolve names to IPs","Encrypt wireless traffic"],"a":0,"e":"Network Address Translation (usually PAT) maps many private addresses to one public IP. DHCP assigns addresses, and DNS resolves names."},{"d":2,"q":"A DHCP server has run out of addresses to hand out on a busy guest network. What should the administrator adjust?","o":["Expand the scope or shorten the lease time","Add DNS records","Disable NAT","Change the SSID"],"a":0,"e":"Making the scope bigger or shortening leases frees up addresses faster on high-turnover networks."},{"d":2,"q":"Which DHCP setting prevents certain addresses in the scope, such as those used by static servers, from being handed out?","o":["Exclusion range","Reservation","Lease time","Scope option 6"],"a":0,"e":"Exclusions keep addresses out of the pool. A reservation ties one specific address to one MAC address."},{"d":2,"q":"Which DNS record type is an alias that points one hostname to another hostname?","o":["CNAME","A","MX","TXT"],"a":0,"e":"A CNAME (canonical name) record points an alias, such as www, to another name."},{"d":2,"q":"Which service allows a server to provide directory lookups for user accounts, groups, and devices?","o":["LDAP/directory service such as Active Directory","SMTP","SNMP","NTP"],"a":0,"e":"Directory services such as Active Directory, queried over LDAP, store and look up identities and resources."},{"d":2,"q":"Users need a central place to store and share files over the network. Which server role provides this?","o":["File server","Syslog server","Proxy server","DNS server"],"a":0,"e":"A file server hosts shared folders over SMB or NFS."},{"d":2,"q":"A company wants all users' web traffic to pass through a server that can cache content and filter sites. Which server role is this?","o":["Proxy server","DHCP server","RADIUS server","Mail server"],"a":0,"e":"A proxy server makes requests on behalf of clients. It can cache content, filter websites, and log activity."},{"d":2,"q":"Which protocol keeps clocks synchronized across network devices?","o":["NTP","SNMP","SMTP","LDAP"],"a":0,"e":"Network Time Protocol (UDP 123) synchronizes clocks, which logs and Kerberos authentication depend on."},{"d":2,"q":"Which device distributes incoming web requests across several servers to improve performance and availability?","o":["Load balancer","Hub","Media converter","Repeater"],"a":0,"e":"A load balancer spreads traffic across a pool of servers and routes around any that fail."},{"d":2,"q":"A remote worker needs an encrypted connection to the corporate network over the internet. What should be used?","o":["VPN","Telnet"
