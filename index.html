how far an attacker can move if one device is compromised. Why not the others: the other options put weak devices next to sensitive systems or expose them to the internet."}, {"d": 4, "q": "Employees connect personal phones to Wi-Fi. What is the BEST way to protect corporate systems?", "o": ["Place BYOD devices on a separate, restricted network segment", "Give BYOD devices full internal access", "Disable WPA2", "Use the same VLAN as servers"], "a": 0, "e": "BYOD devices aren't managed by the company, so isolate them and grant only the access they need. Why not the others: the other options expose internal systems to unmanaged devices."}, {"d": 4, "q": "An attacker floods a switch with thousands of frames using fake source MAC addresses, causing the switch to flood all traffic out of every port. What attack is this?", "o": ["MAC flooding", "ARP poisoning", "VLAN hopping", "DNS poisoning"], "a": 0, "e": "MAC flooding fills the CAM table so the switch fails open and acts like a hub, which lets the attacker sniff traffic. Port security prevents it. Why not the others: ARP poisoning forges IP-to-MAC mappings. VLAN hopping crosses VLANs. DNS poisoning corrupts name resolution."}, {"d": 4, "q": "An attacker sends forged ARP replies so that hosts map the default gateway's IP to the attacker's MAC address. What attack is this?", "o": ["ARP poisoning", "MAC flooding", "DNS spoofing", "Evil twin"], "a": 0, "e": "Forged ARP replies redirect traffic through the attacker, putting them on-path. Dynamic ARP Inspection (DAI) mitigates it. Why not the others: MAC flooding overflows the CAM table. DNS spoofing forges name answers. An evil twin is a rogue AP."}, {"d": 4, "q": "An attacker sends double-tagged 802.1Q frames to reach a VLAN they are not assigned to. What attack is this?", "o": ["VLAN hopping", "MAC flooding", "Rogue DHCP", "Smurf attack"], "a": 0, "e": "Double tagging exploits the native VLAN. Switch spoofing (DTP negotiation) is the other form of VLAN hopping. Mitigate by using an unused native VLAN and disabling DTP. Why not the others: they aren't VLAN-crossing techniques."}, {"d": 4, "q": "Which configuration change MOST effectively prevents VLAN hopping through switch spoofing?", "o": ["Disable DTP and hard-set ports to access", "Enable jumbo frames on all trunks", "Enable SNMPv2c on the switches", "Increase the DHCP lease time"], "a": 0, "e": "If access ports can't negotiate a trunk (switchport mode access, switchport nonegotiate), an attacker can't form one. Why not the others: jumbo frames, SNMP and DHCP leases have nothing to do with trunking."}, {"d": 4, "q": "Users are being sent to a fake banking site even though they typed the correct URL. The local DNS server's cache contains a forged record. What attack is this?", "o": ["DNS cache poisoning", "ARP spoofing", "Phishing", "MAC flooding"], "a": 0, "e": "DNS poisoning inserts false records into a resolver's cache. DNSSEC helps prevent it. Why not the others: ARP spoofing redirects at Layer 2. Phishing relies on a lure. MAC flooding targets switches."}, {"d": 4, "q": "An attacker sets up an access point with the same SSID as the corporate network to trick users into connecting and capture their credentials. What is this?", "o": ["Evil twin", "Rogue DHCP server", "Bluejacking", "War driving"], "a": 0, "e": "An evil twin imitates a legitimate SSID. Why not the others: a rogue DHCP server hands out bad addresses. Bluejacking sends unsolicited Bluetooth messages. War driving means searching for networks."}, {"d": 4, "q": "An employee plugs a personal wireless router into an office wall jack, creating an unauthorized access point. What is this?", "o": ["Rogue access point", "Evil twin", "Honeypot", "Captive portal"], "a": 0, "e": "A rogue AP is any unauthorized AP on the network. It may not imitate the corporate SSID, which is what makes an evil twin. Why not the others: a honeypot is a deliberate decoy. A captive portal is a guest login page."}, {"d": 4, "q": "Clients suddenly receive IP addresses in the wrong subnet with an unknown gateway. Which attack or issue is MOST likely?", "o": ["A rogue DHCP server", "MAC flooding", "DNS poisoning", "VLAN hopping"], "a": 0, "e": "A rogue DHCP server answers clients first and hands out a malicious gateway or DNS. DHCP snooping blocks it. Why not the others: they don't hand out IP configuration."}, {"d": 4, "q": "Thousands of compromised IoT devices simultaneously flood a company's web server with requests. What attack is this?", "o": ["DDoS", "DoS from a single host", "On-path", "Tailgating"], "a": 0, "e": "Distributed DoS comes from many sources, often a botnet. Why not the others: a DoS comes from one source. On-path attacks intercept traffic. Tailgating is physical."}, {"d": 4, "q": "An attacker positioned between a user and a server secretly relays and possibly alters their communications. What is this attack called?", "o": ["On-path attack", "Brute force", "Dumpster diving", "Shoulder surfing"], "a": 0, "e": "An on-path attack (formerly man-in-the-middle) intercepts traffic between two parties. Why not the others: brute force guesses passwords. Dumpster diving searches trash. Shoulder surfing watches screens."}, {"d": 4, "q": "An unauthorized person follows an employee through a badge-secured door without scanning their own badge. What is this?", "o": ["Tailgating", "Shoulder surfing", "Phishing", "Dumpster diving"], "a": 0, "e": "Tailgating (piggybacking) is entering a secure area behind someone authorized. Access control vestibules (mantraps) prevent it. Why not the others: the others are different social engineering techniques."}, {"d": 4, "q": "An attacker watches over a user's shoulder as they type their password. What is this?", "o": ["Shoulder surfing", "Tailgating", "Vishing", "Pretexting"], "a": 0, "e": "Shoulder surfing means observing screens or keystrokes. Privacy screens help. Why not the others: tailgating is physical entry. Vishing is voice phishing. Pretexting is a made-up scenario used to extract information."}, {"d": 4, "q": "Employees receive an email that looks like it's from IT, asking them to log in at a link to 'verify their account.' What attack is this?", "o": ["Phishing", "Evil twin", "DNS poisoning", "MAC spoofing"], "a": 0, "e": "Phishing uses fraudulent messages to steal credentials. Why not the others: an evil twin is a fake AP. DNS poisoning corrupts resolution. MAC spoofing fakes a hardware address."}, {"d": 4, "q": "An attacker searches through a company's trash for printed network diagrams and passwords. What is this?", "o": ["Dumpster diving", "Tailgating", "Shoulder surfing", "Smishing"], "a": 0, "e": "Dumpster diving recovers sensitive information from discarded material. Shredding prevents it. Why not the others: the others don't involve trash."}, {"d": 4, "q": "Malware encrypts files on shared drives and demands payment for the decryption key. What type of malware is this?", "o": ["Ransomware", "Worm", "Spyware", "Adware"], "a": 0, "e": "Ransomware encrypts data and demands payment. Offline backups are the key defense. Why not the others: a worm self-propagates. Spyware steals information. Adware shows ads."}, {"d": 4, "q": "A switch port should allow only the first device's MAC address and shut down if a different device connects. Which feature should be configured?", "o": ["Port security", "802.1Q tagging", "Spanning tree PortFast", "Jumbo frames"], "a": 0, "e": "Port security limits which or how many MACs can use a port and takes action, such as shutdown, on a violation. Why not the others: 802.1Q is tagging. PortFast speeds up STP. Jumbo frames change the MTU."}, {"d": 4, "q": "A company wants switch ports to stay closed until a device authenticates with credentials or a certificate against a RADIUS server. Which standard should be used?", "o": ["802.1X", "802.1Q", "802.3af", "802.11i only"], "a": 0, "e": "802.1X is port-based network access control: supplicant, authenticator (switch or AP) and authentication server (RADIUS). Why not the others: 802.1Q is VLAN tagging. 802.3af is PoE. 802.11i is the Wi-Fi security amendment that uses 802.1X but isn't wired port control."}, {"d": 4, "q": "A network checks that devices have current antivirus and patches before granting access, and places noncompliant devices in a remediation VLAN. What is this?", "o": ["NAC with posture assessment", "Port mirroring to a sensor", "Geofencing by location", "URL filtering on the proxy"], "a": 0, "e": "NAC evaluates device health (posture) and enforces access, including quarantine. Why not the others: port mirroring copies traffic. Geofencing uses location. URL filtering blocks websites."}, {"d": 4, "q": "Why is MAC filtering on an AP considered a WEAK security control?", "o": ["MAC addresses can be easily spoofed", "It encrypts traffic too slowly", "It blocks all devices", "It requires a RADIUS server"], "a": 0, "e": "Attackers can sniff allowed MACs and clone them. Why not the others: MAC filtering doesn't encrypt anything, doesn't block every device, and doesn't need RADIUS."}, {"d": 4, "q": "A newly installed router still uses the vendor's default admin password, and Telnet and HTTP are enabled. What should be done to harden it? (Select two.)", "o": ["Change the default credentials", "Disable unused/insecure services such as Telnet and HTTP", "Enable SNMPv1 with community 'public'", "Leave all ports enabled for future use"], "a": [0, 1], "e": "Hardening means changing defaults and disabling insecure or unused services, then using SSH and HTTPS instead. Why not the others: SNMPv1 'public' is insecure. Leaving unused ports enabled increases the attack surface."}, {"d": 4, "q": "Several unused switch ports are in public areas of an office. What is the BEST practice?", "o": ["Shut them down and move them to an unused VLAN", "Leave them enabled on the user VLAN", "Configure them as 802.1Q trunks", "Enable PoE on all of them for phones"], "a": 0, "e": "Disabling unused ports, and parking them in a dead VLAN, prevents anyone from simply plugging in. Why not the others: leaving them enabled or trunked invites unauthorized access. PoE doesn't add security."}, {"d": 4, "q": "A router must allow HTTPS to a web server but block all other traffic to it. Which feature should be configured?", "o": ["Access control list", "Port mirroring", "NAT overload", "QoS"], "a": 0, "e": "ACLs permit or deny traffic by source, destination, protocol and port, with an implicit deny at the end. Why not the others: mirroring copies traffic. PAT translates addresses. QoS prioritizes traffic."}, {"d": 4, "q": "At the end of every ACL, what happens to traffic that matches none of the configured entries?", "o": ["It is denied by the implicit deny", "It is permitted by default", "It is logged and forwarded", "It is sent to the native VLAN"], "a": 0, "e": "ACLs end with an implicit 'deny any', so anything not explicitly permitted is dropped. Why not the others: unmatched traffic isn't permitted, forwarded or redirected."}, {"d": 4, "q": "A company wants to block employees from reaching gambling and malware websites by category. Which control should it use?", "o": ["URL/content filtering", "Port security", "802.1Q tagging", "NAT"], "a": 0, "e": "URL and content filtering on a proxy, NGFW or SWG blocks web categories. Why not the others: port security, tagging and NAT don't inspect web destinations."}, {"d": 4, "q": "A company hosts its public web and mail servers in a separate network between the internet and the internal LAN. What is this zone called?", "o": ["Screened subnet", "Trusted zone", "Native VLAN", "Honeynet"], "a": 0, "e": "A screened subnet (DMZ) holds internet-facing services so a compromise doesn't directly expose the internal network. Why not the others: the trusted zone is the internal LAN. The native VLAN is untagged trunk traffic. A honeynet is a decoy network."}, {"d": 4, "q": "Which firewall zone label typically applies to the internet?", "o": ["Untrusted", "Trusted", "Screened", "Management"], "a": 0, "e": "The internet is the untrusted zone, the internal LAN is trusted, and the DMZ (screened subnet) sits between them. Why not the others: they describe internal or semi-trusted zones."}, {"d": 4, "q": "A company stores encryption keys used by many servers in a centralized system that rotates and revokes them on schedule. Which practice is this?", "o": ["Key management", "Port security", "Content filtering", "Geofencing"], "a": 0, "e": "Key management covers generating, storing, distributing, rotating and revoking keys, often in an HSM or KMS. Why not the others: the others aren't key-related."}, {"d": 4, "q": "Which switch feature blocks DHCP offers that arrive on untrusted ports to stop rogue DHCP servers?", "o": ["DHCP snooping", "Port mirroring", "BPDU guard", "LACP"], "a": 0, "e": "DHCP snooping trusts only uplink ports for DHCP server messages and builds a binding table that DAI can use. Why not the others: mirroring copies traffic. BPDU guard protects STP. LACP bundles links."}, {"d": 4, "q": "A switch port where users connect should shut down immediately if it receives an STP BPDU from an unauthorized switch. Which feature does this?", "o": ["BPDU guard", "Root guard", "DHCP snooping", "Port mirroring"], "a": 0, "e": "BPDU guard disables (err-disables) an edge port that receives BPDUs, which stops rogue switches from joining STP. Why not the others: root guard blocks superior BPDUs from taking over the root bridge but doesn't shut the port down. The others aren't STP-related."}, {"d": 5, "q": "A user reports they cannot reach a file server. According to the CompTIA troubleshooting methodology, what should the technician do FIRST?", "o": ["Identify the problem", "Establish a theory of probable cause", "Implement a fix", "Document findings"], "a": 0, "e": "The first step is identifying the problem: gather information, question users, identify symptoms, find out what changed, and try to reproduce it. Why not the others: theory, implementation and documentation come later."}, {"d": 5, "q": "A technician has established a theory of probable cause. What is the NEXT step?", "o": ["Test the theory to determine the cause", "Document findings", "Verify full system functionality", "Establish a plan of action"], "a": 0, "e": "The order is identify → theory → test theory → plan of action → implement or escalate → verify → document. Why not the others: they come after testing."}, {"d": 5, "q": "A technician's tests disprove their theory. What should they do NEXT?", "o": ["Establish a new theory or escalate", "Implement the original fix anyway", "Document and close the ticket", "Reboot every device"], "a": 0, "e": "If the theory isn't confirmed, form a new one or escalate. Why not the others: applying an unproven fix, closing the ticket or rebooting everything doesn't address the actual cause."}, {"d": 5, "q": "After resolving an outage, the technician confirms all users can work normally and adds monitoring so it doesn't recur. Which step is this?", "o": ["Verify full system functionality", "Document findings and lessons learned", "Establish a plan of action", "Identify the problem"], "a": 0, "e": "Verification includes confirming the fix and preventing a repeat. Why not the others: documentation comes after verification. The other steps happen earlier."}, {"d": 5, "q": "What is the FINAL step of the CompTIA network troubleshooting methodology?", "o": ["Document findings, actions and outcomes", "Verify full system functionality", "Implement the solution or escalate", "Question the user about symptoms"], "a": 0, "e": "Documentation is always last, so the next person can learn from it. Why not the others: they're earlier steps."}, {"d": 5, "q": "A technician asks, 'Did anything change recently on the network?' Which step of the methodology is this part of?", "o": ["Identify the problem", "Test the theory", "Implement the solution", "Document findings"], "a": 0, "e": "Determining recent changes is part of identifying the problem. Why not the others: they come later."}, {"d": 5, "q": "Multiple users report three different problems at once: slow Wi-Fi, a printer error, and VPN failures. What does the methodology recommend?", "o": ["Approach multiple problems individually", "Assume they share one cause and reboot the core switch", "Fix the easiest one and close all tickets", "Escalate all of them immediately"], "a": 0, "e": "CompTIA says to approach multiple problems individually so one symptom doesn't hide another. Why not the others: assuming one cause, closing everything, or escalating blindly skips diagnosis."}, {"d": 5, "q": "A technician isolates a problem by testing at the midpoint of the network path, then halving the remaining segment each time. Which approach is this?", "o": ["Divide and conquer", "Top-to-bottom", "Bottom-to-top", "Question the obvious"], "a": 0, "e": "Divide and conquer starts in the middle (often Layer 3 with a ping) and works toward the problem. Why not the others: top-down starts at Layer 7 and bottom-up at Layer 1. Questioning the obvious means checking simple causes first."}, {"d": 5, "q": "A fix requires replacing a core router, which needs approval and a maintenance window. Which step comes BEFORE making the change?", "o": ["Establish a plan of action", "Document findings", "Verify full functionality", "Question the user"], "a": 0, "e": "The plan of action considers the impact, rollback and approvals before implementation. Why not the others: documentation and verification come after. Questioning users happens at the start."}, {"d": 5, "q": "A 1 Gbps copper link to a switch 140 meters away has frequent errors and drops. What is the MOST likely cause?", "o": ["Attenuation from excessive length", "Duplex mismatch on the switch port", "Wrong VLAN on the access port", "DNS failure on the client"], "a": 0, "e": "Twisted-pair Ethernet is limited to 100 m, and beyond that the signal weakens (attenuation) and errors appear. Why not the others: duplex, VLAN and DNS issues aren't caused by length."}, {"d": 5, "q": "A cable tester shows near-end crosstalk (NEXT) on a newly terminated cable. What is the MOST likely cause?", "o": ["Pairs untwisted too far at the connector", "Using single-mode fiber patch cords", "An incorrect IP address on the host", "The cable run is too short"], "a": 0, "e": "Untwisting pairs near the termination increases crosstalk. Keep twists within about 0.5 inch (13 mm) of the connector. Why not the others: fiber doesn't have crosstalk. IP settings aren't physical. Short cables don't cause NEXT."}, {"d": 5, "q": "A network cable runs alongside fluorescent light ballasts and an elevator motor, and the link has intermittent errors. What is the BEST solution?", "o": ["Reroute it or use shielded cable", "Move the port to a different VLAN", "Replace it with a longer cable", "Lower the DHCP lease time"], "a": 0, "e": "Electromagnetic interference (EMI) from motors and ballasts corrupts signals on UTP. Rerouting or shielding fixes it. Why not the others: VLAN and DHCP settings aren't physical. A longer cable adds attenuation."}, {"d": 5, "q": "A technician connects a multimode patch cable to a single-mode SFP, and the link shows high loss or stays down. What is the problem?", "o": ["Fiber type mismatch", "TX/RX are reversed", "Wrong VLAN", "STP is blocking"], "a": 0, "e": "Single-mode and multimode optics and cables aren't interchangeable, and mixing them causes severe loss. Why not the others: reversed TX/RX produces no link even with the correct fiber type. VLAN and STP are logical."}, {"d": 5, "q": "A new fiber link shows no light received at either end, even though both transceivers and the cable test good. What should the technician try FIRST?", "o": ["Swap the TX/RX strands (polarity) at one end", "Replace both switches", "Change the IP addresses", "Use a crossover copper cable"], "a": 0, "e": "Duplex fiber has to cross TX to RX. If the polarity is reversed, both sides transmit into each other's transmitters. Why not the others: replacing switches is premature. IP addresses and copper cables don't fix fiber polarity."}, {"d": 5, "q": "A technician needs to find a break in a fiber cable inside a patch panel by shining visible red light through it. Which tool is used?", "o": ["Visual fault locator", "Toner probe", "Multimeter", "Loopback adapter"], "a": 0, "e": "A VFL injects bright red laser light that leaks out at breaks and tight bends. Why not the others: a toner is for copper. A multimeter measures electrical values. A loopback tests ports."}, {"d": 5, "q": "A technician needs to trace an unlabeled copper cable from a wall jack to the correct patch panel port. Which tool should be used?", "o": ["Tone generator and probe", "OTDR", "Spectrum analyzer", "Visual fault locator"], "a": 0, "e": "The toner puts a signal on the cable, and the probe finds the matching cable at the other end. Why not the others: an OTDR and a VFL are for fiber. A spectrum analyzer examines RF."}, {"d": 5, "q": "A newly terminated patch cable passes continuity on one tester, but a certification test shows pairs 1-2 and 3-6 are swapped at one end. What is the MOST likely cause?", "o": ["T568A on one end, T568B on the other", "The cable jacket is plenum-rated", "The cable run is too short", "The switch port supplies PoE"], "a": 0, "e": "One end A and the other end B makes a crossover cable (green and orange pairs swapped). Use the same standard on both ends for a straight-through cable. Why not the others: plenum rating, length and PoE don't swap pairs."}, {"d": 5, "q": "A switch interface shows a steadily increasing number of CRC errors. What does this MOST likely indicate?", "o": ["A physical-layer problem such as bad cabling", "A DNS misconfiguration on the client", "An ACL blocking traffic on the port", "DHCP scope exhaustion on the VLAN"], "a": 0, "e": "CRC errors mean frames arrived corrupted, which points to cabling, interference, bad optics or a duplex mismatch. Why not the others: DNS, ACL and DHCP problems don't corrupt frames."}, {"d": 5, "q": "Interface counters show many runts. What are runts?", "o": ["Frames smaller than the 64-byte minimum", "Frames larger than 1518 bytes", "Frames dropped by an ACL entry", "Frames carrying an 802.1Q tag"], "a": 0, "e": "Runts are undersized frames (under 64 bytes), usually from collisions or a duplex mismatch. Why not the others: oversized frames are giants. ACL drops and tagged frames aren't runts."}, {"d": 5, "q": "A switch reports giants on an interface connected to a server that was recently configured for jumbo frames. What is the cause?", "o": ["An MTU mismatch", "Crosstalk on the cable", "The wrong VLAN on the port", "A duplicate IP address"], "a": 0, "e": "Giants are frames larger than the port's MTU. The server sends 9000-byte frames that the switch port expects at 1500. Why not the others: crosstalk causes CRC errors. VLAN and IP issues don't create oversized frames."}, {"d": 5, "q": "A switch port shows the status 'err-disabled' after an unknown device was plugged in. What is the MOST likely reason?", "o": ["A port security or BPDU guard violation", "The cable is too long", "DNS is down", "The VLAN database is full"], "a": 0, "e": "Security features such as port security and BPDU guard put ports into err-disabled on a violation. Why not the others: cable length causes errors, not err-disable. DNS and the VLAN database don't disable ports."}, {"d": 5, "q": "A port shows 'administratively down.' What does this mean?", "o": ["It was shut down in the configuration", "The cable is unplugged at one end", "The remote device is powered off", "There is a duplex mismatch on it"], "a": 0, "e": "Administratively down means someone ran 'shutdown' on the interface. Run 'no shutdown' to enable it. Why not the others: an unplugged cable or a powered-off remote device shows as down/down (not connected), not admin down. A duplex mismatch shows up as errors."}, {"d": 5, "q": "A new PoE camera does not power up, but a laptop works fine on the same port. The switch shows the PoE budget is nearly used up. What is the problem?", "o": ["PoE power budget exceeded", "Wrong VLAN", "Duplex mismatch", "Crosstalk"], "a": 0, "e": "When the switch's total PoE budget is used up, new powered devices don't get power, but data still works for non-PoE devices. Why not the others: VLAN, duplex and crosstalk problems don't stop devices from powering up."}, {"d": 5, "q": "A Wi-Fi 6 AP that needs 802.3at power is connected to an older 802.3af switch. It boots, but with reduced radios. What is the issue?", "o": ["Incorrect PoE standard", "Wrong SSID", "Channel overlap", "Expired certificate"], "a": 0, "e": "802.3af supplies about 15.4 W, so a PoE+ AP may run in a limited mode. Why not the others: SSID, channel and certificate problems don't cause power-related degradation."}, {"d": 5, "q": "A 10GBASE-LR transceiver is installed at one end of a link, and a 10GBASE-SR transceiver at the other. What will happen?", "o": ["The link will not come up", "It will work at the full 10 Gbps", "It will negotiate down to 1 Gbps", "It will work only on VLAN 1"], "a": 0, "e": "LR (1310 nm, single-mode) and SR (850 nm, multimode) use different wavelengths and fiber types, so both ends must match. Why not the others: the link won't work at all, at any speed or VLAN."}, {"d": 5, "q": "A light meter shows a fiber link's received signal is below the transceiver's sensitivity threshold. What might cause this? (Select two.)", "o": ["Dirty connectors", "Excessive bends or a damaged cable", "Incorrect DNS server", "Wrong default gateway"], "a": [0, 1], "e": "Low received light (dBm) comes from contamination, tight bends, bad splices or too much distance. Clean the connectors first. Why not the others: DNS and gateway settings are logical."}, {"d": 5, "q": "Users report the network becomes extremely slow, and switch CPU spikes to 100% after someone connected a second cable between two switches. What is the MOST likely cause?", "o": ["A switching loop causing a broadcast storm", "DHCP scope exhaustion on the VLAN", "A DNS server failure", "An incorrect subnet mask on clients"], "a": 0, "e": "Redundant links without STP create loops where broadcasts circulate endlessly. Why not the others: DHCP, DNS and subnet mask issues don't saturate switch CPUs this way."}, {"d": 5, "q": "After a new switch with default priority was added, traffic began taking an inefficient path through it. What is the MOST likely cause?", "o": ["The new switch was elected STP root bridge", "Its VLAN database was empty", "It has PoE enabled", "It is running SNMPv3"], "a": 0, "e": "A switch with a lower bridge ID (equal priority but lower MAC) can become root unexpectedly and reshape the topology. Set the root priority deliberately. Why not the others: they don't affect path selection."}, {"d": 5, "q": "A PC on the correct switch gets an address in the wrong subnet and cannot reach its department's server. Other ports work fine. What is the MOST likely cause?", "o": ["The port is assigned to the wrong VLAN", "The DNS server is down", "The cable is too long", "The NIC driver is outdated"], "a": 0, "e": "An incorrect VLAN assignment puts the host in another broadcast domain, so it gets that VLAN's DHCP scope. Why not the others: DNS doesn't assign addresses. Length causes errors. Drivers don't pick subnets."}, {"d": 5, "q": "A user can ping hosts on their own subnet but not anything on other subnets or the internet. What is the MOST likely cause?", "o": ["Incorrect default gateway", "Bad patch cable", "Duplicate MAC address", "Wrong SSID selected"], "a": 0, "e": "If local traffic works but remote traffic fails, the gateway is the prime suspect. Why not the others: a bad cable would break local traffic too. Duplicate MACs cause intermittent local issues. SSID only applies to Wi-Fi."}, {"d": 5, "q": "A user receives the message 'Windows has detected an IP address conflict.' What is the problem?", "o": ["Duplicate IP address", "Incorrect subnet mask", "Wrong VLAN assignment", "Bad DNS record"], "a": 0, "e": "Two devices claim the same IP, often a static address inside the DHCP range. Why not the others: they don't produce a conflict warning."}, {"d": 5, "q": "Host A is 192.168.1.10/24 and host B is 192.168.1.20 but configured with a /28 mask. Host B can reach some local hosts but not others. What is wrong?", "o": ["Incorrect subnet mask on host B", "Incorrect default gateway on host A", "Duplicate IP", "Wrong DNS server"], "a": 0, "e": "With /28, host B thinks only .16–.31 are local and sends other 'local' traffic to the gateway, so communication becomes inconsistent. Why not the others: they don't explain partial local reachability."}, {"d": 5, "q": "Many new devices on a busy guest network get APIPA addresses, while devices that connected earlier work. What is the MOST likely cause?", "o": ["DHCP address pool exhaustion", "Wrong VLAN on all ports", "STP loop", "Expired SSL certificate"], "a": 0, "e": "A full DHCP scope can't hand out new leases. Expand the scope or shorten the lease time. Why not the others: a wrong VLAN or a loop would affect everyone. Certificates don't affect DHCP."}, {"d": 5, "q": "A new firewall rule was added, and now users can no longer reach the CRM server on TCP 443, although ping still works. What should be checked FIRST?", "o": ["The firewall rule set", "The cable to the server", "The server's NIC duplex", "The DHCP lease time"], "a": 0, "e": "Ping (ICMP) works but HTTPS fails right after a rule change, which points to an ACL or firewall rule blocking 443. Why not the others: ping success rules out cabling and duplex. DHCP isn't involved."}, {"d": 5, "q": "A router has no route to 172.20.0.0/16 and no default route. Packets to that network are dropped. What should be checked?", "o": ["The routing table", "The MAC address table", "The DNS cache", "The PoE budget"], "a": 0, "e": "Without a matching route or a default route, the router drops the packet. 'show ip route' reveals the gap. Why not the others: the MAC table, DNS and PoE don't make routing decisions."}, {"d": 5, "q": "Internet traffic stops at the edge router, though internal routing works. 'show ip route' shows no 'Gateway of last resort.' What is missing?", "o": ["A default route", "A VLAN", "An SVI", "A DHCP reservation"], "a": 0, "e": "The gateway of last resort is the default route that sends unknown destinations to the ISP. Why not the others: VLANs, SVIs and DHCP don't provide internet routing."}, {"d": 5, "q": "A user can reach a server by IP but not by name. Which service is MOST likely failing?", "o": ["DNS", "DHCP", "NTP", "SNMP"], "a": 0, "e": "Reaching a host by IP but not by name points to name resolution. Why not the others: DHCP assigns addresses. NTP syncs time. SNMP monitors devices."}, {"d": 5, "q": "VoIP calls have words dropping in and out because packets arrive at uneven intervals. Which metric is MOST relevant?", "o": ["Jitter", "Bandwidth", "Throughput", "MTU"], "a": 0, "e": "Jitter is variation in packet delay. Voice needs it low (under about 30 ms). QoS and jitter buffers help. Why not the others: bandwidth is capacity. Throughput is actual data delivered. MTU is frame size."}, {"d": 5, "q": "A video call shows a noticeable delay between when a person speaks and when they are heard, but no choppiness. Which issue is this?", "o": ["Latency", "Jitter", "Packet loss", "Crosstalk"], "a": 0, "e": "Consistent delay is latency. Why not the others: jitter is uneven delay that causes choppiness. Packet loss causes gaps. Crosstalk is a cable problem."}, {"d": 5, "q": "A 1 Gbps link consistently delivers only 300 Mbps of actual data during transfers. Which term describes the measured 300 Mbps?", "o": ["Throughput", "Bandwidth", "Latency", "Jitter"], "a": 0, "e": "Throughput is the actual data rate achieved. Bandwidth is the theoretical capacity. Why not the others: latency is delay and jitter is delay variation."}, {"d": 5, "q": "Users on 48 access switches share a single 1 Gbps uplink to the core, and performance drops sharply during peak hours. What is the issue?", "o": ["Bottleneck / congestion on the uplink", "Duplex mismatch on each PC", "DNS poisoning", "APIPA addressing"], "a": 0, "e": "Too much traffic through one undersized link causes congestion and contention. Add bandwidth or aggregate links. Why not the others: they don't explain a peak-hour slowdown on the uplink."}, {"d": 5, "q": "A user's Wi-Fi works near the AP but disconnects frequently at the far end of the office. What is the MOST likely issue?", "o": ["Insufficient wireless coverage", "Wrong VLAN on the SSID", "Expired DHCP scope options", "Duplex mismatch on the AP uplink"], "a": 0, "e": "Signal weakens with distance and obstacles, so add APs or adjust placement. Why not the others: they don't depend on the user's location."}, {"d": 5, "q": "Two neighboring APs are both on 2.4 GHz channel 6, and clients see poor throughput. What is the issue?", "o": ["Co-channel interference", "Attenuation from cable length", "DNS misconfiguration", "Native VLAN mismatch"], "a": 0, "e": "APs on the same channel have to take turns using the air (contention). Use 1, 6 and 11 across neighboring APs. Why not the others: they aren't RF problems."}, {"d": 5, "q": "A Wi-Fi user's connection drops whenever the microwave in the break room runs. What is the cause?", "o": ["Interference in the 2.4 GHz band", "WPA3 incompatibility", "DHCP exhaustion", "Wrong subnet mask"], "a": 0, "e": "Microwave ovens operate around 2.45 GHz and interfere with 2.4 GHz Wi-Fi. Moving clients to 5 GHz helps. Why not the others: they don't correlate with the microwave."}, {"d": 5, "q": "Users walking through a building lose their connection briefly when moving between APs, and their sessions reset. What should be checked?", "o": ["Roaming configuration across the APs", "STP root bridge placement", "DNS TTL values on records", "PoE budget on the AP switch"], "a": 0, "e": "Seamless roaming needs matching SSID and security settings and often 802.11r/k/v fast-roaming support. Why not the others: they don't affect handoff between APs."}, {"d": 5, "q": "A client remains connected to a distant AP with a weak signal even though a closer AP is available. Which issue is this?", "o": ["A sticky client (roaming issue)", "Channel bonding on the AP", "DNS spoofing on the LAN", "An MTU mismatch on the uplink"], "a": 0, "e": "Sticky clients hold on to their current AP. Minimum RSSI thresholds and 802.11k/v can fix it. Why not the others: they aren't AP association problems."}, {"d": 5, "q": "Clients are repeatedly disconnected from the AP with deauthentication messages, even though the signal is strong. What could cause this? (Select two.)", "o": ["A deauthentication attack", "Mismatched security settings or failed authentication", "Plenum cable", "Incorrect PTR record"], "a": [0, 1], "e": "Forged deauth frames (an attack) or authentication or security mismatches both cause client disassociation. Why not the others: plenum cable and PTR records are unrelated to Wi-Fi association."}, {"d": 5, "q": "A ping to a remote server shows 15% of replies time out. Which problem does this indicate?", "o": ["Packet loss", "Jitter only", "DNS failure", "Duplicate IP"], "a": 0, "e": "Timeouts on a fraction of pings mean packet loss, from congestion, errors or faulty links. Why not the others: jitter is delay variation. DNS and IP conflicts don't produce partial timeouts to an IP."}, {"d": 5, "q": "A technician wants to see each router hop between a PC and a website to find where packets stop. Which command should be used on Windows?", "o": ["tracert", "ping", "nslookup", "netstat"], "a": 0, "e": "tracert (traceroute on Linux and macOS) lists each hop by increasing the TTL. Why not the others: ping tests reachability only. nslookup queries DNS. netstat lists connections."}, {"d": 5, "q": "Which command tests basic reachability to a host using ICMP Echo Requests?", "o": ["ping", "tracert", "arp -a", "dig"], "a": 0, "e": "ping sends ICMP Echo Requests and reports replies and round-trip time. Why not the others: tracert shows the path. arp shows IP-to-MAC mappings. dig queries DNS."}, {"d": 5, "q": "A Linux administrator wants detailed DNS query results, including the answer, authority, and TTL. Which command is BEST?", "o": ["dig", "ping", "netstat", "tcpdump"], "a": 0, "e": "dig is a flexible DNS lookup tool with detailed output. nslookup is the cross-platform alternative. Why not the others: ping tests reachability, netstat shows sockets, and tcpdump captures packets."}, {"d": 5, "q": "Which Windows command queries DNS to resolve a hostname and shows which DNS server answered?", "o": ["nslookup", "ipconfig /release", "tracert", "route print"], "a": 0, "e": "nslookup queries DNS servers directly. Why not the others: ipconfig /release drops the DHCP lease. tracert traces the path. route print shows the routing table."}, {"d": 5, "q": "A technician wants to see all active TCP connections and listening ports on a server. Which command should be used?", "o": ["netstat", "nslookup", "arp", "tracert"], "a": 0, "e": "netstat (or ss on Linux) lists connections, listening ports and their state. Why not the others: nslookup is DNS, arp is the MAC cache, and tracert is the path."}, {"d": 5, "q": "Which Windows command displays the IP address, subnet mask, default gateway, and DNS servers for all adapters?", "o": ["ipconfig /all", "ping -t", "netstat -an", "nslookup"], "a": 0, "e": "ipconfig /all shows the full IP configuration, including MAC and DHCP details. Why not the others: ping -t pings continuously. netstat -an lists sockets. nslookup queries DNS."}, {"d": 5, "q": "Which Linux command shows interface addresses on modern distributions, replacing ifconfig?", "o": ["ip addr", "ipconfig", "nslookup", "tracert"], "a": 0, "e": "The 'ip' command (ip addr, ip route, ip link) replaced ifconfig. Why not the others: ipconfig and tracert are Windows commands. nslookup is DNS."}, {"d": 5, "q": "A technician suspects ARP poisoning and wants to view the local IP-to-MAC mappings on a PC. Which command should be used?", "o": ["arp -a", "netstat -r", "ipconfig /flushdns", "dig"], "a": 0, "e": "arp -a shows the ARP cache, so duplicate MACs for different IPs (such as the gateway) suggest poisoning. Why not the others: netstat -r shows routes. flushdns clears DNS. dig queries DNS."}, {"d": 5, "q": "Which command-line tool captures packets on a Linux server's interface for later analysis in Wireshark?", "o": ["tcpdump", "nmap", "netstat", "dig"], "a": 0, "e": "tcpdump captures packets and can write pcap files with -w. Why not the others: nmap scans hosts and ports. netstat shows sockets. dig queries DNS."}, {"d": 5, "q": "A security team needs to discover which hosts are up on a subnet and which ports and services they expose. Which tool should be used?", "o": ["Nmap", "tcpdump", "nslookup", "ping only"], "a": 0, "e": "Nmap performs host discovery and port and service scanning. Why not the others: tcpdump captures traffic. nslookup is DNS. ping only tests reachability."}, {"d": 5, "q": "A technician needs to identify which switch and port a VoIP phone is connected to, using a vendor-neutral discovery protocol. Which should be used?", "o": ["LLDP", "CDP", "SNMP traps", "STP"], "a": 0, "e": "LLDP (802.1AB) is the vendor-neutral neighbor discovery protocol. CDP is Cisco-proprietary. Why not the others: SNMP traps are alerts. STP prevents loops."}, {"d": 5, "q": "Which device sits inline on a link and passes an exact copy of all traffic to a monitoring tool, even at full line rate?", "o": ["Network TAP", "Hub", "Toner", "Loopback plug"], "a": 0, "e": "A TAP (test access point) copies traffic passively without dropping packets, which is more reliable than SPAN under load. Why not the others: a hub isn't a monitoring device. A toner traces cables. A loopback tests ports."}, {"d": 5, "q": "A user wants to measure their actual internet upload and download rates. Which tool is appropriate?", "o": ["Speed tester", "Toner probe", "Cable crimper", "Visual fault locator"], "a": 0, "e": "A speed test measures real throughput and latency to a test server. Why not the others: toners, crimpers and VFLs are physical cabling tools."}, {"d": 5, "q": "On a Cisco switch, which command shows which MAC addresses are learned on which ports?", "o": ["show mac address-table", "show ip route", "show vlan brief", "show running-config"], "a": 0, "e": "The MAC address table maps MACs to ports and VLANs. Why not the others: show ip route shows routes. show vlan brief lists VLAN port assignments. show running-config shows the configuration."}, {"d": 5, "q": "Which Cisco command lists all VLANs and the access ports assigned to each?", "o": ["show vlan brief", "show interfaces trunk", "show arp", "show power inline"], "a": 0, "e": "show vlan brief lists VLANs and their member access ports. Why not the others: show interfaces trunk shows trunks. show arp shows the ARP table. show power inline shows PoE."}, {"d": 5, "q": "Which Cisco command shows an interface's speed, duplex, and error counters such as CRC and runts?", "o": ["show interface", "show vlan", "show ip route", "show mac address-table"], "a": 0, "e": "show interface (or show interfaces) displays status, speed, duplex, MTU and error counters. Why not the others: they show VLANs, routes and MACs."}, {"d": 5, "q": "A technician wants to check how much PoE power each switch port is drawing and how much of the budget remains. Which command is used?", "o": ["show power inline", "show interface trunk", "show route", "show arp"], "a": 0, "e": "show power inline displays per-port PoE draw and the remaining budget. Why not the others: they show trunks, routes and ARP."}, {"d": 5, "q": "Which Cisco command displays the IP-to-MAC address mappings the router has learned?", "o": ["show arp", "show mac address-table", "show vlan", "show power inline"], "a": 0, "e": "show arp (or show ip arp) lists the router's ARP cache. Why not the others: the MAC table is a switch's Layer 2 table. VLAN and power commands don't show ARP."}, {"d": 5, "q": "A technician needs to view the routing table on a router to confirm a static route was added. Which command should be used?", "o": ["show ip route", "show running-config interface", "show mac address-table", "show cdp neighbors"], "a": 0, "e": "show ip route displays all routes and their sources (C, S, O, D, B). Why not the others: they show interface config, MACs and neighbors."}, {"d": 5, "q": "A technician uses a tool that displays nearby SSIDs, channels, signal strength (RSSI), and noise to plan AP placement. Which tool is this?", "o": ["Wi-Fi analyzer", "Protocol analyzer only", "Cable tester", "Multimeter"], "a": 0, "e": "A Wi-Fi analyzer shows RF details for channel planning and coverage. Why not the others: a protocol analyzer decodes packets. A cable tester and a multimeter are wired tools."}, {"d": 5, "q": "A technician needs to decode captured traffic and follow a TCP stream to see why an application handshake fails. Which tool is BEST?", "o": ["Protocol analyzer", "Toner probe", "Speed tester", "Light meter"], "a": 0, "e": "Protocol analyzers decode every layer and can follow streams to find failures. Why not the others: they don't inspect packets."}, {"d": 5, "q": "A traceroute output shows hops 1–4 responding normally, then asterisks (* * *) for every hop after 5. What is the MOST likely explanation?", "o": ["A device at or after hop 5 is blocking or dropping traffic", "The local PC has no IP address assigned", "DNS is misconfigured on the local PC", "The cable to the PC is bad or unplugged"], "a": 0, "e": "Responses stop at a point in the path, so a firewall, ACL or failure lies there. Some devices simply don't answer traceroute probes. Why not the others: the first four hops answered, so local addressing, DNS and cabling are working."}, {"d": 5, "q": "A user can ping 8.8.8.8 but 'ping google.com' fails with 'could not find host.' Which command would BEST help confirm the cause?", "o": ["nslookup google.com", "arp -a", "netstat -r", "show power inline"], "a": 0, "e": "IP connectivity works but name resolution doesn't, and nslookup tests DNS directly. Why not the others: arp, netstat -r and PoE commands don't test DNS."}]</script>
<script id="gloss-n1" type="application/json">[["OSI", "A 7-layer model for describing networks: 1 Physical, 2 Data Link, 3 Network, 4 Transport, 5 Session, 6 Presentation, 7 Application."], ["VLANs?", "A way to split one physical switch into separate virtual networks that can't talk to each other without a router."], ["trunk", "A switch link that carries many VLANs at once by tagging each frame with its VLAN number."], ["native VLAN", "The one VLAN on a trunk whose traffic is sent without a tag. Both ends must agree on it."], ["802\\.1Q", "The standard for tagging Ethernet frames with a VLAN number."], ["SVIs?", "A virtual interface on a Layer 3 switch that acts as the default gateway for a VLAN."], ["STP|Spanning Tree", "A protocol that shuts off extra switch links so traffic can't loop forever."], ["root bridge", "The switch STP picks as the center of the network. All other paths are calculated from it."], ["broadcast storm", "Broadcast traffic looping endlessly between switches until the network grinds to a halt."], ["LACP|link aggregation", "Bundling several physical links into one bigger, redundant logical link."], ["MTU", "The largest frame or packet size a link will carry. Standard Ethernet is 1500 bytes."], ["jumbo frames?", "Frames bigger than the normal 1500 bytes (usually 9000). Every device in the path must support them."], ["CRC", "A checksum on each frame. CRC errors mean the frame got corrupted on the way, usually a cable or interference problem."], ["runts?", "Broken frames smaller than the 64-byte minimum, usually from collisions or a duplex mismatch."], ["giants?", "Frames larger than the port allows, usually from an MTU mismatch."], ["duplex", "Whether a link can send and receive at the same time (full) or only one direction at a time (half)."], ["subnet mask|prefix|CIDR", "The part of an IP setting that says how many bits are the network and how many are hosts, e.g. /24 = 255.255.255.0."], ["subnet", "A smaller network carved out of a bigger IP range."], ["VLSM", "Using different subnet sizes inside one address block so each subnet fits its needs."], ["APIPA|169\\.254", "A 169.254.x.x address a PC gives itself when it can't reach a DHCP server."], ["RFC 1918|private IP", "Address ranges reserved for internal use: 10.x, 172.16-31.x, 192.168.x. They aren't routed on the internet."], ["default gateway|gateway", "The router a device sends traffic to when the destination is outside its own subnet."], ["NAT|PAT", "Translating private IP addresses into public ones at the edge router. PAT lets many devices share one public IP using different port numbers."], ["administrative distance", "How much a router trusts a route source. Lower wins (connected 0, static 1, OSPF 110)."], ["longest prefix", "When several routes match, the router uses the most specific one (the biggest /number)."], ["OSPF", "An open-standard routing protocol used inside an organization. It picks paths by cost."], ["EIGRP", "A Cisco-created routing protocol used inside an organization."], ["BGP", "The routing protocol that connects different organizations and ISPs across the internet."], ["FHRP|VRRP|HSRP", "Two routers sharing one virtual gateway IP, so hosts keep working if one router dies."], ["SFP\\+?|QSFP\\w*|transceiver", "A small plug-in module that converts a switch port to fiber or copper at a set speed."], ["single-mode", "Fiber with a tiny core and laser light for very long distances (kilometers)."], ["multimode", "Fiber with a wider core for shorter runs (hundreds of meters), usually inside a building."], ["DAC|twinax", "A short copper cable with transceivers built into each end, used to link gear in the same rack."], ["plenum", "The air space above ceilings or below floors. Cable there must have a fire-safe plenum jacket."], ["attenuation", "A signal getting weaker over distance."], ["crosstalk|NEXT", "Signal from one wire pair bleeding into another pair, usually from untwisting too much at the connector."], ["EMI|interference", "Electrical noise from motors, lights or radios that corrupts signals."], ["PoE\\+?|802\\.3a[ft]|802\\.3bt", "Power over Ethernet: sending electricity over the network cable to phones, APs and cameras."], ["SSID", "The Wi-Fi network name people see."], ["BSSID", "The hardware (MAC) address of one specific access point radio."], ["ESSID|ESS", "Several access points sharing the same network name so users can roam."], ["band steering", "The AP nudging devices onto the faster, less crowded 5 or 6 GHz band."], ["channel width", "How much radio spectrum one Wi-Fi channel uses. Wider is faster but leaves fewer channels to share."], ["co-channel|channel overlap", "Nearby APs on the same or overlapping channels, forcing them to take turns."], ["WPA3|SAE", "The newest Wi-Fi security. SAE replaces the old shared-password handshake and resists password cracking."], ["802\\.1X", "Port-based login: a device has to authenticate (usually against a RADIUS server) before the switch or AP lets it on."], ["RADIUS", "A server that checks usernames, passwords or certificates for network access."], ["TACACS\\+", "A Cisco-origin login server for network device admins. It authorizes and logs each command."], ["captive portal", "The web page that pops up on guest Wi-Fi asking you to accept terms or log in."], ["MDF", "The main wiring room where the building's core network and internet connection live."], ["IDF", "A smaller wiring closet, usually one per floor, that connects back to the MDF."], ["PDU", "A rack power strip that feeds power to equipment, often with monitoring."], ["UPS", "A battery backup that keeps equipment running during short power outages."], ["SNMP", "A protocol monitoring tools use to read stats from network devices. Version 3 adds login and encryption."], ["MIB|OID", "The list (MIB) of things SNMP can read from a device. Each item has an ID number (OID)."], ["traps?", "An alert a device sends on its own (for example, 'interface down') instead of waiting to be asked."], ["syslog", "The standard way devices send log messages to a central log server."], ["SIEM", "A system that collects logs from everywhere and raises security alerts."], ["NetFlow|IPFIX|flow data", "Summaries of who talked to whom, on what port and how much, without capturing the full packets."], ["SPAN|port mirroring", "Copying traffic from one switch port to another so an analyzer can watch it."], ["TAP", "A hardware device placed on a cable that copies all traffic to a monitoring tool."], ["baseline", "A record of what normal looks like (performance or configuration) to compare against later."], ["RPO", "How much data (measured in time) you can afford to lose. This drives how often you back up."], ["RTO", "How long you have to get a service back up after a disaster."], ["MTBF", "The average time a device runs before it fails."], ["MTTR", "The average time it takes to fix something after it fails."], ["hot site", "A backup location that's fully running and ready to take over almost immediately."], ["warm site", "A backup location with hardware ready but data that still has to be restored."], ["cold site", "A backup location with only space, power and cooling. Everything else must be brought in."], ["DHCP relay|IP helper", "A router setting that forwards DHCP requests to a DHCP server on another subnet."], ["scope", "The range of IP addresses a DHCP server can hand out."], ["lease", "How long a device gets to keep an IP address from DHCP before renewing."], ["SLAAC", "IPv6 devices building their own address from the router's advertised network prefix, with no DHCP server."], ["PTR", "A DNS record that maps an IP address back to a name (reverse lookup)."], ["CNAME", "A DNS alias that points one name at another name."], ["MX", "The DNS record that says which server receives a domain's email."], ["DNSSEC", "Digital signatures on DNS answers so they can't be faked."], ["DoH|DoT", "DNS over HTTPS / DNS over TLS: encrypting DNS lookups for privacy."], ["NTP", "The protocol that keeps device clocks in sync."], ["PTP", "A very precise clock-sync protocol (sub-microsecond) used when timing really matters."], ["split tunnel", "A VPN setting where only company traffic goes through the VPN and everything else uses the home internet."], ["full tunnel", "A VPN setting where all traffic, even web browsing, goes through the company network."], ["site-to-site", "A VPN that permanently connects two office networks over the internet."], ["jump box|jump host", "A locked-down server admins must log into first before reaching network devices."], ["out-of-band", "A separate management path (like a console server on cellular) that works even when the main network is down."], ["in-band", "Managing devices over the same network that carries normal user traffic."], ["IPsec|ESP|IKE", "A suite for encrypting IP traffic, mostly used for VPNs. IKE sets up the keys and ESP encrypts the data."], ["GRE", "A simple tunnel that wraps one packet inside another. It doesn't encrypt anything on its own."], ["anycast", "One IP address used by many servers in different places. You reach whichever one is closest."], ["multicast", "Sending one stream to a group of devices that asked for it."], ["SD-WAN", "Smart WAN routing that picks the best connection (fiber, cable, LTE) per application, managed from one console."], ["SDN", "Software-defined networking: a central controller decides how switches forward traffic."], ["VXLAN", "A way to stretch Layer 2 networks across a routed network, with about 16 million possible segments."], ["zero trust", "A security approach that trusts no one by default, even inside the network, and checks every request."], ["SASE|SSE", "Security and networking services delivered from the cloud close to users instead of from the head office."], ["infrastructure as code|IaC", "Defining network setups in code files so they can be deployed automatically and identically."], ["configuration drift", "Devices slowly getting out of sync with their approved configuration."], ["zero-touch provisioning", "A new device downloading its configuration automatically as soon as it's plugged in."], ["NAT64", "A translator that lets IPv6-only devices reach IPv4-only servers."], ["dual stack", "Running IPv4 and IPv6 at the same time on the same devices."], ["VPC", "Your own private, isolated network inside a public cloud."], ["NAT gateway", "A cloud service that lets private servers reach the internet without being reachable from it."], ["internet gateway", "The cloud component that connects a VPC to the internet."], ["security group", "A cloud firewall attached to individual virtual servers."], ["NFV", "Running network devices like firewalls and routers as software on ordinary servers."], ["elasticity", "Cloud resources automatically growing and shrinking with demand."], ["multitenancy", "Many customers sharing the same cloud hardware while staying separated from each other."], ["spine|leaf", "A data center design where every access (leaf) switch connects to every core (spine) switch."], ["east-west", "Traffic moving between servers inside the data center."], ["north-south", "Traffic going into or out of the data center."], ["collapsed core", "A smaller design where the core and distribution layers are combined in one set of switches."], ["IDS", "A system that watches traffic and alerts on attacks but doesn't block them."], ["IPS", "A system that sits in the traffic path and blocks attacks as they happen."], ["load balancer", "A device that spreads incoming requests across several servers."], ["proxy", "A server that makes web requests on behalf of users, often to filter or cache them."], ["NAS", "A storage box that shares files over the network."], ["SAN", "A dedicated storage network that gives servers raw disk (block) storage."], ["CDN", "Servers around the world that keep copies of content close to users so it loads faster."], ["QoS", "Settings that give important traffic like voice priority over everything else."], ["TTL", "A counter in each packet that drops by one at every router. At zero the packet is discarded."], ["ACLs?", "A list of permit and deny rules on a router or firewall. Anything not permitted is denied at the end."], ["DMZ|screened subnet", "A buffer network for public-facing servers, separated from both the internet and the internal LAN."], ["port security", "A switch setting that limits which devices (MAC addresses) can use a port."], ["NAC", "Network access control: checking a device's identity and health before letting it on the network."], ["DHCP snooping", "A switch feature that blocks fake DHCP servers on user ports."], ["BPDU guard", "A switch feature that shuts a user port if someone plugs in another switch."], ["ARP", "The protocol that finds the MAC address belonging to an IP address on the local network."], ["ARP poisoning|ARP spoofing", "Sending fake ARP replies so traffic goes to the attacker instead of the real device."], ["MAC flooding", "Overloading a switch's MAC table so it starts sending traffic out every port."], ["VLAN hopping", "An attack that tricks a switch into delivering traffic to a VLAN the attacker isn't on."], ["evil twin", "A fake Wi-Fi access point using the same name as the real one to steal logins."], ["rogue", "An unauthorized device (like an access point or DHCP server) added to the network."], ["on-path", "An attacker secretly sitting between two parties, reading or changing their traffic (formerly man-in-the-middle)."], ["DDoS|DoS", "Flooding a service with traffic so real users can't reach it. Distributed means from many sources."], ["honeypot", "A fake system set up to lure attackers and study them."], ["PKI", "The system of certificate authorities and certificates that lets computers trust each other's encryption keys."], ["self-signed", "A certificate that wasn't issued by a trusted authority, so browsers warn about it."], ["SSO", "Logging in once to get into many applications."], ["SAML", "A standard for passing login proof from an identity provider to a web app for single sign-on."], ["MFA|TOTP", "Multi-factor authentication: proving who you are with two or more types of proof, like a password plus a phone code."], ["RBAC", "Giving permissions based on job role instead of person by person."], ["least privilege", "Giving people only the access they need, nothing more."], ["geofencing", "Allowing or blocking access based on where a device physically is."], ["PCI DSS", "The security rules any business that handles credit cards must follow."], ["GDPR", "The EU's privacy law covering personal data about people in the EU."], ["SCADA|ICS|OT", "Computers that control physical industrial equipment like pumps, power and factory lines."], ["IoT", "Internet-connected gadgets like cameras, thermostats and sensors."], ["BYOD", "Employees using their own personal devices on the company network."], ["jitter", "Variation in how long packets take to arrive. It makes calls choppy."], ["latency", "The delay before data arrives."], ["throughput", "How much data actually gets through per second, as opposed to the link's rated speed."], ["packet loss", "Packets that never arrive."], ["tracert|traceroute", "A command that lists every router hop on the way to a destination."], ["nslookup|dig", "Commands that ask a DNS server to look up a name."], ["netstat", "A command that lists a computer's open network connections and listening ports."], ["tcpdump", "A command-line tool that captures network packets."], ["[Nn]map", "A tool that scans a network to find devices and the ports they have open."], ["LLDP|CDP", "Protocols devices use to announce themselves to directly connected neighbors (CDP is Cisco-only)."], ["Wireshark|protocol analyzer", "A tool that captures and decodes network traffic so you can see exactly what was sent."], ["toner|tone generator", "A tool that sends a tone down a cable so you can find the other end with a probe."], ["visual fault locator|VFL", "A bright red laser shone into fiber to find breaks or sharp bends."], ["err-disabled", "A switch port the switch shut off on its own, usually because a security rule was broken."], ["administratively down", "A switch port someone turned off on purpose with the shutdown command."], ["divide and conquer", "Starting troubleshooting in the middle (like a ping) and working toward the problem."], ["routers?", "A device that connects different networks and forwards traffic between them."], ["switch(es)?", "A device that connects devices on the same network and forwards frames by MAC address."], ["DHCP", "The service that automatically hands out IP addresses and settings to devices."], ["DNS", "The service that turns names like google.com into IP addresses."], ["MAC address|MAC", "The permanent hardware address burned into a network card."], ["firewall", "A device or program that allows or blocks traffic based on rules."], ["access point|AP", "The device that creates a Wi-Fi network and connects wireless devices to the wired network."], ["broadcast domain", "The group of devices that all receive each other's broadcasts. Routers and VLANs split them up."], ["IPv6", "The newer IP version with 128-bit addresses, written in hex like 2001:db8::1."], ["ICMP", "The protocol ping and traceroute use to test connectivity and report errors."], ["VPN", "An encrypted tunnel across the internet into a private network."], ["Wi-Fi analyzer", "A tool that shows nearby Wi-Fi networks, their channels and signal strength."]]</script>
<script id="bank-s1" type="application/json">[{"d": 1, "q": "A company installs bollards in front of its data center entrance to stop vehicles from ramming the doors. Which of the following control types BEST describes the bollards?", "o": ["Physical", "Managerial", "Technical", "Directive"], "a": 0, "e": "Bollards are physical barriers, so they're a physical control. Why not the others: Managerial controls are policies and risk decisions. Technical controls are enforced by systems (firewalls, encryption). Directive controls tell people what to do, like a sign or policy."}, {"d": 1, "q": "A security team posts signs stating that the building is monitored by video surveillance 24/7. The cameras are not actually recording. Which of the following control types is the sign?", "o": ["Deterrent", "Detective", "Corrective", "Compensating"], "a": 0, "e": "A deterrent discourages an attacker from trying. A warning sign works whether or not the cameras record. Why not the others: Detective controls identify an event as or after it happens, which non-recording cameras can't do. Corrective controls fix things after an incident. Compensating controls stand in for a primary control that can't be used."}, {"d": 1, "q": "A legacy manufacturing system cannot be patched because the vendor no longer supports it. The security team places it on an isolated VLAN with strict ACLs. Which of the following BEST describes this control?", "o": ["Compensating", "Preventive", "Directive", "Deterrent"], "a": 0, "e": "When the normal control (patching) can't be applied, an alternative that reduces the same risk is a compensating control. Why not the others: Isolation is preventive in effect, but the question is about replacing a control that can't be used. Directive controls are instructions. Deterrent controls discourage attempts."}, {"d": 1, "q": "After a ransomware infection, an administrator restores servers from last night's backups. Which of the following control types does the restore represent?", "o": ["Corrective", "Detective", "Preventive", "Deterrent"], "a": 0, "e": "Corrective controls bring systems back to a good state after an incident. Restoring from backup is the classic example. Why not the others: Detective controls find an incident. Preventive controls stop it from happening. Deterrent controls discourage the attacker."}, {"d": 1, "q": "Which of the following is an example of a detective control?", "o": ["Reviewing security logs for failed logins", "Installing a keyed door lock on the server room", "Writing an acceptable use policy for staff", "Restoring a database from last night's backup"], "a": 0, "e": "Log review finds events that already happened, so it's detective. Why not the others: A lock is preventive. An AUP is directive (managerial). A restore is corrective."}, {"d": 1, "q": "A company requires all new hires to sign an acceptable use policy before receiving network access. Which of the following control categories does this represent?", "o": ["Managerial", "Technical", "Physical", "Operational"], "a": 0, "e": "Policies and the requirement to agree to them are managerial controls. They're about oversight and governance. Why not the others: Technical controls are enforced by technology. Physical controls are things like locks and fences. Operational controls are carried out by people day to day, such as guards or awareness training."}, {"d": 1, "q": "A security guard checks badges at the lobby entrance. Which of the following control categories BEST describes the guard?", "o": ["Operational", "Managerial", "Technical", "Corrective"], "a": 0, "e": "Controls carried out by people as part of daily operations, like guards checking badges, are operational. Why not the others: Managerial controls are policies and risk assessments. Technical controls are carried out by systems. Corrective is a control type, not a category, and describes recovery."}, {"d": 1, "q": "An attacker alters the amount on a wire transfer while it is in transit. Which part of the CIA triad was violated?", "o": ["Integrity", "Confidentiality", "Availability", "Non-repudiation"], "a": 0, "e": "Unauthorized changes to data violate integrity. Why not the others: Confidentiality is about unauthorized disclosure. Availability is about access when needed. Non-repudiation is related but isn't part of the CIA triad."}, {"d": 1, "q": "Which of the following provides non-repudiation for an email message?", "o": ["Digital signature", "Symmetric encryption", "Hashing alone", "TLS between mail servers"], "a": 0, "e": "A digital signature is created with the sender's private key, which only the sender holds, so the sender can't credibly deny sending it. Why not the others: Symmetric keys are shared, so either party could have made the message. A hash alone proves integrity but not who created it. TLS protects the connection in transit, not the message's origin."}, {"d": 1, "q": "A user logs in with a username and password, accesses a file share they are allowed to use, and the server records how long they were connected. Which of the following describes the final step?", "o": ["Accounting", "Authentication", "Authorization", "Identification"], "a": 0, "e": "Accounting (the third A in AAA) tracks what users do and for how long. Why not the others: Authentication proves who you are (the password). Authorization decides what you can access (the share permissions). Identification is claiming an identity (the username)."}, {"d": 1, "q": "A company is adopting a zero trust architecture. Which of the following components makes the decision to grant or deny access to a resource?", "o": ["Policy engine", "Policy enforcement point", "Implicit trust zone", "Subject"], "a": 0, "e": "In zero trust, the policy engine (part of the control plane) evaluates the request and makes the grant/deny decision. Why not the others: The policy enforcement point carries out the decision on the data plane but doesn't make it. Zero trust removes implicit trust zones. The subject is the user or device asking for access."}, {"d": 1, "q": "In a zero trust model, which of the following BEST describes adaptive identity?", "o": ["Access decisions adjust to context like location and device health", "Users authenticate once and stay trusted for the session", "Devices on the internal network are automatically trusted", "Passwords are replaced by one shared hardware token"], "a": 0, "e": "Adaptive identity weighs real-time context like location, device posture and behavior to decide how much to trust a request. Why not the others: Trusting a whole session after one login, or trusting anything on the internal network, is the implicit trust zero trust removes. A hardware token is one authentication factor, not adaptive identity."}, {"d": 1, "q": "A security team deploys a fake server with intentionally weak credentials to attract attackers and study their techniques. Which of the following was deployed?", "o": ["Honeypot", "Honeytoken", "Honeynet", "Jump server"], "a": 0, "e": "A honeypot is a single decoy system meant to attract and observe attackers. Why not the others: A honeytoken is fake data, like a bogus credential or record. A honeynet is a network of several honeypots. A jump server is a hardened host used to administer other systems."}, {"d": 1, "q": "A company inserts a fake customer record into its CRM database. If the record ever appears outside the company, the team will know data was exfiltrated. Which of the following is this?", "o": ["Honeytoken", "Honeypot", "Honeyfile", "DNS sinkhole"], "a": 0, "e": "A honeytoken is fake data planted to detect misuse or theft. A record that should never leave the company fits. Why not the others: A honeypot is a decoy system. A honeyfile is a decoy file, like passwords.xlsx on a share. A DNS sinkhole redirects malicious domain lookups."}, {"d": 1, "q": "Before applying a firewall change to production, an administrator must document a backout plan. What is the PRIMARY purpose of the backout plan?", "o": ["To return systems to the prior state if the change fails", "To get approval from the change advisory board", "To identify the change owner", "To schedule the maintenance window"], "a": 0, "e": "A backout plan describes how to reverse a change if it fails or causes problems. Why not the others: CAB approval, ownership and scheduling are separate parts of change management, not what the backout plan is for."}, {"d": 1, "q": "Which of the following change management elements identifies the systems and business processes that could be affected by a proposed change?", "o": ["Impact analysis", "Backout plan", "Maintenance window", "Standard operating procedure"], "a": 0, "e": "Impact analysis works out what the change will affect and the risk of doing it. Why not the others: A backout plan reverses a change. A maintenance window is when the change happens. An SOP is a routine set of steps."}, {"d": 1, "q": "An administrator updates a web server's configuration, and an older internal application that relies on a deprecated cipher stops working. Which of the following change management considerations was MOST likely overlooked?", "o": ["Dependencies", "Allow lists", "Downtime", "Version control"], "a": 0, "e": "The application depended on the old cipher. Identifying dependencies before a change prevents breaks like this. Why not the others: Allow lists control what may run. Downtime is about scheduling an outage. Version control tracks changes to files and code."}, {"d": 1, "q": "A security analyst compares the organization's current controls against the requirements of a framework to see where it falls short. Which of the following is the analyst performing?", "o": ["Gap analysis", "Risk transfer", "Penetration test", "Business impact analysis"], "a": 0, "e": "A gap analysis compares where you are to where a standard or framework says you should be. Why not the others: Risk transfer shifts risk to someone else, like an insurer. A pen test simulates attacks. A BIA measures how outages affect business functions."}, {"d": 1, "q": "Which of the following is used to add extra randomness to a password before it is hashed so that identical passwords produce different hashes?", "o": ["Salt", "Key stretching", "Nonce reuse", "Obfuscation"], "a": 0, "e": "A salt is a random value added to each password before hashing, so two users with the same password get different hashes. This defeats rainbow tables. Why not the others: Key stretching hashes many times to slow brute force. Reusing a nonce is a weakness. Obfuscation hides meaning but isn't a hashing step."}, {"d": 1, "q": "A developer wants to make brute-force attacks against stored password hashes significantly slower. Which of the following should the developer use?", "o": ["Key stretching such as PBKDF2 or bcrypt", "MD5 hashing", "Base64 encoding", "Symmetric encryption with a static key"], "a": 0, "e": "Key stretching algorithms (PBKDF2, bcrypt, scrypt, Argon2) run the hash thousands of times, making each guess expensive. Why not the others: MD5 is fast and broken, which helps attackers. Base64 is encoding, not security. Encrypting passwords with a static key lets anyone who steals the key reverse them all."}, {"d": 1, "q": "Which of the following encryption types uses the same key to encrypt and decrypt data?", "o": ["Symmetric", "Asymmetric", "Hashing", "Digital signature"], "a": 0, "e": "Symmetric algorithms such as AES use one shared key for both operations. Why not the others: Asymmetric uses a public/private key pair. Hashing is one-way with no key to decrypt. Digital signatures use asymmetric keys."}, {"d": 1, "q": "Two parties need to agree on a shared symmetric key over an untrusted network without ever sending the key itself. Which of the following should they use?", "o": ["Diffie-Hellman", "SHA-256 hashing", "AES-256", "RC4 stream cipher"], "a": 0, "e": "Diffie-Hellman is a key exchange algorithm that lets two parties derive the same secret over an open channel. Why not the others: SHA-256 is a hash. AES is the symmetric cipher you'd use after the key is agreed. RC4 is an old, insecure stream cipher."}, {"d": 1, "q": "Alice wants to send Bob a message that only Bob can read. Which key should Alice use to encrypt the message?", "o": ["Bob's public key", "Bob's private key", "Alice's private key", "Alice's public key"], "a": 0, "e": "Encrypting with the recipient's public key means only the recipient's private key can decrypt it. Why not the others: Alice never has Bob's private key. Encrypting with Alice's private key creates a signature anyone can verify, not secrecy. Alice's public key would let only Alice decrypt."}, {"d": 1, "q": "A user digitally signs a document. Which key is used to create the signature?", "o": ["The signer's private key", "The signer's public key", "The recipient's public key", "A shared symmetric key"], "a": 0, "e": "Signatures are created with the signer's private key and verified with the signer's public key. Why not the others: Public keys verify, they don't sign. The recipient's public key is for encryption. A shared symmetric key can't prove which party created the signature."}, {"d": 1, "q": "A web server's certificate is valid for www.example.com, mail.example.com, and vpn.example.net. Which of the following certificate types is being used?", "o": ["Subject Alternative Name (SAN)", "Wildcard (*.example.com)", "Self-signed certificate", "Root CA certificate"], "a": 0, "e": "A SAN certificate lists several specific names, even across different domains. Why not the others: A wildcard (*.example.com) covers subdomains of one domain only and couldn't include example.net. Self-signed describes who issued it, not how many names it covers. A root certificate belongs to a CA."}, {"d": 1, "q": "A company wants one certificate to cover shop.example.com, blog.example.com, and any future subdomains of example.com. Which of the following is the BEST choice?", "o": ["Wildcard certificate", "SAN certificate listing each name", "Code-signing certificate", "Self-signed certificate"], "a": 0, "e": "A wildcard certificate (*.example.com) covers any first-level subdomain, including future ones. Why not the others: A SAN certificate would have to be reissued to add new names. Code-signing certificates sign software, not websites. Self-signed certificates aren't trusted by browsers."}, {"d": 1, "q": "A browser needs to check in real time whether a server's certificate has been revoked without downloading a full list. Which of the following does it use?", "o": ["OCSP", "CRL", "CSR", "Key escrow"], "a": 0, "e": "Online Certificate Status Protocol answers a revocation query for a single certificate. Why not the others: A CRL is the full list of revoked certificates the client must download. A CSR is a request for a new certificate. Key escrow stores keys with a third party."}, {"d": 1, "q": "An administrator generates a key pair on a web server and sends a file containing the public key and the server's identifying information to a certificate authority. Which of the following was sent?", "o": ["Certificate signing request (CSR)", "Certificate revocation list (CRL)", "Private key", "OCSP response"], "a": 0, "e": "A CSR holds the public key and subject details the CA needs to issue a certificate. Why not the others: A CRL lists revoked certificates. The private key must never leave the server. An OCSP response comes from the CA, not to it."}, {"d": 1, "q": "Which of the following is at the top of a certificate chain of trust and signs intermediate CA certificates?", "o": ["Root CA", "Registration authority", "Intermediate CA", "Leaf certificate"], "a": 0, "e": "The root CA is the trust anchor. Its self-signed certificate is preinstalled in trust stores, and it signs intermediate CAs. Why not the others: A registration authority verifies identities but doesn't sign. Intermediate CAs sign end-entity (leaf) certificates. The leaf is the server or user certificate at the bottom."}, {"d": 1, "q": "A company must be able to recover encrypted data if an employee leaves and their private key is unavailable. Which of the following should the company implement?", "o": ["Key escrow", "Certificate pinning", "OCSP stapling", "Perfect forward secrecy"], "a": 0, "e": "Key escrow keeps a copy of keys with a trusted party so data can be recovered. Why not the others: Pinning ties an app to a specific certificate. OCSP stapling speeds up revocation checks. Perfect forward secrecy uses temporary session keys and makes recovery harder, not easier."}, {"d": 1, "q": "A laptop must store its full-disk encryption keys in hardware so they are released only if the boot process has not been tampered with. Which of the following provides this?", "o": ["Trusted Platform Module (TPM)", "Hardware security module (HSM)", "Key management system in the cloud", "Secure enclave on a smart card"], "a": 0, "e": "A TPM is a chip on the motherboard that stores keys and releases them only when boot measurements match (used by BitLocker). Why not the others: An HSM is a dedicated, often rack-mounted, device for high-volume key operations on servers. A cloud KMS manages keys centrally but doesn't check this laptop's boot state. A smart card is a portable credential."}, {"d": 1, "q": "A bank needs a tamper-resistant appliance to generate and protect the private keys used by its certificate authority. Which of the following should it use?", "o": ["Hardware security module (HSM)", "Trusted Platform Module (TPM)", "Secure cookie", "Self-encrypting USB drive"], "a": 0, "e": "HSMs are dedicated, tamper-resistant devices built to generate and store high-value keys, like a CA's signing keys. Why not the others: A TPM protects one endpoint. Secure cookies are for web sessions. A USB drive isn't designed for high-assurance key operations."}, {"d": 1, "q": "A payment processor replaces credit card numbers in its database with random values and stores the mapping in a separate, secured vault
