Encryption using a key pair: the public key is shared, the private key is kept secret."], ["Diffie-Hellman", "A way for two parties to agree on a shared secret key over an open network."], ["digital(ly)? sign(ature|s|ed)?", "A hash encrypted with the sender's private key. It proves who sent something and that it wasn't changed."], ["SAN", "Subject Alternative Name: a certificate field listing several specific host names it's valid for."], ["wildcard", "A certificate like *.example.com that covers any subdomain of one domain."], ["OCSP", "Online Certificate Status Protocol: asks a CA in real time whether one certificate was revoked."], ["CRL", "Certificate Revocation List: the CA's published list of revoked certificates."], ["CSR", "Certificate Signing Request: what you send a CA (your public key plus details) to get a certificate."], ["root CA", "The top certificate authority that everything else in the chain of trust traces back to."], ["key escrow", "Keeping a copy of encryption keys with a trusted third party so data can be recovered."], ["TPM", "Trusted Platform Module: a chip on the motherboard that stores keys and checks the boot process."], ["HSM", "Hardware Security Module: a tamper-resistant appliance for creating and guarding high-value keys."], ["tokeni[sz]ation", "Swapping sensitive data for a meaningless token. The real value is kept in a separate vault."], ["mask(ing)?", "Hiding part of a value on screen, like showing only the last 4 digits."], ["steganography", "Hiding data inside another file, such as an image or audio file."], ["pinning", "Making an app accept only one specific certificate or key for a server."], ["access control vestibule|mantrap", "A small room with two doors where only one can open at a time, to stop tailgating."], ["APT|advanced persistent threat", "A skilled, well-funded attacker (often a nation-state) who stays hidden in a network long-term."], ["hacktivist", "Someone who hacks to promote a political or social cause."], ["shadow IT", "Technology employees use without IT's approval."], ["smishing", "Phishing through SMS text messages."], ["vishing", "Phishing by phone call or voicemail."], ["whaling", "Phishing aimed at top executives."], ["business email compromise|BEC", "Pretending to be an executive or vendor by email to trick staff into sending money or data."], ["typosquat(ting|ted)?", "Registering misspelled lookalike domains or package names to catch typos."], ["watering hole", "Infecting a website the targets often visit, then waiting for them to show up."], ["pretext(ing)?", "Making up a believable story to trick someone into giving information or access."], ["buffer overflow", "Writing more data than a memory buffer holds, which can let an attacker run code."], ["TOCTOU|race condition|time-of-check", "A bug where something changes between when it's checked and when it's used."], ["directory traversal|\\.\\./", "Using ../ in a path to reach files outside the folder the app meant to allow."], ["SQL injection|SQLi", "Sneaking database commands into input fields so the app runs them."], ["parameterized quer(y|ies)|prepared statement", "Database queries that treat user input strictly as data, never as code. They stop SQL injection."], ["XSS|cross-site scripting", "Injecting script into a web page so it runs in other users' browsers."], ["CSRF|cross-site request forgery", "Tricking a logged-in user's browser into sending a request they didn't intend."], ["SSRF|server-side request forgery", "Tricking a server into making requests to internal systems for the attacker."], ["supply chain", "Attacking a target through a trusted vendor, product, or software component."], ["zero-day", "A flaw attackers exploit before the vendor knows about it or has a patch."], ["sideload(ing)?", "Installing apps from outside the official app store."], ["VM escape", "Breaking out of a virtual machine to reach the host or other VMs."], ["ransomware", "Malware that encrypts files and demands payment to unlock them."], ["worm", "Malware that spreads across networks by itself, without user action."], ["trojan", "Malware disguised as legitimate software."], ["logic bomb", "Malicious code that runs when a specific condition or date is met."], ["rootkit", "Malware that hides deep in the OS to conceal itself and other malware."], ["keylogger", "Malware or a device that records keystrokes."], ["fileless", "Malware that runs in memory using built-in tools, leaving no files on disk."], ["bloatware", "Unwanted software preinstalled on a new device."], ["impossible travel", "Logins from places too far apart to travel between in the time given."], ["password spraying", "Trying one common password against many accounts to avoid lockouts."], ["credential stuffing", "Reusing username/password pairs leaked from one site on other sites."], ["replay", "Capturing valid login data and sending it again later to get in."], ["downgrade", "Forcing a connection onto an older, weaker protocol or cipher."], ["birthday attack|collision", "Finding two different inputs that produce the same hash."], ["on-path|man-in-the-middle", "An attacker secretly sitting between two parties, reading or changing traffic."], ["amplif(ied|ication)|reflected", "Small spoofed requests that trigger large replies aimed at the victim, flooding it."], ["DNS poisoning", "Putting false records into a DNS resolver so names point to the attacker's IP."], ["ARP poisoning", "Faking ARP replies so traffic for one IP goes to the attacker's MAC address."], ["MAC flooding", "Overloading a switch's address table so it sends traffic out every port."], ["evil twin", "A fake Wi-Fi access point that copies a real network's name."], ["bluesnarfing", "Stealing data from a device over Bluetooth."], ["bluejacking", "Sending unsolicited messages to nearby devices over Bluetooth."], ["RFID cloning", "Copying a proximity badge's signal to make a duplicate."], ["privilege escalation", "Gaining more access rights than you were given."], ["pass-the-hash", "Logging in with a stolen password hash instead of the password itself."], ["allow list", "Only approved items may run or connect. Everything else is blocked."], ["segmentation", "Splitting a network into zones so a compromise in one can't easily spread."], ["harden(ing)?", "Removing unneeded services, accounts, and ports to shrink the attack surface."], ["SBOM|software bill of materials", "A list of every component and library inside a piece of software."], ["shared responsibility", "The split of security duties between a cloud provider and its customer."], ["IaaS", "Infrastructure as a Service: you rent VMs and manage the OS and everything above it."], ["SaaS", "Software as a Service: a finished app run by the provider. You manage users and data."], ["infrastructure as code|IaC", "Defining servers and networks in config files that are deployed automatically."], ["serverless", "Running code as functions without managing any servers yourself."], ["microservices", "An app built from many small, separate services that talk through APIs."], ["SDN|software-defined networking", "Networking where a central controller makes routing decisions, separate from the forwarding hardware."], ["air[- ]gap(ped)?", "Physically cut off from all other networks."], ["ICS|SCADA", "Systems that control industrial equipment like power grids, pipelines, and factories."], ["RTOS", "Real-time operating system: an OS that must respond within strict time limits."], ["IoT", "Internet of Things: network-connected devices like cameras, sensors, and thermostats."], ["fail-closed|fail-secure", "When a device fails, it blocks everything (security over availability)."], ["fail-open", "When a device fails, it lets everything through (availability over security)."], ["inline", "Placed directly in the traffic path, so it can block traffic."], ["SPAN|tap", "A copy of network traffic sent to a monitoring tool. It can watch but not block."], ["screened subnet|DMZ", "A buffer network between the internet and the internal LAN for public-facing servers."], ["jump server", "A locked-down server admins must go through to reach sensitive systems."], ["UTM", "Unified Threat Management: one box that combines firewall, IPS, antivirus, filtering, and VPN."], ["WAF", "Web Application Firewall: filters HTTP traffic to block web attacks like SQLi and XSS."], ["NGFW|next-generation firewall", "A firewall that recognizes applications, not just ports and IP addresses."], ["802\\.1X", "Port-based network access control: devices must authenticate before they get network access."], ["RADIUS", "A server that checks credentials for network access (Wi-Fi, VPN, 802.1X)."], ["IPSec", "A suite that encrypts and authenticates IP packets, often used for VPNs."], ["tunnel mode", "An IPSec mode that encrypts the whole original packet. Used for site-to-site VPNs."], ["SD-WAN", "Managing multiple WAN and internet links from one controller."], ["SASE", "Secure Access Service Edge: cloud-delivered networking plus security for users anywhere."], ["active/active", "All redundant nodes handle traffic at the same time."], ["data sovereignty", "Data is subject to the laws of the country where it's stored."], ["PII", "Personally Identifiable Information: data that can identify a person."], ["PHI", "Protected Health Information: health data tied to a person."], ["hot site", "A fully equipped backup site that can take over almost immediately."], ["warm site", "A backup site with some equipment. It needs hours to days to be ready."], ["cold site", "A backup site with only space and power. It takes days to weeks to set up."], ["UPS", "Uninterruptible Power Supply: battery backup that covers short outages."], ["tabletop", "A discussion-only exercise where a team talks through how they'd handle a scenario."], ["parallel processing", "Running backup systems alongside production to confirm they produce the same results."], ["incremental", "A backup of what changed since the last backup of any kind."], [" function el(tag, attrs, ...kids){

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  clearInterval(tick); S = null; window.scrollTo(0,0);
  const name = el("input",{type:"text",id:"player-name",maxlength:"24",placeholder:"e.g. J. Rivera",autocomplete:"nickname",value:store.get("aplus-name")||""});
  const err = el("p",{class:"muted",id:"name-err",style:"font-size:.88rem"},"Shown on the scoreboard. 24 characters max.");
  const start = (k, mode)=>{
    const n = cleanName(name.value);
    if (!n){ err.textContent = "Enter a name before starting."; err.style.color="var(--bad)"; name.focus(); return; }
    store.set("aplus-name", n); begin(k, n, mode||"exam");
  };
  const cards = Object.keys(EXAMS).map(k=>{
    const ex = EXAMS[k], done = answered(k), ready = done >= DRILL_MIN_ANSWERED;
    const hasData = done > 0;
    const rows = ex.domains.map(d=>{
      const acc = domAcc(k, d.id);
      const showAcc = hasData;
      const pct = showAcc ? (acc==null ? "–" : Math.round(acc*100)+"%") : d.w+"%";
      const width = showAcc ? (acc==null ? 0 : acc*100) : d.w/28*100;
      const col = !showAcc || acc==null ? "var(--steel)" : acc>=.8 ? "var(--good)" : acc>=.6 ? "var(--accent)" : "var(--bad)";
      return el("li",null, el("span",{text:d.name}), el("span",{class:"pct",text:pct}), el("span",{class:"bar"}, el("i",{style:"width:"+width+"%;background:"+col})));
    });
    const weakest = weakList(k).find(w=>w.acc!=null);
    return el("div",{class:"card"},
      el("div",null, el("div",{class:"code",text:"CompTIA "+(ex.cert||"A+")+" "+ex.code}), el("h2",{text:ex.name})),
      el("div",{class:"spec"}, el("span",null, el("b",{text:String(ex.nq||N_Q)}),"questions"), el("span",null, el("b",{text:(ex.min||MINUTES)+" min"}),"time limit"), el("span",null, el("b",{text:BANK[k].length}),"in pool")),
      el("div",{class:"eyebrow",text: hasData ? "Your accuracy · "+done+" answered" : "Exam weighting"}),
      el("ul",{class:"domains"}, ...rows),
      el("button",{class:"primary",id:"start-"+k,onclick:()=>start(k)},"Start "+ex.name+" exam"),
      el("button",{id:"drill-"+k,disabled:!ready,onclick:()=>start(k,"drill")},"Weak-spot drill · "+N_DRILL+" Q"),
      el("p",{class:"muted",style:"font-size:.82rem",text: ready
        ? (weakest ? "Drill focuses on your weakest areas, starting with "+weakest.d.name+" ("+Math.round(weakest.acc*100)+"%), and repeats questions you missed. Untimed, and not posted to the scoreboard." : "")
        : "Answer at least "+DRILL_MIN_ANSWERED+" "+ex.name+" questions to unlock the drill. It targets your weakest domains and repeats questions you missed."}));
  });
  const boardBox = el("section",{class:"board",id:"scoreboard"});
  app.replaceChildren(
    el("header",{class:"hero"},
      el("span",{class:"codes",text:"220-1201 · 220-1202 · N10-009 · SY0-701"}),
      el("h1",{text:"CompTIA Practice Exams"}),
      el("p",{class:"muted"},"Every attempt draws "+N_Q+" random questions, weighted like the real exam's domains. You'll see whether you're right after each answer. You have "+MINUTES+" minutes, and anything unanswered when time runs out counts as wrong.")),
    el("div",{class:"stack"},
      el("label",{for:"player-name",class:"eyebrow",text:"Your name"}), name, err,
      el("div",{class:"cards",style:"margin-top:8px"}, ...cards),
      boardBox),
    el("p",{class:"foot",text:"Original practice questions written against CompTIA's published 220-1201, 220-1202, N10-009 and SY0-701 exam objectives. Not affiliated with CompTIA. Real exams also include performance-based questions and use scaled scoring (675/900 for Core 1, 700/900 for Core 2, 720/900 for Network+, 750/900 for Security+)."})
  );
  name.addEventListener("keydown",e=>{ if(e.key==="Enter") start("c1"); });
  renderBoard(boardBox);
}

/* ---------- exam ---------- */
function begin(exam, name, mode){
  mode = mode || "exam";
  clearInterval(tick);
  const qs = mode==="drill" ? buildDrill(exam) : buildExam(exam);
  S = { exam, name, mode, qs, i:0, sel:[], checked:false, results:[], start:Date.now(), end:Date.now()+(EXAMS[exam].min||MINUTES)*60000, confirmEnd:false };
  board.tab = exam;
  tick = setInterval(()=>{
    const t = document.getElementById("timer");
    if (S.mode==="drill"){ if (t) t.textContent = fmt((Date.now()-S.start)/1000); return; }
    const left = (S.end-Date.now())/1000;
    if (t){ t.textContent = fmt(left); t.classList.toggle("warn", left<=300); }
    if (left <= 0) finish(true);
  }, 250);
  drawQ();
}
function drawQ(){
  const q = S.qs[S.i], ex = EXAMS[S.exam];
  const right = S.results.filter(r=>r.ok).length, wrong = S.results.length - right;
  const dom = ex.domains.find(d=>d.id===q.d);
  const drill = S.mode==="drill";
  const left = drill ? (Date.now()-S.start)/1000 : (S.end-Date.now())/1000;
  const need = q.multi ? q.a.length : 1;

  const opts = q.o.map((t,idx)=>{
    const isSel = S.sel.includes(idx);
    let cls = "opt" + (isSel ? " sel" : "");
    if (S.checked){
      cls = "opt locked";
      if (q.a.includes(idx)) cls += " right";
      else if (isSel) cls += " wrong";
    }
    const input = el("input",{type:q.multi?"checkbox":"radio",name:"opt",id:"opt-"+idx,checked:isSel,disabled:S.checked});
    input.addEventListener("change",()=>{
      if (S.checked) return;
      if (q.multi){
        if (S.sel.includes(idx)) S.sel = S.sel.filter(x=>x!==idx);
        else if (S.sel.length < need) S.sel = [...S.sel, idx];
      } else S.sel = [idx];
      drawQ();
    });
    return el("label",{class:cls,for:"opt-"+idx}, input, el("span",{class:"letter",text:"ABCDEFGH"[idx]+"."}), el("span",{class:"t",text:t}));
  });

  let feedback = null, actions;
  if (S.checked){
    const r = S.results[S.results.length-1];
    feedback = el("div",{class:"verdict "+(r.ok?"ok":"no"),role:"status"},
      el("h3",{text:r.ok?"Correct":"Incorrect"}),
      r.ok ? null : el("p",null, el("strong",{text:"Answer: "}), q.a.map(i=>"ABCDEFGH"[i]+". "+q.o[i]).join("  ·  ")),
      el("p",{text:q.e}));
    if (GLOSS[S.exam]) feedback = el("div",{class:"stack",style:"gap:12px"}, feedback, termsBox(q));
    const last = S.i === S.qs.length-1;
    actions = el("div",{class:"row"}, el("button",{class:"primary",id:"next-btn",onclick:()=>{ if(last) finish(false); else { S.i++; S.sel=[]; S.checked=false; drawQ(); window.scrollTo(0,0);} }}, last?"See results":"Next question"));
  } else {
    actions = el("div",{class:"row"},
      el("button",{class:"primary",id:"check-btn",disabled:S.sel.length!==need,onclick:check}, "Check answer"),
      q.multi ? el("span",{class:"muted",style:"font-size:.88rem",text:"Select "+need+" ("+S.sel.length+"/"+need+")"}) : null);
  }

  const endBox = S.confirmEnd ? el("div",{class:"confirm"},
      el("p",null,(drill?"End this drill now? The ":"End this exam now? The ")+(S.qs.length-S.results.length)+" unanswered questions will count as wrong."),
      el("div",{class:"row"}, el("button",{class:"primary",id:"end-yes",onclick:()=>finish(false)},"End and score it"), el("button",{id:"end-no",onclick:()=>{S.confirmEnd=false;drawQ();}},"Keep going")))
    : el("button",{class:"link",id:"end-btn",onclick:()=>{S.confirmEnd=true;drawQ();}},drill?"End drill early":"End exam early");

  app.replaceChildren(
    el("div",{class:"bar-top"},
      el("div",{class:"inner"},
        el("div",null, el("div",{class:"eyebrow",text:(drill?"Weak-spot drill · ":"")+ex.name+" · "+ex.code}), el("div",{class:"tally"}, "Q "+(S.i+1)+" / "+S.qs.length+"   ", el("b",{text:"✓ "+right}), "  ", el("s",{text:"✗ "+wrong}))),
        el("div",{class:"timer"+(!drill&&left<=300?" warn":""),id:"timer","aria-label":drill?"Time elapsed":"Time remaining",text:fmt(left)})),
      el("div",{class:"progress"}, el("i",{style:"width:"+((S.results.length)/S.qs.length*100)+"%"}))),
    el("div",{class:"stack"},
      el("div",{class:"eyebrow",text:dom.name}),
      el("p",{class:"qtext",text:q.q}),
      el("div",{class:"opts",role:q.multi?"group":"radiogroup"}, ...opts),
      feedback, actions, endBox)
  );
}
function check(){
  const q = S.qs[S.i];
  const ok = S.sel.length===q.a.length && [...S.sel].sort().every((v,i)=>v===q.a[i]);
  S.results.push({ok, sel:[...S.sel]});
  record(S.exam, q, ok);
  S.checked = true; drawQ();
}

/* ---------- results ---------- */
async function finish(timedOut){
  if (!S || S.done) return;
  S.done = true; clearInterval(tick);
  const ex = EXAMS[S.exam];
  const drill = S.mode==="drill";
  const secs = drill ? Math.round((Date.now()-S.start)/1000) : Math.min((ex.min||MINUTES)*60, Math.round((Date.now()-S.start)/1000));
  const correct = S.results.filter(r=>r.ok).length;
  const pct = Math.round(correct/S.qs.length*100);
  const pass = pct >= TARGET;

  const perDom = ex.domains.map(d=>{
    const idxs = S.qs.map((q,i)=>q.d===d.id?i:-1).filter(i=>i>=0);
    const got = idxs.filter(i=>S.results[i]&&S.results[i].ok).length;
    return {d, got, n:idxs.length};
  });
  const missed = S.qs.map((q,i)=>({q, r:S.results[i]})).filter(x=>!x.r || !x.r.ok);

  const postBox = el("p",{class:"post",id:"post-status",text:"Posting your score…"});
  window.scrollTo(0,0);
  app.replaceChildren(
    el("header",{class:"hero"},
      el("span",{class:"codes",text:ex.name+" · "+ex.code}),
      el("h1",{text: drill ? "Drill complete" : timedOut ? "Time's up" : "Exam complete"}),
      el("p",{class:"muted",text:S.name})),
    el("div",{class:"stack"},
      el("div",{class:"scorebig"}, el("span",{class:"n",text:pct+"%"}), el("span",{class:"pill "+(pass?"pass":"fail"),text: pass ? "On track" : "Keep drilling"})),
      el("p",{class:"muted",text:"Aim for "+TARGET+"% or higher on practice tests before booking the real exam. CompTIA uses scaled scores, so this percentage won't map exactly to the "+(ex.pass||"675/900 or 700/900")+" passing score."}),
      el("div",{class:"stats"},
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Correct"}), el("b",{text:correct+" / "+S.qs.length})),
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Answered"}), el("b",{text:S.results.length+" / "+S.qs.length})),
        el("div",{class:"stat"}, el("span",{class:"eyebrow",text:"Time used"}), el("b",{text:fmt(secs)}))),
      postBox,
      el("div",{class:"dom-res"}, el("h3",{text:"By domain"}),
        ...perDom.map(p=>{
          const r = p.n ? p.got/p.n : 0;
          const col = r>=.8 ? "var(--good)" : r>=.6 ? "var(--accent)" : "var(--bad)";
          return el("div",{class:"r"}, el("span",{text:p.d.name}), el("span",{class:"v",text:p.got+"/"+p.n}), el("span",{class:"bar"}, el("i",{style:"width:"+(r*100)+"%;background:"+col})));
        })),
      el("div",{class:"row"},
        el("button",{class:"primary",id:"retake",onclick:()=>begin(S.exam,S.name,S.mode)},drill?"Another drill":"New "+ex.name+" exam"),
        drill ? el("button",{id:"to-exam",onclick:()=>begin(S.exam,S.name,"exam")},"Full "+ex.name+" exam") : el("button",{id:"to-drill",disabled:answered(S.exam)<DRILL_MIN_ANSWERED,onclick:()=>begin(S.exam,S.name,"drill")},"Drill my weak spots"),
        el("button",{id:"home",onclick:home},"Back to scoreboard")),
      missed.length ? el("h2",{text:"Review missed ("+missed.length+")",style:"margin-top:16px"}) : el("h2",{text:"Perfect score. Nothing to review.",style:"margin-top:16px"}),
      el("div",{class:"review"}, ...missed.map(({q,r})=>el("div",{class:"rv"},
        el("span",{class:"eyebrow",text:ex.domains.find(d=>d.id===q.d).name}),
        el("strong",{text:q.q}),
        el("span",{class:"yours",text: r ? "Your answer: "+r.sel.map(i=>q.o[i]).join(" · ") : "Not answered"}),
        el("span",{class:"ans",text:"Correct: "+q.a.map(i=>q.o[i]).join(" · ")}),
        el("span",{class:"muted",text:q.e}),
        termsBox(q))))
    )
  );

  if (drill){ const pb0=document.getElementById("post-status"); if (pb0) pb0.textContent = "Drill results count toward your accuracy on the home screen. They aren't posted to the scoreboard."; return; }
  const res = await postScore(S.exam, {name:S.name, pct, correct, secs});
  const msg = res.ok ? (res.better ? "New personal best posted to the scoreboard." : "Score saved. Your best score on the scoreboard is still higher.")
    : res.why==="nowrite" ? "Not posted: your access to this page is view-only. Ask the person who shared it to invite you as an Editor."
    : res.why==="noid" || res.why==="nodb" ? "Not posted: the scoreboard isn't connected right now."
    : "Couldn't reach the scoreboard right now. Your score is shown above.";
  const pb = document.getElementById("post-status"); if (pb) pb.textContent = msg;
}

home();
initBoard();
})();
</script>
