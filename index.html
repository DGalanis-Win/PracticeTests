,"FTP","HTTP"],"a":0,"e":"A VPN creates an encrypted tunnel over the public internet."},{"d":2,"q":"Which internet connection type uses existing telephone lines and offers speeds that drop as distance from the provider's office increases?","o":["DSL","Fiber","Cable","Satellite"],"a":0,"e":"DSL runs over copper phone lines, and its performance falls off with distance from the central office."},{"d":2,"q":"A rural business receives internet via a directional antenna pointed at a provider's tower several miles away. What type of service is this?","o":["Wireless ISP (WISP)","DSL","Fiber to the home","Cable"],"a":0,"e":"A WISP uses fixed wireless links from towers to the customer's antenna."},{"d":2,"q":"Which network type connects offices in different cities over long distances?","o":["WAN","LAN","PAN","WLAN"],"a":0,"e":"A wide area network connects geographically separate sites."},{"d":2,"q":"Which network type spans a city, such as a municipality connecting its buildings?","o":["MAN","PAN","LAN","SAN"],"a":0,"e":"A metropolitan area network covers a city or campus-sized area."},{"d":4,"q":"A help desk wants to test a new Windows update on a copy of a production workstation without risk. Which virtualization use case is this?","o":["Test/development environment","VDI for remote users","Legacy software support","Cloud file sync"],"a":0,"e":"VMs give you safe, disposable test environments for updates and software."},{"d":4,"q":"A VM should be able to talk to the host and other VMs on the same host, but NOT to the physical network. Which network mode should be selected?","o":["Internal/host-only","Bridged","NAT","Public"],"a":0,"e":"Host-only or internal networking isolates VMs from the physical LAN. It's useful for labs and malware analysis."},{"d":4,"q":"A VM needs internet access through the host's connection but should not be directly reachable from the LAN. Which network mode is BEST?","o":["NAT","Bridged","Host-only","Internal"],"a":0,"e":"NAT mode shares the host's IP for outbound access and keeps the VM hidden from the LAN."},{"d":4,"q":"Which is a security risk specific to virtualization where malware breaks out of a VM to attack the hypervisor or host?","o":["VM escape","VM sprawl","Snapshot drift","Rapid elasticity"],"a":0,"e":"In a VM escape, code running in a guest gains access to the host. Keep hypervisors patched."},{"d":4,"q":"An organization has hundreds of forgotten, unpatched VMs running that no one manages. What is this problem called?","o":["VM sprawl","VM escape","Multitenancy","Hybrid cloud"],"a":0,"e":"VM sprawl is an uncontrolled buildup of VMs that wastes resources and creates security risks."},{"d":4,"q":"Which cloud deployment model is operated solely for one organization, either on-premises or by a third party?","o":["Private cloud","Public cloud","Community cloud","Hybrid cloud"],"a":0,"e":"A private cloud's resources are dedicated to a single organization."},{"d":4,"q":"A provider guarantees 99.99% uptime by running services across multiple data centers with automatic failover. Which cloud characteristic is this?","o":["High availability","Metered utilization","File synchronization","Community cloud"],"a":0,"e":"High availability uses redundancy and failover to minimize downtime."},{"d":4,"q":"Which statement BEST describes the shared responsibility model in IaaS?","o":["The provider secures the physical infrastructure; the customer secures the OS, apps, and data","The provider secures everything including customer data","The customer secures the physical data center","Neither party is responsible for patching"],"a":0,"e":"In IaaS, the customer manages everything from the OS up. In SaaS, the provider handles most of it, but the customer still owns access control and data."},{"d":4,"q":"Which hypervisor is an example of a Type 1 (bare-metal) hypervisor?","o":["VMware ESXi","Oracle VirtualBox","VMware Workstation","Parallels Desktop"],"a":0,"e":"ESXi, Hyper-V, Proxmox, and Xen run directly on the hardware. VirtualBox, Workstation, and Parallels are Type 2."},{"d":4,"q":"A user's desktop is delivered from the cloud as a subscription service, managed entirely by a provider. What is this called?","o":["Desktop as a Service (DaaS)","IaaS","On-premises VDI","Type 2 hypervisor"],"a":0,"e":"DaaS is VDI hosted and managed by a cloud provider, such as Windows 365 or Amazon WorkSpaces."},{"d":4,"q":"Which resource is MOST important to increase on a host to run more simultaneous VMs smoothly?","o":["RAM","Optical drive speed","Monitor size","Keyboard type"],"a":0,"e":"Each VM reserves memory, so RAM is usually the first limit. CPU cores and fast storage also matter."},{"d":4,"q":"An application team packages its app in a container image so it runs the same on a laptop and in the cloud. Which benefit does this provide?","o":["Portability and consistency across environments","Full hardware isolation like a VM","Elimination of all security risks","Requirement for a Type 1 hypervisor"],"a":0,"e":"Containers bundle the app with its dependencies so it behaves the same everywhere. They share the host kernel, so their isolation is weaker than a VM's."},{"d":4,"q":"A company wants to avoid buying servers for a short-term project that will last three months. Which cloud benefit addresses this?","o":["Pay-as-you-go with rapid provisioning","Private on-premises cloud","Hardware ownership","Type 2 virtualization"],"a":0,"e":"In the cloud you can provision resources quickly, pay only for what you use, and shut them down when the project ends."},{"d":4,"q":"Which storage service type in the cloud stores unstructured data such as images and backups accessed via HTTP APIs?","o":["Object storage","Block storage on a SAN","Local RAID 1","Optical media"],"a":0,"e":"Object storage (such as Amazon S3 or Azure Blob) stores files as objects that you access through APIs."},{"d":4,"q":"A guest VM shows very poor disk and network performance. The technician notices the hypervisor's integration tools are not installed. What should be done?","o":["Install the hypervisor guest additions/integration services","Add a second virtual monitor","Disable the virtual NIC","Convert the VM to a container"],"a":0,"e":"Guest tools (VMware Tools, VirtualBox Guest Additions, Hyper-V Integration Services) provide optimized drivers and better integration with the host."},{"d":4,"q":"Which is a requirement for running a 64-bit guest OS in a hypervisor on a desktop?","o":["CPU virtualization support enabled in firmware","A dedicated GPU","A second physical NIC","An optical drive"],"a":0,"e":"VT-x/AMD-V must be enabled. Most hypervisors need it for 64-bit guests."},{"d":4,"q":"Which describes a key difference between a snapshot and a backup of a VM?","o":["A snapshot depends on the original VM disk and is not a full independent copy","A snapshot is stored offsite automatically","Backups cannot be restored","Snapshots replace the need for backups"],"a":0,"e":"Snapshots are differencing files tied to the original disk. If that disk is lost, the snapshot is useless, so you still need real backups."},{"d":3,"q":"What is the maximum data rate of USB 2.0?","o":["480 Mbps","12 Mbps","5 Gbps","10 Gbps"],"a":0,"e":"USB 2.0 (Hi-Speed) runs at 480 Mbps. USB 1.1 Full Speed is 12 Mbps, and USB 3.x starts at 5 Gbps."},{"d":3,"q":"Which statement about USB-C is TRUE?","o":["USB-C is a connector shape; supported speed and features depend on the underlying standard","USB-C always supports Thunderbolt","USB-C is limited to 480 Mbps","USB-C cannot deliver power"],"a":0,"e":"USB-C is a reversible connector. It can carry USB 2.0 through USB4 or Thunderbolt, plus video and Power Delivery, depending on the device and cable."},{"d":3,"q":"An older monitor only has a 15-pin connector with three rows of pins. Which interface is this?","o":["VGA","DVI-D","HDMI","DisplayPort"],"a":0,"e":"VGA uses a DE-15 connector with three rows of pins and carries analog video only."},{"d":3,"q":"Which DVI variant carries both digital and analog signals?","o":["DVI-I","DVI-D","DVI-A","DVI-L"],"a":0,"e":"DVI-I (integrated) carries both digital and analog signals. DVI-D is digital only, and DVI-A is analog only."},{"d":3,"q":"Which connector type is used for internal SATA data cables?","o":["7-pin SATA","15-pin SATA","40-pin IDE","4-pin Molex"],"a":0,"e":"SATA data uses a 7-pin L-shaped connector. SATA power uses a 15-pin connector."},{"d":3,"q":"Which interface allows an external SATA drive enclosure to connect at native SATA speeds, though it is largely replaced by USB 3 and Thunderbolt?","o":["eSATA","FireWire 400","PS/2","Serial RS-232"],"a":0,"e":"eSATA brought SATA speeds to external drives, but USB 3 and Thunderbolt have mostly replaced it."},{"d":3,"q":"A legacy industrial device uses a DB-9 connector to communicate with a PC. Which interface is this?","o":["Serial (RS-232)","Parallel","VGA","Ethernet"],"a":0,"e":"DB-9 is the common serial (RS-232) connector, often used for console and industrial devices. USB-to-serial adapters are common."},{"d":3,"q":"Which type of RAM module uses 288 pins and is found in current desktop PCs?","o":["DDR4 or DDR5 DIMM","DDR3 SODIMM","DDR2 DIMM","RIMM"],"a":0,"e":"Both DDR4 and DDR5 DIMMs have 288 pins, but their notch positions differ so they can't be swapped."},{"d":3,"q":"Which BIOS/UEFI setting automatically applies a RAM module's rated higher speed profile?","o":["XMP/EXPO","Secure Boot","TPM","CSM"],"a":0,"e":"Intel XMP and AMD EXPO profiles set memory to its rated speed and timings. Without them, RAM runs at default JEDEC speeds."},{"d":3,"q":"Which statement BEST describes the difference between DDR5 and DDR4?","o":["DDR5 offers higher bandwidth and moves power management onto the module","DDR4 is faster than DDR5","They use the same notch and are interchangeable","DDR5 is only for laptops"],"a":0,"e":"DDR5 has higher bandwidth and more density, and it includes an on-module PMIC for power management. It isn't backward compatible with DDR4."},{"d":3,"q":"A drive is labeled 'M.2 2280 SATA.' What does 2280 refer to?","o":["22 mm wide by 80 mm long","22 GB cache and 80 GB capacity","PCIe Gen 2 with 2,280 MB/s","2,280 RPM"],"a":0,"e":"M.2 size codes give width and length in millimeters. 2280 is the most common size."},{"d":3,"q":"A technician installs an M.2 SATA SSD into an M.2 slot that supports only NVMe (PCIe). What will happen?","o":["The drive will not be detected","It will run at NVMe speeds","It will run at USB speeds","It will damage the CPU"],"a":0,"e":"Some M.2 slots support only one protocol. A SATA M.2 drive in a PCIe-only slot won't be detected, so check the motherboard manual."},{"d":3,"q":"Which storage technology has no moving parts and is MOST resistant to physical shock?","o":["Solid-state drive","Hard disk drive","Optical disc","Tape drive"],"a":0,"e":"SSDs store data in flash memory with no moving parts, so they handle drops and vibration much better."},{"d":3,"q":"Which storage device is designed for long-term, high-capacity archival backups with sequential access?","o":["Tape drive","NVMe SSD","USB flash drive","SD card"],"a":0,"e":"Tape (such as LTO) is cheap per terabyte and lasts a long time, but it's accessed sequentially, so it suits archiving."},{"d":3,"q":"Which type of memory card is commonly used in cameras and smartphones for expandable storage?","o":["microSD/SD","CompactFlash only","SODIMM","CMOS"],"a":0,"e":"SD and microSD cards are common removable flash storage for cameras, phones, and drones."},{"d":3,"q":"What is the function of the motherboard chipset?","o":["Manages data flow between the CPU, memory, storage, and peripherals","Stores BIOS settings when power is off","Converts AC to DC power","Cools the CPU"],"a":0,"e":"The chipset (for example, the platform controller hub) handles communication between the CPU and the I/O devices."},{"d":3,"q":"A user purchased an AMD processor, but the motherboard has an Intel LGA socket. What is the issue?","o":["CPU sockets are vendor- and generation-specific, so the CPU is incompatible","It will work after a BIOS update","It only requires a different cooler","It will work in single-core mode"],"a":0,"e":"The CPU has to match the motherboard's socket and chipset. AMD uses AM4/AM5 and Intel uses LGA sockets."},{"d":3,"q":"Which CPU feature allows one physical core to process two threads at the same time?","o":["Simultaneous multithreading (Hyper-Threading)","Virtualization","Overclocking","ECC"],"a":0,"e":"SMT, which Intel calls Hyper-Threading, presents two logical processors for each physical core."},{"d":3,"q":"Which type of CPU cooling uses a pump, radiator, and coolant loop?","o":["Liquid cooling","Passive heat sink","Case fan only","Thermal pad"],"a":0,"e":"Liquid coolers circulate coolant from a CPU block to a radiator with fans, and they handle high heat loads well."},{"d":3,"q":"Which component in a system has no fan and relies only on fins to dissipate heat?","o":["Passive heat sink","Active cooler","AIO liquid cooler","Blower-style GPU cooler"],"a":0,"e":"Passive heat sinks use only fins and airflow, which suits low-power parts and silent builds."},{"d":3,"q":"Which BIOS/UEFI setting requires a password before the system can boot or settings can be changed?","o":["BIOS/UEFI password","Secure Boot","Fast Boot","Wake-on-LAN"],"a":0,"e":"A firmware supervisor or user password stops unauthorized changes to settings or the boot order."},{"d":3,"q":"Which BIOS/UEFI feature lets an administrator turn on a computer remotely by sending a special network packet?","o":["Wake-on-LAN","PXE","Secure Boot","USB permissions"],"a":0,"e":"Wake-on-LAN powers on a system when the NIC receives a 'magic packet.'"},{"d":3,"q":"Which feature detects if the computer case has been opened?","o":["Chassis intrusion detection","TPM","Secure Boot","HSM"],"a":0,"e":"An intrusion switch records when the case is opened and can raise an alert at boot."},{"d":3,"q":"A user wants to add four more SATA drives, but the motherboard has no free SATA ports. Which expansion card should be installed?","o":["SATA host bus adapter/controller card","Sound card","Capture card","Wi-Fi card"],"a":0,"e":"A PCIe SATA controller (HBA) adds more SATA ports."},{"d":3,"q":"A streamer wants to record gameplay from a console onto a PC. Which expansion card is needed?","o":["Video capture card","Sound card","NIC","SATA controller"],"a":0,"e":"Capture cards take video input from HDMI or other sources and record or stream it."},{"d":3,"q":"What is the main function of a power supply unit?","o":["Convert AC wall power to the DC voltages used by components","Convert DC to AC for the motherboard","Store BIOS settings","Regulate CPU clock speed"],"a":0,"e":"The PSU converts AC to DC rails (3.3 V, 5 V, and 12 V) for the components."},{"d":3,"q":"Which voltage rail powers most high-draw components such as CPUs and GPUs?","o":["+12 V","+3.3 V","+5 V","-12 V"],"a":0,"e":"The 12 V rail carries most of the load for CPUs, GPUs, and drive motors."},{"d":3,"q":"Which 80 PLUS rating indicates the HIGHEST efficiency?","o":["Titanium","Bronze","Silver","Gold"],"a":0,"e":"From least to most efficient: White, Bronze, Silver, Gold, Platinum, Titanium."},{"d":3,"q":"A laser printer's toner is low. What else is commonly replaced together with the toner in many laser printer cartridges?","o":["The imaging drum","The fuser","The pickup roller","The formatter board"],"a":0,"e":"Many laser cartridges combine toner and the imaging drum. Fusers and rollers are replaced separately with maintenance kits."},{"d":3,"q":"A laser printer displays 'Perform printer maintenance' after printing 200,000 pages. What should be installed?","o":["A maintenance kit (fuser, rollers, separation pads)","A new drum only","A new network card","More RAM"],"a":0,"e":"Maintenance kits replace parts that wear out on a page-count schedule. Reset the maintenance counter afterward."},{"d":3,"q":"In an inkjet printer, which component moves the print head back and forth across the page?","o":["Carriage and belt","Fuser","Transfer roller","Drum"],"a":0,"e":"The print head rides on a carriage that a stepper motor and belt move across the page."},{"d":3,"q":"A thermal receipt printer produces faded receipts. What is a likely fix?","o":["Clean the heating element and use the correct thermal paper","Replace the toner","Replace the ink cartridge","Run head alignment for inkjets"],"a":0,"e":"Faded thermal prints come from a dirty print head, worn paper, or the wrong paper type. Clean the element with isopropyl alcohol."},{"d":3,"q":"Which part of an impact printer needs regular replacement as it fades?","o":["Ribbon","Toner","Fuser","Drum"],"a":0,"e":"Impact printers strike an inked ribbon, which wears out and needs replacing."},{"d":3,"q":"Which printer security feature holds a print job until the user authenticates at the device?","o":["Secured prints/badge release","Duplex","Collation","Tray assignment"],"a":0,"e":"Secure or pull printing releases jobs only after a PIN or badge is used at the printer, so confidential printouts don't sit in the tray."},{"d":3,"q":"Which printer configuration lets the printer track users' print volumes and restrict who can print in color?","o":["User authentication and audit logging/print management","Duplex","Orientation","Quality"],"a":0,"e":"Print management with authentication supports quotas, permission restrictions, and audit logs."},{"d":5,"q":"A technician has resolved an issue. In which troubleshooting step should the technician confirm the user can work normally and take steps to prevent recurrence?","o":["Verify full system functionality and, if applicable, implement preventive measures","Identify the problem","Establish a theory","Document findings"],"a":0,"e":"Step 5 confirms the fix worked and that nothing else broke, then adds preventive measures."},{"d":5,"q":"While identifying a problem, which action is part of CompTIA's recommended approach?","o":["Question the user and identify recent changes to the system","Immediately replace the hard drive","Reinstall the OS","Escalate without investigating"],"a":0,"e":"Identifying the problem includes gathering information from the user, reviewing logs, and finding out what changed recently."},{"d":5,"q":"When establishing a theory of probable cause, what does CompTIA recommend?","o":["Question the obvious and consider multiple approaches, and research if needed","Always assume hardware failure","Skip to the solution the user suggests","Replace parts until it works"],"a":0,"e":"Question the obvious, check simple causes first, and consult documentation or research as needed."},{"d":5,"q":"Before implementing a fix on a production server, the technician should consider what?","o":["Corporate policies, procedures, and the impact of the change","Only the user's preference","Nothing; fix it immediately","The vendor's marketing materials"],"a":0,"e":"The plan-of-action step includes checking change management policies and the impact on the business before you implement."},{"d":5,"q":"A PC randomly freezes, and memory diagnostics show errors on one module. What should the technician do?","o":["Replace the failing RAM module","Reinstall the OS","Replace the PSU","Update the browser"],"a":0,"e":"Confirmed memory errors mean the module should be replaced. Test each stick individually to find the bad one."},{"d":5,"q":"A PC powers on for a second and then shuts off immediately, with no POST. Which is a likely cause?","o":["A short circuit, such as a misplaced standoff or failing PSU","A missing OS","A bad DNS server","An expired license"],"a":0,"e":"Immediate shutdown can mean the PSU's short protection is tripping. Check standoffs, power connectors, and the PSU."},{"d":5,"q":"After installing a new GPU, the PC boots with a black screen. The monitor is connected to the motherboard's video port. What should be done?","o":["Connect the monitor to the GPU's output","Replace the GPU","Reinstall Windows","Update DNS"],"a":0,"e":"With a discrete GPU installed, onboard video is often disabled. Plug the monitor into the graphics card."},{"d":5,"q":"A newly installed GPU causes the system to shut down under load. The PSU is 400 W. What is the MOST likely issue?","o":["The PSU cannot supply enough power","The monitor is incompatible","The keyboard driver is old","The RAM is ECC"],"a":0,"e":"High-end GPUs draw a lot of power at peak. An undersized PSU shuts down under load."},{"d":5,"q":"A system's time is correct, but the BIOS shows CPU temperature at 98°C at idle. What should the technician check?","o":["CPU cooler mounting, fan operation, and thermal paste","The network cable","The monitor refresh rate","The printer driver"],"a":0,"e":"High idle temperatures point to a cooling problem: a loose heat sink, a dead fan, or dried-out thermal paste."},{"d":5,"q":"A computer's fans spin at maximum speed constantly and it is very loud. Temperatures are normal. What should the technician check?","o":["Fan curve/BIOS fan settings or a faulty fan header","The DNS server","The Wi-Fi channel","The printer queue"],"a":0,"e":"Fans running at full speed with normal temperatures usually means a misconfigured fan profile or a sensor or header fault."},{"d":5,"q":"A system shows the wrong amount of installed RAM in the BIOS after an upgrade. What should be checked FIRST?","o":["That the modules are fully seated and compatible","The hard drive","The network adapter","The monitor cable"],"a":0,"e":"RAM that isn't fully seated or is incompatible won't be detected. Reseat it and check the motherboard's QVL."},{"d":5,"q":"A RAID 1 array is degraded. Which is the BEST next step after replacing the failed drive?","o":["Allow or initiate the array rebuild and monitor it","Delete the array","Format both drives","Switch to RAID 0"],"a":0,"e":"Once the failed drive is replaced, the controller rebuilds the mirror. Keep an eye on it until it finishes."},{"d":5,"q":"A hard drive is extremely slow and the system takes minutes to open files. S.M.A.R.T. shows reallocated sector counts increasing. What does this indicate?","o":["The drive is developing bad sectors and failing","The drive needs defragmenting only","The CPU is overheating","The RAM is too fast"],"a":0,"e":"A rising reallocated sector count is a warning that the drive is failing. Back up the data and replace it."},{"d":5,"q":"A new external drive is not visible in File Explorer but appears in Disk Management as 'Unallocated.' What should the technician do?","o":["Initialize/create a partition and format the drive","Replace the USB cable","Update the BIOS","Run sfc /scannow"],"a":0,"e":"A brand-new disk has to be initialized, partitioned, and formatted before Windows gives it a drive letter."},{"d":5,"q":"A user reports their monitor displays colors with a strong pink tint. Which should be checked FIRST?","o":["The video cable connection and pins","Replace the GPU","Reinstall the OS","Change DNS settings"],"a":0,"e":"Color tints often come from a loose or damaged cable, especially VGA or DVI, or from bent pins. Then check the monitor's color settings."},{"d":5,"q":"A display shows an image that appears to 'burn' or leave a temporary trail when windows are moved quickly. What is this called?","o":["Ghosting/image persistence","Dead pixels","Overscan","Artifacting"],"a":0,"e":"Ghosting comes from slow pixel response or image persistence. Adjusting overdrive or response time settings can help."},{"d":5,"q":"A PC shows strange colored blocks and lines on screen during games, and it crashes. Which component should be suspected?","o":["The graphics card (overheating or failing)","The keyboard","The optical drive","The network card"],"a":0,"e":"Visual artifacts under load usually mean a GPU problem: overheating, failing VRAM, or an unstable overclock."},{"d":5,"q":"A projector shuts off after a few minutes of use and the fan is not spinning. What is the MOST likely cause?","o":["Overheating due to a failed fan or clogged filter","A bad HDMI cable","Wrong input source","Low resolution"],"a":0,"e":"Projectors shut down to protect the lamp when they overheat. Clean the filters and check the fan."},{"d":5,"q":"A smartphone shows 'No SIM' after the user dropped it. What should be checked FIRST?","o":["Reseat the SIM card","Factory reset","Replace the screen","Update all apps"],"a":0,"e":"A drop can unseat the SIM card. Reseat it before trying anything more drastic."},{"d":5,"q":"A phone overheats while charging and the battery percentage jumps erratically. What should the technician do?","o":["Stop using it, check for battery swelling, and replace the battery","Keep charging overnight","Install a battery saver app only","Ignore it"],"a":0,"e":"Erratic readings plus heat point to a failing battery, which is a safety hazard."},{"d":5,"q":"A laptop's touchscreen registers touches in the wrong location. What should be done FIRST?","o":["Recalibrate the touchscreen","Replace the motherboard","Replace the battery","Reinstall the Wi-Fi driver"],"a":0,"e":"Calibration fixes input that's offset from where you touched. If it persists, the digitizer may need replacing."},{"d":5,"q":"A laptop keyboard types numbers instead of letters for certain keys. What is the MOST likely cause?","o":["Num Lock/embedded keypad is enabled","The keyboard is broken","The display driver is outdated","The battery is low"],"a":0,"e":"On laptops without a separate number pad, Num Lock turns some letter keys into numbers."},{"d":5,"q":"A laptop cannot detect any Bluetooth devices, and Bluetooth does not appear in settings. What should the technician check FIRST?","o":["Whether Bluetooth is enabled in Device Manager/BIOS or airplane mode is on","Replace the screen","Change the DNS server","Replace the AC adapter"],"a":0,"e":"Bluetooth missing from settings usually means it's disabled in Device Manager or the BIOS, airplane mode is on, or a driver is missing."},{"d":5,"q":"Users connected to the 5 GHz SSID report good speed near the AP, but lose connection two rooms away. 2.4 GHz works there. What explains this?","o":["5 GHz has shorter range and penetrates walls less","5 GHz is always slower","The DNS server is failing","DHCP is disabled for 5 GHz"],"a":0,"e":"Higher frequencies lose strength faster through walls. Add APs or use band steering to keep clients connected."},{"d":5,"q":"A technician runs ping to a server and receives 'Request timed out' but can access the server's web page. What is the MOST likely explanation?","o":["ICMP is blocked by a firewall","The server is down","DNS is failing","The cable is unplugged"],"a":0,"e":"Firewalls often block ICMP, so ping fails even though the server and its other services work."},{"d":5,"q":"Network users report that the internet becomes very slow every afternoon. Monitoring shows the WAN link at 100% utilization. What is this issue?","o":["Bandwidth saturation/congestion","DNS failure","APIPA","Port flapping"],"a":0,"e":"A saturated link causes slowdowns. Find out what's using the bandwidth, apply QoS, or upgrade the circuit."},{"d":5,"q":"A user gets 'Limited connectivity' on Windows with an IP from the correct subnet, but cannot reach any website. Ping to 8.8.8.8 also fails. What should be checked?","o":["The default gateway and upstream router/ISP connection","The DNS server only","The printer driver","The browser cache"],"a":0,"e":"If pinging an outside IP fails, routing or the internet link is broken, not just DNS. Check the gateway and upstream connection."},{"d":5,"q":"An office's wired PCs connected to one switch suddenly lose connectivity, while other switches work. What should be checked FIRST?","o":["The switch's power and uplink connection","Each PC's DNS settings","The users' passwords","The printer queue"],"a":0,"e":"When everything on one switch fails, look at that switch first: power, the uplink cable, or the switch itself."},{"d":5,"q":"A newly crimped Ethernet cable does not work. A cable tester shows pins 1 and 2 crossed with 3 and 6 on one end only. What happened?","o":["The ends were terminated with different standards (T568A on one, T568B on the other)","The cable is too long","The cable is plenum-rated","The switch port is PoE"],"a":0,"e":"Mixing T568A and T568B creates a crossover cable. Use the same standard on both ends for a straight-through cable."},{"d":5,"q":"A wireless network shows a strong signal, but devices connect at low speeds and drop often. An analyzer shows high noise levels. What is the problem?","o":["Low signal-to-noise ratio from interference","The SSID is hidden","WPA3 is enabled","The DHCP lease is too long"],"a":0,"e":"A strong signal with heavy noise gives a poor SNR. Find the interference source or change channels."},{"d":5,"q":"A printer shows 'Paper jam' but no paper is in the paper path. What should the technician check?","o":["Paper sensors for debris or damage","The toner level","The network IP","The print driver language"],"a":0,"e":"A phantom jam usually means a paper sensor is blocked, dirty, or damaged. Look for torn bits of paper."},{"d":5,"q":"A laser printer's pages come out with small toner speckles all over. What is the MOST likely cause?","o":["A leaking toner cartridge or dirty paper path","Low printer RAM","Wrong orientation setting","Wrong IP address"],"a":0,"e":"Speckles come from loose toner. Replace the cartridge and clean the paper path. Wear a mask and use a toner vacuum."},{"d":5,"q":"A printer makes a loud grinding noise during printing. Which should be inspected?","o":["Gears, rollers, and the fuser drive assembly","The network cable","The driver","The print queue"],"a":0,"e":"Grinding points to a mechanical problem, such as worn gears, a jammed roller, or debris. Stop using the printer and inspect it."},{"d":5,"q":"A printer's output shows a 'double image' of text slightly offset on every page. What is this, and what's a likely cause?","o":["Double/echo image from a faulty drum or transfer issue","Garbled print from a bad driver","Faded print from low toner","Paper jam from a bad roller"],"a":0,"e":"A double image comes from drum or transfer problems. Replacing the imaging unit usually fixes it."},{"d":5,"q":"Users can print to a network printer by IP address, but the printer's hostname does not resolve. What is the MOST likely issue?","o":["DNS record for the printer is missing or incorrect","The fuser is bad","The toner is low","The paper tray is open"],"a":0,"e":"Printing by IP works but the hostname doesn't resolve, so the printer's DNS record is the problem."},{"d":5,"q":"A printer has an incorrect paper size configured, causing pages to print with cut-off margins. What should be adjusted?","o":["Paper size/tray settings in the driver and on the printer","The network gateway","The toner density","The duplex unit"],"a":0,"e":"Make sure the paper size matches in the driver, the application, and the tray configuration."},{"d":5,"q":"A laptop powers off without warning even though the battery indicator showed 40%. What is the MOST likely cause?","o":["A worn or failing battery reporting incorrect charge","A bad monitor","A failed network card","Incorrect time zone"],"a":0,"e":"Old batteries can't hold voltage under load and report their charge incorrectly. Calibrating or replacing the battery fixes this."},{"d":5,"q":"After a lightning storm, a PC will not power on and its network port is dead. What is the MOST likely cause?","o":["A power surge damaged the PSU/motherboard","A virus","A bad keyboard","Incorrect DNS"],"a":0,"e":"Surges can damage both the power and network paths. Test the PSU and board, and use surge protection and a UPS going forward."}],"c2":[{"d":1,"q":"A user on Windows 11 Home wants to encrypt their entire drive with BitLocker and join the company domain. What must be done?","o":["Upgrade to Windows 11 Pro or higher","Install a TPM driver","Enable EFS","Create a local administrator account"],"a":0,"e":"Home edition doesn't include full BitLocker management, domain join, Group Policy Editor, or Remote Desktop host. Pro, Enterprise, and Education editions do."},{"d":1,"q":"A user cannot copy a 6 GB video file to a USB flash drive, even though the drive has 30 GB free. What is the MOST likely cause?","o":["The drive is formatted FAT32, which has a 4 GB file size limit","The file is encrypted","The USB port is USB 2.0","The drive is write-protected"],"a":0,"e":"FAT32 limits individual files to 4 GB. Reformatting the drive as exFAT or NTFS removes that limit."},{"d":1,"q":"A user needs a USB drive that works with large files on both Windows and macOS. Which file system is BEST?","o":["exFAT","NTFS","ext4","APFS"],"a":0,"e":"exFAT supports large files and both Windows and macOS can read and write it natively. macOS can only read NTFS by default."},{"d":1,"q":"Which file system is the default for modern macOS installations?","o":["APFS","HFS","ext4","ReFS"],"a":0,"e":"Apple File System (APFS) has been the macOS default since High Sierra and is optimized for SSDs."},{"d":1,"q":"Which file system is commonly the default on Linux distributions?","o":["ext4","NTFS","APFS","FAT32"],"a":0,"e":"ext4 is the most common default Linux file system. XFS and Btrfs are also used."},{"d":1,"q":"A technician needs to view a workstation's IP address, subnet mask, default gateway, and DNS servers. Which command should be used?","o":["ipconfig /all","netstat -a","tracert","nslookup"],"a":0,"e":"ipconfig /all shows the full adapter configuration, including the MAC address, DHCP status, and DNS servers."},{"d":1,"q":"Which command releases and then requests a new DHCP address on a Windows PC?","o":["ipconfig /release then ipconfig /renew","ipconfig /flushdns","netstat -r","ping -t"],"a":0,"e":"/release drops the current DHCP lease and /renew requests a new one. /flushdns clears the DNS resolver cache."},{"d":1,"q":"A technician wants to see each router hop between a PC and a remote server. Which Windows command should be used?","o":["tracert","ping","ipconfig","hostname"],"a":0,"e":"tracert lists each hop and its latency. pathping combines tracert with packet loss statistics."},{"d":1,"q":"Which command queries DNS to find the IP address associated with a domain name?","o":["nslookup","netstat","gpupdate","chkdsk"],"a":0,"e":"nslookup queries DNS servers directly, which is useful for diagnosing name resolution."},{"d":1,"q":"A technician suspects malware is communicating with a remote server. Which command shows active network connections and listening ports?","o":["netstat -ano","ipconfig /all","tracert","sfc /scannow"],"a":0,"e":"netstat -ano shows connections, ports, and the owning process IDs, which you can then match to processes in Task Manager."},{"d":1,"q":"Windows system files appear to be corrupted. Which command scans and repairs protected system files?","o":["sfc /scannow","chkdsk /f","diskpart","format"],"a":0,"e":"System File Checker replaces corrupted protected system files. If it can't repair them, run DISM /Online /Cleanup-Image /RestoreHealth first, then run sfc again."},{"d":1,"q":"Which command checks a disk for file system errors and bad sectors, and fixes them?","o":["chkdsk /r","sfc /scannow","gpresult","robocopy"],"a":0,"e":"chkdsk /f fixes file system errors, and /r also finds bad sectors and recovers readable data."},{"d":1,"q":"An administrator changed a Group Policy and wants it applied immediately on a workstation. Which command should be run?","o":["gpupdate /force","gpresult /r","netstat","winver"],"a":0,"e":"gpupdate /force reapplies all policy settings right away. gpresult /r shows which policies have been applied."},{"d":1,"q":"A technician needs to confirm which Group Policy objects were applied to a user. Which command should be used?","o":["gpresult /r","gpupdate /force","ipconfig","diskpart"],"a":0,"e":"gpresult /r shows the Resultant Set of Policy (RSoP) for the user and computer."},{"d":1,"q":"Which command-line tool is used to create, delete, and format partitions from a Windows command prompt?","o":["diskpart","chkdsk","sfc","xcopy"],"a":0,"e":"diskpart manages disks, partitions, and volumes from the command line."},{"d":1,"q":"A technician needs to copy a large folder structure, keep file permissions, and resume if the copy is interrupted. Which command is BEST?","o":["robocopy","copy","xcopy","move"],"a":0,"e":"Robocopy (Robust File Copy) supports restartable mode, mirroring, permission copying, and logging."},{"d":1,"q":"Which command maps a network share to a drive letter on a Windows PC?","o":["net use","net user","netstat","nslookup"],"a":0,"e":"For example, net use Z: \\\\server\\share maps a drive. net user manages user accounts."},{"d":1,"q":"Which Windows tool should a technician use to review application crash logs and system errors?","o":["Event Viewer","Disk Management","Device Manager","Task Scheduler"],"a":0,"e":"Event Viewer (eventvwr.msc) shows the Application, System, and Security logs with timestamps and error details."},{"d":1,"q":"A newly installed device shows a yellow exclamation mark. Which tool shows this and allows the driver to be updated or rolled back?","o":["Device Manager","Event Viewer","Services","Performance Monitor"],"a":0,"e":"Device Manager (devmgmt.msc) shows hardware status and lets you update, roll back, disable, or uninstall drivers."},{"d":1,"q":"A technician needs to initialize a new drive, create a partition, and assign a drive letter using a graphical tool. Which tool should be used?","o":["Disk Management","Device Manager","Disk Cleanup","Resource Monitor"],"a":0,"e":"Disk Management (diskmgmt.msc) handles initializing (MBR/GPT), partitioning, formatting, and assigning drive letters."},{"d":1,"q":"An administrator wants a cleanup script to run every night at 2:00 a.m. Which Windows tool should be used?","o":["Task Scheduler","Services","msconfig","Event Viewer"],"a":0,"e":"Task Scheduler (taskschd.msc) runs programs or scripts on a schedule or in response to triggers."},{"d":1,"q":"A user's PC is slow. Which tool shows real-time CPU, memory, disk, and network use by process and lets the technician end a frozen app?","o":["Task Manager","Disk Management","Certificate Manager","Local Users and Groups"],"a":0,"e":"Task Manager (Ctrl+Shift+Esc) shows per-process resource use, startup apps, and services, and can end tasks."},{"d":1,"q":"A technician wants to collect performance counter data over several hours to find an intermittent bottleneck. Which tool is BEST?","o":["Performance Monitor","Task Manager","Event Viewer","System Information"],"a":0,"e":"Performance Monitor (perfmon) logs counters over time using Data Collector Sets. Task Manager only shows the current moment."},{"d":1,"q":"A technician wants to perform a clean boot by disabling non-Microsoft services. Which tool is used?","o":["System Configuration (msconfig)","Registry Editor","Disk Management","Device Manager"],"a":0,"e":"msconfig lets you hide Microsoft services and disable the rest, and it controls boot options such as Safe Mode."},{"d":1,"q":"Which tool provides a detailed summary of a PC's hardware, components, and software environment?","o":["System Information (msinfo32)","Resource Monitor","Task Scheduler","Event Viewer"],"a":0,"e":"msinfo32 summarizes the system model, BIOS version, RAM, drivers, and environment details."},{"d":1,"q":"A technician needs to directly edit a configuration setting stored in the Windows Registry. Which tool should be used?","o":["regedit","msconfig","gpedit.msc","services.msc"],"a":0,"e":"Registry Editor (regedit) edits registry keys directly. Back up the key before you change it."},{"d":1,"q":"An administrator wants to configure a password policy on a standalone Windows 11 Pro PC that is not on a domain. Which tool is used?","o":["Local Group Policy Editor (gpedit.msc)","Registry Editor","Task Manager","Device Manager"],"a":0,"e":"gpedit.msc configures local policies on Pro and higher editions. It isn't available on Home."},{"d":1,"q":"In a Windows environment, which arrangement uses a centralized server to manage user accounts and authentication for all computers?","o":["Domain","Workgroup","Homegroup","Peer-to-peer"],"a":0,"e":"A domain uses Active Directory domain controllers for central authentication and policy. In a workgroup, each computer keeps its own local accounts."},{"d":1,"q":"A Mac user wants automatic, incremental backups to an external drive. Which built-in macOS feature should be used?","o":["Time Machine","FileVault","Keychain","Spotlight"],"a":0,"e":"Time Machine makes hourly, daily, and weekly incremental backups to an external drive or network location."},{"d":1,"q":"Which macOS feature provides full-disk encryption?","o":["FileVault","Gatekeeper","Time Machine","Mission Control"],"a":0,"e":"FileVault encrypts the startup disk, like BitLocker on Windows."},{"d":1,"q":"A Mac user wants their saved passwords and certificates stored securely. Which macOS feature does this?","o":["Keychain","Finder","Boot Camp","Dock"],"a":0,"e":"Keychain Access stores passwords, keys, and certificates securely."},{"d":1,"q":"On a Linux system, which command displays the current working directory?","o":["pwd","ls","cd","whoami"],"a":0,"e":"pwd (print working directory) shows your current location in the file system."},{"d":1,"q":"A Linux administrator needs to give the owner full permissions and everyone else read-only access to a script file. Which command would do this?","o":["chmod 744 script.sh","chown 744 script.sh","chmod 777 script.sh","ls -l script.sh"],"a":0,"e":"chmod 744 sets owner rwx (7), group r (4), and others r (4). chown changes ownership, not permissions."},{"d":1,"q":"Which Linux command changes the owner of a file?","o":["chown","chmod","passwd","mv"],"a":0,"e":"chown user:group file changes file ownership."},{"d":1,"q":"A Linux user needs to install a package with apt but gets a permission denied error. What should the user do?","o":["Run the command with sudo","Use chmod on apt","Reboot into Safe Mode","Use the ls command first"],"a":0,"e":"sudo runs one command with elevated (root) privileges, which package installation requires."},{"d":1,"q":"Which Linux command searches a text file for lines containing a specific word?","o":["grep","find","cat","df"],"a":0,"e":"grep searches text for patterns. find locates files by name and other attributes."},{"d":1,"q":"Which Linux command shows the disk space used and available on mounted file systems?","o":["df -h","du","top","ps"],"a":0,"e":"df -h shows file system usage in human-readable units. du shows how much space directories use."},{"d":1,"q":"A Linux administrator wants a live, updating view of running processes and their CPU and memory use. Which command should be used?","o":["top","ps","ls","man"],"a":0,"e":"top (or htop) shows a continuously updating list of processes. ps gives a one-time snapshot."},{"d":1,"q":"A new 4 TB disk will be the boot drive on a UEFI system. Which partition style should be used?","o":["GPT","MBR","FAT32","Extended"],"a":0,"e":"GPT supports disks larger than 2 TB and more than four primary partitions, and UEFI booting requires it. MBR is limited to 2 TB."},{"d":1,"q":"A company needs to deploy the same configured Windows build to 200 identical laptops quickly. Which installation method is MOST efficient?","o":["Image deployment","Clean install from USB on each","In-place upgrade on each","Repair installation"],"a":0,"e":"Image deployment (for example, with MDT or Autopilot, often over PXE) installs a standard configured image across many machines."},{"d":1,"q":"A user wants to move from Windows 10 to Windows 11 while keeping their files, settings, and applications. Which installation type should be used?","o":["In-place upgrade","Clean install","Image deployment","Recovery partition reset"],"a":0,"e":"An in-place upgrade keeps apps, settings, and data. A clean install erases everything on the target partition."},{"d":1,"q":"A 32-bit version of Windows is installed on a PC with 16 GB of RAM, but only about 4 GB is usable. Why?","o":["32-bit operating systems can address only about 4 GB of RAM","The RAM is defective","The BIOS needs updating","Dual-channel is disabled"],"a":0,"e":"A 32-bit OS has a 4 GB address space. A 64-bit OS is needed to use more memory."},{"d":2,"q":"A secure facility uses a small room with two interlocking doors so only one person can pass through at a time. What is this called?","o":["Access control vestibule","Bollard","Badge reader","Video surveillance"],"a":0,"e":"An access control vestibule (formerly called a mantrap) prevents tailgating because only one door can be open at a time."},{"d":2,"q":"Which physical security control prevents vehicles from driving into a building entrance?","o":["Bollards","Motion sensors","Access control vestibule","Badge readers"],"a":0,"e":"Bollards are short, sturdy posts that block vehicles while still letting pedestrians through."},{"d":2,"q":"An employee holds the secure door open for a person carrying boxes without checking their badge. Which social engineering attack does this allow?","o":["Tailgating/piggybacking","Shoulder surfing","Phishing","Whaling"],"a":0,"e":"Tailgating (or piggybacking, when the employee knowingly allows it) gets someone through a secured entrance on another person's access."},{"d":2,"q":"An attacker watches a user type their PIN at an ATM from behind. Which attack is this?","o":["Shoulder surfing","Tailgating","Vishing","Dumpster diving"],"a":0,"e":"Shoulder surfing is observing someone's screen or keypad to steal information. Privacy screens help prevent it."},{"d":2,"q":"A user receives a phone call from someone claiming to be from IT who asks for their password to 'fix an account issue.' Which attack is this?","o":["Vishing","Smishing","Whaling","Evil twin"],"a":0,"e":"Vishing is voice phishing done over the phone. Smishing uses text messages."},{"d":2,"q":"A company's CEO receives a highly targeted email that appears to come from the board and requests an urgent wire transfer. Which attack is this?","o":["Whaling","Smishing","Shoulder surfing","Tailgating"],"a":0,"e":"Whaling is spear phishing aimed at high-level executives."},{"d":2,"q":"An attacker sets up a wireless access point named 'CoffeeShop_Free' that mimics the shop's real Wi-Fi to capture users' traffic. What is this?","o":["Evil twin","Rogue DHCP","Bluejacking","War driving"],"a":0,"e":"An evil twin is a fake AP that imitates a legitimate SSID to intercept traffic."},{"d":2,"q":"A user's files are encrypted, and a message demands payment in cryptocurrency to unlock them. Which type of malware is this?","o":["Ransomware","Spyware","Keylogger","Adware"],"a":0,"e":"Ransomware encrypts data and demands payment. Offline, tested backups are the best defense."},{"d":2,"q":"A user downloaded a free game that also secretly installed a backdoor. Which type of malware is this?","o":["Trojan","Worm","Virus","Rootkit"],"a":0,"e":"A Trojan looks like legitimate software but carries a malicious payload."},{"d":2,"q":"Which type of malware hides deep in the operating system or firmware and conceals its presence from antivirus software?","o":["Rootkit","Adware","Keylogger","Spyware"],"a":0,"e":"Rootkits hide processes, files, and registry keys, often at kernel or boot level. Removing one often means reimaging the system."},{"d":2,"q":"A user's PC runs extremely slowly, and the CPU stays near 100% because of an unknown process that uses its resources to generate digital currency. What is this?","o":["Cryptominer","Ransomware","Keylogger","Boot sector virus"],"a":0,"e":"Cryptominers (cryptojacking) secretly use system resources to mine cryptocurrency."},{"d":2,"q":"Which malware records everything a user types to steal credentials?","o":["Keylogger","Adware","Worm","Ransomware"],"a":0,"e":"Keyloggers capture keystrokes, and they can be software or hardware."},{"d":2,"q":"Which wireless security protocol is the MOST secure for a new SOHO network?","o":["WPA3","WPA2 with TKIP","WEP","WPA"],"a":0,"e":"WPA3 uses SAE (Simultaneous Authentication of Equals), which resists offline password guessing. WEP and TKIP are obsolete."},{"d":2,"q":"Which encryption method should be used with WPA2 for strong wireless security?","o":["AES (CCMP)","TKIP","RC4","DES"],"a":0,"e":"WPA2 should use AES-CCMP. TKIP is deprecated and vulnerable."},{"d":2,"q":"An organization wants to centrally manage administrator authentication on network devices and log each command they run. Which protocol is BEST suited?","o":["TACACS+","RADIUS","Kerberos","WPA3"],"a":0,"e":"TACACS+ (a Cisco-developed protocol) separates authentication, authorization, and accounting and can authorize individual commands, which suits device administration."},{"d":2,"q":"Which authentication protocol is used by Windows Active Directory and issues tickets to users?","o":["Kerberos","TACACS+","RADIUS","LDAP"],"a":0,"e":"Kerberos uses a ticket-granting system and is the default authentication protocol in AD domains."},{"d":2,"q":"A user logs in with a password and then approves a push notification on their phone. Which security concept is this?","o":["Multifactor authentication","Single sign-on","Least privilege","Zero trust only"],"a":0,"e":"MFA combines factors from different categories: something you know (a password) and something you have (a phone)."},{"d":2,"q":"An employee in accounting is given access only to the folders and applications needed for their job. Which principle is applied?","o":["Principle of least privilege","Implicit deny","Separation of duties","Single sign-on"],"a":0,"e":"Least privilege grants only the minimum access needed, which limits damage if the account is compromised."},{"d":2,"q":"A folder has Share permission 'Read' and NTFS permission 'Modify' for a user. What is the user's effective permission when accessing it over the network?","o":["Read","Modify","Full Control","No access"],"a":0,"e":"When share and NTFS permissions combine, the most restrictive one applies. Here that's Read."},{"d":2,"q":"A file is moved to a different folder on the SAME NTFS volume. What happens to its NTFS permissions?","o":["It keeps its original permissions","It inherits the destination folder's permissions","All permissions are removed","It gets Full Control for Everyone"],"a":0,"e":"Moving a file within the same volume keeps its permissions. Copying a file, or moving it to a different volume, makes it inherit the destination's permissions."},{"d":2,"q":"Which Windows feature prompts the user for permission before a program can make administrative changes?","o":["User Account Control (UAC)","BitLocker","Windows Defender Firewall","EFS"],"a":0,"e":"UAC requires elevation for administrative actions, even for admin accounts."},{"d":2,"q":"A user wants to encrypt specific files on an NTFS drive so other user accounts on the same PC cannot read them. Which feature should be used?","o":["Encrypting File System (EFS)","BitLocker","FileVault","Windows Hello"],"a":0,"e":"EFS encrypts individual files and folders per user. BitLocker encrypts whole volumes."},{"d":2,"q":"A company wants to encrypt USB flash drives so data is protected if a drive is lost. Which Windows feature should be used?","o":["BitLocker To Go","EFS","UAC","Windows Defender SmartScreen"],"a":0,"e":"BitLocker To Go encrypts removable drives and requires a password or smart card to unlock them."},{"d":2,"q":"Which steps should be taken to harden a new SOHO wireless router? (Choose two.)","o":["Change the default admin password","Update the firmware","Enable WPS","Leave UPnP enabled"],"a":[0,1],"e":"Change the default credentials and update the firmware. WPS and UPnP should normally be disabled because both have known weaknesses."},{"d":2,"q":"A coffee shop wants customers to have internet access without being able to reach the shop's point-of-sale system. What should be configured on the router?","o":["A separate guest network","MAC address cloning","Port forwarding to the POS","DMZ for all clients"],"a":0,"e":"A guest network isolates visitors from internal devices."},{"d":2,"q":"A company is disposing of old hard drives and needs to ensure the data can never be recovered. Which method is MOST secure?","o":["Physical destruction such as shredding","Quick format","Deleting the partitions","Moving files to the Recycle Bin"],"a":0,"e":"Shredding, drilling, or incinerating the drive physically destroys the platters or chips. Formatting or deleting partitions leaves recoverable data."},{"d":2,"q":"Which data destruction method uses a strong magnetic field and is NOT effective on SSDs?","o":["Degaussing","Shredding","Incineration","Drilling"],"a":0,"e":"Degaussing scrambles magnetic media such as HDDs and tapes. SSDs store data in flash cells, so they need cryptographic erase, secure erase, or physical destruction."},{"d":2,"q":"A company uses a third-party vendor to destroy drives. What document should the vendor provide for compliance records?","o":["Certificate of destruction","Chain of custody form only","EULA","Acceptable use policy"],"a":0,"e":"A certificate of destruction proves the media was destroyed and when."},{"d":2,"q":"A user receives a browser warning that a website's certificate is not trusted when visiting their bank. What should the user do?","o":["Not proceed and report it, because the connection may be intercepted","Click through the warning","Disable the browser's certificate checks","Clear the browser cache and proceed"],"a":0,"e":"An untrusted or invalid certificate on a known site can mean an on-path attack or a spoofed site. Don't continue."},{"d":2,"q":"An attacker intercepts and possibly alters communications between two parties without their knowledge. Which attack is this?","o":["On-path (man-in-the-middle)","Denial of service","Brute force","SQL injection"],"a":0,"e":"In an on-path attack, the attacker sits between two parties and can capture or modify the traffic."},{"d":2,"q":"A website is overwhelmed by traffic from thousands of compromised devices and becomes unavailable. Which attack is this?","o":["Distributed denial of service (DDoS)","Phishing","Zero-day","Insider threat"],"a":0,"e":"A DDoS uses many sources, often a botnet, to exhaust a target's resources."},{"d":2,"q":"An attacker exploits a software vulnerability that the vendor does not yet know about and has not patched. What is this?","o":["Zero-day attack","Brute force attack","Dictionary attack","Spoofing"],"a":0,"e":"A zero-day is a vulnerability exploited before a patch exists."},{"d":2,"q":"An attacker tries common words from a list as passwords against a login page. Which attack is this?","o":["Dictionary attack","Rainbow table only","Shoulder surfing","Evil twin"],"a":0,"e":"A dictionary attack tries words from a wordlist. A brute force attack tries every possible combination. Account lockout and MFA defend against both."},{"d":2,"q":"A web form is manipulated to send commands directly to a back-end database. Which attack is this?","o":["SQL injection","Cross-site scripting","Vishing","Evil twin"],"a":0,"e":"SQL injection inserts malicious SQL through unvalidated input. Parameterized queries prevent it."},{"d":2,"q":"An attacker injects malicious script into a website so it runs in other visitors' browsers. Which attack is this?","o":["Cross-site scripting (XSS)","SQL injection","On-path","DDoS"],"a":0,"e":"XSS runs attacker-supplied scripts in victims' browsers, often to steal session cookies."},{"d":2,"q":"Which security solution monitors endpoints for suspicious behavior, records activity, and allows a security team to isolate a compromised device?","o":["Endpoint detection and response (EDR)","Basic signature antivirus","A hardware firewall","A proxy server"],"a":0,"e":"EDR goes beyond signature antivirus: it uses behavior monitoring, collects forensic data, and can isolate devices remotely."},{"d":2,"q":"A disgruntled employee with legitimate access copies confidential data before quitting. Which threat type is this?","o":["Insider threat","Zero-day","Evil twin","Spoofing"],"a":0,"e":"Insider threats come from people with authorized access. Data loss prevention (DLP), least privilege, and monitoring help reduce the risk."},{"d":2,"q":"An attacker searches through a company's trash to find printed passwords and internal documents. What is this called?","o":["Dumpster diving","Shoulder surfing","Tailgating","Impersonation"],"a":0,"e":"Dumpster diving is searching discarded materials for information. Shredding policies help prevent it."},{"d":2,"q":"A company wants lost corporate phones to be locatable and erasable remotely. Which features should be enabled? (Choose two.)","o":["Locator application","Remote wipe","Bluetooth discoverable mode","Developer mode"],"a":[0,1],"e":"Locator apps (such as Find My) and remote wipe protect lost devices, and both are often enforced through MDM."},{"d":2,"q":"Which Windows tool provides built-in antivirus and anti-malware protection?","o":["Microsoft Defender Antivirus","Windows Update","BitLocker","Task Scheduler"],"a":0,"e":"Microsoft Defender Antivirus is built into Windows 10 and 11. Keep its definitions up to date."},{"d":2,"q":"An administrator wants to prevent users from logging in with only a password when accessing email from outside the office. Which approach is BEST?","o":["Require MFA for external access","Increase password length to 10 characters","Disable account lockout","Allow users to reuse passwords"],"a":0,"e":"MFA greatly reduces the risk of credential theft. Password changes alone don't stop phishing."},{"d":2,"q":"A browser extension that a user installed is injecting ads and redirecting searches. What is the BEST first action?","o":["Remove the untrusted extension","Clear the DNS cache","Reinstall the operating system","Disable the firewall"],"a":0,"e":"Malicious or untrusted extensions are a common cause of ad injection and redirects. Remove them and only install extensions from trusted sources."},{"d":3,"q":"What is the FIRST step in CompTIA's best practice procedure for malware removal?","o":["Investigate and verify malware symptoms","Quarantine the infected system","Disable System Restore","Remediate the infected system"],"a":0,"e":"The steps are: 1) investigate and verify malware symptoms, 2) quarantine the infected system, 3) disable System Restore in Windows, 4) remediate (update anti-malware, then scan and remove), 5) schedule scans and run updates, 6) enable System Restore and create a restore point, 7) educate the end user."},{"d":3,"q":"After confirming a PC is infected with malware, what should the technician do NEXT?","o":["Quarantine the system by disconnecting it from the network","Educate the end user","Create a restore point","Reinstall all applications"],"a":0,"e":"Quarantining the system stops the malware from spreading to other machines."},{"d":3,"q":"Why should System Restore be disabled during malware removal?","o":["Restore points may contain the malware and could reinfect the system","It speeds up the antivirus scan","It frees up RAM","It is required to enter Safe Mode"],"a":0,"e":"Old restore points can contain infected files. Disabling System Restore deletes them so the malware can't come back that way."},{"d":3,"q":"What is the FINAL step of the malware removal process?","o":["Educate the end user","Enable System Restore","Schedule scans","Quarantine the system"],"a":0,"e":"Finish by teaching the user how to avoid getting infected again."},{"d":3,"q":"During remediation, what should the technician do BEFORE running a full anti-malware scan?","o":["Update the anti-malware definitions","Enable System Restore","Educate the user","Reconnect to the network permanently"],"a":0,"e":"Current definitions are needed to detect the latest threats. Scanning in Safe Mode or from a pre-installation environment can also help."},{"d":3,"q":"A user's browser homepage keeps changing, and searches redirect to unfamiliar sites. What is the MOST likely cause?","o":["Browser hijacker malware or a malicious extension","A failing hard drive","An incorrect DNS suffix","A bad network cable"],"a":0,"e":"Changed homepages and search redirects are classic signs of a browser hijacker. Check extensions, browser settings, and the hosts file."},{"d":3,"q":"A user reports a pop-up claiming their PC is infected and instructing them to call a support number. Their installed antivirus shows no alerts. What is this MOST likely?","o":["A fake security alert (scareware)","A legitimate Windows Defender alert","A hardware failure","A driver update notice"],"a":0,"e":"Rogue or fake antivirus alerts try to scare users into calling scammers or paying. Close the browser and scan with legitimate tools."},{"d":3,"q":"Several of a user's files now have unfamiliar extensions and cannot be opened. What should the technician suspect?","o":["Ransomware infection","File system corruption from a power outage","Missing codecs","Incorrect file associations only"],"a":0,"e":"Renamed or encrypted files are a key sign of ransomware. Isolate the PC immediately."},{"d":3,"q":"A user's contacts report receiving spam emails from the user's account, but the user did not send them. What is the MOST likely cause?","o":["The email account has been compromised","The mail server is out of disk space","DNS records are incorrect","The user's monitor is faulty"],"a":0,"e":"A hijacked email account sends spam to the user's contacts. Reset the password, enable MFA, and check the mailbox rules."},{"d":3,"q":"A Windows PC displays a blue screen with a stop code and restarts after a new driver was installed. What should the technician do FIRST?","o":["Boot into Safe Mode and roll back the driver","Replace the motherboard","Reinstall Windows","Replace the RAM"],"a":0,"e":"A BSOD right after a driver install points to that driver. Safe Mode loads only minimal drivers so you can roll it back."},{"d":3,"q":"A Windows 11 PC fails to boot after a recent update. Which feature lets the technician access Startup Repair, System Restore, and uninstalling updates?","o":["Windows Recovery Environment (WinRE)","Task Manager","Event Viewer","Disk Cleanup"],"a":0,"e":"WinRE (Advanced Startup) offers Startup Repair, System Restore, Uninstall Updates, a command prompt, and Reset this PC."},{"d":3,"q":"A user's PC has become slow after they installed several programs. The technician sees many apps launching at startup. Where can these be disabled in Windows 11?","o":["Task Manager Startup apps tab","Device Manager","Disk Management","Certificate Manager"],"a":0,"e":"Task Manager's Startup apps page (also found in Settings > Apps > Startup) shows the impact of each app and lets you disable it."},{"d":3,"q":"A Windows service needed by an application fails to start after reboot. Where should the technician check the service's startup type and status?","o":["services.msc","diskmgmt.msc","devmgmt.msc","certmgr.msc"],"a":0,"e":"The Services console shows each service's status and startup type (Automatic, Manual, Disabled) and its dependencies."},{"d":3,"q":"A user's application crashes every time a specific report is opened. Which tool should be checked FIRST for error details?","o":["Event Viewer Application log","Disk Management","Device Manager","Network and Sharing Center"],"a":0,"e":"The Application log records crash events, the faulting module, and error codes."},{"d":3,"q":"Windows displays a 'low memory' warning, and the system is sluggish with many browser tabs open. What should the technician recommend FIRST?","o":["Close unneeded apps and tabs, and consider adding RAM","Replace the hard drive","Disable the firewall","Format the drive"],"a":0,"e":"Using up all the RAM forces heavy paging. Reduce the load first, then upgrade the RAM if needed."},{"d":3,"q":"A user's Windows profile takes several minutes to load at sign-in, while other users sign in quickly on the same PC. What is a likely cause?","o":["A corrupt or very large user profile","A failing power supply","A bad monitor cable","An incorrect time zone"],"a":0,"e":"If only one user signs in slowly, the cause is that user's profile, such as corruption or a large roaming profile. Rebuilding the profile may be needed."},{"d":3,"q":"A PC's clock keeps drifting several minutes from the correct time, causing authentication failures on the domain. What should be checked?","o":["Time synchronization with the domain/NTP server","The screen resolution","The printer spooler","The USB controller"],"a":0,"e":"Kerberos needs clocks within about 5 minutes of each other. Check the Windows Time service and the NTP source, and consider the CMOS battery."},{"d":3,"q":"A Windows Update repeatedly fails to install with the same error code. What should the technician try?","o":["Run the Windows Update troubleshooter and check the error code","Replace the RAM","Disable the firewall permanently","Change the screen resolution"],"a":0,"e":"Look up the specific error code, run the troubleshooter, and consider clearing the SoftwareDistribution folder and running DISM and SFC."},{"d":3,"q":"A Windows PC shows 'Operating system not found' after a USB drive was left plugged in. What is the MOST likely cause?","o":["The firmware is trying to boot from the USB drive first","The SSD failed","Windows was deleted by malware","The RAM is bad"],"a":0,"e":"If USB comes before the internal drive in the boot order, a non-bootable USB stick can stop startup. Remove it or fix the boot order."},{"d":3,"q":"A user installed a new application, and now the PC is unstable. The application cannot be uninstalled normally. What is the BEST way to return the system to its prior state?","o":["Use System Restore to a point before the install","Reformat the drive","Replace the motherboard","Disable all services"],"a":0,"e":"System Restore rolls back system files, drivers, and registry settings without affecting personal files."},{"d":3,"q":"A user wants to reinstall Windows but keep their personal files, and is fine with reinstalling apps. Which option should be used?","o":["Reset this PC with 'Keep my files'","Clean install from USB with drive format","System Restore","Disk Cleanup"],"a":0,"e":"Reset this PC with 'Keep my files' reinstalls Windows and removes apps and settings, but keeps your personal files."},{"d":3,"q":"A USB device works on other PCs but is not recognized on one Windows PC. Which tool should the technician check FIRST?","o":["Device Manager","Disk Cleanup","Task Scheduler","msinfo32"],"a":0,"e":"Device Manager shows unknown devices and driver problems, and you can trigger a scan for hardware changes from it."},{"d":3,"q":"A smartphone app keeps crashing right after it opens. What should the technician try FIRST?","o":["Force stop the app and clear its cache, then update it","Factory reset the phone","Replace the battery","Disable cellular data"],"a":0,"e":"Start with the least disruptive fixes: force stop, clear the cache, update or reinstall the app, then restart the device."},{"d":3,"q":"A phone will not install the latest OS update. Which is the MOST likely cause?","o":["Insufficient storage space or the device is no longer supported","The Bluetooth is off","Screen brightness is too low","The SIM card is missing"],"a":0,"e":"Updates fail when there's not enough free space, the battery is low, or the device has reached end-of-support."},{"d":3,"q":"A mobile device is very slow, and its storage is 98% full. What should the technician recommend?","o":["Free up storage by removing unused apps and offloading media","Enable airplane mode","Replace the screen","Disable location services"],"a":0,"e":"Nearly full storage slows the device down. Clearing space restores performance."},{"d":3,"q":"A phone screen does not rotate when the device is turned sideways. What should the technician check FIRST?","o":["Whether rotation lock is enabled","The digitizer","The battery health","The Wi-Fi settings"],"a":0,"e":"Rotation lock is the most common reason. If that's not it, the app may not support rotation, or the accelerometer may have failed."},{"d":3,"q":"A user's phone shows unexpected high data usage, unknown apps, and the battery drains quickly. Which issue should be suspected?","o":["Malware on the mobile device","A faulty charging cable","Low screen brightness","A cracked case"],"a":0,"e":"Unknown apps, data spikes, and battery drain together suggest a compromised device. Remove suspicious apps, and factory reset if needed."},{"d":3,"q":"A user installed an app from outside the official app store and now sees frequent ads on the home screen. What is this practice called, and what risk does it introduce?","o":["Sideloading; it can introduce malware","Rooting; it improves security","Jailbreaking; it is required for updates","Tethering; it increases data use"],"a":0,"e":"Sideloading installs apps from unvetted sources and is a common way malware gets onto phones. MDM can block it."},{"d":3,"q":"A user can no longer log in to a company app after the phone was jailbroken. What is the MOST likely reason?","o":["MDM or the app detected the jailbreak and blocked access","The Wi-Fi password expired","The screen protector is too thick","The phone needs a new SIM"],"a":0,"e":"Jailbroken or rooted devices bypass OS security protections, so MDM and many corporate apps refuse to run on them."},{"d":3,"q":"After malware removal, the technician confirms the system is clean. Which of the following should be done BEFORE educating the user?","o":["Enable System Restore and create a new restore point","Disable antivirus","Delete all user files","Disconnect the PC permanently"],"a":0,"e":"Re-enable System Restore and create a clean restore point, then educate the user."},{"d":3,"q":"A user receives a message that their certificate has expired when connecting to an internal website. Other users have no issue. What should be checked FIRST?","o":["The date and time on the user's PC","The website's DNS record","The user's monitor","The printer queue"],"a":0,"e":"Certificate validation depends on the correct time. A wrong system clock can make a valid certificate appear expired or not yet valid."},{"d":3,"q":"Windows Defender reports that it cannot update and its real-time protection keeps turning off by itself. What should the technician suspect?","o":["Malware tampering with security software","A normal Windows behavior","A failing monitor","An expired Office license"],"a":0,"e":"Malware often disables security tools to protect itself. Investigate and use offline scanning tools."},{"d":3,"q":"Users report that a shared application runs very slowly only between 9:00 and 9:30 a.m. The technician finds an antivirus full scan is scheduled at 9:00 a.m. What should be done?","o":["Reschedule the scan to after hours","Uninstall the antivirus","Add more monitors","Disable Windows Update"],"a":0,"e":"Schedule resource-heavy tasks outside business hours so they don't slow down users."},{"d":3,"q":"A desktop app shows 'The application was unable to start correctly' and mentions a missing DLL. What is the BEST fix?","o":["Repair or reinstall the application or its required runtime","Replace the CPU","Run diskpart","Change the screen resolution"],"a":0,"e":"Missing or corrupt DLLs and runtimes (such as the Visual C++ Redistributable) are usually fixed by repairing or reinstalling the app or runtime."},{"d":3,"q":"Which Windows startup mode loads only the minimal set of drivers and services, which helps isolate software problems?","o":["Safe Mode","Fast Startup","Hibernate","Secure Boot"],"a":0,"e":"Safe Mode loads only essential drivers and services. If the problem disappears there, a third-party driver or app is likely the cause."},{"d":4,"q":"Before working inside a desktop PC, a technician puts on a strap connected to the chassis. What is the purpose?","o":["Prevent electrostatic discharge damage to components","Prevent electric shock from the PSU","Ground the monitor","Measure voltage"],"a":0,"e":"An ESD wrist strap equalizes static charge between you and the equipment, which protects sensitive components."},{"d":4,"q":"Which type of fire extinguisher should be used on an electrical fire in a server room?","o":["Class C (CO2 or clean agent)","Class A (water)","Class K","Class D"],"a":0,"e":"Class C extinguishers are for energized electrical fires. Water conducts electricity and is dangerous to use on them."},{"d":4,"q":"A technician needs safe handling and disposal information for a laser printer toner product. Which document should be consulted?","o":["Safety Data Sheet (SDS)","EULA","Acceptable use policy","Network diagram"],"a":0,"e":"Safety Data Sheets (formerly called MSDS) describe hazards, handling, first aid, and disposal."},{"d":4,"q":"What is the proper way to lift a heavy UPS unit?","o":["Bend at the knees and lift with the legs, keeping the back straight","Bend at the waist and lift with the back","Twist while lifting to save time","Lift quickly to reduce strain duration"],"a":0,"e":"Lift with your legs, keep the load close, and avoid twisting. Get help or use equipment for very heavy items."},{"d":4,"q":"A company wants servers to keep running long enough to shut down safely during a power outage. What should be installed?","o":["Uninterruptible power supply (UPS)","Surge suppressor only","Power strip","Line conditioner only"],"a":0,"e":"A UPS provides battery power during outages, and many can trigger an automatic shutdown."},{"d":4,"q":"Which backup type copies all files changed since the last FULL backup and does NOT reset the archive bit?","o":["Differential","Incremental","Full","Synthetic full"],"a":0,"e":"A differential grows each day until the next full backup, and a restore needs the full backup plus the latest differential. An incremental captures changes since the last backup of any kind."},{"d":4,"q":"Which backup strategy restores fastest, requiring only the last full backup plus ONE other backup set?","o":["Full plus differential","Full plus incremental","Incremental only","Daily copy"],"a":0,"e":"A restore needs the full backup plus the latest differential. Incremental restores need the full plus every incremental since then."},{"d":4,"q":"Which describes the 3-2-1 backup rule?","o":["Three copies of data, on two different media types, with one copy offsite","Three backups per day, two per week, one per month","Three servers, two sites, one cloud","Three full backups, two incrementals, one differential"],"a":0,"e":"3-2-1 means three copies of your data on two types of media, with one copy offsite. Many organizations also keep one copy offline or immutable."},{"d":4,"q":"An administrator wants to be sure backups can actually be restored. What should be done regularly?","o":["Test restores from backups","Delete old backups","Increase backup frequency only","Encrypt the backups only"],"a":0,"e":"A backup you've never test-restored can't be trusted. Regular restore tests confirm the data can be recovered."},{"d":4,"q":"Before making a major change to a production server, which document defines how to undo the change if it fails?","o":["Rollback plan","Acceptable use policy","Incident report","Asset tag"],"a":0,"e":"Change management requires a rollback (backout) plan in case the change causes problems."},{"d":4,"q":"In change management, what should be done before a change is implemented in production?","o":["Test it in a sandbox and get approval from the change advisory board","Implement it immediately during business hours","Notify users afterward only","Skip documentation for minor changes"],"a":0,"e":"Change management includes a request, risk analysis, sandbox testing, CAB approval, a rollback plan, and end-user acceptance."},{"d":4,"q":"A technician finds a user's personal information such as Social Security numbers stored on a shared drive. What type of data is this?","o":["PII","PCI","Public data","Open-source data"],"a":0,"e":"Personally identifiable information (PII) identifies a person and must be protected under policy and law. PCI refers to payment card data."},{"d":4,"q":"Which type of regulated data covers credit card numbers?","o":["PCI DSS data","PHI","GDPR only","EULA data"],"a":0,"e":"The Payment Card Industry Data Security Standard (PCI DSS) governs cardholder data."},{"d":4,"q":"A technician discovers illegal content on a user's workstation during a repair. What should the technician do FIRST?","o":["Stop, preserve the evidence, and report it per company policy","Delete the content","Continue the repair and ignore it","Copy the files to a USB drive for review"],"a":0,"e":"Follow incident response procedures: don't alter the evidence, report it to the proper authority, and preserve the chain of custody."},{"d":4,"q":"Which document tracks every person who handled evidence and when, so it stays admissible?","o":["Chain of custody","SDS","Rollback plan","Acceptable use policy"],"a":0,"e":"The chain of custody records who handled evidence and when, so it can be shown it wasn't tampered with."},{"d":4,"q":"A user wants to install software on 20 office computers but bought a single-user license. What is the issue?","o":["It violates the license agreement (EULA)","It is allowed for small businesses","It is fine if the software is uninstalled later","It is allowed if installed offline"],"a":0,"e":"Licenses define how many installs or users are allowed. Exceeding them is a licensing violation."},{"d":4,"q":"Which ticketing system practice is MOST important when documenting a resolved issue?","o":["Clear description of the problem, steps taken, and the resolution","Only the user's name","Only the time spent","The technician's personal opinions"],"a":0,"e":"Good tickets record the issue, the troubleshooting steps, and the resolution, so they can serve as a knowledge base for future tickets."},{"d":4,"q":"An organization tracks every laptop with a unique tag, assigned user, purchase date, and warranty status. What is this process?","o":["Asset management","Change management","Incident response","Patch management"],"a":0,"e":"Asset management keeps an inventory of hardware and software throughout its lifecycle."},{"d":4,"q":"Which file extension indicates a Windows PowerShell script?","o":[".ps1",".sh",".bat",".vbs"],"a":0,"e":".ps1 is PowerShell, .sh is a Linux shell script, .bat is a Windows batch file, and .vbs is VBScript."},{"d":4,"q":"Which file extension is used for a Linux shell script?","o":[".sh",".ps1",".bat",".js"],"a":0,"e":".sh files are run by shells such as bash."},{"d":4,"q":"A technician writes a script to map network drives at login. Which is a key risk of running scripts?","o":["A script can make unintended system changes or introduce malware if untested","Scripts always require more RAM","Scripts cannot run on domain computers","Scripts disable the firewall automatically"],"a":0,"e":"Untested scripts can cause unintended changes, crash systems, or open security holes. Test them and use code signing."},{"d":4,"q":"A help desk needs to securely access and manage remote employees' PCs, including pushing patches and monitoring health. Which tool is BEST?","o":["Remote monitoring and management (RMM)","Telnet","An FTP server","A KVM switch"],"a":0,"e":"RMM platforms provide remote control, patching, monitoring, and alerting at scale."},{"d":4,"q":"Which remote access method is MOST secure for administering a Linux server's command line?","o":["SSH","Telnet","FTP","HTTP"],"a":0,"e":"SSH encrypts the session. Telnet sends everything, including credentials, in plaintext."},{"d":4,"q":"While on a service call, a technician's personal phone rings repeatedly. What is the MOST professional action?","o":["Silence the phone and return calls after the job","Answer and talk while working","Put the call on speaker","Ask the customer to wait outside"],"a":0,"e":"Avoid distractions. Keep the focus on the customer and use personal devices only when appropriate."},{"d":4,"q":"A customer is upset that
