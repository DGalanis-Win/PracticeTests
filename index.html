. Pen testing simulates attacks on running systems."}, {"d": 4, "q": "A software vendor wants customers to be able to verify that its installer has not been modified and truly came from the vendor. Which of the following should it use?", "o": ["Code signing", "Obfuscation", "Input validation", "Sandboxing"], "a": 0, "e": "Code signing attaches a digital signature that proves both origin and integrity. Why not the others: Obfuscation makes code hard to read. Input validation checks data. Sandboxing isolates execution."}, {"d": 4, "q": "A security analyst opens a suspicious email attachment in an isolated virtual environment to observe its behavior without risking the network. Which of the following is this?", "o": ["Sandboxing", "Hardening", "Tokenization", "Geofencing"], "a": 0, "e": "A sandbox is an isolated environment for running untrusted code safely. Why not the others: Hardening reduces attack surface. Tokenization protects data. Geofencing uses location."}, {"d": 4, "q": "Which of the following should happen FIRST when a new laptop is purchased and received by the IT department?", "o": ["Add it to the asset inventory with an assigned owner", "Wipe the drive and issue a certificate of destruction", "Run a full penetration test against it", "Assign it to the data retention schedule"], "a": 0, "e": "Asset management starts by recording the asset and assigning ownership. You can't secure what you don't know you have. Why not the others: Wiping, destroying and certificates of destruction happen at disposal. Pen tests aren't an acquisition step."}, {"d": 4, "q": "A company is disposing of old hard drives that contained sensitive data and wants proof that the drives were destroyed. Which of the following should it obtain from the disposal vendor?", "o": ["Certificate of destruction", "Service level agreement", "Memorandum of understanding", "Chain of custody for forensic evidence"], "a": 0, "e": "A certificate of destruction documents that the media was destroyed, which supports compliance. Why not the others: An SLA defines service levels. An MOU is an informal agreement. Forensic chain of custody is for evidence."}, {"d": 4, "q": "A company wants to reuse old SSDs in another department after removing all data. Which of the following is the BEST approach?", "o": ["Sanitize the drives using a secure erase method", "Delete the files and empty the recycle bin", "Quick format the drives", "Physically shred the drives"], "a": 0, "e": "Sanitization (secure erase or cryptographic erase) removes data so it can't be recovered and leaves the drive reusable. Why not the others: Deleting and quick formatting leave data recoverable. Shredding prevents reuse."}, {"d": 4, "q": "A regulation requires the company to keep financial records for seven years and then dispose of them. Which of the following asset management concepts does this address?", "o": ["Data retention", "Data sovereignty", "Classification", "Enumeration"], "a": 0, "e": "Data retention sets how long data must be kept before disposal. Why not the others: Sovereignty is about jurisdiction. Classification is about sensitivity. Enumeration is discovering assets."}, {"d": 4, "q": "A vulnerability scan reports a critical flaw on a server, but investigation shows the patch is already installed and the scanner misread the version. Which of the following is this?", "o": ["False positive", "False negative", "True positive", "True negative"], "a": 0, "e": "A false positive reports a vulnerability that isn't really there. Why not the others: A false negative misses a real one. A true positive correctly reports a real flaw. A true negative correctly reports none."}, {"d": 4, "q": "Which of the following is the MOST dangerous result of a vulnerability scan because it creates a false sense of security?", "o": ["False negative", "False positive", "True positive", "Informational finding"], "a": 0, "e": "A false negative means a real vulnerability went undetected, so nobody fixes it. Why not the others: False positives waste time but aren't dangerous. True positives are correct. Informational findings are low risk."}, {"d": 4, "q": "A vulnerability scanner authenticates to servers with administrator credentials to inspect installed software and configurations. Which of the following scan types is this?", "o": ["Credentialed scan", "Non-credentialed scan", "Passive scan", "Port scan only"], "a": 0, "e": "Credentialed scans log in to the system and see far more, with fewer false positives. Why not the others: Non-credentialed scans see only what an outsider sees. Passive scans watch traffic. A port scan only finds open ports."}, {"d": 4, "q": "Which of the following provides a standardized numeric score from 0 to 10 indicating the severity of a vulnerability?", "o": ["CVSS", "CVE", "SCAP", "STIX"], "a": 0, "e": "The Common Vulnerability Scoring System rates severity from 0 to 10. Why not the others: CVE is a unique ID for a vulnerability. SCAP is a set of standards for automating compliance. STIX is a format for sharing threat intelligence."}, {"d": 4, "q": "Which of the following provides a unique identifier, such as CVE-2024-12345, for a publicly known vulnerability?", "o": ["Common Vulnerabilities and Exposures (CVE)", "Common Vulnerability Scoring System (CVSS)", "Open Vulnerability and Assessment Language (OVAL)", "MITRE ATT&CK technique ID"], "a": 0, "e": "CVE gives each known vulnerability a unique ID. Why not the others: CVSS scores severity. OVAL describes system checks. ATT&CK catalogs attacker tactics and techniques."}, {"d": 4, "q": "Two servers have the same critical vulnerability. One is internet-facing and the other is on an isolated lab network. Which of the following explains why they should be prioritized differently?", "o": ["Environmental variables and exposure", "The CVE number", "The vulnerability's CVSS base score", "The scanner vendor"], "a": 0, "e": "The same flaw carries different risk depending on exposure and environment, so the internet-facing server comes first. Why not the others: The CVE and base score are identical for both. The scanner vendor doesn't change risk."}, {"d": 4, "q": "A critical patch cannot be applied for 60 days because it would break a business application. The risk is formally documented and approved by management. Which of the following is this?", "o": ["Exception", "Remediation", "Rescan", "False positive"], "a": 0, "e": "An exception (exemption) formally accepts a vulnerability for a period, usually with compensating controls. Why not the others: Remediation fixes the flaw. A rescan checks a fix. A false positive isn't a real flaw."}, {"d": 4, "q": "After applying patches for scan findings, what is the BEST way to confirm the vulnerabilities were remediated?", "o": ["Rescan the systems", "Close the tickets", "Update the risk register", "Send a report to management"], "a": 0, "e": "Rescanning confirms the vulnerabilities are actually gone. Why not the others: Closing tickets, updating records and reporting should come after validation."}, {"d": 4, "q": "A company invites outside researchers to find and report vulnerabilities in its website in exchange for monetary rewards. Which of the following is this?", "o": ["Bug bounty program", "Tabletop exercise", "Internal audit", "Red team exercise performed by employees"], "a": 0, "e": "A bug bounty pays outside researchers for responsibly reported vulnerabilities. Why not the others: A tabletop is a discussion exercise. An internal audit is done by staff. A red team made up of employees isn't outside researchers being paid per finding."}, {"d": 4, "q": "A security analyst subscribes to a feed that provides indicators of compromise such as malicious IP addresses and file hashes. Which of the following is this?", "o": ["Threat intelligence feed", "Vulnerability scan", "SIEM correlation rule", "Penetration test report"], "a": 0, "e": "A threat feed supplies IoCs and intelligence about current threats. Why not the others: Scans find flaws. Correlation rules analyze logs. Pen test reports describe a test."}, {"d": 4, "q": "An analyst gathers information about a target from public sources such as social media, news, and company websites. Which of the following is this?", "o": ["OSINT", "Dark web purchase", "Credentialed scanning", "Port scanning"], "a": 0, "e": "OSINT is intelligence gathered from publicly available sources. Why not the others: Dark web sources aren't open/public in the OSINT sense. Credentialed scans and port scans actively probe systems."}, {"d": 4, "q": "Which of the following tools collects logs from many sources, correlates events, and generates alerts for security analysts?", "o": ["SIEM", "DLP", "NAC", "HSM"], "a": 0, "e": "A SIEM aggregates and correlates logs and raises alerts. Why not the others: DLP stops data leaks. NAC controls network access. An HSM protects keys."}, {"d": 4, "q": "Analysts are overwhelmed by thousands of SIEM alerts per day, most of which are benign. Which of the following should they do?", "o": ["Alert tuning", "Disable logging", "Quarantine all hosts", "Increase log retention"], "a": 0, "e": "Tuning adjusts rules and thresholds to cut false positives while keeping real alerts. Why not the others: Disabling logging creates blind spots. Quarantining everything breaks operations. Longer retention doesn't reduce alerts."}, {"d": 4, "q": "Which of the following protocols collects metadata about network flows, such as source, destination, ports, and byte counts, without capturing full packet contents?", "o": ["NetFlow", "Full packet capture", "SNMP traps", "Syslog"], "a": 0, "e": "NetFlow (or IPFIX) records flow metadata: who talked to whom, on which ports, and how much. Why not the others: Packet capture records full contents. SNMP traps are device alerts. Syslog carries log messages."}, {"d": 4, "q": "A network device sends an unsolicited message to the monitoring server when an interface goes down. Which of the following is this?", "o": ["SNMP trap", "NetFlow record", "Syslog query", "SCAP benchmark"], "a": 0, "e": "An SNMP trap is an alert the agent pushes to the manager when an event happens. Why not the others: NetFlow is flow data. A syslog 'query' isn't how syslog works. SCAP benchmarks are configuration standards."}, {"d": 4, "q": "Which of the following provides a set of standards to automate vulnerability management and compliance checking against configuration benchmarks?", "o": ["SCAP", "SNMP", "SAML", "SFTP"], "a": 0, "e": "SCAP (Security Content Automation Protocol) standardizes automated configuration and vulnerability checks. Why not the others: SNMP is device monitoring. SAML is federated login. SFTP is file transfer."}, {"d": 4, "q": "Which of the following would an organization use as a hardening guide for configuring operating systems securely?", "o": ["CIS Benchmarks", "MITRE ATT&CK", "CVE list", "OWASP Top 10 for APIs only"], "a": 0, "e": "CIS Benchmarks give detailed, consensus-based hardening settings for OSs and applications. Why not the others: ATT&CK describes attacker behavior. CVE lists vulnerabilities. OWASP lists web app risks."}, {"d": 4, "q": "A firewall rule list ends with a rule that denies all traffic not explicitly allowed by earlier rules. Which of the following is this?", "o": ["Implicit deny", "Allow list exception", "Stateful inspection", "Port forwarding"], "a": 0, "e": "Implicit deny blocks anything not specifically allowed. Why not the others: An exception allows something specific. Stateful inspection tracks connections. Port forwarding redirects traffic."}, {"d": 4, "q": "A firewall administrator needs to allow secure web traffic to a server. Which port should be opened?", "o": ["TCP 443", "TCP 80", "TCP 23", "UDP 161"], "a": 0, "e": "HTTPS uses TCP 443. Why not the others: 80 is unencrypted HTTP. 23 is Telnet. 161 is SNMP."}, {"d": 4, "q": "Which of the following port and protocol combinations should be blocked at the perimeter because it provides insecure remote access?", "o": ["TCP 23 (Telnet)", "TCP 22 (SSH)", "TCP 443 (HTTPS)", "TCP 636 (LDAPS)"], "a": 0, "e": "Telnet sends credentials and data in cleartext. Why not the others: SSH, HTTPS and LDAPS are encrypted."}, {"d": 4, "q": "An IDS detects attacks by comparing traffic against a database of known attack patterns. Which detection method is this?", "o": ["Signature-based", "Anomaly-based", "Heuristic", "Behavioral baseline"], "a": 0, "e": "Signature-based detection matches known patterns. It's accurate for known attacks but misses new ones. Why not the others: Anomaly, heuristic and behavioral methods flag deviations from normal and can catch unknown attacks."}, {"d": 4, "q": "An IDS learns normal network behavior over two weeks and alerts when traffic deviates significantly. Which detection method is this?", "o": ["Anomaly-based", "Signature-based", "Rule-based ACL", "Reputation-based"], "a": 0, "e": "Anomaly-based detection builds a baseline and alerts on deviations, which can catch zero-days. Why not the others: Signature matches known patterns. ACLs filter traffic. Reputation uses known-bad lists."}, {"d": 4, "q": "A company blocks employees from visiting gambling and adult websites by category. Which of the following is this?", "o": ["Web filter content categorization", "DNS sinkhole for malware domains", "Switch port security", "Geofencing by location"], "a": 0, "e": "Web filters group sites into categories and block by category. Why not the others: Sinkholes target malicious domains. Port security limits MACs on switch ports. Geofencing uses location."}, {"d": 4, "q": "A company's laptops are frequently used off-site. It wants web filtering to apply even when users are not on the corporate network. Which of the following is BEST?", "o": ["Agent-based web filtering", "Centralized on-premises proxy only", "Firewall ACL at headquarters", "Port mirroring"], "a": 0, "e": "An agent on the laptop enforces filtering wherever it goes. Why not the others: An on-site proxy or HQ firewall only covers traffic that passes through them. Port mirroring copies traffic."}, {"d": 4, "q": "Which of the following email security mechanisms lists the IP addresses authorized to send mail for a domain?", "o": ["SPF", "DKIM", "DMARC", "S/MIME"], "a": 0, "e": "SPF is a DNS TXT record listing which servers may send mail for the domain. Why not the others: DKIM signs messages. DMARC sets policy and reporting using SPF and DKIM. S/MIME encrypts or signs individual messages."}, {"d": 4, "q": "Which of the following email security mechanisms adds a digital signature to message headers so receivers can verify the message was not altered and came from the domain?", "o": ["DKIM", "SPF", "DMARC", "MX record"], "a": 0, "e": "DKIM signs messages with the domain's private key. Receivers verify with the public key published in DNS. Why not the others: SPF lists authorized IPs. DMARC sets policy. MX records route mail."}, {"d": 4, "q": "A company wants receiving mail servers to reject messages that fail SPF and DKIM checks and to send reports about them. Which of the following should it publish?", "o": ["DMARC", "DNSSEC", "SPF only", "A CNAME record"], "a": 0, "e": "DMARC tells receivers what to do when SPF/DKIM fail (none, quarantine, reject) and where to send reports. Why not the others: DNSSEC signs DNS records. SPF alone has no reporting or alignment policy. A CNAME is an alias."}, {"d": 4, "q": "A security team wants to be alerted whenever critical system files on a server are modified. Which of the following should it implement?", "o": ["File integrity monitoring (FIM)", "Data loss prevention (DLP)", "NetFlow traffic monitoring", "Category-based web filtering"], "a": 0, "e": "FIM hashes important files and alerts when they change. Why not the others: DLP watches for data leaving. NetFlow tracks traffic. Web filtering controls browsing."}, {"d": 4, "q": "A company wants to block employees from emailing files that contain credit card numbers to external addresses. Which of the following should it use?", "o": ["Data loss prevention (DLP)", "File integrity monitoring", "IDS", "Load balancer"], "a": 0, "e": "DLP inspects content for sensitive patterns like card numbers and blocks unauthorized transfers. Why not the others: FIM detects file changes. An IDS detects attacks. A load balancer spreads traffic."}, {"d": 4, "q": "Before allowing a laptop onto the network, a system checks that it has current antivirus definitions and patches. Noncompliant devices are placed in a remediation VLAN. Which of the following is this?", "o": ["Network access control (NAC)", "Data loss prevention (DLP)", "Security information and event management (SIEM)", "Endpoint detection and response (EDR)"], "a": 0, "e": "NAC checks device posture before granting access and can quarantine devices that don't comply. Why not the others: DLP stops data leaks. A SIEM correlates logs. EDR monitors endpoint behavior."}, {"d": 4, "q": "Which of the following tools continuously monitors endpoints for suspicious behavior, records activity, and allows analysts to isolate a compromised host remotely?", "o": ["Endpoint detection and response (EDR)", "Traditional signature antivirus only", "Web application firewall", "Proxy server"], "a": 0, "e": "EDR records endpoint activity, detects suspicious behavior and supports response actions like isolating a host. Why not the others: Traditional AV matches signatures. A WAF protects web apps. A proxy forwards web requests."}, {"d": 4, "q": "A solution correlates telemetry from endpoints, network, email, and cloud workloads into a single detection and response platform. Which of the following is this?", "o": ["XDR", "EDR on a single host", "UTM", "NAC"], "a": 0, "e": "XDR (extended detection and response) extends EDR across many data sources. Why not the others: EDR covers endpoints only. UTM is an on-site gateway appliance. NAC controls network access."}, {"d": 4, "q": "A tool establishes a baseline of each user's normal activity and alerts when an account suddenly downloads far more data than usual at 3 a.m. Which of the following is this?", "o": ["User behavior analytics", "Signature-based IDS", "Switch port security", "Group Policy Objects"], "a": 0, "e": "UBA (UEBA) baselines user behavior and flags anomalies. Why not the others: Signature IDS matches known patterns. Port security limits switch ports. Group Policy configures Windows settings."}, {"d": 4, "q": "A Windows administrator needs to enforce password length and screen lock settings on all domain-joined computers. Which of the following should be used?", "o": ["Group Policy", "SELinux", "MDM for iOS only", "SNMP"], "a": 0, "e": "Group Policy (GPO) pushes security settings to domain-joined Windows machines. Why not the others: SELinux is Linux mandatory access control. iOS MDM doesn't manage Windows domain machines. SNMP is monitoring."}, {"d": 4, "q": "Which of the following provides mandatory access control enforcement on Linux systems?", "o": ["SELinux", "Group Policy", "NTFS permissions", "Kerberos"], "a": 0, "e": "SELinux enforces mandatory access control policies on Linux. Why not the others: Group Policy and NTFS are Windows. Kerberos is authentication."}, {"d": 4, "q": "Users who visit known malicious domains have their DNS queries answered with the IP address of a safe internal server instead. Which of the following is this?", "o": ["DNS filtering / sinkholing", "DNSSEC", "DNS poisoning by an attacker", "Round-robin DNS"], "a": 0, "e": "DNS filtering or sinkholing redirects or blocks lookups for known bad domains. Why not the others: DNSSEC verifies DNS records. Poisoning is malicious. Round-robin spreads load across servers."}, {"d": 4, "q": "An employee leaves the company. Which of the following should happen IMMEDIATELY to reduce risk?", "o": ["Disable the employee's accounts and revoke access", "Delete all of the employee's files and mailbox", "Reimage every workstation in the department", "Reset the passwords of all other users"], "a": 0, "e": "Deprovisioning by disabling accounts and revoking access right away stops a former employee from getting back in. Why not the others: Files may need to be kept for business or legal reasons. Reimaging every machine and resetting everyone's password is unnecessary."}, {"d": 4, "q": "A user signs in once to the corporate portal and can then access email, HR, and payroll applications without logging in again. Which of the following is this?", "o": ["Single sign-on (SSO)", "Multifactor authentication", "Federation between two separate companies only", "Password vaulting"], "a": 0, "e": "SSO means one authentication grants access to many applications. Why not the others: MFA uses multiple factors. Federation extends trust across organizations (and can enable SSO, but isn't the same thing). Vaulting stores privileged passwords."}, {"d": 4, "q": "Which of the following XML-based standards is commonly used to exchange authentication assertions between an identity provider and a web-based service provider for SSO?", "o": ["SAML", "OAuth", "LDAP", "RADIUS"], "a": 0, "e": "SAML sends XML assertions from an IdP to a service provider. Why not the others: OAuth is for authorization (delegated access). LDAP is directory access. RADIUS is network AAA."}, {"d": 4, "q": "A mobile app asks the user for permission to access their photos stored in a cloud service without receiving the user's cloud password. Which of the following is being used?", "o": ["OAuth", "SAML", "Kerberos", "TACACS+"], "a": 0, "e": "OAuth grants delegated authorization through tokens, so the app never sees your password. Why not the others: SAML is mainly for web SSO authentication. Kerberos is internal network authentication. TACACS+ is device admin AAA."}, {"d": 4, "q": "Two partner companies configure trust so employees of one can access the other's applications using their own corporate credentials. Which of the following is this?", "o": ["Federation", "Least privilege", "Attestation", "Time-of-day restrictions"], "a": 0, "e": "Federation links identity systems across organizations so they trust each other's authentication. Why not the others: Least privilege limits permissions. Attestation certifies access is still appropriate. Time-of-day restrictions limit when logins can happen."}, {"d": 4, "q": "Managers must review and certify every quarter that their team members' access rights are still appropriate. Which of the following is this?", "o": ["Access attestation / recertification", "Identity proofing of each employee", "Automated account provisioning", "Federation with a partner directory"], "a": 0, "e": "Attestation (access review) periodically confirms that access is still needed. Why not the others: Identity proofing verifies who someone is at enrollment. Provisioning creates accounts. Federation links identity systems."}, {"d": 4, "q": "Access to files is determined by the user's job role, such as 'Nurse' or 'Billing Clerk'. Which access control model is this?", "o": ["Role-based access control (RBAC)", "Mandatory access control (MAC)", "Discretionary access control (DAC)", "Rule-based access control"], "a": 0, "e": "RBAC assigns permissions to roles, and users get them through the roles they hold. Why not the others: MAC uses labels and clearances. DAC lets owners decide. Rule-based uses system-wide rules like time or IP."}, {"d": 4, "q": "A military system grants access based on security labels such as Secret and Top Secret and the user's clearance. Users cannot change these permissions. Which access control model is this?", "o": ["Mandatory access control (MAC)", "Discretionary access control (DAC)", "Role-based access control", "Attribute-based access control"], "a": 0, "e": "MAC is centrally enforced through classification labels and clearances, and users can't override it. Why not the others: DAC lets owners grant access. RBAC uses job roles. ABAC uses many attributes."}, {"d": 4, "q": "The owner of a file on a workstation decides which coworkers can read or modify it. Which access control model is this?", "o": ["Discretionary access control", "Mandatory access control", "Role-based access control", "Rule-based access control"], "a": 0, "e": "In DAC, the resource owner sets permissions, as with standard NTFS file shares. Why not the others: MAC is label-based. RBAC is role-based. Rule-based uses system-wide rules."}, {"d": 4, "q": "Access to a cloud resource is granted only if the user is in the Finance department, using a managed device, located in the U.S., and connecting during business hours. Which access control model is this?", "o": ["Attribute-based access control", "Discretionary access control", "Mandatory access control", "Role-based access control"], "a": 0, "e": "ABAC weighs several attributes of the user, device, resource and environment. Why not the others: DAC is owner-based. MAC is label-based. RBAC uses only roles."}, {"d": 4, "q": "Which of the following is an example of 'something you have'?", "o": ["A hardware security key", "A fingerprint scan", "A memorized PIN", "Your GPS location"], "a": 0, "e": "A physical token or security key is a possession factor. Why not the others: A fingerprint is something you are. A PIN is something you know. GPS location is somewhere you are."}, {"d": 4, "q": "A user logs in with a password and a PIN. How many authentication factor types are being used?", "o": ["One", "Two", "Three", "Zero"], "a": 0, "e": "A password and a PIN are both something you know, so this is one factor type. It isn't MFA. Why not the others: MFA needs different categories, such as know + have."}, {"d": 4, "q": "Which of the following authentication methods is MOST resistant to phishing?", "o": ["FIDO2 security key", "SMS one-time passcode", "Security questions", "Email-based one-time link"], "a": 0, "e": "FIDO2/WebAuthn keys are tied to the real site's origin, so a fake site can't use them. Why not the others: SMS codes can be phished or SIM-swapped. Security questions can be guessed or researched. Email links can be phished."}, {"d": 4, "q": "A user authenticates with a fingerprint on a laptop and no password is ever entered. Which of the following concepts is this?", "o": ["Passwordless authentication", "Password vaulting", "Single-factor password authentication", "Federation"], "a": 0, "e": "Passwordless authentication uses biometrics, keys or passkeys instead of a password. Why not the others: Vaulting stores passwords. No password is used here. Federation is cross-organization trust."}, {"d": 4, "q": "Administrators request elevated rights that are granted only for a limited time and are automatically revoked afterward. Which of the following is this?", "o": ["Just-in-time (JIT) permissions", "Permanent domain admin rights", "Discretionary access", "Single sign-on"], "a": 0, "e": "JIT access grants privileges only when needed and only for a set time, which shrinks standing privilege. This is part of PAM. Why not the others: Permanent rights are the risk JIT removes. DAC is owner-based. SSO is about logging in once."}, {"d": 4, "q": "Privileged account passwords are stored in a secured system that checks them out to administrators and rotates them after use. Which of the following is this?", "o": ["Password vaulting", "Password spraying", "Key escrow for encryption keys", "Self-service password reset"], "a": 0, "e": "A PAM password vault stores, checks out and rotates privileged credentials. Why not the others: Spraying is an attack. Key escrow is for encryption keys. Self-service reset is for users."}, {"d": 4, "q": "Which of the following BEST describes the principle of least privilege?", "o": ["Users get only the access their job requires", "All users get admin rights for convenience", "Access is granted based on seniority", "Users can grant themselves permissions"], "a": 0, "e": "Least privilege gives only the access a job requires, which limits damage from mistakes or compromise. Why not the others: The other options all give excess access."}, {"d": 4, "q": "Before issuing a new employee their credentials, HR verifies their identity using a government-issued ID. Which of the following is this?", "o": ["Identity proofing", "Attestation", "Accounting", "Federation"], "a": 0, "e": "Identity proofing confirms a person is who they claim to be before credentials are issued. Why not the others: Attestation reviews existing access. Accounting tracks activity. Federation links identity providers."}, {"d": 4, "q": "A security team writes a script that automatically disables a user account and creates a ticket when the SIEM detects impossible travel. Which of the following BEST describes this?", "o": ["Automation and orchestration", "Manual incident response", "Proactive threat hunting", "Tabletop exercise"], "a": 0, "e": "Automating response actions and ticket creation is security automation and orchestration (SOAR). Why not the others: Manual response needs a person. Threat hunting is proactive searching. A tabletop is a discussion exercise."}, {"d": 4, "q": "Which of the following is a potential DRAWBACK of extensive security automation?", "o": ["More complexity and a possible single point of failure", "Faster response times to common alerts", "More consistent enforcement of security baselines", "Reduced workload for analysts handling tickets"], "a": 0, "e": "Automation adds complexity, technical debt and a failure point if the scripts or platform break. Why not the others: Faster response, consistency and less workload are benefits."}, {"d": 4, "q": "Automated guardrails in a cloud environment prevent developers from creating storage buckets that are publicly accessible. Which of the following benefits does this provide?", "o": ["Enforcing baselines and preventing misconfigurations", "Increasing the technical debt of the platform", "Removing the need for any security monitoring", "Eliminating all vulnerabilities in deployed code"], "a": 0, "e": "Guardrails enforce security baselines automatically and prevent common misconfigurations. Why not the others: Guardrails reduce technical debt rather than add it, and they don't replace monitoring or remove every vulnerability."}, {"d": 4, "q": "Which of the following is the FIRST phase of the incident response process?", "o": ["Preparation", "Detection", "Containment", "Lessons learned"], "a": 0, "e": "Preparation (plans, tools, training) comes first. The order is preparation, detection, analysis, containment, eradication, recovery, lessons learned. Why not the others: Detection, containment and lessons learned come later."}, {"d": 4, "q": "During an incident, an analyst disconnects an infected server from the network to stop the malware from spreading. Which incident response phase is this?", "o": ["Containment", "Eradication", "Recovery", "Preparation"], "a": 0, "e": "Containment limits the spread and damage. Isolating the host is the classic example. Why not the others: Eradication removes the threat. Recovery restores operations. Preparation happens before the incident."}, {"d": 4, "q": "After containing an incident, the team removes malware, deletes attacker-created accounts, and patches the exploited vulnerability. Which phase is this?", "o": ["Eradication", "Containment", "Recovery", "Detection"], "a": 0, "e": "Eradication removes the threat and its root cause. Why not the others: Containment stops the spread. Recovery restores systems to normal. Detection finds the incident."}, {"d": 4, "q": "The incident response team holds a meeting after an incident to discuss what went well and what should be improved. Which phase is this?", "o": ["Lessons learned", "Containment", "Preparation", "Analysis"], "a": 0, "e": "The post-incident review (lessons learned) improves future response and feeds back into preparation. Why not the others: The other phases happen during or before the incident."}, {"d": 4, "q": "Systems are restored from clean backups, monitored closely, and returned to production. Which incident response phase is this?", "o": ["Recovery", "Eradication", "Detection", "Containment"], "a": 0, "e": "Recovery returns systems to normal operation and monitors them. Why not the others: Eradication removes the threat. Detection identifies it. Containment limits it."}, {"d": 4, "q": "Analysts proactively search through logs and endpoint data for signs of attackers that existing tools have not alerted on. Which of the following is this?", "o": ["Threat hunting", "Vulnerability scanning", "Alert tuning", "Penetration testing"], "a": 0, "e": "Threat hunting assumes a breach and actively looks for undetected threats. Why not the others: Scanning finds flaws. Tuning adjusts alerts. Pen testing simulates attacks."}, {"d": 4, "q": "After a breach, the team determines that the underlying cause was an unpatched VPN appliance. Which of the following activities was performed?", "o": ["Root cause analysis", "Tabletop exercise", "Legal hold", "Identity proofing"], "a": 0, "e": "Root cause analysis identifies the fundamental reason an incident happened. Why not the others: A tabletop is an exercise. A legal hold preserves data. Identity proofing verifies identity."}, {"d": 4, "q": "An investigator documents every person who handled a seized hard drive, when, and why. Which of the following is this?", "o": ["Chain of custody", "Legal hold", "Data retention", "Right to audit"], "a": 0, "e": "Chain of custody records who handled evidence and when, so it holds up in court. Why not the others: A legal hold preserves data for litigation. Retention is a records policy. Right to audit is a contract clause."}, {"d": 4, "q": "A company's legal department instructs IT to preserve all emails related to a pending lawsuit and suspend normal deletion policies. Which of the following is this?", "o": ["Legal hold", "Chain of custody", "E-discovery production", "Data sanitization"], "a": 0, "e": "A legal hold suspends normal deletion so relevant data is preserved for litigation. Why not the others: Chain of custody tracks evidence handling. E-discovery is the process of finding and producing data. Sanitization destroys data."}, {"d": 4, "q": "When collecting digital evidence, which of the following should be collected FIRST according to the order of volatility?", "o": ["CPU registers and cache", "Hard drive contents", "Backup tapes", "Archived log files"], "a": 0, "e": "The most volatile data (registers, cache, then RAM) disappears first, so it's collected first. Why not the others: Disks, backups and archives last much longer."}, {"d": 4, "q": "Before analyzing a suspect's hard drive, a forensic investigator creates a bit-for-bit copy and calculates its hash. Why is the hash calculated?", "o": ["To prove the copy has not been altered", "To encrypt the image so it cannot be read", "To compress the image for faster transport", "To identify which suspect created the files"], "a": 0, "e": "Hashing the original and the image proves they match and that the evidence wasn't altered. Why not the others: Hashing doesn't encrypt, compress or identify anyone."}, {"d": 4, "q": "Which of the following prevents a forensic workstation from modifying a suspect drive while an image is being created?", "o": ["Write blocker", "Faraday bag", "TPM chip", "Degausser"], "a": 0, "e": "A write blocker allows reads and blocks any writes to the evidence drive. Why not the others: A Faraday bag blocks wireless signals to mobile devices. A TPM stores keys. A degausser erases magnetic media."}, {"d": 4, "q": "A seized smartphone must be prevented from receiving a remote wipe command before it reaches the lab. Which of the following should be used?", "o": ["Faraday bag", "Write blocker", "Hash calculation", "Legal hold notice"], "a": 0, "e": "A Faraday bag blocks cellular, Wi-Fi and Bluetooth signals, so remote wipes can't arrive. Why not the others: A write blocker is for drives. Hashing proves integrity. A legal hold is a legal instruction."}, {"d": 4, "q": "An analyst investigating suspected data exfiltration wants to see the actual contents of network traffic between two hosts. Which data source is BEST?", "o": ["Packet capture", "NetFlow", "Firewall deny logs", "Vulnerability scan"], "a": 0, "e": "A packet capture records full packet contents (payloads). Why not the others: NetFlow is metadata only. Deny logs show blocked traffic. Scans show weaknesses."}, {"d": 4, "q": "An analyst wants to know which internal hosts connected to a known malicious IP address over the past month without storing full packet contents. Which data source is BEST?", "o": ["NetFlow records", "Full packet capture", "Application error logs", "Badge reader logs"], "a": 0, "e": "NetFlow keeps lightweight flow records over long periods, which suits who-talked-to-whom questions. Why not the others: Full captures are too big to keep for a month. App errors and badge logs don't show network connections."}, {"d": 4, "q": "Which of the following log sources would BEST show whether a user's attempt to connect to a blocked port was denied at the network perimeter?", "o": ["Firewall logs", "Application logs", "Endpoint antivirus logs", "Metadata in an email header"], "a": 0, "e": "Firewall logs record allowed and denied connections at the perimeter. Why not the others: Application, antivirus and email metadata don't record perimeter decisions."}, {"d": 4, "q": "Which Windows log would an analyst review to find successful and failed logon events on a server?", "o": ["Security log", "Application log", "System log", "Setup log"], "a": 0, "e": "The Windows Security log records authentication events (such as 4624 success and 4625 failure) when auditing is enabled. Why not the others: Application logs are app events. System logs are OS and driver events. Setup logs cover installations."}, {"d": 4, "q": "Which of the following is the BEST way to give executives a real-time, high-level view of the organization's security posture?", "o": ["A dashboard", "Raw packet captures", "Individual syslog entries", "Full vulnerability scan exports"], "a": 0, "e": "Dashboards summarize key metrics visually for quick understanding. Why not the others: Raw captures, log entries and scan exports are too detailed for executives."}, {"d": 4, "q": "A user receives an email with a link. An analyst examines the email headers to see the sending server and route the message took. Which data source is this?", "o": ["Metadata", "Packet capture", "Vulnerability scan", "NetFlow"], "a": 0, "e": "Email headers are metadata: data about the message such as servers, timestamps and routing. Why not the others: The other options are different data sources."}, {"d": 4, "q": "Which of the following BEST describes the purpose of a playbook in a security operations center?", "o": ["Step-by-step procedures for responding to a specific type of incident", "A legal agreement that defines a vendor's responsibilities", "An inventory list of all company hardware and software assets", "A high-level statement of management's security intent"], "a": 0, "e": "A playbook (runbook) gives repeatable response steps for a specific scenario, like phishing or ransomware. Why not the others: A vendor agreement is a contract. An asset list is an inventory. A policy is high-level governance."}, {"d": 4, "q": "A SIEM alert indicates a workstation is beaconing to a command-and-control server. Which of the following is the MOST appropriate immediate response?", "o": ["Quarantine the workstation", "Delete the SIEM alert", "Reimage all servers", "Notify all customers"], "a": 0, "e": "Isolating (quarantining) the host stops C2 communication and lateral movement while you investigate. Why not the others: Deleting the alert ignores the problem. Reimaging all servers is excessive. Notifying customers is premature."}, {"d": 4, "q": "Which of the following should be used to securely store and synchronize logs from many systems in one location for analysis and retention?", "o": ["Log aggregation", "Port mirroring", "Tokenization", "DHCP"], "a": 0, "e": "Log aggregation collects logs centrally, often into a SIEM, for correlation and retention. Why not the others: Port mirroring copies traffic. Tokenization protects data. DHCP assigns addresses."}, {"d": 4, "q": "Users connecting to a public Wi-Fi hotspot must accept terms on a web page before getting internet access. Which of the following is this?", "o": ["Captive portal", "WPA3-Enterprise", "802.1X with EAP-TLS", "MAC filtering"], "a": 0, "e": "A captive portal intercepts web traffic until the user accepts terms or logs in. Why not the others: WPA3-Enterprise and 802.1X authenticate with credentials or certificates. MAC filtering uses hardware addresses."}, {"d": 4, "q": "Which of the following EAP methods requires a certificate on BOTH the client and the server?", "o": ["EAP-TLS", "PEAP", "EAP-TTLS", "EAP-FAST"], "a": 0, "e": "EAP-TLS uses mutual certificate authentication, the strongest common option. Why not the others: PEAP and EAP-TTLS need only a server certificate. EAP-FAST uses PACs instead of certificates."}, {"d": 4, "q": "A help desk technician has access to reset passwords but also approves their own access requests. Which principle is violated?", "o": ["Separation of duties", "Least functionality", "Data minimization", "Implicit deny"], "a": 0, "e": "Separation of duties splits critical tasks so no one person controls the whole process, like requesting and approving. Why not the others: Least functionality limits features. Data minimization limits collection. Implicit deny is a firewall default."}, {"d": 4, "q": "An administrator writes a script to automatically create accounts, assign groups, and provision mailboxes when HR adds a new hire. Which of the following benefits does this provide?", "o": ["Efficiency and consistent provisioning", "Increased technical debt in the provisioning system", "Creation of a single point of failure", "Reduced auditability of account changes"], "a": 0, "e": "Automating user provisioning saves time and applies the same standard every time. Why not the others: Technical debt and a single point of failure are risks of automation. Automation usually improves auditability."}, {"d": 4, "q": "An attacker who compromised a workstation has created a scheduled task that reconnects to their server each time the computer reboots. During eradication, what should the analyst ensure?", "o": ["All persistence mechanisms are removed", "Only the active malware process is killed", "The workstation is left online for monitoring indefinitely", "The SIEM is disabled"], "a": 0, "e": "Eradication must remove persistence (scheduled tasks, services, registry run keys), or the attacker comes back. Why not the others: Killing one process leaves the persistence. Leaving the host online indefinitely and disabling the SIEM increase risk."}, {"d": 5, "q": "A server worth $20,000 has an exposure factor of 25% for a flood. What is the single loss expectancy (SLE)?", "o": ["$5,000", "$20,000", "$25,000", "$500"], "a": 0, "e": "SLE = asset value × exposure factor = $20,000 × 0.25 = $5,000. Why not the others: $20,000 is the full asset value. The other numbers don't follow the formula."}, {"d": 5, "q": "The SLE for a data breach is $50,000, and it is expected to occur once every five years. What is the annualized loss expectancy (ALE)?", "o": ["$10,000", "$50,000", "$250,000", "$5,000"], "a": 0, "e": "ARO = 1/5 = 0.2. ALE = SLE × ARO = $50,000 × 0.2 = $10,000. Why not the others: $50,000 assumes once a year. $250,000 multiplies by 5 instead of dividing."}, {"d": 5, "q": "Which of the following describes the number of times a specific risk is expected to occur in one year?", "o": ["ARO", "SLE", "EF", "RTO"], "a": 0, "e": "ARO is the expected yearly frequency. Why not the others: SLE is the loss from one event. EF is the percentage of the asset lost. RTO is the target time to restore a system."}, {"d": 5, "q": "A risk assessment rates threats as High, Medium, or Low based on expert opinion rather than dollar amounts. Which type of analysis is this?", "o": ["Qualitative", "Quantitative", "Annualized loss expectancy", "Monte Carlo simulation"], "a": 0, "e": "Qualitative analysis uses ratings and judgment. Why not the others: Quantitative analysis, ALE and Monte Carlo all use numbers and money values."}, {"d": 5, "q": "A company buys cybersecurity insurance to cover losses from a ransomware attack. Which risk management strategy is this?", "o": ["Transfer", "Avoid", "Accept", "Mitigate"], "a": 0, "e": "Insurance shifts the financial impact of a risk to another party. Why not the others: Avoid stops the risky activity. Accept takes the risk as-is. Mitigate reduces it with controls."}, {"d": 5, "q": "A company decides not to launch a new online service because the security risks outweigh the expected benefits. Which risk strategy is this?", "o": ["Avoid", "Transfer", "Accept", "Mitigate"], "a": 0, "e": "Avoidance means not doing the activity that creates the risk. Why not the others: Transfer shifts risk. Accept takes it. Mitigate reduces it."}, {"d": 5, "q": "Management reviews a low-impact risk and decides that the cost of fixing it exceeds the potential loss, so it takes no further action. Which risk strategy is this?", "o": ["Accept", "Avoid", "Transfer", "Mitigate"], "a": 0, "e": "Acceptance is a conscious decision to live with a risk, usually because it's cheaper than fixing it. Why not the others: Avoid, transfer and mitigate all take action."}, {"d": 5, "q": "A company installs a firewall and IPS to reduce the likelihood of network attacks. Which risk strategy is this?", "o": ["Mitigate", "Accept", "Avoid", "Transfer"], "a": 0, "e": "Mitigation applies controls to lower likelihood or impact. Why not the others: Accept does nothing. Avoid stops the activity. Transfer shifts the risk."}, {"d": 5, "q": "Which of the following documents lists identified risks along with their owners, likelihood, impact, and planned responses?", "o": ["Risk register", "Business impact analysis", "Acceptable use policy", "Statement of work"], "a": 0, "e": "A risk register tracks each risk, its owner, rating and response. Why not the others: A BIA analyzes the impact of outages. An AUP governs use. A SOW defines vendor work."}, {"d": 5, "q": "Which of the following describes the overall amount of risk an organization is willing to pursue or retain to achieve its objectives?", "o": ["Risk appetite", "Risk transfer", "Residual risk", "Inherent risk"], "a": 0, "e": "Risk appetite is the broad level of risk the organization is willing to take on. Why not the others: Transfer is a strategy. Residual risk is what's left after controls. Inherent risk is before controls."}, {"d": 5, "q": "After implementing all planned controls, some risk remains. What is this called?", "o": ["Residual risk", "Inherent risk", "Risk appetite", "Risk avoidance"], "a": 0, "e": "Residual risk is the risk left after controls are in place. Why not the others: Inherent risk is before controls. Appetite is willingness. Avoidance is a strategy."}, {"d": 5, "q": "A risk management team uses a metric that warns when the number of unpatched critical vulnerabilities exceeds a set threshold. Which of the following is this?", "o": ["Key risk indicator (KRI)", "Recovery point objective", "Mean time between failures", "Exposure factor"], "a": 0, "e": "KRIs are metrics that give early warning that risk is rising. Why not the others: RPO is about data loss tolerance. MTBF is reliability. EF is percentage of loss."}, {"d": 5, "q": "A business determines that it can lose no more than 4 hours of transaction data after a failure. Which metric is this?", "o": ["Recovery point objective (RPO)", "Recovery time objective (RTO)", "Mean time to repair (MTTR)", "Mean time between failures (MTBF)"], "a": 0, "e": "RPO is the maximum acceptable data loss, measured in time, and it drives how often you back up. Why not the others: RTO is how fast the system must be back. MTTR is average repair time. MTBF is average time between failures."}, {"d": 5, "q": "A payroll system must be restored within 8 hours after an outage to avoid unacceptable business impact. Which metric is this?", "o": ["Recovery time objective (RTO)", "Recovery point objective (RPO)", "MTBF", "ALE"], "a": 0, "e": "RTO is the maximum acceptable downtime before the system must be restored. Why not the others: RPO is data loss. MTBF is reliability. ALE is annual expected loss."}, {"d": 5, "q": "A hardware vendor states that a storage array typically runs 50,000 hours before a component fails. Which metric is this?", "o": ["MTBF", "MTTR", "RTO", "RPO"], "a": 0, "e": "MTBF is the average time a repairable system runs between failures. Why not the others: MTTR is average repair time. RTO and RPO are recovery objectives."}, {"d": 5, "q": "Which of the following analyses identifies critical business functions and the impact of their disruption to determine recovery priorities?", "o": ["Business impact analysis (BIA)", "Gap analysis against a framework", "Penetration test of critical systems", "Third-party vendor assessment"], "a": 0, "e": "A BIA identifies critical functions, the impact of losing them, and their RTO and RPO. Why not the others: A gap analysis compares against a standard. A pen test simulates attacks. A vendor assessment evaluates suppliers."}, {"d": 5, "q": "A company and a cloud provider sign a document stating the provider guarantees 99.9% uptime and response times for support tickets. Which of the following is this?", "o": ["Service level agreement (SLA)", "Memorandum of understanding (MOU)", "Non-disclosure agreement (NDA)", "Business partners agreement (BPA)"], "a": 0, "e": "An SLA defines measurable service commitments like uptime and response times. Why not the others: An MOU is a non-binding statement of intent. An NDA protects confidential information. A BPA governs a partnership."}, {"d": 5, "q": "Two government agencies sign a document expressing their intent to cooperate on a project, but it is not legally binding. Which of the following is this?", "o": ["Memorandum of understanding", "Service level agreement", "Master service agreement", "Statement of work"], "a": 0, "e": "An MOU documents shared intent and is generally not legally binding. Why not the others: SLAs, MSAs and SOWs are binding contracts."}, {"d": 5, "q": "A company signs a contract with a vendor that defines general terms for all future work. Individual projects are then defined in separate documents. Which agreement defines the general terms?", "o": ["Master service agreement", "Statement of work", "Non-disclosure agreement", "Memorandum of agreement"], "a": 0, "e": "An MSA sets the overall terms, and SOWs or work orders define each project. Why not the others: A SOW is project-specific. An NDA covers confidentiality. An MOA documents a cooperative arrangement."}, {"d": 5, "q": "A document specifies the deliverables, timeline, and cost for a penetration test engagement under an existing vendor contract. Which of the following is this?", "o": ["Statement of work (SOW)", "Master service agreement", "Memorandum of understanding", "Service level agreement"], "a": 0, "e": "A SOW (or work order) details a specific project's scope, deliverables and timeline. Why not the others: An MSA sets general terms. An MOU expresses intent. An SLA sets service levels."}, {"d": 5, "q": "A company requires vendors to sign an agreement before receiving details about an unreleased product. Which agreement is this?", "o": ["Non-disclosure agreement (NDA)", "Service level agreement", "Business partners agreement", "Acceptable use policy"], "a": 0, "e": "An NDA legally requires keeping shared information confidential. Why not the others: An SLA covers service levels. A BPA covers a partnership. An AUP governs employee use."}, {"d": 5, "q": "A contract clause allows a company to inspect its vendor's security controls and records. Which of the following is this?", "o": ["Right-to-audit clause", "Non-compete clause", "Indemnification only", "Service credit"], "a": 0, "e": "A right-to-audit clause lets the customer assess the vendor's controls. Why not the others: A non-compete restricts competition. Indemnification shifts liability. A service credit compensates for SLA misses."}, {"d": 5, "q": "Before signing with a new vendor, a company reviews its financial stability, security practices, and past breaches. Which of the following is this?", "o": ["Due diligence", "Due care", "Risk acceptance", "Attestation"], "a": 0, "e": "Due diligence is the investigation done before a decision. Why not the others: Due care is acting responsibly on an ongoing basis. Risk acceptance is a strategy. Attestation is formal certification."}, {"d": 5, "q": "A company sends a detailed security questionnaire to a potential supplier asking about encryption, access controls, and incident response. Which of the following is this part of?", "o": ["Third-party vendor assessment", "Internal compliance audit", "Penetration testing", "Change management review"], "a": 0, "e": "Questionnaires are a common tool for assessing a vendor's security. Why not the others: An internal audit looks at your own organization. Pen testing is technical attack simulation. Change management controls changes."}, {"d": 5, "q": "Before a penetration test begins, the client and testers document what systems are in scope, testing hours, and emergency contacts. Which document is this?", "o": ["Rules of engagement", "Acceptable use policy", "Business impact analysis", "Risk register"], "a": 0, "e": "Rules of engagement define scope, timing, methods and contacts for a test. Why not the others: An AUP covers users. A BIA covers business impact. A risk register tracks risks."}, {"d": 5, "q": "A penetration tester is given full network diagrams, source code, and credentials before testing. Which type of test is this?", "o": ["Known environment", "Unknown environment", "Partially known environment", "Passive reconnaissance only"], "a": 0, "e": "A known environment (white box) test gives testers complete information. Why not the others: An unknown environment (black box) test gives none. Partially known (gray box) gives some. Passive recon is a test phase, not a test type."}, {"d": 5, "q": "A penetration tester receives only the company name and must discover everything else on their own, like a real outside attacker. Which type of test is this?", "o": ["Unknown environment", "Known environment", "Partially known environment", "Integrated"], "a": 0, "e": "An unknown environment (black box) test starts with no inside knowledge. Why not the others: Known gives full information. Partially known gives limited information. Integrated combines offensive and defensive teams."}, {"d": 5, "q": "During a penetration test, the tester searches public DNS records and social media without sending any traffic to the target's systems. Which of the following is this?", "o": ["Passive reconnaissance", "Active reconnaissance", "Exploitation", "Privilege escalation"], "a": 0, "e": "Passive recon gathers information without directly touching the target. Why not the others: Active recon (like port scans) interacts with the target. Exploitation and escalation come later."}, {"d": 5, "q": "A tester runs Nmap against the company's public IP range to identify open ports. Which of the following is this?", "o": ["Active reconnaissance", "Passive reconnaissance", "OSINT only", "Lessons learned"], "a": 0, "e": "Port scanning sends traffic to the target, so it's active reconnaissance. Why not the others: Passive recon and OSINT don't touch the target. Lessons learned is incident response."}, {"d": 5, "q": "In a security exercise, one team attacks the network while another team defends it, and a third team coordinates and shares findings between them. What is the third team?", "o": ["Purple team", "Red team", "Blue team", "White team only as referees"], "a": 0, "e": "A purple team blends red (offense) and blue (defense) to share knowledge and improve detection. Why not the others: Red attacks. Blue defends. The white team referees the exercise but isn't focused on combining the two."}, {"d": 5, "q": "Which of the following security policies defines how employees are allowed to use company computers, email, and internet access?", "o": ["Acceptable use policy (AUP)", "Business continuity plan", "Change management policy", "Incident response plan"], "a": 0, "e": "An AUP defines acceptable and prohibited use of company resources. Why not the others: A BCP covers continuity. Change management covers changes. An IR plan covers incidents."}, {"d": 5, "q": "Which of the following is the BEST description of a standard in a governance framework?", "o": ["A mandatory, specific requirement like minimum password length", "A high-level statement of management's security intent", "An optional recommendation that staff may follow", "Step-by-step instructions for completing a task"], "a": 0, "e": "Standards are mandatory, specific requirements that support policies. Why not the others: Policies are high-level intent. Guidelines are optional recommendations. Procedures are step-by-step instructions."}, {"d": 5, "q": "Which of the following is an optional recommendation that helps employees implement a policy but is not mandatory?", "o": ["Guideline", "Standard", "Policy", "Regulation"], "a": 0, "e": "Guidelines are advisory, not required. Why not the others: Standards and policies are mandatory. Regulations are legal requirements."}, {"d": 5, "q": "Which of the following documents provides step-by-step instructions for onboarding a new employee, including account creation and badge issuance?", "o": ["Procedure", "Policy", "Guideline", "Standard"], "a": 0, "e": "Procedures give detailed, ordered steps for a task. Why not the others: Policies state intent. Guidelines recommend. Standards set specific requirements."}, {"d": 5, "q": "Under GDPR, which of the following roles determines the purposes and means of processing personal data?", "o": ["Data controller", "Data processor", "Data subject", "Data custodian"], "a": 0, "e": "The controller decides why and how personal data is processed. Why not the others: The processor handles data on the controller's behalf. The subject is the person the data is about. The custodian maintains the data technically."}, {"d": 5, "q": "A payroll company processes employee data on behalf of its client according to the client's instructions. Which role does the payroll company have?", "o": ["Data processor", "Data controller", "Data owner", "Data subject"], "a": 0, "e": "A processor handles data for a controller and follows the controller's instructions. Why not the others: The client is the controller and owner. The employees are the subjects."}, {"d": 5, "q": "Which role is responsible for the day-to-day technical handling of data, such as backups, storage, and applying access controls?", "o": ["Data custodian", "Data owner", "Data subject", "Data controller"], "a": 0, "e": "Custodians (stewards) implement and maintain the controls the owner specifies. Why not the others: The owner is accountable and sets classification. The subject is the individual. The controller sets processing purposes."}, {"d": 5, "q": "A senior manager is accountable for classifying customer data and approving who may access it. Which role is this?", "o": ["Data owner", "Data custodian", "Data processor", "Data subject"], "a": 0, "e": "The data owner is a senior person accountable for classifying and protecting data. Why not the others: The custodian carries out controls. The processor processes for the controller. The subject is the individual."}, {"d": 5, "q": "An EU citizen requests that a company delete all personal data it holds about them. Which right is the citizen exercising?", "o": ["Right to be forgotten", "Right to audit", "Right of first refusal", "Due care"], "a": 0, "e": "Under GDPR, the right to be forgotten (erasure) lets people request deletion of their personal data. Why not the others: Right to audit is a contract clause. Right of first refusal is a business term. Due care is a duty."}, {"d": 5, "q": "A company processes credit card payments. Which of the following standards MUST it comply with?", "o": ["PCI DSS", "HIPAA", "FERPA", "SOX"], "a": 0, "e": "PCI DSS applies to any organization that stores, processes or transmits cardholder data. Why not the others: HIPAA covers health data. FERPA covers student records. SOX covers financial reporting by public companies."}, {"d": 5, "q": "A company fails to comply with a privacy regulation and is required to pay a monetary penalty. Which consequence of non-compliance is this?", "o": ["Fines", "Loss of license", "Reputational damage", "Contractual impact"], "a": 0, "e": "A monetary penalty from a regulator is a fine. Why not the others: Loss of license removes permission to operate. Reputational damage is lost trust. Contractual impacts affect agreements."}, {"d": 5, "q": "Each year, the CEO signs a statement certifying that the company's internal controls are effective. Which of the following is this?", "o": ["Attestation", "Exception", "Tabletop exercise", "Risk transfer"], "a": 0, "e": "Attestation is a formal declaration that controls or compliance are in place. Why not the others: An exception accepts a deviation. A tabletop is an exercise. Risk transfer shifts risk."}, {"d": 5, "q": "A company hires an independent accounting firm to evaluate its security controls and issue a report to customers. Which of the following is this?", "o": ["Independent third-party audit", "Internal self-assessment", "Internal audit by staff", "Tabletop exercise"], "a": 0, "e": "An outside, independent firm assessing controls is a third-party audit (for example, a SOC 2). Why not the others: Self-assessments and internal audits are done in-house. A tabletop is an exercise."}, {"d": 5, "q": "A government agency visits a bank to verify compliance with financial regulations. Which type of assessment is this?", "o": ["Regulatory examination", "Self-assessment", "Bug bounty program", "Internal audit"], "a": 0, "e": "Regulators inspecting compliance is a regulatory examination (an external assessment). Why not the others: Self-assessments and internal audits are internal. A bug bounty is vulnerability reporting."}, {"d": 5, "q": "Which group typically oversees the internal audit function and reports to the board of directors to ensure independence?", "o": ["Audit committee", "Change advisory board", "Help desk", "Red team"], "a": 0, "e": "The audit committee oversees internal and external audits independently of management. Why not the others: The CAB approves changes. The help desk supports users. The red team performs attacks."}, {"d": 5, "q": "A company sends fake phishing emails to employees and provides immediate training to anyone who clicks the link. Which of the following is this?", "o": ["Phishing simulation campaign", "Watering hole attack", "Vishing campaign by attackers", "Penetration test of the firewall"], "a": 0, "e": "Simulated phishing campaigns measure and improve how users recognize phishing. Why not the others: A watering hole and vishing are real attacks. A firewall pen test is technical."}, {"d": 5, "q": "Which of the following is the MOST important action an employee should take after realizing they entered credentials on a phishing site?", "o": ["Report it immediately to the security team", "Wait to see if anything happens", "Delete the email and tell no one", "Forward the email to coworkers as a warning"], "a": 0, "e": "Reporting fast lets security reset credentials and contain the damage. Why not the others: Waiting or staying quiet gives attackers time. Forwarding the email spreads the malicious link."}, {"d": 5, "q": "Security awareness training teaches employees to watch for coworkers who suddenly access systems outside their role or work odd hours. Which topic does this address?", "o": ["Insider threat / anomalous behavior recognition", "Password management and passphrase creation", "Removable media and cable handling", "Physical security and tailgating prevention"], "a": 0, "e": "Recognizing unusual behavior helps spot insider threats. Why not the others: Password management, removable media and tailgating are different awareness topics."}, {"d": 5, "q": "Remote employees are trained to lock their screens, use a VPN, and avoid working on sensitive data in public places. Which training topic is this?", "o": ["Hybrid/remote work environment security", "Data sovereignty and cross-border transfers", "Change management and approval workflows", "Third-party vendor assessment"], "a": 0, "e": "Remote and hybrid work training covers the risks of working outside the office. Why not the others: Sovereignty is legal jurisdiction. Change management covers changes. Vendor assessment is third-party risk."}, {"d": 5, "q": "Which of the following BEST measures the effectiveness of a security awareness program over time?", "o": ["Tracking phishing click and report rates", "Counting firewalls deployed each year", "Measuring data center server uptime", "Counting security policies written"], "a": 0, "e": "Falling click rates and rising report rates show behavior is actually changing. Why not the others: Firewall count, uptime and policy count don't measure awareness."}, {"d": 5, "q": "Which of the following governance structures places security decisions with a single central team that sets policy for all business units?", "o": ["Centralized", "Decentralized", "Federated identity", "Ad hoc"], "a": 0, "e": "Centralized governance means one central body makes decisions for the whole organization. Why not the others: Decentralized spreads decisions across units. Federated identity is authentication. Ad hoc is unstructured."}, {"d": 5, "q": "Risk assessments at a company are performed only when a major event occurs, such as a merger. Which type of assessment is this?", "o": ["Ad hoc", "Recurring", "Continuous", "Scheduled quarterly"], "a": 0, "e": "Ad hoc assessments happen as needed, triggered by events. Why not the others: Recurring and scheduled assessments happen at set intervals. Continuous is ongoing."}, {"d": 5, "q": "A company's risk tolerance for system downtime is 2 hours per month. Which of the following BEST describes risk tolerance?", "o": ["Acceptable deviation from risk appetite for one objective", "The total risk that exists before any controls", "The annual cost of cyber insurance", "The replacement value of an asset"], "a": 0, "e": "Risk tolerance is the specific, measurable level of deviation that's acceptable for one objective. Risk appetite is the broader stance. Why not the others: Total risk before controls is inherent risk. Insurance cost and asset value aren't tolerance."}, {"d": 5, "q": "An organization with an expansionary risk appetite is MOST likely to do which of the following?", "o": ["Accept higher risk to pursue growth and innovation", "Avoid adopting any new technology until it is proven", "Transfer all identified risk to insurance carriers", "Accept only risks that have zero potential impact"], "a": 0, "e": "An expansionary appetite accepts more risk for potential gains. Why not the others: Avoiding new technology and accepting only zero-impact risk describe a conservative appetite. Transferring all risk isn't realistic."}, {"d": 5, "q": "A vendor's own software relies on components from dozens of other suppliers. Which of the following should a company perform to understand risk from these indirect suppliers?", "o": ["Supply chain analysis", "Tabletop exercise", "Right to be forgotten request", "Data masking"], "a": 0, "e": "Supply chain analysis examines risk across the vendor's own suppliers and components. Why not the others: A tabletop is an IR exercise. Erasure requests are about privacy. Masking protects data."}, {"d": 5, "q": "During vendor selection, a procurement manager discovers that a bidding vendor is owned by a relative. Which concern should be addressed?", "o": ["Conflict of interest", "Data sovereignty", "Exposure factor", "Right to audit"], "a": 0, "e": "A personal relationship with a bidder is a conflict of interest and must be disclosed or handled. Why not the others: Sovereignty, EF and right-to-audit don't apply here."}, {"d": 5, "q": "After signing a vendor, a company reviews the vendor's security reports and performance every quarter. Which of the following is this?", "o": ["Vendor monitoring", "Due diligence before selection", "Risk avoidance", "Identity proofing"], "a": 0, "e": "Ongoing vendor monitoring checks that the vendor keeps meeting its obligations. Why not the others: Due diligence happens before selection. Avoidance and identity proofing aren't relevant."}, {"d": 5, "q": "Which of the following documents outlines how an organization will keep critical business operations running during a disruption, including people, facilities, and processes?", "o": ["Business continuity plan (BCP)", "Disaster recovery plan for IT only", "Acceptable use policy", "Password standard"], "a": 0, "e": "A BCP covers keeping the whole business running. The DR plan is the IT recovery part within it. Why not the others: An IT-only DR plan is narrower. The AUP and password standard are unrelated."}, {"d": 5, "q": "Which of the following documents focuses specifically on restoring IT systems and data after a disaster?", "o": ["Disaster recovery plan (DRP)", "Business continuity plan", "Incident response plan for phishing", "Acceptable use policy"], "a": 0, "e": "The DRP covers the technical recovery of IT systems and data. Why not the others: A BCP is broader. An IR plan handles security incidents. An AUP governs use."}, {"d": 5, "q": "Which of the following policies would define how software should be securely designed, coded, tested, and deployed?", "o": ["Software development lifecycle (SDLC) policy", "Acceptable use policy (AUP)", "Physical security standard for facilities", "Data retention and disposal policy"], "a": 0, "e": "An SDLC policy builds security into each development phase. Why not the others: The other policies cover use, facilities and records."}, {"d": 5, "q": "Employees must acknowledge in writing that they have read and understand the information security policy. Which of the following does this provide?", "o": ["Proof of policy acknowledgement", "Transfer of risk to the employee", "Encryption of the policy document", "Data sovereignty for HR records"], "a": 0, "e": "Written acknowledgement shows that users were informed. It supports enforcement and compliance. Why not the others: It doesn't transfer risk, encrypt anything or relate to sovereignty."}, {"d": 5, "q": "A security manager is reviewing the information security policy because a new regulation was passed. Which of the following governance activities is this?", "o": ["Monitoring and revision", "Risk avoidance", "Penetration testing", "Data sanitization"], "a": 0, "e": "Policies should be reviewed and updated when laws, technology or business needs change. Why not the others: Avoidance, pen testing and sanitization are different activities."}, {"d": 5, "q": "Which of the following privacy concepts requires an organization to know what personal data it holds, where it is stored, and why?", "o": ["Data inventory and mapping", "Right to audit", "Exposure factor", "Load balancing"], "a": 0, "e": "A data inventory (data map) records what personal data exists, where it is and why it's held. Privacy compliance depends on it. Why not the others: The other options are unrelated concepts."}, {"d": 5, "q": "A U.S. publicly traded company must ensure the accuracy of financial reporting and maintain internal controls. Which law requires this?", "o": ["Sarbanes-Oxley Act (SOX)", "Health Insurance Portability and Accountability Act (HIPAA)", "General Data Protection Regulation (GDPR)", "Family Educational Rights and Privacy Act (FERPA)"], "a": 0, "e": "SOX requires public companies to maintain internal controls over financial reporting. Why not the others: HIPAA is health. GDPR is EU privacy. FERPA is education records."}, {"d": 5, "q": "A company is found to have exposed customer data. Even though no fine is issued, customers move to competitors. Which consequence is this?", "o": ["Reputational damage", "Sanctions", "Loss of license", "Regulatory fines"], "a": 0, "e": "Lost customer trust and business is reputational damage. Why not the others: Sanctions, license loss and fines are formal penalties."}, {"d": 5, "q": "Which of the following is an example of due care?", "o": ["Regularly patching systems and enforcing security policies", "Researching a vendor's security before signing a contract", "Buying cyber insurance to cover breach costs", "Choosing not to launch a risky product"], "a": 0, "e": "Due care is the ongoing, reasonable action to protect assets, like patching and enforcing policy. Why not the others: Researching a vendor is due diligence. Insurance is transfer. Not launching is avoidance."}, {"d": 5, "q": "A penetration test includes attempting to bypass badge readers and enter restricted areas of a facility. Which type of penetration test is this?", "o": ["Physical", "Offensive network only", "Defensive", "Integrated tabletop"], "a": 0, "e": "Testing building access controls is a physical penetration test. Why not the others: A network test targets systems. Defensive testing is blue team work. Integrated tabletops are exercises."}, {"d": 5, "q": "Which type of risk assessment is performed once for a specific project, such as evaluating a new data center before construction?", "o": ["One-time", "Continuous", "Recurring", "Ad hoc after every incident"], "a": 0, "e": "A one-time assessment is done once for a specific purpose. Why not the others: Continuous and recurring assessments repeat. Ad hoc assessments are triggered by events."}, {"d": 5, "q": "Which of the following BEST describes the purpose of an internal compliance audit?", "o": ["Confirm compliance with internal policies and regulations", "Identify new customers and markets", "Test backup generators and UPS systems", "Replace the need for external audits"], "a": 0, "e": "Internal compliance audits check adherence to policies and regulations before external auditors arrive. Why not the others: Finding customers and testing generators aren't audit functions. Internal audits complement external ones and don't replace them."}, {"d": 5, "q": "A business partner agreement (BPA) is MOST likely to define which of the following?", "o": ["Each partner's responsibilities, profit sharing, and decisions", "Guaranteed network uptime and service credits", "Confidentiality about one upcoming product launch", "The scope and timeline of one penetration test"], "a": 0, "e": "A BPA defines how partners work together: responsibilities, finances and decisions. Why not the others: Uptime is an SLA. Confidentiality is an NDA. Test scope is a SOW or rules of engagement."}, {"d": 2, "q": "A security team wants to reduce the risk of credential stuffing attacks against its customer login page. Which of the following controls would be MOST effective? (Select two.)", "o": ["Require multifactor authentication", "Rate-limit and monitor login attempts per IP and account", "Encrypt the customer database at rest", "Move the login page to a different URL path", "Use a wildcard certificate on the site"], "a": [0, 1], "e": "MFA makes reused passwords useless on their own, and rate limiting with monitoring slows and detects automated login attempts. Why not the others: Encryption at rest doesn't stop logins with valid stolen credentials. Changing the URL path is security through obscurity. Certificate type doesn't affect password reuse."}, {"d": 3, "q": "A company is designing a highly available web application. Which of the following would BEST eliminate single points of failure? (Select two.)", "o": ["Deploy a load balancer in front of multiple web servers", "Replicate the database to a second availability zone", "Increase the CPU on the single web server", "Take weekly full backups to tape", "Configure a longer DNS TTL"], "a": [0, 1], "e": "Multiple load-balanced web servers and a replicated database mean losing any one component doesn't take the app down. Why not the others: A bigger single server is still a single server. Weekly backups help recovery, not availability. A longer TTL slows failover."}]</script>
<script id="gloss-s1" type="application/json">[["CIA triad|confidentiality", "Confidentiality, Integrity, Availability: keep data secret, unchanged, and reachable when needed."], ["integrity", "Making sure data hasn't been changed by anyone who shouldn't change it."], ["non-repudiation", "Proof that someone did something (like sending a message) so they can't deny it later."], ["AAA|accounting", "Authentication (prove who you are), Authorization (what you can do), Accounting (logging what you did)."], ["zero trust", "Never trust by default. Every request is checked, even from inside the network."], ["policy engine", "The zero trust component that decides whether to allow or deny an access request."], ["compensating", "A substitute control used when the normal control can't be applied."], ["deterrent", "A control that discourages an attacker from trying, like warning signs or visible cameras."], ["detective", "A control that finds an incident during or after it happens, like log review or alarms."], ["corrective", "A control that fixes things after an incident, like restoring from backup."], ["honeypot|honeynet", "A fake system (or network of them) set up to lure and study attackers."], ["honeytoken", "Fake data, like a bogus record or credential, that sets off an alert if anyone uses it."], ["backout plan", "Steps to undo a change and get back to how things were if the change goes wrong."], ["gap analysis", "Comparing what you have now to what a standard requires, to find what's missing."], ["salt(ing)?", "Random data added to a password before hashing so identical passwords get different hashes."], ["key stretching|PBKDF2|bcrypt", "Hashing a password thousands of times so each guess takes an attacker much longer."], ["hash(es|ing)?", "A one-way fingerprint of data. Any change to the data gives a completely different hash."], ["symmetric", "Encryption that uses one shared key to both lock and unlock data (for example, AES)."], ["asymmetric|public key|private key", "
