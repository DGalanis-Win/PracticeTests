 their computer is still not fixed. What should the technician do?","o":["Listen actively, avoid arguing, and clarify the issue and next steps","Tell them it is not your fault","Explain the problem using technical jargon","Leave without explanation"],"a":0,"e":"Professionalism means active listening, not being defensive, setting clear expectations, and following up."},{"d":4,"q":"An employee wants to paste a customer's account details into a public AI chatbot to draft a response faster. What is the PRIMARY concern?","o":["Exposing sensitive data to a third party in violation of data privacy policy","The chatbot may type too slowly","The response might be too short","AI tools cannot write emails"],"a":0,"e":"Putting PII or confidential data into public AI tools can violate privacy policies and regulations. Use approved tools and remove sensitive details first."},{"d":4,"q":"A technician uses an AI tool to generate a PowerShell command and plans to run it on production servers. What should the technician do FIRST?","o":["Review and test the output in a non-production environment","Run it immediately since AI is accurate","Share it with all users","Disable logging before running it"],"a":0,"e":"AI output can be wrong or made up (hallucinations). Verify and test it before using it in production."},{"d":4,"q":"Which environmental condition increases the risk of electrostatic discharge in a computer room?","o":["Low humidity","High humidity","Moderate temperature","Good airflow"],"a":0,"e":"Dry air (low humidity) increases static buildup. Too much humidity causes condensation. A moderate range of about 40 to 60 percent is ideal."},{"d":4,"q":"A company's policy describes what employees may and may not do with company computers and internet access. What is this document?","o":["Acceptable use policy (AUP)","Rollback plan","SDS","Chain of custody"],"a":0,"e":"An AUP defines permitted use of company IT resources, and employees typically sign it."},{"d":4,"q":"Which device protects equipment from sudden voltage spikes but provides no battery backup?","o":["Surge suppressor","UPS","Generator","Redundant PSU"],"a":0,"e":"Surge suppressors block voltage spikes. Only a UPS or generator keeps equipment running during an outage."},{"d":4,"q":"Which type of license allows users to view, modify, and redistribute the source code?","o":["Open-source license","Personal license","Enterprise license","DRM license"],"a":0,"e":"Open-source licenses such as the GPL and MIT allow access to and modification of the source code, under the license's terms."},{"d":1,"q":"Which Windows command shows the version and build number of the installed OS in a dialog box?","o":["winver","hostname","ver /all","msinfo64"],"a":0,"e":"winver opens the About Windows dialog with the version and build. msinfo32 shows more detail."},{"d":1,"q":"Which command displays the computer's name?","o":["hostname","whoami","ipconfig /flushdns","net use"],"a":0,"e":"hostname prints the computer's name. whoami shows the logged-in user."},{"d":1,"q":"Which command clears the local DNS resolver cache in Windows?","o":["ipconfig /flushdns","ipconfig /renew","nslookup -clear","netstat -r"],"a":0,"e":"Clearing the DNS cache fixes stale or poisoned name resolution entries."},{"d":1,"q":"Which command combines ping and tracert to show packet loss at each hop?","o":["pathping","netstat","arp","nbtstat"],"a":0,"e":"pathping traces the route and then measures loss and latency at each hop over time."},{"d":1,"q":"Which command repairs the Windows component store that SFC uses as a source for repairs?","o":["DISM /Online /Cleanup-Image /RestoreHealth","chkdsk /f","bootrec /fixmbr","gpupdate /force"],"a":0,"e":"DISM repairs the system image, after which sfc /scannow can repair the system files."},{"d":1,"q":"Which command immediately restarts a Windows computer from the command line?","o":["shutdown /r /t 0","shutdown /s","restart now","logoff /r"],"a":0,"e":"shutdown /r restarts, /s shuts down, and /t sets the delay in seconds."},{"d":1,"q":"Which command creates a new directory in the Windows command prompt?","o":["md","cd","rd","dir"],"a":0,"e":"md (mkdir) creates a directory, cd changes directories, rd removes one, and dir lists contents."},{"d":1,"q":"Which command lists the contents of the current directory in Windows?","o":["dir","ls -l","cd","md"],"a":0,"e":"dir is the Windows command. ls is the Linux and macOS equivalent."},{"d":1,"q":"Which command copies files and directories including subfolders in older Windows scripts, but is now largely replaced by robocopy?","o":["xcopy","copy","move","rd"],"a":0,"e":"xcopy can copy directory trees, but robocopy is more robust and resumable."},{"d":1,"q":"Which command formats a drive from the Windows command line?","o":["format","chkdsk","diskpart list","defrag"],"a":0,"e":"format prepares a volume with a file system. diskpart can also format inside its own shell."},{"d":1,"q":"Which command manages local user accounts, such as adding a user or resetting a password, from the command line?","o":["net user","net use","netstat","nslookup"],"a":0,"e":"net user manages local accounts, while net use maps network drives."},{"d":1,"q":"An administrator wants to quickly open the classic Control Panel applet to manage installed programs. Which command opens it?","o":["appwiz.cpl","ncpa.cpl","mmsys.cpl","inetcpl.cpl"],"a":0,"e":"appwiz.cpl opens Programs and Features. ncpa.cpl opens Network Connections, mmsys.cpl opens Sound, and inetcpl.cpl opens Internet Options."},{"d":1,"q":"Which Control Panel utility shortcut opens Network Connections to view adapters?","o":["ncpa.cpl","appwiz.cpl","sysdm.cpl","powercfg.cpl"],"a":0,"e":"ncpa.cpl shows the network adapters so you can enable, disable, or set TCP/IP properties."},{"d":1,"q":"Where in Windows can a user configure the computer name, domain membership, and Remote Desktop settings in the classic interface?","o":["System Properties (sysdm.cpl)","Device Manager","Disk Cleanup","Task Scheduler"],"a":0,"e":"System Properties has tabs for the computer name and domain, advanced performance and virtual memory settings, System Protection, and Remote."},{"d":1,"q":"A user wants their laptop to never sleep while plugged in. Where should this be configured?","o":["Power Options/power plan settings","Device Manager","Credential Manager","Indexing Options"],"a":0,"e":"Power Options (or Settings > System > Power) controls sleep, hibernate, and lid-close actions."},{"d":1,"q":"Which Windows feature stores saved website and network credentials for the user?","o":["Credential Manager","Certificate Manager","Device Manager","User Accounts"],"a":0,"e":"Credential Manager stores web and Windows credentials, such as saved network share logins."},{"d":1,"q":"Which Windows tool shows installed certificates and lets an administrator import or remove them?","o":["Certificate Manager (certmgr.msc)","Credential Manager","Device Manager","Event Viewer"],"a":0,"e":"certmgr.msc manages the user's certificate stores. certlm.msc manages the local computer's."},{"d":1,"q":"Which Windows tool provides detailed real-time views of CPU, memory, disk, and network activity per process, including which files are being accessed?","o":["Resource Monitor (resmon)","Task Scheduler","Disk Management","msconfig"],"a":0,"e":"Resource Monitor goes deeper than Task Manager and shows disk I/O by file and network activity by process."},{"d":1,"q":"Which Windows feature indexes files to speed up searches and can be configured to include specific folders?","o":["Indexing Options","Disk Cleanup","Defragment and Optimize Drives","File History"],"a":0,"e":"Indexing Options controls which locations Windows Search indexes."},{"d":1,"q":"Which Windows utility frees space by removing temporary files, the Recycle Bin, and old update files?","o":["Disk Cleanup (cleanmgr)","Disk Management","chkdsk","DISM"],"a":0,"e":"Disk Cleanup and Storage Sense remove temporary and unneeded files."},{"d":1,"q":"A Windows user wants to show file extensions and hidden files. Where is this configured?","o":["File Explorer Options/View settings","Device Manager","Network and Sharing Center","Power Options"],"a":0,"e":"File Explorer Options has 'Hide extensions for known file types' and 'Show hidden files.'"},{"d":1,"q":"Which Windows Settings area is used to configure Windows Update, including pausing updates and viewing update history?","o":["Windows Update","Accounts","Privacy","Apps"],"a":0,"e":"Settings > Windows Update manages updates, active hours, pausing, and update history."},{"d":1,"q":"In Windows, which user account type has full control of the system and can install software for all users?","o":["Administrator","Standard user","Guest","Power user"],"a":0,"e":"Administrators can change system settings and install software. Use standard accounts for day-to-day work."},{"d":1,"q":"Which type of Windows account signs in with an email address and syncs settings across devices?","o":["Microsoft account","Local account","Domain account","Guest account"],"a":0,"e":"A Microsoft account syncs settings, OneDrive, and the Store. Local accounts live only on that PC, and domain accounts come from Active Directory."},{"d":1,"q":"A technician needs to join a Windows 11 Pro workstation to the company's Active Directory domain. Where can this be done?","o":["System Properties > Computer Name > Change, or Settings > Accounts > Access work or school","Device Manager","Disk Management","Task Manager"],"a":0,"e":"You can join a domain through System Properties (sysdm.cpl) or through Settings > Access work or school. It requires Pro or a higher edition."},{"d":1,"q":"On a Mac, which feature quickly searches for files, apps, and settings?","o":["Spotlight","Finder","Dock","Keychain"],"a":0,"e":"Spotlight (Cmd+Space) searches the whole system."},{"d":1,"q":"Which macOS feature shows all open windows and virtual desktops at once?","o":["Mission Control","Spotlight","Launchpad","Time Machine"],"a":0,"e":"Mission Control shows open windows and Spaces (virtual desktops)."},{"d":1,"q":"A Mac user needs to repair disk permissions or check a drive for errors. Which built-in tool should be used?","o":["Disk Utility (First Aid)","Activity Monitor","Terminal only","Boot Camp"],"a":0,"e":"Disk Utility's First Aid checks and repairs disks and volumes."},{"d":1,"q":"Which macOS tool is the equivalent of Windows Task Manager for viewing and ending processes?","o":["Activity Monitor","Console","Spotlight","System Information"],"a":0,"e":"Activity Monitor shows CPU, memory, energy, disk, and network use, and you can force quit apps from it."},{"d":1,"q":"Which macOS app is used to install and update most software from Apple and approved developers?","o":["App Store","Boot Camp","Keychain","Terminal"],"a":0,"e":"The Mac App Store handles installs and updates. Apps from outside it are typically .dmg or .pkg files."},{"d":1,"q":"Which Linux command lists the files in a directory, including hidden files, in long format?","o":["ls -la","dir /a","pwd","cat"],"a":0,"e":"ls -l shows long format, and -a includes hidden dotfiles."},{"d":1,"q":"Which Linux command moves or renames a file?","o":["mv","cp","rm","mkdir"],"a":0,"e":"mv moves or renames, cp copies, rm deletes, and mkdir creates directories."},{"d":1,"q":"Which Linux command displays the manual page for another command?","o":["man","help","info -all","whatis --full"],"a":0,"e":"For example, man ls shows the documentation for ls."},{"d":1,"q":"Which Linux command shows the IP addresses assigned to network interfaces on modern distributions?","o":["ip addr","ipconfig","netsh","nbtstat"],"a":0,"e":"ip addr (or ip a) replaces the older ifconfig. ipconfig is the Windows command."},{"d":1,"q":"Which Linux command switches to another user account, such as root, in the current shell?","o":["su","sudo","chown","passwd"],"a":0,"e":"su switches users, while sudo runs a single command with elevated rights."},{"d":1,"q":"Which package manager command installs software on Red Hat-based Linux distributions like Fedora?","o":["dnf install","apt install","brew install","winget install"],"a":0,"e":"Fedora and RHEL use dnf (formerly yum). Debian and Ubuntu use apt."},{"d":1,"q":"A Linux administrator needs to edit a configuration file from the terminal. Which tool is a command-line text editor?","o":["nano","grep","top","df"],"a":0,"e":"nano and vi/vim are terminal text editors."},{"d":1,"q":"Before installing a new application on 50 workstations, what should be verified FIRST?","o":["System requirements and OS compatibility","The color of the application icon","The vendor's social media","Monitor brand"],"a":0,"e":"Check the CPU, RAM, storage, OS version, and dependencies, along with licensing and security impact, before deploying."},{"d":1,"q":"An application installer requires .NET Framework that is not installed. What is this an example of?","o":["A dependency requirement","A licensing violation","A driver conflict","A file system limitation"],"a":0,"e":"Many apps depend on runtimes (.NET, Visual C++, Java) that must be installed first."},{"d":1,"q":"A technician needs to recover a Windows PC whose OS will not load at all, using a fresh copy of Windows while preserving nothing. Which installation is this?","o":["Clean install","In-place upgrade","Repair install keeping apps","Image capture"],"a":0,"e":"A clean install wipes the target partition and installs a fresh OS."},{"d":2,"q":"Which security control requires users to present a badge to unlock a door, logging each entry?","o":["Badge reader/access control system","Bollard","Fence","Lighting"],"a":0,"e":"Electronic badge systems control who gets in and log each entry."},{"d":2,"q":"Which physical security control uses biometrics like fingerprints or retina scans to grant access?","o":["Biometric lock","Key fob only","Bollard","Video surveillance"],"a":0,"e":"Biometric locks use something you are, which is hard to share or steal."},{"d":2,"q":"Which security measure provides recorded evidence of who entered a secured area?","o":["Video surveillance","Bollards","Fencing","Magnetometer"],"a":0,"e":"Cameras deter intruders and record evidence for investigations."},{"d":2,"q":"Which device detects metal objects at a facility entrance?","o":["Magnetometer","Badge reader","Motion sensor","Bollard"],"a":0,"e":"Magnetometers (metal detectors) screen people for weapons or prohibited devices."},{"d":2,"q":"A visitor badge must be returned at the end of the day, and visitors must sign a logbook. What is the purpose of the log?","o":["Accountability and an audit trail of who was on site","Encrypting visitor data","Speeding up Wi-Fi","Reducing printing"],"a":0,"e":"Visitor logs record who came and when, which supports security and emergency headcounts."},{"d":2,"q":"Which logical security concept means users are denied access unless it is explicitly allowed?","o":["Implicit deny","Least privilege","MFA","SSO"],"a":0,"e":"Implicit deny blocks anything not explicitly permitted. It's common in firewalls and ACLs."},{"d":2,"q":"Which security concept assumes no user or device is trusted by default, even inside the network, and verifies every request?","o":["Zero Trust","Perimeter-only security","Implicit allow","Open access"],"a":0,"e":"Zero Trust continuously verifies identity and device posture for every access request."},{"d":2,"q":"Users log in once and gain access to multiple applications without logging in again. What is this?","o":["Single sign-on (SSO)","MFA","Least privilege","Kerberos ticket expiration"],"a":0,"e":"SSO uses one authentication to grant access to many services, often through SAML or OAuth/OIDC."},{"d":2,"q":"Which authentication factor category does a fingerprint belong to?","o":["Something you are","Something you know","Something you have","Somewhere you are"],"a":0,"e":"Biometrics are inherence factors."},{"d":2,"q":"Which MFA method generates a new six-digit code every 30 seconds in an app?","o":["TOTP authenticator app","SMS only","Security question","Smart card PIN only"],"a":0,"e":"Time-based one-time password (TOTP) apps generate rolling codes. They're more secure than SMS."},{"d":2,"q":"Which MFA method is MOST resistant to phishing?","o":["Hardware security key using FIDO2/WebAuthn","SMS code","Email code","Security questions"],"a":0,"e":"FIDO2 keys and passkeys check the website's domain, so they can't be phished the way codes can."},{"d":2,"q":"What does a mobile device's screen lock with a strong passcode primarily protect against?","o":["Unauthorized access if the device is lost or stolen","Cellular eavesdropping","App crashes","Battery drain"],"a":0,"e":"The screen lock also enables device encryption on modern phones."},{"d":2,"q":"Which wireless security setting should be DISABLED because its PIN method can be brute-forced?","o":["WPS","WPA3","AES","802.1X"],"a":0,"e":"WPS PIN mode has a known brute-force weakness, so turn it off."},{"d":2,"q":"Which SOHO router setting should be disabled because it lets devices automatically open ports without approval?","o":["UPnP","DHCP","NAT","Firewall"],"a":0,"e":"Malware can abuse UPnP to open inbound ports. Disable it unless you specifically need it."},{"d":2,"q":"A technician wants to keep a SOHO router's admin interface from being reachable over the internet. What should be done?","o":["Disable remote/WAN management","Enable UPnP","Enable WPS","Use the default password"],"a":0,"e":"Allow admin access only from the LAN, and change the default credentials."},{"d":2,"q":"Which SOHO feature restricts network access to devices with specific hardware addresses, though it can be bypassed by spoofing?","o":["MAC address filtering","Port forwarding","DHCP reservation","DNS filtering"],"a":0,"e":"MAC filtering adds a small barrier, but MAC addresses are easy to spoof, so don't rely on it alone."},{"d":2,"q":"Which practice reduces attacks on a SOHO network by blocking known malicious domains for all clients?","o":["DNS/content filtering","Disabling DHCP","Hiding the router","Using WEP"],"a":0,"e":"DNS or content filtering blocks malicious and inappropriate sites for the whole network."},{"d":2,"q":"An attacker sends emails pretending to be a bank with a link to a fake login page. What is this?","o":["Phishing","Whaling","Vishing","Tailgating"],"a":0,"e":"Phishing uses fraudulent messages to steal credentials or deliver malware."},{"d":2,"q":"A user receives a text message claiming a package is delayed, with a link to 'reschedule delivery.' What attack is this?","o":["Smishing","Vishing","Whaling","Evil twin"],"a":0,"e":"Smishing is phishing by SMS."},{"d":2,"q":"An attacker calls the help desk pretending to be an executive to get a password reset. What technique is this?","o":["Impersonation","Dumpster diving","Shoulder surfing","Evil twin"],"a":0,"e":"In impersonation, the attacker poses as someone with authority. Verify identity before resetting passwords."},{"d":2,"q":"An attacker sends spoofed packets with a fake source IP address. Which attack type is this?","o":["Spoofing","Brute force","XSS","Dumpster diving"],"a":0,"e":"Spoofing fakes an identity, such as an IP address, MAC address, email sender, or caller ID."},{"d":2,"q":"Which type of malware replicates itself across a network without user interaction?","o":["Worm","Trojan","Adware","Keylogger"],"a":0,"e":"Worms spread on their own by exploiting vulnerabilities. Viruses need a host file and usually some user action."},{"d":2,"q":"Which type of malware infects the master boot record so it loads before the OS?","o":["Boot sector virus","Adware","Spyware","Worm"],"a":0,"e":"Boot sector viruses run before the OS loads. Secure Boot helps defend against them."},{"d":2,"q":"Which malware secretly monitors a user's activity and sends information to a third party?","o":["Spyware","Ransomware","Worm","Rootkit"],"a":0,"e":"Spyware collects data such as browsing habits and keystrokes without consent."},{"d":2,"q":"Which security solution is a managed service where an outside team monitors and responds to endpoint threats 24/7?","o":["MDR (managed detection and response)","Basic antivirus","Host firewall","Proxy server"],"a":0,"e":"MDR adds human analysts who monitor and respond on top of EDR tools."},{"d":2,"q":"Which tool helps prevent sensitive data such as credit card numbers from being emailed outside the company?","o":["Data loss prevention (DLP)","Antivirus","UPS","Load balancer"],"a":0,"e":"DLP inspects content and blocks or flags sensitive data leaving the organization."},{"d":2,"q":"In Windows, which firewall setting determines which rules apply when the PC is on a coffee shop network?","o":["Network profile set to Public","Network profile set to Domain","UAC level","BitLocker status"],"a":0,"e":"Windows Firewall has Domain, Private, and Public profiles. Public is the most restrictive."},{"d":2,"q":"A user needs to run a single program with elevated rights without logging in as an administrator. What should they use?","o":["Run as administrator (with admin credentials via UAC)","Disable UAC","Join the Guest group","Turn off Windows Defender"],"a":0,"e":"Run as administrator elevates just that app and prompts for admin credentials through UAC."},{"d":2,"q":"Which NTFS permission allows a user to read, write, and delete files but NOT change permissions?","o":["Modify","Full Control","Read & Execute","List folder contents"],"a":0,"e":"Modify covers read, write, and delete. Full Control adds changing permissions and taking ownership."},{"d":2,"q":"Which practice describes regularly applying vendor security fixes to OSes and applications?","o":["Patch management","Asset tagging","Change freeze","Data destruction"],"a":0,"e":"Patch management closes known vulnerabilities. Test patches and deploy them on a schedule."},{"d":2,"q":"Which of the following is the BEST password policy recommendation according to modern guidance?","o":["Long passphrases, MFA, and checking against breached password lists","Forced changes every 30 days with complexity only","Short passwords that are easy to remember","Sharing passwords with team leads"],"a":0,"e":"NIST guidance favors length, screening against breached passwords, and MFA over frequent forced changes."},{"d":2,"q":"What does account lockout policy protect against?","o":["Brute force password guessing","Phishing emails","Shoulder surfing","Power outages"],"a":0,"e":"Locking an account after a set number of failed attempts slows online guessing."},{"d":2,"q":"An employee left the company yesterday. What should IT do with their account?","o":["Disable it promptly per the offboarding procedure","Leave it active for a month","Give the password to their manager","Delete all audit logs"],"a":0,"e":"Disable departed users' accounts quickly. Keep the data as policy requires, then delete the account later."},{"d":2,"q":"Which feature on a smartphone erases all data after a number of failed passcode attempts?","o":["Failed login attempt wipe/lockout policy","Screen rotation","Airplane mode","Do Not Disturb"],"a":0,"e":"A wipe after too many failed attempts protects the data on a stolen device. MDM often enforces it."},{"d":2,"q":"A browser shows a padlock and 'https://' in the address bar. What does this indicate?","o":["The connection is encrypted with TLS to that domain","The website is guaranteed to be safe","The site has no malware","The site is government-approved"],"a":0,"e":"HTTPS encrypts the connection, but phishing sites can have valid certificates too. Check the domain itself."},{"d":2,"q":"Which browser feature helps prevent sites from opening unwanted windows?","o":["Pop-up blocker","Private browsing","Cache clearing","Bookmark sync"],"a":0,"e":"A pop-up blocker stops unrequested windows, which are often ads or scams."},{"d":2,"q":"What does private/incognito browsing do?","o":["Does not save local history, cookies, or form data after the session","Hides traffic from the ISP and employer","Encrypts all traffic like a VPN","Blocks all malware"],"a":0,"e":"Private browsing only affects what's stored locally. Networks and websites can still see your activity."},{"d":2,"q":"An administrator wants only company-approved browser extensions installed. What is the BEST approach?","o":["Enforce an extension allow list through Group Policy/MDM","Ask users nicely","Disable the browser","Use private browsing"],"a":0,"e":"Centrally managed policies can block unapproved extensions."},{"d":2,"q":"Which process ensures a downloaded installer has not been tampered with?","o":["Verify its hash/checksum or digital signature from the vendor","Rename the file","Open it in Notepad","Run it in compatibility mode"],"a":0,"e":"Compare the file's hash with the published value, or confirm the code-signing certificate."},{"d":2,"q":"Which wireless authentication method uses a RADIUS server and individual user credentials, rather than a shared password?","o":["WPA2/WPA3-Enterprise (802.1X)","WPA2-Personal (PSK)","WEP","Open network"],"a":0,"e":"Enterprise mode authenticates each user individually through RADIUS and 802.1X."},{"d":3,"q":"Windows takes a very long time to start, and the user sees a spinning wheel for several minutes. What should the technician check FIRST?","o":["Startup apps and services impact, and recent updates","The monitor cable","The printer queue","The Wi-Fi channel"],"a":0,"e":"Slow boots are often caused by heavy startup items, pending updates, or failing storage. Check Task Manager's startup impact and Event Viewer's boot performance logs."},{"d":3,"q":"A Windows PC shows a 'Bootmgr is missing' or boot configuration error. Which tool can repair the boot records?","o":["bootrec commands in WinRE","Disk Cleanup","gpupdate","net use"],"a":0,"e":"In the WinRE command prompt, run bootrec /fixmbr, /fixboot, and /rebuildbcd (or use bcdboot) to repair boot data."},{"d":3,"q":"After a Windows update, a user's PC goes into a repeating restart loop. What should the technician try?","o":["Boot into WinRE and uninstall the latest update or use System Restore","Replace the RAM","Replace the monitor","Change the user's password"],"a":0,"e":"WinRE's Uninstall Updates option and System Restore roll back problem updates."},{"d":3,"q":"Windows shows 'Your PC ran into a problem' with stop code CRITICAL_PROCESS_DIED after installing new hardware. What is a logical first step?","o":["Remove the new hardware or roll back its driver and test","Reinstall Office","Change the wallpaper","Disable the firewall"],"a":0,"e":"Undo the most recent change first, then check drivers and run memory and disk diagnostics."},{"d":3,"q":"A user's application runs slowly, and Task Manager shows disk usage at 100% constantly on an HDD. What is a reasonable fix?","o":["Check for failing disk/background tasks and consider upgrading to an SSD","Add a second monitor","Lower the screen brightness","Change the keyboard layout"],"a":0,"e":"A disk stuck at 100% on an HDD comes from background indexing, updates, malware, or a failing drive. An SSD helps a lot."},{"d":3,"q":"A Windows PC displays 'There are currently no logon servers available' when a domain user signs in. What should be checked?","o":["Network connectivity to the domain controller and DNS settings","The printer driver","The monitor","The audio service"],"a":0,"e":"Domain logons need to reach a domain controller, which depends on network access and DNS pointing to AD DNS."},{"d":3,"q":"A user receives a message that their temporary profile is loaded and their desktop files are missing. What does this indicate?","o":["The user profile failed to load, often due to corruption","The hard drive is full of malware","The user was deleted from AD","The monitor resolution changed"],"a":0,"e":"Windows loads a temporary profile when the real one fails. Fix it through the ProfileList registry key or by rebuilding the profile."},{"d":3,"q":"An application crashes, and Event Viewer shows the faulting module as a graphics driver DLL. What should the technician try?","o":["Update or roll back the graphics driver","Reinstall the printer","Replace the keyboard","Clear the DNS cache"],"a":0,"e":"The faulting module tells you what to fix. In this case, the GPU driver."},{"d":3,"q":"Windows Search no longer finds files that exist on the drive. What should the technician do?","o":["Rebuild the search index in Indexing Options","Run chkdsk /r","Reinstall the network driver","Disable UAC"],"a":0,"e":"A corrupt search index makes files missing from results. Rebuilding it fixes this."},{"d":3,"q":"A Windows service fails to start with an 'access denied' error after a password change. What is the MOST likely cause?","o":["The service account's stored password was not updated","The monitor is unplugged","DNS is misconfigured","The CPU is overheating"],"a":0,"e":"Services running under a user account store that account's password. Update it in the service's Log On tab."},{"d":3,"q":"Multiple apps report they cannot connect to the internet, but the browser works. The technician finds a proxy configured in the app settings. What should be checked?","o":["Proxy settings for the affected applications/system","The printer queue","The display driver","The keyboard layout"],"a":0,"e":"Wrong proxy settings break app connections. Check them in Windows proxy settings and in each app."},{"d":3,"q":"A user's PC was disconnected from the domain and reports 'The trust relationship between this workstation and the primary domain failed.' What is a typical fix?","o":["Rejoin the computer to the domain or reset its computer account","Replace the NIC","Update the BIOS","Install a new browser"],"a":0,"e":"The computer account password no longer matches AD. Rejoining the domain or resetting the account restores trust."},{"d":3,"q":"A Windows PC's clock resets to the wrong time zone after reboots. Which should be checked?","o":["Time zone settings and the Windows Time service/sync source","The display driver","The printer spooler","The audio service"],"a":0,"e":"Set the correct time zone and make sure automatic time sync works. Also consider the CMOS battery."},{"d":3,"q":"Users report that an internal web app gives a certificate error on all PCs starting today. What is the MOST likely cause?","o":["The server's certificate has expired","Every PC's clock is wrong","The users' passwords expired","The printer is offline"],"a":0,"e":"An error on every client at once points to the server's certificate expiring. Renew it."},{"d":3,"q":"A user sees ads appearing on websites that normally do not display ads, and new toolbars appear in the browser. What is likely installed?","o":["Adware/potentially unwanted program","A rootkit only","A hardware keylogger","A bad DNS server"],"a":0,"e":"Injected ads and unwanted toolbars mean adware or a PUP. Remove it and reset the browser."},{"d":3,"q":"A user's antivirus shows a definition file several months old and will not update. What should the technician suspect FIRST?","o":["Malware blocking updates or a licensing/connectivity issue","A bad monitor","Faulty RAM","The keyboard driver"],"a":0,"e":"Malware often blocks security updates. Check licensing and connectivity too, and scan with offline tools."},{"d":3,"q":"After clicking a link in an email, a user notices their files have a new .locked extension and a ransom note appears. What should the technician do FIRST?","o":["Disconnect the PC from the network to prevent spread","Pay the ransom","Restart the PC repeatedly","Email the attacker"],"a":0,"e":"Isolate the PC immediately, then follow incident response procedures and restore from clean backups."},{"d":3,"q":"A user reports that their mouse cursor moves on its own and programs open by themselves. What should be suspected?","o":["Remote access malware or an unauthorized remote session","A failing monitor","Low battery in a wired mouse","A wrong time zone"],"a":0,"e":"Uncontrolled cursor movement can mean someone has remote control. Disconnect the PC and investigate."},{"d":3,"q":"A user's hosts file contains entries redirecting a banking site to an unknown IP. What type of attack does this indicate?","o":["Pharming/DNS hijacking by malware","Shoulder surfing","Tailgating","DDoS"],"a":0,"e":"Malware edits the hosts file to send users to fake sites. Remove the entries and scan the system."},{"d":3,"q":"A Windows update fails because there is not enough free space. What should the technician do?","o":["Free disk space with Disk Cleanup/Storage Sense, then retry","Disable updates permanently","Replace the CPU","Change the time zone"],"a":0,"e":"Feature updates need a lot of free space. Clear temporary files and old update files."},{"d":3,"q":"An app on a user's phone will not connect to the internet, but other apps work. What should be checked FIRST?","o":["The app's cellular data/background data permissions","The phone's screen brightness","Bluetooth settings","The phone case"],"a":0,"e":"iOS and Android let you restrict data per app. Check that permission first."},{"d":3,"q":"A user's phone cannot connect to the corporate Wi-Fi after the password was changed. What should be done?","o":["Forget the network and reconnect with the new password","Factory reset the phone","Replace the SIM","Update the camera app"],"a":0,"e":"The saved profile still has the old password. Forget the network and rejoin."},{"d":3,"q":"A phone app crashes after the latest OS update. What is the BEST next step?","o":["Check for an app update that supports the new OS","Downgrade the OS immediately","Factory reset","Disable Wi-Fi"],"a":0,"e":"Developers often release fixes for new OS versions. Update the app first."},{"d":3,"q":"A user's company email stopped syncing on their phone after their password changed. What should they do?","o":["Update the password in the mail account settings on the phone","Replace the phone","Turn on airplane mode","Delete all contacts"],"a":0,"e":"Mail profiles keep the old credentials. Update them, or remove and re-add the account."},{"d":3,"q":"A phone shows a full storage warning, but the user has few apps and photos. What may be consuming space?","o":["App caches, messages with attachments, and downloaded media","The SIM card","The screen protector","Bluetooth pairings"],"a":0,"e":"Look at the storage breakdown. Caches, message attachments, and offline media can grow large."},{"d":3,"q":"Every time a phone connects to a car's Bluetooth, calls drop. What should be tried FIRST?","o":["Unpair and re-pair the devices and update software","Replace the car stereo","Factory reset the phone","Disable cellular data"],"a":0,"e":"Re-pairing fixes corrupted Bluetooth profiles. Update the phone's OS and the car's firmware too."},{"d":3,"q":"A company-managed phone shows an alert that it is non-compliant and cannot access email. What is the MOST likely cause?","o":["It fails an MDM policy such as an outdated OS or missing passcode","The screen is cracked","The case is too thick","Bluetooth is off"],"a":0,"e":"Conditional access blocks devices that don't meet MDM requirements."},{"d":3,"q":"A phone battery drains fast, and the settings show 'Location' used heavily by an app the user rarely opens. What should be done?","o":["Restrict location access for that app to 'While using' or 'Never'","Replace the battery","Factory reset","Remove the SIM"],"a":0,"e":"Background location use drains the battery. Tightening the app's permission fixes it."},{"d":3,"q":"A phone is extremely slow and the user has not restarted it in months. What should be tried FIRST?","o":["Restart the device","Factory reset","Replace the screen","Replace the battery"],"a":0,"e":"A restart clears memory and stuck processes. Try the simplest fix first."},{"d":3,"q":"A user installed a flashlight app that requests access to contacts, SMS, and microphone. What should the technician advise?","o":["Uninstall it; excessive permissions suggest a malicious app","Grant all permissions","Root the phone","Disable updates"],"a":0,"e":"Permissions that don't match what the app does are a red flag for spyware."},{"d":3,"q":"Antivirus detects a threat but cannot remove it because the file is in use. What is the BEST approach?","o":["Scan in Safe Mode or with an offline/boot-time scan","Delete System32","Disable antivirus","Ignore the alert"],"a":0,"e":"Safe Mode or an offline scan (such as Microsoft Defender Offline) runs before the malware loads."},{"d":3,"q":"After malware removal, the user's browser still redirects searches. What should the technician check?","o":["Browser extensions, search engine settings, and proxy/hosts settings","The monitor","The keyboard","The CMOS battery"],"a":0,"e":"Leftover settings can keep the redirect going. Reset the browser and check the proxy and hosts file."},{"d":3,"q":"A user receives an email from their own address that they did not send. What is MOST likely?","o":["The sender address was spoofed, or the account is compromised","The mail server is out of disk","The DNS cache is full","The printer is jammed"],"a":0,"e":"Check the message headers. Spoofing is common, and SPF, DKIM, and DMARC help prevent it. If it's real, reset the password and enable MFA."},{"d":3,"q":"A Windows 11 PC shows that it is not activated after a motherboard replacement. Why?","o":["The digital license is tied to hardware and needs reactivation","The RAM is bad","The SSD is too fast","The firewall is on"],"a":0,"e":"Windows activation is tied to the motherboard. Use the Activation troubleshooter with the linked Microsoft account, or contact support."},{"d":3,"q":"A technician notices a user's PC has random files renamed and the user reports missing documents. Which should be checked FIRST for a non-malware cause?","o":["Recent sync conflicts or user actions, and check backups/Recycle Bin","Replace the CPU","Change the time zone","Disable the firewall"],"a":0,"e":"Rule out sync conflicts, the Recycle Bin, and File History before assuming malware, but stay alert to ransomware."},{"d":4,"q":"What is the purpose of an incident report?","o":["Document details of a security or safety incident for follow-up and improvement","Track printer toner levels","Assign IP addresses","Store passwords"],"a":0,"e":"Incident reports record what happened, when, who was involved, and what was done about it."},{"d":4,"q":"In a ticketing system, what does assigning severity/priority accomplish?","o":["Ensures the most business-critical issues are worked first","Changes the user's password","Encrypts the ticket","Deletes old tickets"],"a":0,"e":"Priority depends on impact and urgency. An outage affecting many users ranks above a single cosmetic issue."},{"d":4,"q":"Which document defines the expected response and resolution times between IT and a customer?","o":["Service level agreement (SLA)","EULA","SDS","AUP"],"a":0,"e":"SLAs set measurable service commitments."},{"d":4,"q":"What should a technician include in a ticket's problem description?","o":["Clear symptoms, error messages, affected users, and when it started","Only 'it's broken'","The technician's lunch plans","Unrelated user complaints"],"a":0,"e":"Detailed descriptions speed up troubleshooting and escalation."},{"d":4,"q":"Which type of documentation shows how network devices are connected and their IP addresses?","o":["Network topology diagram","AUP","Incident report","Purchase order"],"a":0,"e":"Diagrams help troubleshooting and planning. Keep them up to date."},{"d":4,"q":"A help desk keeps a searchable collection of solutions to common problems. What is this?","o":["Knowledge base","Change log","Asset inventory","SDS library"],"a":0,"e":"Knowledge base articles reduce resolution time and keep fixes consistent."},{"d":4,"q":"During change management, who reviews and approves proposed changes?","o":["Change advisory board (CAB)","The end user only","The vendor's sales team","No one"],"a":0,"e":"The CAB evaluates risk and timing before approving a change."},{"d":4,"q":"Which part of a change request explains why the change is needed?","o":["Purpose/justification","Rollback plan","Asset tag","SDS"],"a":0,"e":"Change requests include purpose, scope, risk analysis, a test plan, a rollback plan, and affected users."},{"d":4,"q":"After a change is implemented, what confirms that users can perform their work as expected?","o":["End-user acceptance/validation","Deleting the change request","Disabling logging","Changing the CAB members"],"a":0,"e":"End-user acceptance verifies the change met its goal without side effects."},{"d":4,"q":"Which backup type copies only files changed since the last backup of any type, making daily backups fast but restores slower?","o":["Incremental","Differential","Full","Mirror"],"a":0,"e":"A restore needs the full backup plus every incremental in order."},{"d":4,"q":"Which backup type is created by combining an existing full backup with later incrementals, without reading all data from the source again?","o":["Synthetic full","Differential","Copy","Snapshot only"],"a":0,"e":"A synthetic full is assembled on the backup system, which reduces load on production."},{"d":4,"q":"Which backup rotation scheme uses daily, weekly, and monthly backup sets?","o":["Grandfather-father-son (GFS)","3-2-1","RAID 10","Round robin DNS"],"a":0,"e":"GFS keeps daily (son), weekly (father), and monthly (grandfather) sets."},{"d":4,"q":"Why should at least one backup copy be kept offline or immutable?","o":["So ransomware cannot encrypt or delete it","To make backups faster","To reduce licensing costs","To avoid testing restores"],"a":0,"e":"Ransomware targets backups it can reach. An offline or immutable copy survives."},{"d":4,"q":"What does an ESD mat provide when working on components?","o":["A grounded surface that safely dissipates static charge","Electrical insulation from live voltage","Heat protection","Liquid protection"],"a":0,"e":"ESD mats and wrist straps keep components and the technician at the same potential."},{"d":4,"q":"A technician must work on equipment with exposed high voltage, such as inside a PSU or CRT. What should they do?","o":["Not open it; send it to qualified service or replace the unit","Use an ESD strap and proceed","Work quickly","Leave it plugged in for grounding"],"a":0,"e":"PSUs and CRTs hold dangerous charges even when unplugged. Don't open them."},{"d":4,"q":"What is the correct way to dispose of used lithium-ion batteries?","o":["Recycle per local regulations/hazardous waste programs","Throw them in regular trash","Burn them","Bury them"],"a":0,"e":"Batteries contain hazardous materials and can start fires, so recycle them properly."},{"d":4,"q":"How should old CRT monitors and other e-waste be disposed of?","o":["Through certified e-waste recycling per local regulations","Regular trash","Leaving them at the curb","Landfill dumping"],"a":0,"e":"E-waste contains lead and other toxins. Use certified recyclers."},{"d":4,"q":"Which device cleans up voltage sags and noise on a power line but does not provide battery backup?","o":["Line conditioner","UPS","Generator","Surge-only power strip"],"a":0,"e":"Line conditioners smooth out voltage. A UPS adds battery backup."},{"d":4,"q":"What is the main purpose of proper cable management in a workspace?","o":["Prevent trip hazards and protect cables","Increase network speed","Reduce licensing costs","Improve monitor color"],"a":0,"e":"Tidy, secured cables prevent accidents and damage."},{"d":4,"q":"Which regulation governs the privacy of personal data for EU residents?","o":["GDPR","HIPAA","PCI DSS","SOX"],"a":0,"e":"GDPR covers EU residents' personal data, no matter where the company is located."},{"d":4,"q":"Which type of regulated data includes patient medical records in the United States?","o":["PHI under HIPAA","PCI","Public data","Open-source data"],"a":0,"e":"Protected health information is governed by HIPAA."},{"d":4,"q":"A company keeps user data longer than needed. Which policy should define how long data is kept?","o":["Data retention policy","AUP","SLA","SDS"],"a":0,"e":"Retention policies balance legal requirements against risk. Delete data you no longer need."},{"d":4,"q":"What does DRM (digital rights management) do?","o":["Restricts how copyrighted digital content can be used or copied","Encrypts network traffic","Manages DHCP leases","Controls backups"],"a":0,"e":"DRM enforces usage restrictions on media and software."},{"d":4,"q":"Which license type allows one purchase to be used by a large organization under a single agreement with a key server or portal?","o":["Enterprise/volume license","Personal license","Open-source GPL","Shareware"],"a":0,"e":"Volume licensing simplifies deploying software across many machines."},{"d":4,"q":"When speaking with a non-technical user, what should a technician avoid?","o":["Jargon and acronyms the user may not understand","Active listening","Clarifying questions","Setting expectations"],"a":0,"e":"Use plain language and confirm the user understood."},{"d":4,"q":"A technician finds personal documents on a user's desk while fixing their PC. What should the technician do?","o":["Not read or disturb them; respect user privacy","Read them to understand the user's needs","Photograph them","Throw them away"],"a":0,"e":"Respect the confidentiality of customer property and information."},{"d":4,"q":"Which is the BEST way to handle a situation where the technician cannot meet a promised repair time?","o":["Proactively contact the customer, explain, and set a new expectation","Say nothing","Blame another department","Close the ticket"],"a":0,"e":"Setting and updating expectations keeps trust."},{"d":4,"q":"Which scripting language is native to Windows and commonly used to automate administrative tasks with cmdlets?","o":["PowerShell","Bash","Python only","JavaScript"],"a":0,"e":"PowerShell uses verb-noun cmdlets such as Get-Process and integrates with Windows management."},{"d":4,"q":"Which file type is a Windows batch script?","o":[".bat",".sh",".py",".ps1"],"a":0,"e":".bat and .cmd files run in the Windows command interpreter."},{"d":4,"q":"Which file extension indicates a Python script?","o":[".py",".js",".vbs",".sh"],"a":0,"e":"Python scripts use .py and are popular for cross-platform automation."},{"d":4,"q":"Which is a common use case for scripting in IT?","o":["Automating repetitive tasks like backups, restarts, and drive mapping","Replacing all hardware","Designing logos","Writing user manuals"],"a":0,"e":"Scripts handle tasks such as installing updates, mapping drives, collecting info, and restarting services."},{"d":4,"q":"Which remote access tool lets a technician view and control a user's desktop across platforms using port 5900 by default?","o":["VNC","SSH","SFTP","Telnet"],"a":0,"e":"VNC shares the screen and uses port 5900 by default. Tunnel or encrypt it."},{"d":4,"q":"What is a security best practice for remote support sessions?","o":["Get user consent, use encrypted tools, and log sessions","Leave sessions open after work","Share passwords in chat","Disable MFA for speed"],"a":0,"e":"Use approved, encrypted tools with consent, authentication, and auditing."},{"d":4,"q":"Which security concern exists when using third-party remote access tools?","o":["Attackers abuse them to gain unauthorized access if not secured","They slow down printers","They change DNS","They void hardware warranties"],"a":0,"e":"Remote access tools are frequent attack targets. Restrict, patch, and monitor them."},{"d":4,"q":"An IT team wants to use AI to summarize support tickets. What should be confirmed FIRST?","o":["The AI tool is approved and handles data per company privacy policy","The AI has a fun name","The AI is free","The AI can play music"],"a":0,"e":"Check how the tool stores and uses data before you send it company or customer information."},{"d":4,"q":"An AI chatbot gives a confident but incorrect answer about a Windows command. What is this AI limitation called?","o":["Hallucination","Encryption","Overfitting hardware","Latency"],"a":0,"e":"AI can generate plausible but wrong output, so always verify it."}]}</script>
<script id="bank-n1" type="application/json">[{"d": 1, "q": "A technician is troubleshooting a problem in which frames are delivered to the wrong host because of a duplicate MAC address. At which OSI layer is the problem occurring?", "o": ["Layer 2 (Data Link)", "Layer 1 (Physical)", "Layer 3 (Network)", "Layer 4 (Transport)"], "a": 0, "e": "MAC addresses and frames live at Layer 2, the Data Link layer. Why not the others: Layer 1 is bits, signals and cables. Layer 3 uses IP addresses and packets. Layer 4 handles ports and segments (TCP/UDP)."}, {"d": 1, "q": "Which OSI layer is responsible for routing packets between different networks using logical addresses?", "o": ["Network (Layer 3)", "Data Link (Layer 2)", "Transport (Layer 4)", "Session (Layer 5)"], "a": 0, "e": "Layer 3 uses IP (logical) addresses to route packets between networks. Why not the others: Layer 2 forwards frames inside one network by MAC address. Layer 4 handles end-to-end delivery and ports. Layer 5 sets up and tears down sessions."}, {"d": 1, "q": "A user can ping a web server by IP address, but the TLS handshake fails because of a certificate format problem. Which OSI layer is MOST associated with encryption and data formatting?", "o": ["Presentation (Layer 6)", "Application (Layer 7)", "Session (Layer 5)", "Transport (Layer 4)"], "a": 0, "e": "Layer 6, Presentation, handles data formatting, translation, encryption and compression. Why not the others: Layer 7 is the application protocol itself (HTTP, DNS). Layer 5 manages sessions. Layer 4 handles ports and reliability."}, {"d": 1, "q": "At which OSI layer do TCP and UDP operate?", "o": ["Transport (Layer 4)", "Network (Layer 3)", "Session (Layer 5)", "Data Link (Layer 2)"], "a": 0, "e": "TCP and UDP are Layer 4 Transport protocols and use port numbers to reach the right application. Why not the others: Layer 3 is IP and ICMP. Layer 5 is session control. Layer 2 is Ethernet framing and MAC addresses."}, {"d": 1, "q": "A technician discovers that a fiber patch cable has a cracked connector, causing a complete loss of signal. Which OSI layer is affected?", "o": ["Physical (Layer 1)", "Data Link (Layer 2)", "Network (Layer 3)", "Presentation (Layer 6)"], "a": 0, "e": "Cables, connectors, light and electrical signals are all Layer 1. Why not the others: Layer 2 is framing and MAC addresses, Layer 3 is IP routing, and Layer 6 is data formatting and encryption."}, {"d": 1, "q": "Which protocol data unit (PDU) is associated with Layer 2 of the OSI model?", "o": ["Frame", "Packet", "Segment", "Bit"], "a": 0, "e": "Layer 2 PDUs are frames. Why not the others: packets are Layer 3, segments (TCP) or datagrams (UDP) are Layer 4, and bits are Layer 1."}, {"d": 1, "q": "A load balancer makes forwarding decisions based on the URL path and HTTP headers. At which OSI layer is it operating?", "o": ["Layer 7", "Layer 4", "Layer 3", "Layer 2"], "a": 0, "e": "Reading URLs and HTTP headers means looking at application data, which is Layer 7. Why not the others: a Layer 4 load balancer only sees IPs and ports, Layer 3 only sees IP addresses, and Layer 2 only sees MAC addresses."}, {"d": 1, "q": "A network engineer is troubleshooting from the bottom of the OSI model up. After confirming link lights and cabling are good, which layer should be checked NEXT?", "o": ["Data Link", "Network", "Transport", "Application"], "a": 0, "e": "Bottom-up goes Physical, then Data Link, then Network, and so on. After Layer 1 checks out, look at Layer 2 next: MAC table, VLAN, duplex. Why not the others: Network, Transport and Application come after Data Link in a bottom-up approach."}, {"d": 1, "q": "Which OSI layer establishes, maintains, and terminates communication sessions between applications?", "o": ["Session (Layer 5)", "Transport (Layer 4)", "Presentation (Layer 6)", "Network (Layer 3)"], "a": 0, "e": "Layer 5, Session, sets up, manages and ends sessions between applications. Why not the others: Layer 4 handles segmentation and reliability, Layer 6 handles formatting and encryption, and Layer 3 handles logical addressing and routing."}, {"d": 1, "q": "A company wants a device that inspects traffic and automatically blocks a detected attack in real time. Which device should be deployed inline?", "o": ["IPS", "IDS", "Proxy server", "Load balancer"], "a": 0, "e": "An intrusion prevention system (IPS) sits inline and can drop malicious traffic as it happens. Why not the others: an IDS only detects and alerts, usually from a mirrored copy of the traffic. A proxy forwards requests for clients. A load balancer spreads traffic across servers."}, {"d": 1, "q": "An administrator connects a sensor to a switch's SPAN port to watch for malicious traffic and send alerts without affecting the flow of traffic. Which device is this?", "o": ["IDS", "IPS", "Firewall", "Router"], "a": 0, "e": "An IDS watches a copy of the traffic (from a SPAN port or tap) and alerts, but doesn't block. Why not the others: an IPS must be inline to block. Firewalls and routers sit in the traffic path and forward or filter it."}, {"d": 1, "q": "A web application runs on four servers. The company wants incoming requests spread evenly across them, with failed servers removed from rotation automatically. Which device is needed?", "o": ["Load balancer", "Proxy server", "Layer 2 switch", "IDS"], "a": 0, "e": "A load balancer distributes requests across a server pool and uses health checks to stop sending traffic to dead servers. Why not the others: a proxy forwards client requests and can cache or filter them. A switch forwards frames by MAC address. An IDS only detects and alerts."}, {"d": 1, "q": "A company wants all employee web traffic to pass through a device that caches content and filters which websites can be visited. Which device should be used?", "o": ["Forward proxy server", "Load balancer", "NAS", "Wireless LAN controller"], "a": 0, "e": "A forward proxy sits between users and the internet and can cache pages and filter URLs. Why not the others: a load balancer spreads inbound traffic across servers. A NAS is file storage. A WLC manages access points."}, {"d": 1, "q": "Which device provides file-level storage to clients over the network using protocols such as SMB and NFS?", "o": ["NAS", "SAN", "Load balancer", "Hypervisor"], "a": 0, "e": "Network-attached storage (NAS) serves files and folders over SMB or NFS. Why not the others: a SAN gives servers block-level storage, usually over iSCSI or Fibre Channel. A load balancer spreads traffic. A hypervisor runs virtual machines."}, {"d": 1, "q": "A database cluster needs block-level access to shared storage over a dedicated high-speed network using Fibre Channel. Which solution is this?", "o": ["SAN", "NAS", "CDN", "VPN"], "a": 0, "e": "A storage area network (SAN) provides block-level storage, typically over Fibre Channel or iSCSI. Why not the others: a NAS is file-level storage. A CDN caches web content close to users. A VPN is an encrypted tunnel."}, {"d": 1, "q": "A company manages 60 lightweight access points across a campus and wants to push configuration and firmware to all of them centrally. Which device should it deploy?", "o": ["Wireless LAN controller", "Autonomous access point", "Layer 3 switch", "Proxy server"], "a": 0, "e": "A wireless LAN controller (WLC) centrally manages lightweight APs, including configuration, firmware, channels and roaming. Why not the others: autonomous APs are each configured individually. A Layer 3 switch routes between VLANs. A proxy handles client web requests."}, {"d": 1, "q": "A streaming company wants users around the world to load video quickly by serving it from servers located near them. Which solution should it use?", "o": ["Content delivery network", "Site-to-site VPN", "SAN", "Load balancer in a single data center"], "a": 0, "e": "A CDN caches content on edge servers spread around the world, so users fetch it from somewhere close, which cuts latency. Why not the others: a VPN is a secure tunnel. A SAN is storage. A load balancer in one data center doesn't reduce the distance to faraway users."}, {"d": 1, "q": "VoIP calls sound choppy when large file transfers run. Which feature should be configured so voice traffic gets priority?", "o": ["QoS", "NAT", "Port mirroring", "Jumbo frames"], "a": 0, "e": "Quality of Service (QoS) marks and prioritizes delay-sensitive traffic such as voice and video over bulk data. Why not the others: NAT translates addresses. Port mirroring copies traffic for analysis. Jumbo frames raise the MTU for bulk transfers and don't prioritize anything."}, {"d": 1, "q": "Which field in an IP packet header prevents packets from looping forever by being decremented at each router hop?", "o": ["TTL", "DSCP", "MTU", "Checksum"], "a": 0, "e": "Time to Live (TTL) drops by one at every router. When it reaches zero, the packet is discarded and an ICMP Time Exceeded message is sent back, which is how traceroute works. Why not the others: DSCP is the QoS marking. MTU is the maximum frame size, not a header field. The checksum detects corruption."}, {"d": 1, "q": "Which device separates collision domains on each port but, by default, keeps all ports in the same broadcast domain?", "o": ["Layer 2 switch", "Hub", "Router", "Repeater"], "a": 0, "e": "Each switch port is its own collision domain, but broadcasts still flood to every port in the VLAN. Why not the others: a hub is one big collision domain. A router separates broadcast domains. A repeater just regenerates the signal."}, {"d": 1, "q": "A company is moving workloads to a public cloud and needs an isolated, private section of the provider's network where it controls IP ranges and subnets. What should it create?", "o": ["Virtual private cloud", "Content delivery network", "Community cloud", "SaaS tenant"], "a": 0, "e": "A VPC is your own logically isolated network inside a public cloud, with your own subnets, route tables and gateways. Why not the others: a CDN caches content. A community cloud is shared by organizations with common needs. A SaaS tenant is an account in someone else's application."}, {"d": 1, "q": "Instances in a private cloud subnet need to download updates from the internet, but must NOT be reachable from the internet. What should be added?", "o": ["NAT gateway", "Internet gateway attached directly to the instances", "Public IP on each instance", "Network load balancer"], "a": 0, "e": "A NAT gateway lets private instances start outbound connections while blocking unsolicited inbound ones. Why not the others: a direct internet gateway route or public IPs would make the instances reachable from outside. A load balancer distributes inbound traffic."}, {"d": 1, "q": "Which cloud component allows resources in a VPC's public subnet to communicate directly with the internet?", "o": ["Internet gateway", "NAT gateway", "Security group", "VPN concentrator"], "a": 0, "e": "An internet gateway connects a VPC to the internet for subnets whose route table points to it. Why not the others: a NAT gateway is for outbound-only access from private subnets. A security group is a firewall, not a path. A VPN concentrator terminates VPN tunnels."}, {"d": 1, "q": "A cloud administrator needs a stateful firewall that controls traffic to and from individual virtual machine instances. Which cloud feature should be used?", "o": ["Network security group", "Internet gateway", "Elastic IP", "CDN"], "a": 0, "e": "Security groups (network security groups) act as stateful firewalls attached to instances or interfaces. Why not the others: an internet gateway is a route to the internet. An elastic IP is a static public address. A CDN caches content."}, {"d": 1, "q": "A company needs a private, dedicated, high-bandwidth connection from its data center to its cloud provider that does NOT traverse the public internet. What should it order?", "o": ["Direct Connect / dedicated cloud interconnect", "Site-to-site IPsec VPN over the internet", "Client-to-site VPN", "CDN"], "a": 0, "e": "A dedicated interconnect (such as AWS Direct Connect or Azure ExpressRoute) is a private circuit to the provider with consistent performance. Why not the others: an IPsec VPN is encrypted but still crosses the public internet. A client VPN is for individual users. A CDN delivers content to users."}, {"d": 1, "q": "Which technology replaces dedicated hardware appliances such as firewalls and routers with software running on standard servers?", "o": ["Network functions virtualization", "VXLAN", "Spanning Tree Protocol", "Link aggregation"], "a": 0, "e": "NFV runs network functions (routers, firewalls, load balancers) as virtual appliances on commodity hardware. Why not the others: VXLAN extends Layer 2 over Layer 3. STP prevents loops. Link aggregation bundles links together."}, {"d": 1, "q": "A retailer's cloud web servers automatically add capacity during a flash sale and remove it afterward. Which cloud concept is this?", "o": ["Elasticity", "Multitenancy", "Data locality", "Vertical scaling only"], "a": 0, "e": "Elasticity is automatically adding and removing resources as demand rises and falls. Why not the others: multitenancy means customers share infrastructure. Data locality is about where data physically lives. Vertical scaling makes one machine bigger and isn't automatic by definition."}, {"d": 1, "q": "An architect increases capacity by adding more web servers behind a load balancer instead of upgrading one server's CPU and RAM. What is this approach called?", "o": ["Horizontal scaling (scaling out)", "Vertical scaling (scaling up)", "Multitenancy", "Hybrid cloud"], "a": 0, "e": "Adding more instances is horizontal scaling. Why not the others: vertical scaling adds resources to one machine. Multitenancy is sharing infrastructure. Hybrid cloud mixes private and public cloud."}, {"d": 1, "q": "A company uses an email service where the provider manages the hardware, operating system, and application. Which cloud service model is this?", "o": ["SaaS", "PaaS", "IaaS", "On-premises"], "a": 0, "e": "With Software as a Service, the provider runs the whole stack and you just use the application. Why not the others: PaaS gives you a platform to deploy code. IaaS gives you servers and you manage the OS. On-premises means you run everything yourself."}, {"d": 1, "q": "Developers want to deploy code without managing servers, operating systems, or patches. Which cloud model fits BEST?", "o": ["PaaS", "IaaS", "SaaS", "Private cloud"], "a": 0, "e": "Platform as a Service provides a managed runtime. Developers bring only their code and data. Why not the others: with IaaS you manage the OS. SaaS is a finished application, not a place to deploy code. A private cloud is a deployment model, not a service model."}, {"d": 1, "q": "A company keeps sensitive databases in its own data center and runs its public web front end in a public cloud. Which deployment model is this?", "o": ["Hybrid cloud", "Public cloud", "Private cloud", "Community cloud"], "a": 0, "e": "Mixing on-premises or private cloud with public cloud is a hybrid cloud. Why not the others: public and private each describe only one side. A community cloud is shared by organizations with a common mission."}, {"d": 1, "q": "Which cloud characteristic describes multiple customers sharing the same physical hardware while staying logically isolated from each other?", "o": ["Multitenancy", "Elasticity", "Scalability", "Data sovereignty"], "a": 0, "e": "Multitenancy is when many tenants share pooled infrastructure but stay isolated from each other. Why not the others: elasticity and scalability are about capacity. Data sovereignty is about which laws apply based on where data is stored."}, {"d": 1, "q": "Which port does Secure Shell (SSH) use by default?", "o": ["22", "23", "21", "3389"], "a": 0, "e": "SSH uses TCP 22. SFTP also runs over SSH on 22. Why not the others: 23 is Telnet (unencrypted), 21 is FTP control, and 3389 is RDP."}, {"d": 1, "q": "A security audit finds a switch is managed with a protocol that sends credentials in clear text on TCP port 23. Which protocol is this, and what should replace it?", "o": ["Telnet; replace with SSH", "FTP; replace with SFTP", "HTTP; replace with HTTPS", "SNMPv1; replace with SNMPv2c"], "a": 0, "e": "Telnet runs on TCP 23 and sends everything in clear text. SSH on 22 encrypts the session. Why not the others: FTP uses 20/21. HTTP uses 80. SNMPv2c still uses clear-text community strings, so you'd move to SNMPv3 instead."}, {"d": 1, "q": "Which port is used by DNS?", "o": ["53", "67", "123", "389"], "a": 0, "e": "DNS uses port 53, UDP for most queries and TCP for zone transfers and large responses. Why not the others: 67 is DHCP server, 123 is NTP, and 389 is LDAP."}, {"d": 1, "q": "Which ports are used by DHCP? (Select two.)", "o": ["UDP 67", "UDP 68", "UDP 69", "TCP 53"], "a": [0, 1], "e": "DHCP servers listen on UDP 67 and clients use UDP 68. Why not the others: UDP 69 is TFTP, and TCP 53 is DNS."}, {"d": 1, "q": "A network engineer needs to copy configuration files to a switch using a lightweight protocol with no authentication over UDP. Which protocol and port are used?", "o": ["TFTP, UDP 69", "FTP, TCP 21", "SFTP, TCP 22", "SMB, TCP 445"], "a": 0, "e": "TFTP (Trivial FTP) runs on UDP 69 with no authentication and is common for network device configs and firmware. Why not the others: FTP is TCP 20/21 with login. SFTP is encrypted over SSH on 22. SMB is Windows file sharing on 445."}, {"d": 1, "q": "Which protocol and port synchronize clocks on network devices?", "o": ["NTP, UDP 123", "SNMP, UDP 161", "Syslog, UDP 514", "LDAP, TCP 389"], "a": 0, "e": "Network Time Protocol uses UDP 123. Accurate time matters for logs, certificates and Kerberos. Why not the others: SNMP polling is 161, syslog is 514, and LDAP is 389."}, {"d": 1, "q": "A monitoring server receives unsolicited alerts sent by network devices when an interface goes down. Which port must be open on the monitoring server?", "o": ["UDP 162", "UDP 161", "UDP 514", "TCP 25"], "a": 0, "e": "SNMP traps (alerts the device sends on its own) go to the manager on UDP 162. Why not the others: UDP 161 is used when the manager polls the agent. 514 is syslog. 25 is SMTP."}, {"d": 1, "q": "Centralized logging collects messages from all routers and firewalls. Which port does traditional syslog use?", "o": ["UDP 514", "UDP 123", "TCP 636", "TCP 1433"], "a": 0, "e": "Syslog traditionally uses UDP 514. Why not the others: 123 is NTP, 636 is LDAPS, and 1433 is Microsoft SQL Server."}, {"d": 1, "q": "An application needs to query a directory service over an encrypted connection. Which port should be allowed?", "o": ["TCP 636 (LDAPS)", "TCP 389 (LDAP)", "TCP 445 (SMB)", "TCP 443 (HTTPS)"], "a": 0, "e": "LDAPS (LDAP over TLS) uses 636. Why not the others: 389 is unencrypted LDAP by default. 445 is SMB file sharing. 443 is HTTPS web traffic."}, {"d": 1, "q": "Which port does Microsoft SQL Server use by default?", "o": ["1433", "3389", "5060", "445"], "a": 0, "e": "SQL Server listens on TCP 1433 by default. Why not the others: 3389 is RDP, 5060 is SIP, and 445 is SMB."}, {"d": 1, "q": "A VoIP phone system uses a signaling protocol to set up and tear down calls. Which protocol and ports are used?", "o": ["SIP, 5060/5061", "RTP, 3389", "H.323, 1433", "SNMP, 161/162"], "a": 0, "e": "SIP (Session Initiation Protocol) uses 5060 unencrypted and 5061 over TLS. Why not the others: 3389 is RDP. 1433 is SQL Server. 161/162 are SNMP."}, {"d": 1, "q": "Which port does SMTP use for authenticated mail submission with STARTTLS from email clients?", "o": ["587", "25", "110", "143"], "a": 0, "e": "Port 587 is the submission port clients use to send mail, usually with STARTTLS and authentication. Why not the others: 25 is server-to-server SMTP. 110 is POP3. 143 is IMAP."}, {"d": 1, "q": "Which IP protocol encapsulates other protocols inside a point-to-point tunnel without providing encryption on its own?", "o": ["GRE", "ESP", "IKE", "TLS"], "a": 0, "e": "Generic Routing Encapsulation (GRE) tunnels traffic but doesn't encrypt it. It's often paired with IPsec. Why not the others: ESP encrypts. IKE negotiates IPsec keys. TLS encrypts application sessions."}, {"d": 1, "q": "Which IPsec component provides confidentiality by encrypting the packet payload?", "o": ["ESP", "AH", "IKE", "GRE"], "a": 0, "e": "Encapsulating Security Payload (ESP) provides encryption plus integrity and authentication. Why not the others: AH (Authentication Header) provides integrity and authentication but no encryption. IKE negotiates the security associations and keys. GRE is unencrypted tunneling."}, {"d": 1, "q": "Which IPsec protocol negotiates security associations and exchanges keys between VPN peers?", "o": ["IKE", "AH", "ESP", "GRE"], "a": 0, "e": "Internet Key Exchange (IKE, on UDP 500 and 4500 for NAT traversal) authenticates the peers and sets up the keys. Why not the others: AH and ESP protect the data afterward. GRE is a tunnel with no security of its own."}, {"d": 1, "q": "Which protocol is used by the ping command?", "o": ["ICMP", "UDP", "TCP", "ARP"], "a": 0, "e": "Ping sends ICMP Echo Requests and receives Echo Replies. Why not the others: TCP and UDP are transport protocols with ports. ARP resolves IP addresses to MAC addresses on the local network."}, {"d": 1, "q": "A video stream is sent from one source to a group of subscribed receivers without sending a separate copy to each one. Which traffic type is this?", "o": ["Multicast", "Broadcast", "Unicast", "Anycast"], "a": 0, "e": "Multicast sends one stream to a group of hosts that have joined it. Why not the others: broadcast goes to every host on the segment. Unicast is one-to-one. Anycast goes to the nearest of several nodes sharing the same address."}, {"d": 1, "q": "Several DNS servers around the world share the same IP address, and each client is routed to the closest one. Which addressing method is this?", "o": ["Anycast", "Multicast", "Broadcast", "Unicast"], "a": 0, "e": "With anycast, one address is advertised from many locations and routing delivers each client to the nearest one. Why not the others: multicast is one-to-many group delivery. Broadcast is one-to-all on a segment. Unicast is a single destination."}, {"d": 1, "q": "Which traffic type is NOT supported in IPv6?", "o": ["Broadcast", "Multicast", "Anycast", "Unicast"], "a": 0, "e": "IPv6 has no broadcast. Functions that used broadcast, like ARP, are handled with multicast instead (Neighbor Discovery). Why not the others: IPv6 supports unicast, multicast and anycast."}, {"d": 1, "q": "Two buildings are 12 km apart and need a 10 Gbps fiber link. Which cable type is required?", "o": ["Single-mode fiber", "Multimode fiber", "Cat 6a", "Twinax (DAC)"], "a": 0, "e": "Single-mode fiber uses a narrow core and laser light to reach many kilometers. Why not the others: multimode is limited to a few hundred meters at 10 Gbps. Copper Cat 6a tops out at 100 m. DAC cables are only a few meters long."}, {"d": 1, "q": "A data center needs to connect a server to a top-of-rack switch 3 meters away at 25 Gbps at the lowest cost. Which option is BEST?", "o": ["Direct attach copper (DAC/twinax) cable", "Single-mode fiber with LR optics", "Cat 5e", "RG-6 coaxial"], "a": 0, "e": "DAC cables are twinax copper with SFP-style ends built in. They're cheap and low-power for short in-rack runs. Why not the others: single-mode LR optics are expensive overkill for 3 m. Cat 5e can't do 25 Gbps. RG-6 is for cable TV and broadband."}, {"d": 1, "q": "Which transceiver form factor is used for 40 Gbps or 100 Gbps links by combining four lanes?", "o": ["QSFP", "SFP", "GBIC", "RJ45"], "a": 0, "e": "QSFP (Quad SFP) runs four lanes: 4 x 10G for 40G (QSFP+) or 4 x 25G for 100G (QSFP28). Why not the others: a single SFP or SFP+ carries one lane (1G or 10G). GBIC is an older, larger 1G module. RJ45 is a copper connector, not a transceiver."}, {"d": 1, "q": "A technician must install a 10 Gbps fiber module in a switch port. Which hot-swappable transceiver type is MOST likely used?", "o": ["SFP+", "QSFP28", "GBIC", "BNC"], "a": 0, "e": "SFP+ is the standard 10 Gbps pluggable transceiver. Why not the others: QSFP28 is 100G. GBIC is legacy 1G. BNC is a coax connector."}, {"d": 1, "q": "Which small form factor fiber connector uses a push-pull latch and a 1.25 mm ferrule, and is common on SFP transceivers?", "o": ["LC", "ST", "SC", "F-type"], "a": 0, "e": "LC (Lucent Connector) is small with a latch, and it's the standard on SFP and SFP+ modules. Why not the others: ST is bayonet twist-lock. SC is a larger square push-pull connector with a 2.5 mm ferrule. F-type is a coax connector."}, {"d": 1, "q": "Which fiber connector uses a bayonet-style twist-lock mechanism?", "o": ["ST", "LC", "SC", "MPO"], "a": 0, "e": "ST (Straight Tip) connectors twist and lock like a BNC. Why not the others: LC uses a latch. SC is square push-pull. MPO is a multi-fiber push-pull connector."}, {"d": 1, "q": "A data center deploys 40G/100G parallel optics that carry 12 or more fibers in one connector. Which connector type is used?", "o": ["MPO/MTP", "LC", "ST", "RJ11"], "a": 0, "e": "MPO (multi-fiber push-on), also sold as MTP, holds 12 or 24 fibers in a single ferrule for parallel optics. Why not the others: LC and ST are single-fiber connectors. RJ11 is for copper phone lines."}, {"d": 1, "q": "Which connector is used to terminate coaxial cable for a cable modem?", "o": ["F-type", "BNC", "RJ45", "LC"], "a": 0, "e": "F-type screw-on connectors are standard for cable TV and broadband modems on RG-6. Why not the others: BNC is a twist-lock coax connector used for video and legacy networks. RJ45 is Ethernet copper. LC is fiber."}, {"d": 1, "q": "Network cabling will run through the air-handling space above a drop ceiling. Which cable jacket type is required by fire code?", "o": ["Plenum-rated", "PVC (non-plenum)", "Direct burial", "Shielded twisted pair"], "a": 0, "e": "Plenum-rated jackets give off less toxic smoke and resist flame spread in air-handling spaces. Why not the others: PVC releases toxic fumes when it burns. Direct burial is for underground. STP is about shielding, not fire rating."}, {"d": 1, "q": "Which cable type has a maximum rated distance of 100 meters for 10GBASE-T?", "o": ["Cat 6a", "Cat 5e", "Cat 6", "Cat 3"], "a": 0, "e": "Cat 6a supports 10 Gbps to the full 100 m. Why not the others: Cat 6 does 10 Gbps to only about 37–55 m. Cat 5e is rated for 1 Gbps. Cat 3 is legacy voice and 10 Mbps."}, {"d": 1, "q": "Which IEEE standard defines Ethernet?", "o": ["802.3", "802.11", "802.1Q", "802.1X"], "a": 0, "e": "IEEE 802.3 is the Ethernet family of wired standards. Why not the others: 802.11 is Wi-Fi. 802.1Q is VLAN tagging. 802.1X is port-based network access control."}, {"d": 1, "q": "A remote site's internet connection uses a low-earth-orbit (LEO) satellite constellation instead of geostationary satellites. What is the PRIMARY benefit?", "o": ["Much lower latency", "No weather impact", "Unlimited bandwidth", "No need for an antenna"], "a": 0, "e": "LEO satellites orbit far closer than geostationary ones (about 550 km versus 35,786 km), so latency drops from roughly 600 ms to about 25–60 ms. Why not the others: weather can still affect it. Bandwidth is limited. A dish or antenna is still required."}, {"d": 1, "q": "Which connector is used to terminate a standard analog telephone line?", "o": ["RJ11", "RJ45", "BNC", "SC"], "a": 0, "e": "RJ11 is the small 6-position connector used for phone lines and DSL. Why not the others: RJ45 is 8-position Ethernet. BNC is coax. SC is fiber."}, {"d": 1, "q": "A data center uses a design in which every access-layer switch connects to every core switch, so any two servers are always the same number of hops apart. Which topology is this?", "o": ["Spine and leaf", "Three-tier hierarchical", "Star", "Bus"], "a": 0, "e": "In spine-and-leaf, every leaf connects to every spine, which gives predictable low latency for east-west traffic. Why not the others: three-tier adds a distribution layer, so hop counts vary. Star is hub-and-spoke. Bus is a single shared cable."}, {"d": 1, "q": "In a traditional three-tier network design, which layer connects end-user devices such as PCs and phones?", "o": ["Access", "Distribution", "Core", "Spine"], "a": 0, "e": "End devices plug into the access layer. Why not the others: the distribution layer aggregates access switches and enforces policy. The core is the high-speed backbone. Spine belongs to spine-and-leaf designs."}, {"d": 1, "q": "A small company combines the core and distribution layers into a single pair of switches to reduce cost. What is this design called?", "o": ["Collapsed core", "Spine and leaf", "Full mesh", "Point-to-point"], "a": 0, "e": "A collapsed core merges the core and distribution layers into one, which suits smaller networks. Why not the others: spine-and-leaf is a data center fabric. A full mesh connects everything to everything. Point-to-point is a single link between two nodes."}, {"d": 1, "q": "Traffic flowing between two servers inside the same data center is described as which type of traffic?", "o": ["East-west", "North-south", "Broadcast", "Out-of-band"], "a": 0, "e": "Server-to-server traffic inside the data center is east-west. Why not the others: north-south traffic enters or leaves the data center. Broadcast is an addressing type. Out-of-band is a management path."}, {"d": 1, "q": "A WAN design connects every branch office directly to every other branch office for maximum redundancy. Which topology is this?", "o": ["Full mesh", "Hub-and-spoke", "Star", "Point-to-point"], "a": 0, "e": "In a full mesh, every site has a direct link to every other site. It's very redundant but expensive (n(n-1)/2 links). Why not the others: hub-and-spoke and star route through a central site. Point-to-point is just two sites."}, {"d": 1, "q": "A company's branch offices connect only to headquarters, and branch-t
